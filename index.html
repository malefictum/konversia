  n = Math.min(n|0, this.maxLoad(st, p));
  if (n <= 0) return 0;
  if (p.loc === 'ussr'){
    for (let i=0;i<n;i++) p.cargo.push({kind:'goods', origin:'s', state:'gov', from:'ussr'});
  } else {
    const cont = st.continents[p.loc], kind = CONTINENTS[p.loc].kind;
    cont.stock -= n;
    for (let i=0;i<n;i++) p.cargo.push({kind, origin:'i', state:'gov', from:p.loc});
  }
  const pay = n * this.freight(st); p.rub += pay;
  this.say(st, p.name + ' берёт государственный груз ×' + n + ' и сразу получает ' + pay + ' тыс. руб. за перевозку.', '');
  return n;
},
/* Своё имущество разгружать ходом не нужно: оно и так ваше, а «Разгрузка»
   в правилах описана только для государственного груза. Поэтому по приезде
   в СССР всё СВОЁ выкладывается на стол само.
   Исключение — привезённый импортный ТОВАР: он остаётся в грузе, потому что
   продаётся дома вдвое дороже советского, а на складе происхождение уже
   не различить. Его продают прямо из груза ходом «Продажа». */
autoUnload(st, p){
  if (p.loc !== 'ussr') return null;
  const kinds = {}; let n = 0;
  for (let i=p.cargo.length-1; i>=0; i--){
    const c = p.cargo[i];
    if (c.state !== 'own') continue;
    if (c.origin === 'i' && c.kind === 'goods') continue;   // импортный товар — на продажу
    if (c.origin === 'i'){
      if (c.kind === 'computer') p.own.computer += 1;
      else if (c.kind === 'plant') p.own.plant += 1;
      else if (c.kind === 'raw') p.raw += 1;
      else if (p.own[c.kind]) p.own[c.kind].i += 1;
      else continue;
    } else {
      if (c.kind === 'raw') p.raw += 1;
      else if (c.kind === 'goods') p.goods += 1;
      else if (c.kind === 'plant') p.own.plant += 1;
      else if (c.kind === 'computer') p.own.computer += 1;
      else if (p.own[c.kind]) p.own[c.kind].s += 1;
      else continue;
    }
    kinds[c.kind] = (kinds[c.kind]||0) + 1;
    p.cargo.splice(i,1); n++;
  }
  if (!n) return null;
  const parts = [];
  for (const k in kinds) parts.push(KIND[k].short + ' ×' + kinds[k]);
  this.say(st, p.name + ' выкладывает своё на стол: ' + parts.join(', ') + '.', '');
  return {n:n, kinds:kinds};
},
/* Оставить дома то, что не влезло в уехавшие машины. Государственный груз
   возвращается банку вместе с уже полученной за него платой за перевозку —
   иначе можно было бы грузиться, не ехать и снимать фрахт бесконечно.
   Оставляем сначала госгруз: свой товар игрок вёз продавать. */
leaveHome(st, p, n, only){
  if (n <= 0) return null;
  const order = [];
  if (only !== 'own')
    for (let i=p.cargo.length-1; i>=0; i--) if (p.cargo[i].state === 'gov') order.push(i);
  if (only !== 'gov')
    for (let i=p.cargo.length-1; i>=0; i--) if (p.cargo[i].state !== 'gov') order.push(i);
  const drop = order.slice(0, n).sort((x,y)=>y-x);
  let gov = 0, own = 0, back = 0;
  for (const i of drop){
    const c = p.cargo[i];
    if (c.state === 'gov'){
      if (c.origin === 'i') st.market.imp[c.kind] = (st.market.imp[c.kind]||0)+1;
      else if (st.market[c.kind] != null) st.market[c.kind] += 1;
      gov++; back += this.freight(st);
    } else if (c.kind === 'raw')   { p.raw   += 1; own++; }
    else if (c.kind === 'goods')   { p.goods += 1; own++; }
    else if (c.kind === 'computer'){ p.own.computer += 1; own++; }
    else if (c.kind === 'plant')   { p.own.plant += 1; own++; }
    else if (p.own[c.kind])        { p.own[c.kind][c.origin==='i'?'i':'s'] += 1; own++; }
    else { p.goods += 1; own++; }
    p.cargo.splice(i,1);
  }
  if (back > 0) p.rub = Math.max(0, p.rub - back);
  const bits = [];
  if (gov) bits.push('госгруз ×' + gov + (back ? ' (плата за перевозку ' + back + ' тыс. возвращена банку)' : ''));
  if (own) bits.push('своё ×' + own);
  this.say(st, p.name + ' оставляет на внутреннем рынке: ' + bits.join(', ') + ' — в уехавшие машины не влезло.', '');
  return {gov:gov, own:own, back:back};
},
/* Сколько партий заберёт действие «Разгрузка» прямо сейчас. Ноль означает,
   что ход будет холостым: боты обязаны это проверять, иначе зацикливаются. */
unloadable(p){
  let n = 0;
  for (const c of p.cargo){
    if (c.state === 'gov'){ if (!(c.from && c.from === p.loc)) n++; }
    else if (p.loc === 'ussr' && !(c.origin === 'i' && c.kind === 'goods')) n++;
  }
  return n;
},
/* сколько госгруза можно сдать здесь (тот, что привезён, а не взят тут же) */
govHere(p){
  return p.cargo.filter(c=> c.state==='gov' && !(c.from && c.from === p.loc)).length;
},
/* Сдать государственный груз банкиру. Возвращает сколько сдано. */
doDropGov(st, p){
  let gov = 0;
  for (let i=p.cargo.length-1; i>=0; i--){
    const c = p.cargo[i];
    if (c.state !== 'gov' || (c.from && c.from === p.loc)) continue;
    if (p.loc==='ussr'){
      if (c.origin==='i') st.market.imp[c.kind] = (st.market.imp[c.kind]||0)+1;
      else if (st.market[c.kind] != null) st.market[c.kind] += 1;
    } else st.continents[p.loc].stock += 1;
    p.cargo.splice(i,1); gov++;
  }
  return gov;
},

/* Плата за наём государственного транспорта. Если своего транспорта, доходящего
   до этой точки, нет вовсе — платим и за себя, и за каждую партию груза. */
travelFee(st, p, cont, units, home){
  /* Возвращение домой налегке бесплатно всегда: иначе игрок без груза,
     без транспорта и без наличных застревает на континенте навсегда —
     он не банкрот (у него могут быть доллары), но и уехать не может. */
  if (home && units <= 0) return 0;
  const cap = this.capacityFor(p, cont);
  const hired = Math.max(0, units - cap) + (cap > 0 ? 0 : 1);
  return hired * this.freight(st);
},

/* стоимость всего имущества игрока по текущему курсу (для финального счёта) */
/* Итоговый подсчёт. Всё имущество продаётся по ценам 5-го курса, валюта
   сдаётся банку по его курсу (в классике это 1:1 всегда, в 1993-м на 5-м
   курсе — 1:10, и считать доллары по единице было ошибкой в десять раз),
   из суммы вычитается непогашенный долг. Возвращает и разбивку, чтобы
   игрок видел, из чего сложился его результат. */
netWorthFull(st, p){
  const b = {rub:p.rub, usd:0, gear:0, stock:0, cargo:0,
             debt:(p.debtDue || 0) + (p.owed || 0)};
  b.usd = p.usd * this.usdSellRate(st);
  b.gear += p.own.plant * this.price(st,'plant','s','sell');
  for (const k of ['machine','extractor','truck','fleet']){
    b.gear += p.own[k].s * this.price(st,k,'s','sell');
    b.gear += p.own[k].i * this.price(st,k,'i','sell');
  }
  b.gear += p.own.computer * this.price(st,'computer','i','sell');
  b.stock += p.raw   * this.price(st,'raw','s','sell');
  b.stock += p.goods * this.price(st,'goods','s','sell');
  p.cargo.forEach(c=>{ if (c.state==='own') b.cargo += this.price(st, c.kind, c.origin, 'sell'); });
  b.total = b.rub + b.usd + b.gear + b.stock + b.cargo - b.debt;
  return b;
},
netWorth(st, p){ return this.netWorthFull(st, p).total; },

/* --- спрос на валюту тоже давит на курс ------------------------------
   Каждые fxPerCell тыс. купленных долларов сдвигают индикатор на клетку:
   бегство от гривни само её и обесценивает. Остаток копится в st.fx. */
fxPressure(st, usd){
  const per = E(st).fxPerCell;
  if (!per || usd <= 0) return 0;
  st.fx = (st.fx || 0) + usd;
  const cells = Math.floor(st.fx / per);
  if (cells > 0){ st.fx -= cells * per; this.advance(st, cells); }
  return cells;
},

/* --- продвижение индикатора курса ---------------------------------- */
advance(st, n){
  for (let i=0; i<n && !st.over; i++){
    st.pos++;
    if (st.pos >= st.track[st.course-1]){
      st.pos = 0; st.course++;
      if (st.course >= 5){ st.course = 5; this.finish(st); return; }
      this.say(st, 'Курс рубля изменился: теперь курс ' + st.course + ' (' + this.rateTxt(st) + '). ' + (E(st).inflating ? 'Всё имущество подорожало.' : 'Всё имущество подешевело.'), 'ev');
      /* Все открытые предложения снимаются: они назначались в прежних
         деньгах, и после смены курса цена в них уже неверна. Особенно
         важно в сетевой партии — иначе кто-то принимает вчерашнюю цену
         сегодняшними деньгами, и это выглядит как подстава. */
      if (st.offers.length){
        const n = st.offers.length;
        st.offers = [];
        this.say(st, 'Все открытые предложения сняты — цены в них были в прежних деньгах (' + n + ').', 'dl');
      }
    }
  }
},
finish(st){
  st.over = true;
  const res = st.players.map(p=>{
    const b = p.out ? null : this.netWorthFull(st, p);
    return {name:p.name, id:p.id, out:p.out, worth:p.out?-1:b.total, parts:b};
  })
                        .sort((a,b)=>b.worth-a.worth);
  st.result = res;
  this.say(st, 'Рубль стал равен доллару. Игра окончена, имущество продано по курсу 5.', 'ev');
  res.forEach((r,i)=>{ if(!r.out) this.say(st, (i+1)+'. '+r.name+' — '+r.worth+' тыс. руб.', i===0?'good':''); });
},

/* --- очередь ходов ------------------------------------------------- */
endTurn(st){
  if (st.over) return;
  if (st.extraAction){ st.extraAction = false; return; }   // карта дала ещё одно действие
  const p = this.P(st, st.cur);
  p.rent.extractor = 0; p.rent.machine = 0;                // аренда действует один ход
  this.chargeUpkeep(st, p);                                // содержание имущества
  this.checkBankrupt(st, p);
  let guard = 0;
  const n = st.players.length, first = st.first | 0;
  const pos = i => (i - first + n) % n;          // место в круге от того, кто начинал
  let was = pos(st.cur);
  do {
    st.cur = (st.cur + 1) % n;
    /* Круг закончился, когда очередь перевалила через того, кто начинал.
       Считаем по обороту, а не по индексу 0: начинать может любой, и
       стартовый игрок может выбыть — счётчик от этого не должен встать. */
    const now = pos(st.cur);
    if (now <= was){
      st.turn++;
      this.demandTick(st);
      /* Инфляция идёт сама по себе. Без этого стол, где никто не вывозит
         и не покупает валюту, не двигает индикатор вообще и партия не
         кончается никогда — проверено прогонами. */
      const idle = E(st).idleRounds;
      if (idle && st.turn % idle === 0 && !st.over){
        this.say(st, 'Цены подросли сами собой — гривня слабеет без всякой торговли.', 'ev');
        this.advance(st, 1);
      }
    }
    was = now;                                   // иначе выбывший игрок насчитает лишний круг
    guard++;
    const q = this.P(st, st.cur);
    if (q.out) continue;
    if (q.skip > 0){ q.skip--; this.say(st, q.name + ' пропускает ход.', ''); continue; }
    break;
  } while (guard < st.players.length * 4);
  if (this.alive(st).length <= 1) this.finish(st);
},

/* --- банкротство --------------------------------------------------- */
canPay(st, p, rub){ return p.rub >= rub; },
checkBankrupt(st, p){
  if (p.out) return;
  const hasStuff = p.own.plant||p.own.computer||p.raw||p.goods||
    ['machine','extractor','truck','fleet'].some(k=>p.own[k].s||p.own[k].i);
  if (p.rub <= 0 && !hasStuff && p.usd <= 0 && p.debts > 0){
    p.out = true;
    this.say(st, p.name + ' объявлен банкротом и выходит из игры.', 'bad');
    return;
  }
  // застрял за границей: нечем оплатить дорогу домой, продать на месте нечего, ссуда уже взята
  if (p.loc !== 'ussr' && p.debts > 0 && p.usd <= 0 && p.rub < this.freight(st) &&
      this.truckCap(p) + this.fleetCap(p) === 0 && p.cargo.length === 0){
    p.out = true;
    this.say(st, p.name + ' остался за границей без средств на возвращение и выбывает из игры.', 'bad');
  }
},

/* ================================================================ APPLY */
apply(st, a){
  if (st.over && a.type!=='NEW') return st;
  const p = this.P(st, a.by);
  if (!p || p.out) return st;

  const FREE = ['OFFER','ACCEPT','CANCEL','LOAN','REPAY','EXCHANGE','ASSIGN'];
  const isFree = FREE.includes(a.type);
  /* Решение по страховке нельзя обойти, сделав что-нибудь другое: любое
     иное действие того же игрока означает отказ от выкупа. */
  if (st.pendingChoice && a.type !== 'CHOOSE' && !isFree){
    const pc = st.pendingChoice; st.pendingChoice = null;
    const q = this.P(st, pc.by);
    this.say(st, q.name + ' не стал решать — событие прошло само собой.', '');
    this.endTurn(st);
    if (a.by !== st.cur) return st;
  }
  if (st.pendingSalvage && a.type !== 'SALVAGE' && !isFree){
    const ps = st.pendingSalvage; st.pendingSalvage = null;
    const q = this.P(st, ps.by);
    this.resolveSalvage(st, q, ps.items, {});
    this.say(st, q.name + ' не выкупает — потеряно всё своё имущество в рейсе.', 'bad');
    this.checkBankrupt(st, q);
    if (a.type === 'PASS' && a.by === ps.by){ this.endTurn(st); return st; }
    this.endTurn(st);
    if (a.by !== st.cur) return st;
  }
  if (!isFree && a.by !== st.cur) return st;      // ход только в свою очередь

  switch (a.type){

  /* ---------- ПОКУПКА ---------- */
  case 'BUY': {
    /* Пока не погашен налог на содержание, покупать нельзя. Без этого
       недоимка была беспроцентным кредитом: выгоднее копить долг и
       строиться дальше, чем платить.
       Только ДОМА: за границей платят долларами, а долг рублёвый, и
       погасить его оттуда всё равно нечем — там нет ни рынка, ни своих
       складов. Иначе игрок застревал за рубежом навсегда. */
    if ((p.owed || 0) > 0 && p.loc === 'ussr'){
      this.say(st, p.name + ': сначала налог на содержание — долг ' + p.owed + '.', 'bad');
      return st;
    }
    let cost = 0, ok = true;
    const list = a.items || {};
    if (p.loc === 'ussr'){
      for (const key in list){
        const n = list[key]|0; if (n<=0) continue;
        const [kind, origin] = key.split(':');
        /* Жетоны сырья и товара банк выдаёт без счёта; ограничены только
           карты собственности и привезённый импорт. */
        const stock = origin==='i' ? (st.market.imp[kind]||0)
                    : (st.market[kind] == null ? Infinity : st.market[kind]);
        if (n > stock){ ok = false; break; }
        cost += n * this.price(st, kind, origin, 'buy');
      }
      if (!ok || cost > p.rub) return st;
      const parts = [];
      for (const key in list){
        const n = list[key]|0; if (n<=0) continue;
        const [kind, origin] = key.split(':');
        if (origin==='i') st.market.imp[kind] -= n;
        else if (st.market[kind] != null) st.market[kind] -= n;
        if (kind==='raw') p.raw += n;
        else if (kind==='goods') p.goods += n;
        else if (kind==='plant') p.own.plant += n;
        else if (kind==='computer') p.own.computer += n;
        else { p.own[kind][origin] += n; this.awaySync(p, kind, origin, n); }
        parts.push(KIND[kind].short + (origin==='i'?' (имп.)':'') + ' ×' + n);
      }
      this.compFix(p);
      p.rub -= cost;
      this.say(st, p.name + ' покупает: ' + parts.join(', ') + ' за ' + cost + ' тыс. руб.', '');
    } else {
      // за границей: только товар этого континента, за доллары, сразу в груз
      const cont = st.continents[p.loc], kind = CONTINENTS[p.loc].kind;
      const n = (a.n|0);
      const free = this.capacityFor(p, p.loc) - p.cargo.length;
      if (n<=0 || n>cont.stock || n>free) return st;
      const c = n * this.usdPrice(st, kind);
      if (c > p.usd) return st;
      p.usd -= c; cont.stock -= n;
      for (let i=0;i<n;i++) p.cargo.push({kind, origin:'i', state:'own'});
      this.say(st, p.name + ' покупает в ' + CONTINENTS[p.loc].ru + ': ' + KIND[kind].short + ' ×' + n + ' за $' + c + ' тыс.', '');
    }
    /* Совмещение из правил: «загрузка государственного груза входит в ход
       „Покупка“». Берём после покупки — купленное уже заняло трюм. */
    if (a.load) this.doLoad(st, p, a.load|0);
    this.endTurn(st); break;
  }

  /* ---------- ДОБЫЧА СЫРЬЯ ---------- */
  case 'EXTRACT': {
    if (p.loc !== 'ussr') return st;
    const useS = Math.min(a.s|0, p.own.extractor.s + p.rent.extractor);
    const useI = Math.min(a.i|0, p.own.extractor.i);
    const n = useS + useI; if (n <= 0) return st;
    const cost = n * this.extractCost(st);
    if (cost > p.rub) return st;
    const out = this.outFor(p, 'extractor', useS, useI);
    p.rub -= cost; p.raw += out;
    this.say(st, p.name + ' добывает ' + LOTS(out) + ' сырья (расход ' + cost + ' тыс. руб.).', '');
    this.endTurn(st); break;
  }

  /* ---------- ПРОИЗВОДСТВО ---------- */
  case 'PRODUCE': {
    if (p.loc !== 'ussr') return st;
    const slots = this.machineSlots(p);
    let useS = Math.min(a.s|0, p.own.machine.s + p.rent.machine);
    let useI = Math.min(a.i|0, p.own.machine.i);
    if (useS + useI > slots){ useI = Math.min(useI, slots); useS = Math.min(useS, slots - useI); }
    const n = useS + useI; if (n <= 0) return st;
    const cost = n * this.produceCost(st);
    const out = this.outFor(p, 'machine', useS, useI);
    if (cost > p.rub || out > p.raw) return st;
    p.rub -= cost; p.raw -= out; p.goods += out;
    this.say(st, p.name + ' производит ' + LOTS(out) + ' товара (расход ' + cost + ' тыс. руб.).', '');
    this.endTurn(st); break;
  }

  /* ---------- ПРОДАЖА ---------- */
  case 'SELL': {
    let gain = 0; const parts = [];
    if (p.loc === 'ussr'){
      const list = a.items || {};
      for (const key in list){
        const n = list[key]|0; if (n<=0) continue;
        const [kind, origin] = key.split(':');
        const have = kind==='raw' ? p.raw : kind==='goods' ? p.goods
                   : kind==='plant' ? p.own.plant : kind==='computer' ? p.own.computer : p.own[kind][origin];
        if (n > have) return st;
      }
      for (const key in list){
        const n = list[key]|0; if (n<=0) continue;
        const [kind, origin] = key.split(':');
        gain += n * this.price(st, kind, origin, 'sell');
        if (kind==='raw'){ p.raw -= n; }
        else if (kind==='goods'){ p.goods -= n; }
        else if (kind==='plant'){ p.own.plant -= n; st.market.plant += n; }
        else if (kind==='computer'){ p.own.computer -= n; st.market.imp.computer += n; }
        else { p.own[kind][origin] -= n; this.awaySync(p, kind, origin, -n);
               if (origin==='i') st.market.imp[kind]+=n;
               else if (st.market[kind] != null) st.market[kind]+=n; }
        parts.push(KIND[kind].short + (origin==='i'?' (имп.)':'') + ' ×' + n);
      }
      this.compFix(p);
      // продажа привезённого собственного импорта прямо из груза
      const fromCargo = a.cargo|0;
      if (fromCargo > 0){
        let left = fromCargo;
        for (let i=p.cargo.length-1; i>=0 && left>0; i--){
          const c = p.cargo[i];
          if (c.state==='own' && c.origin==='i'){
            gain += this.price(st, c.kind, 'i', 'sell');
            st.market.imp[c.kind] = (st.market.imp[c.kind]||0) + 1;
            parts.push(KIND[c.kind].short + ' (имп., из груза)');
            p.cargo.splice(i,1); left--;
          }
        }
      }
      if (gain <= 0) return st;
      p.rub += gain;
      this.say(st, p.name + ' продаёт: ' + parts.join(', ') + ' за ' + gain + ' тыс. руб.', '');
    } else {
      // мировой рынок покупает только советский товар — по $4 тыс. за партию
      const what = (a.raw && E(st).prices.raw.usd) ? 'raw' : 'goods';
      let n = a.n|0;
      const avail = p.cargo.filter(c=>c.kind===what && c.origin==='s' && c.state==='own').length;
      n = Math.min(n, avail); if (n<=0) return st;
      let left = n;
      for (let i=p.cargo.length-1; i>=0 && left>0; i--){
        const c = p.cargo[i];
        if (c.kind===what && c.origin==='s' && c.state==='own'){ p.cargo.splice(i,1); left--; }
      }
      if (st.market[what] != null) st.market[what] += n;   // жетоны не считаются
      let g = 0;
      const cont = st.continents[p.loc];
      const dBefore = this.demandOf(st, p.loc);
      const prices = [];
      if (this.hasDemand(st) && what === 'goods'){
        // каждая партия оценивается по спросу, который на неё пришёлся
        for (let i=0; i<n; i++){
          const pr = this.goodsPrice(st, p.loc);
          prices.push(pr); g += pr;
          cont.demand = Math.max(0, (cont.demand|0) - DEMAND_DRAIN);
        }
      } else {
        g = n * this.usdPrice(st, what);
      }
      p.usd += g;
      const how = prices.length && prices[0] !== prices[prices.length-1]
        ? ' (по $' + prices.join(', $') + ')' : '';
      const dNote = this.hasDemand(st) && what==='goods'
        ? ' Спрос здесь упал с ' + dBefore + ' до ' + this.demandOf(st, p.loc) + '.' : '';
      this.say(st, p.name + ' продаёт за границей ' + LOTS(n) + ' ' + (what==='raw'?'сырья':'товара') + ' за $' + g + ' тыс.' + how + '.' + dNote, '');
    }
    /* Совмещение из правил: «разгрузка государственного груза входит в ход
       „Продажа“ своего». Деньги за перевозку уже получены при погрузке —
       здесь только сдаём жетоны банкиру. */
    if (a.unload){
      const gov = this.doDropGov(st, p);
      if (gov) this.say(st, p.name + ' заодно сдаёт государственный груз ×' + gov + '.', '');
    }
    this.endTurn(st); break;
  }

  /* ---------- ПОГРУЗКА ГОСГРУЗА ---------- */
  case 'LOAD': {
    if (!this.doLoad(st, p, a.n|0)) return st;
    this.endTurn(st); break;
  }

  /* ---------- РАЗГРУЗКА ---------- */
  case 'UNLOAD': {
    let gov=0, own=0; const ownKinds = {};
    for (let i=p.cargo.length-1; i>=0; i--){
      const c = p.cargo[i];
      /* Держвантаж здають тільки там, куди його привезли: гроші плачені
         «за перевозку», а перевозки не було. Взяти й тут-таки скинути —
         не хід із правил, а дірка. */
      if (c.state === 'gov' && c.from && c.from === p.loc) continue;
      if (c.state === 'gov'){
        if (p.loc==='ussr'){
          if (c.origin==='i') st.market.imp[c.kind] = (st.market.imp[c.kind]||0)+1;
          else if (st.market[c.kind] != null) st.market[c.kind] += 1;
        } else {
          st.continents[p.loc].stock += 1;
        }
        p.cargo.splice(i,1); gov++;
      } else if (p.loc==='ussr' && c.origin==='i' && c.kind !== 'goods'){
        // привезённый себе импорт становится собственностью и может работать
        if (c.kind==='computer') p.own.computer += 1; else p.own[c.kind].i += 1;
        ownKinds[c.kind] = (ownKinds[c.kind]||0) + 1;
        p.cargo.splice(i,1); own++;
      } else if (p.loc==='ussr' && c.origin==='s' && (c.kind==='raw' || c.kind==='goods')){
        // непроданное своё сырьё и товар возвращаются на склад, а не пропадают
        if (c.kind==='raw') p.raw += 1; else p.goods += 1;
        p.cargo.splice(i,1); own++;
      }
    }
    if (gov+own === 0) return st;
    const kept = [];
    if (ownKinds.computer) kept.push('Компьютер ×' + ownKinds.computer);
    for (const k in ownKinds) if (k!=='computer') kept.push(KIND[k].short + ' ×' + ownKinds[k]);
    this.say(st, p.name + ' разгружается' + (gov?': госгруз ×'+gov:'') +
      (kept.length ? ', оставляет себе: ' + kept.join(', ') : '') + '.', '');
    if (ownKinds.computer){
      if (p.bot) this.autoAssign(p);
      const room = this.COMP_KINDS.reduce((a2,k)=> a2 + p.own[k].s + p.own[k].i, 0) - this.compUsed(p);
      this.say(st, 'Компьютер ставится на один станок, на одно оборудование по добыче или на одну машину и даёт ей +1 партию за ход.'
        + (room > 0 ? ' Выберите, куда его поставить — кнопка «Установка» в зоне «Компьютеры».'
                    : ' Свободных мест нет: пока компьютеру некуда встать.'), 'dl');
    }
    this.endTurn(st); break;
  }

  /* ---------- ПОЕЗДКА ---------- */
  case 'TRAVEL': {
    const dest = a.dest;
    const cont = p.loc==='ussr' ? dest : p.loc;
    if (p.loc==='ussr'){
      if (!CONTINENTS[dest]) return st;
      /* Ограничения «на континенте только один игрок» в правилах движения
         нет: единственная строчка про это стоит в разделе о раскладке поля
         и противоречит их же тактике №7, где торговец сидит на континенте
         постоянно. В списке запретов её тоже нет. Континенты открыты всем. */
    } else if (dest !== 'ussr') return st;   // с континента на континент нельзя

    /* Какой транспорт едет. По умолчанию — весь, что туда доходит, но
       игрок может отправить часть: меньше увезёт, зато катастрофа отберёт
       только уехавшее. Дома оставленные машины не рискуют ничем. */
    if (p.loc === 'ussr'){
      const all = this.fleetHome(p, dest);
      const pick = a.ship;
      const clamp = (k,o)=> pick ? Math.max(0, Math.min((pick[k]&&pick[k][o])|0, all[k][o])) : all[k][o];
      const away = {truck:{s:clamp('truck','s'), i:clamp('truck','i')},
                    fleet:{s:clamp('fleet','s'), i:clamp('fleet','i')}};
      /* Сколько компьютеров уехало: игрок выбирает конкретные карточки, и
         машина с компьютером могла остаться дома. Без указания считаем,
         что уехали оснащённые — так было раньше. */
      const cp = pick && pick.comp;
      away.comp = {truck:{s:0,i:0}, fleet:{s:0,i:0}};
      for (const k of ['truck','fleet']) for (const o of ['s','i']){
        const want = cp ? ((cp[k] && cp[k][o])|0) : away[k][o];
        away.comp[k][o] = Math.max(0, Math.min(want, away[k][o], this.compOn(p, k, o)));
      }
      p.away = away;
    }

    // берём с собой свой товар
    let take = 0, takeRaw = 0;
    if (p.loc==='ussr'){
      take = Math.min(a.take|0, p.goods);
      for (let i=0;i<take;i++) p.cargo.push({kind:'goods', origin:'s', state:'own'});
      p.goods -= take;
      // в 1993-м мировой рынок берёт и сырьё — дёшево, но берёт
      if (E(st).prices.raw.usd){
        takeRaw = Math.min(a.takeRaw|0, p.raw);
        for (let i=0;i<takeRaw;i++) p.cargo.push({kind:'raw', origin:'s', state:'own'});
        p.raw -= takeRaw;
      }
    }
    /* Манифест рейса. Игрок в окне «Поездка» решает три вещи: куда, какие
       машины едут и что они везут. Всё, чего в манифесте нет, остаётся на
       внутреннем рынке — раньше лишнее молча уезжало на государственном
       транспорте и двигало курс («взял две машины, а сдвинуло на шесть»).
       a.drop — снятое игроком вручную; остаток сверх трюма снимается сам,
       если игрок не нанял государственный транспорт (a.hire). */
    if (p.loc === 'ussr'){
      if (a.drop){
        const d = a.drop;
        if ((d.gov|0) > 0) this.leaveHome(st, p, d.gov|0, 'gov');
        if ((d.own|0) > 0) this.leaveHome(st, p, d.own|0, 'own');
      }
      if (a.ship && !a.hire){
        const hold = this.capOfSet(p, p.away, dest);
        if (p.cargo.length > hold) this.leaveHome(st, p, p.cargo.length - hold);
      }
    }
    const units = p.cargo.length;
    const fee = this.travelFee(st, p, cont, units, p.loc !== 'ussr' && dest === 'ussr');
    /* За границей фрахт можно оплатить валютой: перевозчик там свой и берёт
       долларами. Без этого игрок, у которого остались только доллары,
       не мог бы уехать домой вообще — менять валюту за рубежом нельзя. */
    let feeUsd = 0;
    if (fee > p.rub){
      const short = fee - p.rub;
      // валютой — только по 1:1, как когда-то менял банк: домой вернёшься
      // всегда, но за спасение переплатишь во столько раз, каков курс
      if (p.loc !== 'ussr' && p.usd >= short){
        feeUsd = short;
      } else {                                            // откат
        for (let i=0;i<take+takeRaw;i++){ p.cargo.pop(); }
        p.goods += take; p.raw += takeRaw;
        if (p.loc === 'ussr') p.away = null;
        return st;
      }
    }
    if (feeUsd){
      p.usd -= feeUsd; p.rub += feeUsd;
      this.say(st, p.name + ' платит за дорогу валютой по 1:1 — $' + feeUsd + ' тыс. вместо ' + feeUsd + ' тыс. грн.', '');
    }
    p.rub -= fee;
    if (fee>0) this.say(st, p.name + ' нанимает государственный транспорт за ' + fee + ' тыс. руб.', '');

    // карта «События в пути»
    if (!st.deck.length){ st.deck = shuffle(st, st.discard); st.discard = []; }
    const evId = st.deck.pop(); const ev = cardOf(st, evId);
    st.discard.push(evId);
    st.eventSeq = (st.eventSeq || 0) + 1;
    st.lastEvent = {id:evId, img:ev.img || evId, txt:ev.txt, good:!!ev.good, by:p.id, notes:[], seq:st.eventSeq};
    const note = s => st.lastEvent.notes.push(s);
    this.say(st, p.name + ' — карта в пути: ' + ev.txt, 'ev');

    if (ev.crash){
      st.deck = shuffle(st, buildDeck(st)); st.discard = [];
      const lost = p.cargo.length;
      /* СТРАХОВКА. Импорт гибнет всегда — заново его не завезёшь. А своё,
         отечественное, можно тут же выкупить за половину нынешней цены:
         рынок готов поставить замену. Решение за игроком, поэтому ход не
         заканчивается, пока он не выбрал. */
      /* Гибнет только то, что было В РЕЙСЕ. Машины, оставленные дома,
         катастрофа не касается — раньше она забирала весь парк. */
      const gone = p.away || {truck:{s:p.own.truck.s, i:p.own.truck.i},
                              fleet:{s:p.own.fleet.s, i:p.own.fleet.i}};
      const salv = [];
      const add = (key, n) => { if (n>0) salv.push({key, n}); };
      add('truck:s', gone.truck.s);
      add('fleet:s', gone.fleet.s);
      let cargoS = {};
      p.cargo.forEach(c=>{ if (c.origin==='s') cargoS[c.kind] = (cargoS[c.kind]||0)+1; });
      for (const k in cargoS) add(k+':s', cargoS[k]);

      // импорт и госгруз уходят немедленно и безвозвратно
      for (let i=p.cargo.length-1; i>=0; i--){
        const c = p.cargo[i];
        if (c.origin==='i' || c.state==='gov'){
          if (c.origin==='i') st.market.imp[c.kind] = (st.market.imp[c.kind]||0)+1;
          else if (st.market[c.kind] != null) st.market[c.kind] += 1;
          p.cargo.splice(i,1);
        }
      }
      /* импортный транспорт из рейса тоже гибнет, и выкупить его нельзя */
      st.market.imp.truck += gone.truck.i; st.market.imp.fleet += gone.fleet.i;
      p.own.truck.i -= gone.truck.i; p.own.fleet.i -= gone.fleet.i;
      if (p.away){
        p.away.truck.i = 0; p.away.fleet.i = 0;
        if (p.away.comp){ p.away.comp.truck.i = 0; p.away.comp.fleet.i = 0; }
      }
      this.compFix(p);        // компьютеры с погибших машин снимаются

      const cost = this.salvageCost(st, salv);
      if (E(st).salvage && salv.length && p.rub > 0){
        st.pendingSalvage = {by:p.id, items:salv, cost:cost};
        st.lastEvent.salvage = {items:salv, cost:cost, rub:p.rub};
        note('Импорт потерян безвозвратно. Своё можно выкупить за половину цены — ' + cost + ' тыс.');
        this.say(st, p.name + ' — КАТАСТРОФА. Импорт потерян; своё можно выкупить за ' + cost + ' тыс.', 'bad');
        break;                                   // ход не кончается: ждём решения
      }
      this.resolveSalvage(st, p, salv, {});
      note('Потеряно: груз (' + lost + ') и весь транспорт, бывший в рейсе. Колода перетасована.');
      this.say(st, p.name + ' — КАТАСТРОФА. Потерян груз и транспорт, бывший в рейсе.', 'bad');
    } else {
      if (ev.rub){ const d = Math.max(ev.rub, -p.rub); p.rub += d; note('Уплачено ' + (-d) + ' тыс. руб.'); }
      /* rubK — плата по нынешнему курсу: иначе к 5-му курсу штраф стал бы мелочью */
      if (ev.rubK && !ev.choice){
        const want = ev.rubK * this.usdSellRate(st);
        const d = Math.min(want, p.rub); p.rub -= d;
        note('Уплачено ' + d + ' тыс.' + (d < want ? ' (больше не было)' : ''));
      }
      if (ev.usd){ p.usd += ev.usd; note('Получено $' + ev.usd + ' тыс.'); }
      if (ev.skip){ p.skip += ev.skip; note('Пропуск следующего хода.'); }
      if (ev.fx){ this.advance(st, ev.fx); note('Индикатор курса сдвинут на ' + ev.fx + ' — деньги подешевели у всех.'); }
      if (ev.demandAll && this.hasDemand(st)){
        const d = ev.demandAll;
        for (const k in st.continents){
          const c = st.continents[k];
          c.demand = Math.max(0, Math.min(DEMAND_MAX, (c.demand|0) + d));
        }
        note((d>0 ? 'Спрос вырос на всех континентах: ' : 'Спрос просел на всех континентах: ') +
             Object.keys(st.continents).map(k=>CONTINENTS[k].ru + ' $' + this.goodsPrice(st,k)).join(', ') + '.');
      }
      if (ev.demand && this.hasDemand(st)){
        const key = (p.loc === 'ussr') ? dest : p.loc;
        const c = st.continents[key];
        if (c){
          c.demand = Math.max(0, Math.min(DEMAND_MAX, (c.demand|0) + ev.demand));
          note('Спрос в «' + CONTINENTS[key].ru + '» теперь ' + c.demand + ' — партия идёт по $' + this.goodsPrice(st, key) + '.');
        }
      }
      /* карта выбора: ход не кончается, пока игрок не решил */
      if (ev.choice){
        const cost = (ev.rubK || 0) * this.usdSellRate(st);
        const cargo = p.cargo.filter(c=>c.state==='own').length;
        const worth = p.cargo.reduce((a,c)=> a + (c.state==='own'
          ? Math.round((c.kind==='goods' ? this.goodsPrice(st, p.loc==='ussr'?dest:p.loc) : this.usdPrice(st, c.kind) || 1) / 2) : 0), 0);
        st.pendingChoice = {by:p.id, kind:ev.choice, cost:cost, cargo:cargo, worth:worth,
                            dest:(p.loc==='ussr'?dest:p.loc), arrive:!!ev.arrive};
        st.lastEvent.choice = {kind:ev.choice, cost:cost, cargo:cargo, worth:worth, rub:p.rub};
      }
      if (ev.arrive){
        p.loc = (p.loc==='ussr') ? dest : 'ussr';
        if (p.loc === 'ussr') p.away = null;      // парк вернулся домой целиком
        if (units > 0){
          this.advance(st, units);
          note('Границу пересекло ' + LOTS(units) + ' груза — индикатор курса сдвинут.');
        } else {
          note('Прибытие без груза.');
        }
        /* Приехали домой — своё сразу на стол, ход на это не нужен.
           Но не раньше, чем разобрались с картой выбора: иначе таможня
           не нашла бы у вас груза, который вы уже успели выложить. */
        if (p.loc === 'ussr' && !st.pendingChoice){
          const un = this.autoUnload(st, p);
          if (un){
            const left = p.cargo.filter(c=>c.state==='gov').length;
            const imp  = p.cargo.length - left;
            note('Своё выложено на стол без хода.'
              + (left ? ' Государственный груз (' + left + ') сдаётся отдельным ходом «Разгрузка».' : '')
              + (imp ? ' Привезённый импортный товар (' + imp + ') остаётся в грузе — он продаётся вдвое дороже.' : ''));
            if (un.kinds.computer){
              if (p.bot) this.autoAssign(p);
              this.say(st, 'Компьютер ставится на один станок, на одно оборудование по добыче или на одну машину и даёт ей +1 партию за ход. Кнопка «Установка» в зоне «Компьютеры».', 'dl');
            }
          }
        }
        this.say(st, p.name + ' прибывает: ' + (p.loc==='ussr'?'СССР':CONTINENTS[p.loc].ru) + (units?(', груза ' + units):''), 'ev');
        if (ev.extra){ st.extraAction = true; note('Дополнительное действие в этот ход.'); }
      } else {
        if (p.loc === 'ussr') p.away = null;      // никто никуда не уехал
        note('Поездка сорвана, Вы остались на месте.');
        this.say(st, p.name + ' не доехал: ' + ev.txt, 'bad');
      }
    }
    this.checkBankrupt(st, p);
    if (st.pendingChoice) break;              // ждём решения по карте
    this.endTurn(st); break;
  }

  /* ---------- ПРОПУСК ---------- */
  /* ---------- УСТАНОВКА КОМПЬЮТЕРОВ ----------
     a.map = {machine:{s,i}, extractor:{s,i}} — сколько компьютеров стоит
     на каждом типе единиц. Разложить СВОБОДНЫЕ компьютеры по пустым местам
     можно бесплатно; снять уже установленный и переставить — стоит ход. */
  case 'ASSIGN': {
    const cur = this.compMap(p), want = a.map || {};
    const norm = {};
    let total = 0;
    for (const k of this.COMP_KINDS){
      norm[k] = {s:0, i:0};
      for (const o of ['s','i']){
        const v = Math.max(0, Math.min((want[k] && want[k][o])|0, p.own[k][o]));
        norm[k][o] = v; total += v;
      }
    }
    if (total > p.own.computer) return st;
    let removed = 0, added = 0;
    for (const k of this.COMP_KINDS)
      for (const o of ['s','i']){
        const d = norm[k][o] - cur[k][o];
        if (d > 0) added += d; else removed += -d;
      }
    if (!added && !removed) return st;
    const moving = removed > 0;                       // снятие = переустановка
    if (moving && (st.cur !== p.id || st.pendingChoice || st.pendingSalvage)) return st;
    p.comp = norm;
    const where = [];
    const NM = {machine:'станки', extractor:'добыча', truck:'автотранспорт', fleet:'флот'};
    for (const k of this.COMP_KINDS)
      if (norm[k].s + norm[k].i) where.push(NM[k] + ' ' + (norm[k].s + norm[k].i));
    const free = this.compFree(p);
    this.say(st, p.name + (moving ? ' переставляет компьютеры: ' : ' устанавливает компьютеры: ')
             + (where.length ? where.join(', ') : 'сняты все')
             + (free ? ' · без места ' + free : '') + '.', '');
    if (moving) this.endTurn(st);
    break;
  }

  case 'PASS': {
    this.say(st, p.name + ' пропускает ход.', '');
    this.endTurn(st); break;
  }

  /* ================= ВНЕХОДОВЫЕ ОПЕРАЦИИ (ход не тратится) ========= */

  case 'LOAN': {
    if (p.debts > 0) return st;
    if (!this.canLoan(st)) return st;
    const take = this.loanTake(st), due = this.loanRepay(st);
    p.debts = 1; p.debtDue = due; p.rub += take;
    this.say(st, p.name + ' берёт ссуду ' + take + ' тыс. руб. (вернуть ' + due + ').', 'dl');
    break;
  }
  case 'REPAY': {
    const owe = p.debtDue || 0;
    if (p.debts <= 0 || owe <= 0 || p.rub < owe) return st;
    p.debts -= 1; p.debtDue = 0; p.rub -= owe;
    this.say(st, p.name + ' возвращает в банк ' + owe + ' тыс. руб.', 'dl');
    break;
  }
  case 'EXCHANGE': {
    // банк стоит дома: в 1993-м валюту сдают только в Украине
    if (E(st).inflating && p.loc !== 'ussr') return st;
    const n = Math.min(a.n|0, p.usd); if (n<=0) return st;
    const r = this.usdSellRate(st), got = n * r;
    p.usd -= n; p.rub += got;
    this.say(st, p.name + ' меняет $' + n + ' тыс. на ' + got + ' тыс. руб. (курс банка 1:' + r + ').', 'dl');
    break;
  }
  /* Купить валюту можно только за границей — это такая же закупка, как
     закупка товара на континенте, и она тратит ход. Обменник берёт
     наценку, поэтому внутри одного курса на этом не заработать: прибыль
     только у того, кто удержал доллары через смену курса. Сам спрос на
     валюту давит на гривню и двигает индикатор. */
  case 'BUYUSD': {
    if (!this.canBuyUsd(st, p)) return st;
    const r = this.usdBuyRate(st); if (r <= 0) return st;
    const n = Math.min(a.n|0, Math.floor(p.rub / r)); if (n <= 0) return st;
    p.rub -= n * r; p.usd += n;
    this.say(st, p.name + ' покупает $' + n + ' тыс. за ' + (n*r) + ' тыс. грн (обменник 1:' + r + ').', 'dl');
    const cells = this.fxPressure(st, n);
    if (cells) this.say(st, 'Спрос на валюту давит на гривню — индикатор сдвинут на ' + cells + '.', 'ev');
    break;
  }
  case 'OFFER': {
    const o = a.offer;
    /* Пустая сторона — это подарок или одалживание, а правила требуют,
       чтобы «любая услуга была оплачена». Заодно защищает от промаха:
       выставить «отдайте мне, я ничего не даю» больше нельзя. */
    if ((this.legEmpty(o.give) && !o.rent) || this.legEmpty(o.want)) return st;
    o.id = st.offerSeq++; o.from = p.id; o.turn = st.turn; o.course = st.course;
    st.offers.push(o);
    this.say(st, p.name + ' выставляет предложение о сделке.', 'dl');
    break;
  }
  case 'CANCEL': {
    const i = st.offers.findIndex(o=>o.id===a.id);
    if (i<0) return st;
    if (st.offers[i].from !== p.id && st.offers[i].to !== p.id) return st;
    st.offers.splice(i,1); break;
  }
  case 'ACCEPT': {
    const o = st.offers.find(x=>x.id===a.id);
    if (!o) return st;
    if (o.to !== -1 && o.to !== p.id) return st;
    if (o.from === p.id) return st;
    const A = this.P(st, o.from), B = p;
    const err = this.tradeCheck(st, A, B, o);
    if (err){ this.say(st, 'Сделка невозможна: ' + err, 'bad'); return st; }
    this.tradeExec(st, A, B, o);
    st.offers = st.offers.filter(x=>x.id!==o.id);
    break;
  }
  /* ---------- решение по карте события ---------- */
  case 'CHOOSE': {
    const pc = st.pendingChoice;
    if (!pc || pc.by !== p.id) return st;
    st.pendingChoice = null;
    const yes = !!a.yes;
    if (pc.kind === 'customs'){
      if (yes && p.rub >= pc.cost){
        p.rub -= pc.cost;
        this.say(st, p.name + ' платит пошлину ' + pc.cost + ' тыс.', '');
      } else {
        const i = p.cargo.findIndex(c=>c.state==='own');
        if (i >= 0){
          const c = p.cargo[i];
          if (c.origin==='i') st.market.imp[c.kind] = (st.market.imp[c.kind]||0)+1;
          else if (st.market[c.kind] != null) st.market[c.kind] += 1;
          p.cargo.splice(i,1);
          this.say(st, p.name + ' отдаёт таможне партию груза.', 'bad');
        } else this.say(st, p.name + ' отделался предупреждением — везти было нечего.', '');
      }
    } else if (pc.kind === 'buyout'){
      if (yes && pc.cargo > 0){
        let got = 0;
        for (let i=p.cargo.length-1; i>=0; i--){
          const c = p.cargo[i];
          if (c.state!=='own') continue;
          got += Math.round((c.kind==='goods' ? this.goodsPrice(st, pc.dest) : (this.usdPrice(st, c.kind) || 1)) / 2);
          if (c.origin==='i') st.market.imp[c.kind] = (st.market.imp[c.kind]||0)+1;
          else if (st.market[c.kind] != null) st.market[c.kind] += 1;
          p.cargo.splice(i,1);
        }
        p.usd += got;
        this.say(st, p.name + ' сдаёт весь груз перекупщикам за $' + got + ' тыс.', 'dl');
      } else this.say(st, p.name + ' отказывается продавать груз перекупщикам.', '');
    } else if (pc.kind === 'bribe'){
      if (yes && p.rub >= pc.cost){
        p.rub -= pc.cost; st.extraAction = true;
        this.say(st, p.name + ' платит ' + pc.cost + ' тыс. и успевает ещё одну операцию.', 'dl');
      } else this.say(st, p.name + ' стоит в очереди как все.', '');
    }
    /* карта разобрана — теперь можно выложить своё на стол */
    if (pc.arrive && p.loc === 'ussr'){
      const un = this.autoUnload(st, p);
      if (un && un.kinds.computer){
        if (p.bot) this.autoAssign(p);
        this.say(st, 'Компьютер ставится на один станок, на одно оборудование по добыче или на одну машину и даёт ей +1 партию за ход. Кнопка «Установка» в зоне «Компьютеры».', 'dl');
      }
    }
    this.checkBankrupt(st, p);
    this.endTurn(st);
    break;
  }

  /* ---------- решение по страховке ---------- */
  case 'SALVAGE': {
    const ps = st.pendingSalvage;
    if (!ps || ps.by !== p.id) return st;
    const r = this.resolveSalvage(st, p, ps.items, a.pick);
    if (!r) return st;                                 // не хватает денег на выбранное
    st.pendingSalvage = null;
    if (r.keep.length){
      const txt = r.keep.map(k=>KIND[k.key.split(':')[0]].short + ' ×' + k.n).join(', ');
      this.say(st, p.name + ' выкупает после катастрофы: ' + txt + ' за ' + r.cost + ' тыс. руб.', 'dl');
    } else {
      this.say(st, p.name + ' не выкупает — потеряно всё своё имущество в рейсе.', 'bad');
    }
    this.checkBankrupt(st, p);
    this.endTurn(st);
    break;
  }
  case 'NEW': break;
  }
  return st;
},

/* --- страховка при катастрофе -------------------------------------- */
salvageCost(st, items){
  let c = 0;
  items.forEach(it=>{
    const [kind] = it.key.split(':');
    c += Math.ceil(this.price(st, kind, 's', 'buy') / 2) * it.n;   // округляем поштучно, как показано в окне
  });
  return c;
},
/* Выкупать можно по позициям: спасти флот и бросить товар — законный
   выбор. Всё, что не выкуплено, возвращается в комплект. */
resolveSalvage(st, p, items, pick){
  pick = pick || {};
  const keep = [];
  items.forEach(it=>{
    const n = Math.max(0, Math.min(it.n, pick[it.key]|0));
    if (n > 0) keep.push({key:it.key, n:n});
  });
  const cost = this.salvageCost(st, keep);
  if (cost > p.rub) return null;                      // не по карману — решение не принято
  p.rub -= cost;
  items.forEach(it=>{
    const [kind] = it.key.split(':');
    const kept = keep.find(k=>k.key===it.key);
    const drop = it.n - (kept ? kept.n : 0);
    if (drop <= 0) return;
    if (kind==='truck' || kind==='fleet'){
      st.market[kind] += drop; p.own[kind].s -= drop;
      /* уехавший парк тоже уменьшается, иначе трюм в рейсе останется прежним */
      if (p.away){
        p.away[kind].s = Math.max(0, p.away[kind].s - drop);
        if (p.away.comp) p.away.comp[kind].s = Math.min(p.away.comp[kind].s|0, p.away[kind].s);
      }
      this.compFix(p);
    }
    else {
      if (st.market[kind] != null) st.market[kind] += drop;
      let left = drop;
      for (let i=p.cargo.length-1; i>=0 && left>0; i--){
        const c = p.cargo[i];
        if (c.origin==='s' && c.kind===kind){ p.cargo.splice(i,1); left--; }
      }
    }
  });
  return {cost:cost, keep:keep};
},

/* --- проверка и исполнение сделки ---------------------------------- */
/* --- налог на содержание имущества ------------------------------------
   Считаются карты собственности: завод, станок, оборудование, автотранспорт,
   флот, компьютер. Жетоны сырья и товара — не имущество, а запас, и налогом
   не облагаются. Арендованное чужое тоже: оно не Ваше. */
objectsOf(p){
  return p.own.plant + p.own.computer
    + p.own.machine.s + p.own.machine.i + p.own.extractor.s + p.own.extractor.i
    + p.own.truck.s + p.own.truck.i + p.own.fleet.s + p.own.fleet.i;
},
upkeepOf(st, p){
  const u = E(st).upkeep;
  if (!u) return 0;
  return Math.floor(this.objectsOf(p) / u.per) * u.rate[st.course-1];
},
/* Сколько объектов можно держать бесплатно. */
upkeepFree(st){ const u = E(st).upkeep; return u ? u.per - 1 : Infinity; },
/* Списать налог за прошедший ход. Нечем платить — уходит в недоимку,
   она вычитается из итогового счёта. Это мягче принудительной продажи:
   игрок сам решает, что продавать, и решает не в панике. */
chargeUpkeep(st, p){
  const bill = this.upkeepOf(st, p);
  if (bill <= 0 && !(p.owed > 0)) return;
  let due = bill + (p.owed || 0);
  const pay = Math.min(due, p.rub);
  p.rub -= pay; due -= pay;
  p.owed = due;
  if (due > 0 && bill > 0)
    this.say(st, p.name + ': налог на содержание ' + bill + ' — платить нечем, долг вырос до ' + due + '.', 'bad');
},

/* Пустая ли сторона сделки: ни денег, ни валюты, ни вещей, ни аренды. */
legEmpty(leg){
  if (!leg) return true;
  if ((leg.rub|0) > 0 || (leg.usd|0) > 0 || (leg.note|0) > 0) return false;
  const it = leg.items || {};
  for (const k in it) if ((it[k]|0) > 0) return false;
  return true;
},
tradeCheck(st, A, B, o){
  // товарные сделки только между игроками в одной точке карты;
  // чисто денежные разрешены в разных
  const goodsInvolved = (o.give.items && Object.keys(o.give.items).length) ||
                        (o.want.items && Object.keys(o.want.items).length) || o.rent;
  if (goodsInvolved && A.loc !== B.loc)
    return 'игроки в разных точках карты могут совершать только финансовые операции.';
  const chk = (who, leg) => {
    if ((leg.rub|0) > who.rub) return who.name + ': не хватает рублей.';
    if ((leg.usd|0) > who.usd) return who.name + ': не хватает долларов.';
    if ((leg.note|0) > who.debts) return who.name + ': нет столько кредитных обязательств.';
    for (const key in (leg.items||{})){
      const n = leg.items[key]|0; if (n<=0) continue;
      const [kind, origin] = key.split(':');
      const have = kind==='raw'?who.raw : kind==='goods'?who.goods
                 : kind==='plant'?who.own.plant : kind==='computer'?who.own.computer
                 : who.own[kind][origin];
      if (n > have) return who.name + ': нет столько «' + KIND[kind].short + '».';
    }
    return null;
  };
  return chk(A, o.give) || chk(B, o.want);
},
moveLeg(st, from, to, leg){
  from.rub -= (leg.rub|0); to.rub += (leg.rub|0);
  from.usd -= (leg.usd|0); to.usd += (leg.usd|0);
  const nn = leg.note|0;
  if (nn){                                   // вместе с обязательством уходит и его сумма
    const share = Math.round((from.debtDue||0) * nn / Math.max(1, from.debts));
    from.debts -= nn; from.debtDue = Math.max(0, (from.debtDue||0) - share);
    to.debts += nn;   to.debtDue = (to.debtDue||0) + share;
  }
  for (const key in (leg.items||{})){
    const n = leg.items[key]|0; if (n<=0) continue;
    const [kind, origin] = key.split(':');
    if (kind==='raw'){ from.raw-=n; to.raw+=n; }
    else if (kind==='goods'){ from.goods-=n; to.goods+=n; }
    else if (kind==='plant'){ from.own.plant-=n; to.own.plant+=n; }
    else if (kind==='computer'){ from.own.computer-=n; to.own.computer+=n; }
    else { from.own[kind][origin]-=n; to.own[kind][origin]+=n;
           this.awaySync(from, kind, origin, -n); this.awaySync(to, kind, origin, n); }
  }
  this.compFix(from); this.compFix(to);
},
tradeExec(st, A, B, o){
  this.moveLeg(st, A, B, o.give);
  this.moveLeg(st, B, A, o.want);
  if (o.rent){                        // аренда мощностей на один ход
    const t = o.rent.kind, n = o.rent.n|0;
    B.rent[t] = (B.rent[t]||0) + n;
    this.say(st, B.name + ' арендует у ' + A.name + ': ' + KIND[t].short + ' ×' + n + ' на один свой ход.', 'dl');
  }
  this.say(st, 'СДЕЛКА: ' + A.name + ' ⇄ ' + B.name + ' — ' + this.legTxt(o.give) + ' против ' + this.legTxt(o.want) + '.', 'dl');
},
legTxt(leg){
  const parts = [];
  if (leg.rub) parts.push(leg.rub + ' тыс.руб.');
  if (leg.usd) parts.push('$' + leg.usd + ' тыс.');
  if (leg.note) parts.push('кредитное обязательство ×' + leg.note);
  for (const key in (leg.items||{})){
    const n = leg.items[key]|0; if (n<=0) continue;
    const [kind, origin] = key.split(':');
    parts.push(KIND[kind].short + (origin==='i'?' (имп.)':'') + ' ×' + n);
  }
  return parts.length ? parts.join(' + ') : 'ничего';
}
};
</script>
<script>
/* =====================================================================
   ТРАНСПОРТ — единственное место, которое меняется для сетевой игры
   ===================================================================== */
let S = null;                       // текущее состояние
const Transport = {
  mode: 'local',
  send(action){
    try { Prof.act(action); } catch(_){ }    // своё действие считаем до отправки
    if (typeof Net !== 'undefined' && Net.active()){
      if (Net.isHost()){                       // хозяин считает сам и рассылает состояние
        S = Rules.apply(S, action);
        UI.render(); Net.saveGame(); Net.pushState(); Bots.schedule();
      } else {
        Net.sendAction(action);                // гость только просит — считает хозяин
      }
      return;
    }
    S = Rules.apply(S, action);
    UI.render();
    Bots.schedule();
  }
};
/* Сетевой вариант (Photon Realtime JS / Colyseus / PartyKit / socket.io):
 *
 *   const NetTransport = {
 *     mode:'net', room:null,
 *     send(action){ this.room.send('act', action); },      // ничего не применяем сами
 *     onMessage(action){ S = Rules.apply(S, action); UI.render(); }
 *   };
 *
 * Работает потому, что Rules.apply — чистая функция, а весь рандом идёт
 * из state.seed. Все клиенты, применив одну и ту же последовательность
 * действий, получают идентичное состояние: колода тасуется одинаково.
 * Порядок действий задаёт комната (сервер), клиент только рисует.
 * Для authoritative-сервера тот же файл Rules можно запустить в Node.
 */

/* =====================================================================
   БОТЫ
   ===================================================================== */
/* ECON нужен ботам, чтобы знать про налог; E() приватна для Rules. */
function C_ECON(st){ return ECON[st.mode] || ECON.classic; }

const Bots = {
  timer: null,
  schedule(){
    clearTimeout(this.timer);
    if (!S || S.over) return;
    if (typeof Net !== 'undefined' && Net.active() && !Net.isHost()) return;   // боты живут только у хозяина
    if (UI.blocking()){ this.timer = setTimeout(()=>this.schedule(), 500); return; }
    const p = Rules.P(S, S.cur);
    if (p && p.bot && !p.out) this.timer = setTimeout(()=>this.act(), 850);
    else this.timer = setTimeout(()=>this.react(), 700);   // боты реагируют на сделки
  },
  /* Оценка стороны сделки глазами игрока p.
     mine=true — это то, что p ОТДАЁТ (стоит столько, сколько даст рынок),
     mine=false — то, что p ПОЛУЧАЕТ (стоит столько, сколько рынок с него
     запросил бы, если вещь ему нужна, иначе — по цене сдачи).
     Раньше обе стороны считались по цене сдачи, и любая честная сделка
     «между рынком и рынком» выглядела для бота убыточной — поэтому боты
     не приняли ни одной чужой сделки за всю партию. */
  val(st, leg, forP, mine){
    let v = (leg.rub|0) + (leg.usd|0)*Rules.usdSellRate(st) - (leg.note|0)*Rules.loanRepay(st);
    for (const key in (leg.items||{})){
      const n = leg.items[key]|0; if (n<=0) continue;
      const [kind, origin] = key.split(':');
      const sell = Rules.price(st, kind, origin, 'sell');
      const buy  = Rules.price(st, kind, origin, 'buy');
      let unit = sell;
      if (!mine && forP && this.needs(st, forP, kind)){
        /* нужное дешевле рынка — прямая выгода; но налог на содержание
           отнимает часть ценности, поэтому лишнего не берём */
        const upk = Rules.upkeepOf ? (C_ECON(st).upkeep ? C_ECON(st).upkeep.rate[st.course-1] : 0) : 0;
        unit = Math.max(sell, buy - upk * 2);
      }
      v += n * unit;
    }
    return v;
  },
  /* Нужна ли боту эта вещь прямо сейчас. */
  needs(st, p, kind){
    if (kind === 'raw')   return Rules.usableMachines(p) > 0 && p.raw < Rules.usableMachines(p) * 2;
    if (kind === 'goods') return Rules.truckCap(p) + Rules.fleetCap(p) > p.goods;
    if (kind === 'plant') return p.own.plant === 0 ||
      (p.own.machine.s + p.own.machine.i) > Rules.machineSlots(p);
    if (kind === 'machine')   return (p.own.machine.s + p.own.machine.i) < Rules.machineSlots(p);
    if (kind === 'extractor') return (p.own.extractor.s + p.own.extractor.i) < 4;
    if (kind === 'computer')  return Rules.compFree(p) === 0 &&
      Rules.COMP_KINDS.reduce((a,k)=>a + p.own[k].s + p.own[k].i, 0) > p.own.computer;
    if (kind === 'truck' || kind === 'fleet')
      return Rules.truckCap(p) + Rules.fleetCap(p) < Math.max(2, p.goods);
    return false;
  },
  /* ================= ФИНАНСОВАЯ ГРАМОТНОСТЬ =================
     Раньше бот тратил всё до копейки и не знал про налог на содержание.
     Теперь он прикидывает свои обязательные расходы на несколько ходов
     вперёд и не залезает в этот резерв. */
  HORIZON: 3,                       // на сколько ходов вперёд считаем расходы
  /* Обязательные расходы на ход: налог на содержание плюс работа станков
     и оборудования, если он собирается ими работать. */
  burn(st, p){
    const tax = Rules.upkeepOf(st, p);
    /* работа считается по ВСЕМУ парку: запуск станков — одно действие,
       но платится за каждый, и именно на этом боты садились в долг */
    const work = Rules.produceCost(st) * Rules.usableMachines(p)
               + Rules.extractCost(st) * (p.own.extractor.s + p.own.extractor.i);
    return tax + work;
  },
  /* Сколько наличности бот держит неприкосновенно. */
  reserve(st, p){
    const r = this.burn(st, p) * this.HORIZON + (p.owed || 0);
    return Math.min(r, 90);         // без фанатизма: копить бесконечно тоже глупо
  },
  /* Свободные деньги — то, чем можно рисковать. */
  spare(st, p){ return Math.max(0, p.rub - this.reserve(st, p)); },
  /* Можно ли потратить столько, не залезая в резерв. */
  afford(st, p, cost){ return this.spare(st, p) >= cost; },
  /* Сколько объектов можно ещё купить, не перейдя налоговый порог. */
  taxRoom(st, p){
    const u = C_ECON(st).upkeep; if (!u) return Infinity;
    const n = Rules.objectsOf(p);
    return (u.per - (n % u.per)) % u.per || u.per;   // сколько до следующей ступени
  },
  /* Имущество, которое не работает и только ест налог.
     Возвращает список ключей вида 'machine:s' с количеством. */
  idle(st, p){
    const out = {};
    const add = (k, n) => { if (n > 0) out[k] = (out[k]||0) + n; };
    /* станки без завода или сверх пазов — но только если завод не по карману,
       иначе бот будет качаться «продал станок / купил завод» бесконечно */
    const slots = Rules.machineSlots(p);
    const mach = p.own.machine.s + p.own.machine.i;
    const canPlant = st.market.plant > 0 && p.rub >= Rules.price(st,'plant','s','buy');
    let over = canPlant ? 0 : mach - slots;
    if (over > 0){
      const s = Math.min(over, p.own.machine.s - Rules.compOn(p,'machine','s'));
      if (s > 0){ add('machine:s', s); over -= s; }
      const i = Math.min(over, p.own.machine.i - Rules.compOn(p,'machine','i'));
      if (i > 0) add('machine:i', i);
    }
    /* завод без единого станка — и станок купить не на что */
    const canMach = st.market.machine > 0 && p.rub >= Rules.price(st,'machine','s','buy');
    if (p.own.plant > 0 && mach === 0 && !canMach) add('plant:s', p.own.plant);
    /* транспорт сверх того, что есть чем грузить */
    const hold = Rules.truckCap(p) + Rules.fleetCap(p);
    const cargoNeed = p.goods + p.cargo.length + 2;
    if (hold > cargoNeed + 2 && p.loc === 'ussr'){
      const t = p.own.truck.s - Rules.compOn(p,'truck','s');
      if (t > 0) add('truck:s', Math.min(t, Math.ceil((hold - cargoNeed) / 2)));
    }
    /* компьютер, которому некуда встать */
    const free = Rules.compFree(p);
    if (free > 0) add('computer:i', free);
    return out;
  },

  react(){
    if (!S || S.over) return;
    this.tidyOffers();
    for (const o of S.offers.slice()){
      const cands = S.players.filter(q=>q.bot && !q.out && q.id!==o.from && (o.to===-1 || o.to===q.id));
      for (const b of cands){
        if (Rules.tradeCheck(S, Rules.P(S,o.from), b, o)) continue;
        const gain = this.val(S, o.give, b, false), cost = this.val(S, o.want, b, true);
        /* и денег после сделки должно остаться на налог с работой */
        const rubOut = (o.want.rub|0);
        if (gain >= cost * 1.05 && gain - cost >= 2 && b.rub - rubOut >= this.burn(S, b)){
          Transport.send({type:'ACCEPT', by:b.id, id:o.id});
          return;
        }
      }
    }
    this.offer();
  },
  /* Снимаем свои предложения, которые потеряли смысл: нужное уже куплено,
     обещанных денег больше нет, предложенного имущества больше нет.
     Раньше боты никогда не убирали за собой, и панель забивалась мусором. */
  tidyOffers(){
    for (const o of S.offers.slice()){
      const b = Rules.P(S, o.from);
      if (!b || !b.bot || b.out) continue;
      let dead = false;
      /* нечем заплатить обещанное */
      if ((o.give.rub|0) > b.rub || (o.give.usd|0) > b.usd) dead = true;
      /* обещанного имущества уже нет */
      for (const k in (o.give.items||{})){
        const [kind, orig] = k.split(':');
        const have = kind==='raw' ? b.raw : kind==='goods' ? b.goods
                   : kind==='plant' ? b.own.plant : kind==='computer' ? b.own.computer
                   : b.own[kind][orig];
        if ((o.give.items[k]|0) > have){ dead = true; break; }
      }
      /* Даём предложению пожить: снимать его на следующем же круге —
         это мусор в панели и ноль шансов, что кто-то успеет принять.
         Раньше на 434 выставленных приходилось 400 снятых. */
      const age = S.turn - (o.turn | 0);
      if (!dead && age >= 3){
        /* просил вещь и уже раздобыл её сам */
        if (!Object.keys(o.give.items||{}).length && (o.give.rub|0) > 0){
          const want = Object.keys(o.want.items||{})[0];
          if (want){
            const [kind, orig] = want.split(':');
            const have = kind==='plant' ? b.own.plant : kind==='computer' ? b.own.computer
                       : kind==='raw' ? b.raw : kind==='goods' ? b.goods : b.own[kind][orig];
            if (have > 0 && kind !== 'raw' && kind !== 'goods') dead = true;
          }
        }
      }
      /* Просто «никто не взял» — не повод снимать: предложение продумано
         наперёд и ждёт своего покупателя. Снимаем только то, что стало
         невыполнимым или ненужным. Единственное исключение — смена курса:
         цена в предложении относилась к прежним деньгам. */
      if (!dead && o.course != null && o.course !== S.course) dead = true;
      if (dead) Transport.send({type:'CANCEL', by:b.id, id:o.id});
    }
  },

  offer(){
    if (!S || S.over) return;
    for (const b of S.players){
      if (!b.bot || b.out) continue;
      if (S.offers.some(o=>o.from===b.id)) continue;
      if (b.loc !== 'ussr') continue;
      /* СНАЧАЛА избавляемся от того, что не работает и ест налог:
         сдать игроку выгоднее, чем рынку — рынок покупает дешевле. */
      const idle = this.idle(S, b);
      const keys = Object.keys(idle);
      if (keys.length){
        const k = keys[0], n = idle[k];
        const [kind, orig] = k.split(':');
        const sell = Rules.price(S, kind, orig, 'sell');
        const buy  = Rules.price(S, kind, orig, 'buy');
        const price = Math.max(1, Math.round((sell + buy) / 2));   // между рынком и рынком
        const tax = C_ECON(S).upkeep ? ' Содержание съедает деньги каждый ход.' : '';
        Transport.send({type:'OFFER', by:b.id, offer:{
          to:-1, give:{rub:0,usd:0,note:0,items:{[k]:n}},
          want:{rub:price*n, usd:0, note:0, items:{}},
          note:'Простаивает — отдам дешевле рынка.' + tax}});
        return;
      }
      if (b.raw >= 4 && b.role === 'miner'){
        const n = Math.min(b.raw, 5), pr = Math.max(1, Math.round(Rules.price(S,'raw','s','buy')*0.8));
        Transport.send({type:'OFFER', by:b.id, offer:{
          to:-1, give:{rub:0,usd:0,note:0,items:{'raw:s':n}}, want:{rub:n*pr,usd:0,note:0,items:{}},
          note:'Сырьё дешевле рынка — берите, не теряя хода.'}});
        return;
      }
      if (b.goods >= 3 && b.role==='producer'){
        const n = Math.min(b.goods, 4), pr = Math.max(1, Math.round(Rules.price(S,'goods','s','buy')*0.8));
        Transport.send({type:'OFFER', by:b.id, offer:{
          to:-1, give:{rub:0,usd:0,note:0,items:{'goods:s':n}}, want:{rub:n*pr,usd:0,note:0,items:{}},
          note:'Товар перевозчикам, дешевле рынка.'}});
        return;
      }
      /* --- ЗАЯВКИ НА ПОКУПКУ: «куплю то, чего мне не хватает» ---
         Боты не только сбывали излишки, но и молчали о своих нуждах, хотя
         это самая живая часть настолки. Цена — между рыночной продажей и
         рыночной покупкой: продавцу выгоднее, чем сдать банку, покупателю
         дешевле, чем взять с рынка. Выигрывают оба, ход не тратится. */
      const bid = this.wants(S, b);
      if (bid) { Transport.send({type:'OFFER', by:b.id, offer:bid}); return; }
    }
  },
  /* Чего этому боту не хватает и сколько он за это даст. */
  wants(st, b){
    const mid = (kind, origin) => {                 // честная цена между рынком и рынком
      const buy = Rules.price(st, kind, origin||'s', 'buy');
      const sell = Rules.price(st, kind, origin||'s', 'sell');
      return Math.max(1, Math.round((buy + sell) / 2));
    };
    const ask = (kind, origin, n, note) => {
      const price = mid(kind, origin) * n;
      if (price > b.rub) return null;               // не обещаем того, чего нет
      return {to:-1, give:{rub:price, usd:0, note:0, items:{}},
              want:{rub:0, usd:0, note:0, items:{[kind + ':' + (origin||'s')]: n}},
              note:note};
    };
    const mach = b.own.machine.s + b.own.machine.i;
    const ext  = b.own.extractor.s + b.own.extractor.i;
    const hold = Rules.truckCap(b) + Rules.fleetCap(b);
    const free = st.market;

    /* Компьютер достаётся только из Америки — его почти всегда просят. */
    if (b.own.computer < 2 && Rules.compFree(b) === 0 &&
        (mach + ext + b.own.truck.s + b.own.truck.i + b.own.fleet.s + b.own.fleet.i) > b.own.computer)
      { const o = ask('computer','i',1,'Куплю компьютер — на рынке его не бывает.'); if (o) return o; }

    if (b.role === 'producer'){
      if (!b.own.plant && !free.plant)
        { const o = ask('plant','s',1,'Куплю завод — на рынке кончились.'); if (o) return o; }
      if (b.own.plant && mach < Rules.machineSlots(b) && !free.machine)
        { const o = ask('machine','s',1,'Куплю станок — пазы простаивают.'); if (o) return o; }
      if (mach > 0 && b.raw < mach)
        { const o = ask('raw','s',Math.min(4, mach*2),'Куплю сырьё — станки стоят без дела.'); if (o) return o; }
    }
    if (b.role === 'miner' && ext < 4 && !free.extractor)
      { const o = ask('extractor','s',1,'Куплю оборудование добычи.'); if (o) return o; }
    if (b.role === 'trader'){
      if (hold < 4 && !free.truck && !free.fleet)
        { const o = ask('truck','s',1,'Куплю автотранспорт — нечем возить.'); if (o) return o; }
      if (hold > 0 && b.goods === 0)
        { const o = ask('goods','s',Math.min(4, hold),'Куплю товар — трюм пустой, повезу на продажу.'); if (o) return o; }
    }
    return null;
  },
  act(){
    if (!S || S.over) return;
    const p = Rules.P(S, S.cur);
    if (!p || !p.bot || p.out) return;
    // решение по карте события
    if (S.pendingChoice && S.pendingChoice.by === p.id){
      const pc = S.pendingChoice;
      let yes = false;
      if (pc.kind === 'customs') yes = p.rub >= pc.cost * 2;          // платим, если не последнее
      else if (pc.kind === 'buyout') yes = pc.worth > 0 && p.cargo.length > 0 &&
        pc.worth >= Rules.goodsPrice(S, pc.dest) * pc.cargo * 0.6;    // берём, если дают прилично
      else if (pc.kind === 'bribe') yes = p.rub >= pc.cost * 3;       // лишний ход дорог, но не любой ценой
      Transport.send({type:'CHOOSE', by:p.id, yes:yes});
      return;
    }
    // решение по страховке: выкупаем, если после выкупа остаётся на работу
    if (S.pendingSalvage && S.pendingSalvage.by === p.id){
      const ps = S.pendingSalvage;
      const budget = p.rub - Rules.produceCost(S) * 2;      // на работу оставить надо
      const order = ps.items.slice().sort((a,b)=>{          // транспорт важнее груза
        const w = k => (k.startsWith('truck')||k.startsWith('fleet')) ? 0 : 1;
        return w(a.key) - w(b.key);
      });
      const pick = {}; let spent = 0;
      order.forEach(it=>{
        const [kind] = it.key.split(':');
        const one = Math.ceil(Rules.price(S, kind, 's', 'buy') / 2);
        let n = 0;
        while (n < it.n && spent + one <= budget){ spent += one; n++; }
        if (n) pick[it.key] = n;
      });
      Transport.send({type:'SALVAGE', by:p.id, pick:pick});
      return;
    }
    const before = S.log.length + ':' + S.cur + ':' + S.turn;
    Transport.send(this.decide(S, p) || {type:'PASS', by:p.id});
    // страховка от зацикливания: если действие оказалось невыполнимым — просто пропускаем ход
    if (S.log.length + ':' + S.cur + ':' + S.turn === before && S.cur === p.id && !S.over)
      Transport.send({type:'PASS', by:p.id});
  },
  /* Три уровня. Средний — та политика, что была раньше: она уже неплохо
     держит удар. Сильный играет ту линию, которая по замерам приносит
     больше всего за действие: производство → вывоз → импорт → продажа
     дома вдвое. Лёгкий — тот же средний, но с завязанными руками. */
  level(st, p){ return p.skill || st.botSkill || 'norm'; },

  /* ================= БОТ БЕЗ РОЛИ =================
     Смотрит, чем уже заняты остальные, и берётся за самое свободное
     дело. Первый выбирает по тому, что есть на рынке, каждый следующий
     видит выбор предыдущих — так стол сам собой расходится по нишам,
     и между ними появляется, чем торговать. */
  profileOf(p){
    const ex = p.own.extractor.s + p.own.extractor.i;
    const mc = p.own.machine.s + p.own.machine.i + p.own.plant * 2;
    const tr = p.own.truck.s + p.own.truck.i + p.own.fleet.s + p.own.fleet.i;
    if (ex === 0 && mc === 0 && tr === 0) return null;      // ещё не определился
    if (mc >= ex && mc >= tr) return 'producer';
    if (ex >= tr) return 'miner';
    return 'trader';
  },
  pickRole(st, p){
    const busy = {miner:0, producer:0, trader:0};
    st.players.forEach(q=>{
      if (q.id === p.id || q.out) return;
      /* Считаем и тех, кто уже вложился, и тех, кто просто объявил дело:
         сосед, выбравший роль ходом раньше, тоже занимает нишу. */
      const pr = this.profileOf(q) || ((q.bot && (q.roleSet || !q.auto)) ? q.role : null);
      if (pr && busy[pr] != null) busy[pr]++;
    });
    /* При равной занятости берём то, что прямо сейчас приносит больше за
       действие. Числа игра даёт сама: цена сдачи минус расход на работу,
       у перевозчика — фрахт за наряд. Отсюда классика тянет в производство
       (там дефляция съедает возню с перевозками), а 1993 — в перевозки. */
    const sell = k => Rules.price(st, k, 's', 'sell');
    const gain = {
      miner:    sell('raw') - Rules.extractCost(st),
      producer: (sell('goods') - Rules.produceCost(st) - Rules.extractCost(st)) / 2,
      trader:   Rules.freight(st) * Math.min(3, Rules.govLot(st) === Infinity ? 3 : Rules.govLot(st)) / 2
    };
    /* Перевозки платят больше всех за действие, но каждый груз через
       границу торопит смену курса. Там, где цены падают, это режет
       будущий доход всем — включая самого перевозчика; прогоны стола из
       трёх перевозчиков в классике дают вдвое меньший капитал, чем стол
       с двумя. Поэтому в дефляционной экономике ниша оценивается ниже. */
    /* Множитель 0.25 подобран прогоном (см. game_bots.md): при 1.0 и 0.45
       стол из восьми ботов раскладывается 2/3/3 и берёт 872–907, при 0.25
       и ниже — 3/3/2 и 1121, причём последнее место поднимается со −52 до
       +122. В 1993 скидка не нужна: там цены растут и торопить конец
       партии перевозчику не вредно. */
    if (!C_ECON(st).inflating) gain.trader *= 0.25;
    /* если рынок пуст, за дело не взяться */
    const stock = {miner:st.market.extractor, producer:st.market.plant,
                   trader:st.market.truck + st.market.fleet};
    const order = ['producer','miner','trader']
      .filter(k=>stock[k] > 0)
      .sort((a,b)=> (busy[a] - busy[b]) || (gain[b] - gain[a]));
    if (!order.length) order.push('trader');
    const pick = order[0];
    p.role = pick;
    this.say0(st, p.name + ' берётся за своё дело: ' + BOT_ROLES[pick].toLowerCase() +
      ' — этим тут занят' + (busy[pick] ? 'о меньше всего' : 'о ещё никто') + '.');
    return pick;
  },
  say0(st, text){ Rules.say(st, text, 'dl'); },

  decide(st, p){
    /* роль ещё не выбрана — выбираем на первом же своём ходу */
    if (p.auto && !p.roleSet){ this.pickRole(st, p); p.roleSet = true; }
    const lv = this.level(st, p);
    let a = null;
    if (lv === 'hard') a = this.hard(st, p);
    if (!a && lv === 'easy') a = this.easy(st, p);
    if (!a) a = this.normal(st, p);
    const b = this.budget(st, p, a);
    /* касса может отклонить действие целиком — тогда играем обычную политику */
    if (b === null) return (a.type === 'BUYUSD') ? this.normal(st, p) : a;
    return b;
  },
  /* Во что обойдётся покупка. */
  costOf(st, items){
    let c = 0;
    for (const k in (items||{})){
      const n = items[k]|0; if (n<=0) continue;
      const [kind, orig] = k.split(':');
      c += n * Rules.price(st, kind, orig, 'buy');
    }
    return c;
  },
  /* Единая касса. Любое решение проходит здесь: покупка не должна оставлять
     бота без денег на налог и на работу следующего хода. Если денег нет —
     сначала избавляемся от простаивающего, потом урезаем покупку, и только
     потом отказываемся от неё вовсе. */
  /* Как выбраться из долга по налогу. Порядок — от самого безобидного
     к самому болезненному: сперва работаем и сбываем запасы, и только
     в конце режем сам парк. PASS не годится: он не приносит денег, и бот
     пасовал бы вечно (проверено — партия упиралась в 40 000 действий). */
  raiseMoney(st, p){
    const id = p.id;
    if (p.goods > 0) return {type:'SELL', by:id, items:{'goods:s':p.goods}};
    const mach = Rules.usableMachines(p);
    if (mach > 0 && p.raw > 0 && p.rub >= Rules.produceCost(st)){
      const plan = Rules.planRun(p, 'machine', p.raw, p.own.machine.s + p.rent.machine, p.own.machine.i);
      if (plan.s + plan.i > 0) return {type:'PRODUCE', by:id, s:plan.s, i:plan.i};
    }
    if (p.raw > 2) return {type:'SELL', by:id, items:{'raw:s':p.raw - 1}};
    const ex = p.own.extractor.s + p.own.extractor.i;
    if (ex > 0 && p.rub >= Rules.extractCost(st) * ex)
      return {type:'EXTRACT', by:id, s:p.own.extractor.s + p.rent.extractor, i:p.own.extractor.i};
    if (p.raw > 0) return {type:'SELL', by:id, items:{'raw:s':p.raw}};
    if (p.usd > 0 && Rules.canSellUsd(st, p)) return {type:'EXCHANGE', by:id, n:p.usd};
    const idle = this.idle(st, p);
    if (Object.keys(idle).length) return {type:'SELL', by:id, items:idle};
    if (p.debts === 0 && Rules.canLoan(st)) return {type:'LOAN', by:id};
    const s2 = this.anySellable(st, p);
    if (s2) return {type:'SELL', by:id, items:s2};
    /* последнее средство: режем парк, начиная с самого дорогого */
    for (const k of ['fleet','truck','extractor','machine']){
      for (const o of ['i','s']){
        if (p.own[k][o] > 0) return {type:'SELL', by:id, items:{[k+':'+o]:1}};
      }
    }
    if (p.own.computer > 0) return {type:'SELL', by:id, items:{'computer:i':1}};
    if (p.own.plant > 0) return {type:'SELL', by:id, items:{'plant:s':p.own.plant}};
    return null;
  },
  budget(st, p, a){
    /* В долгу по налогу покупать запрещено — значит сначала добываем деньги. */
    if ((p.owed || 0) > 0 && p.loc === 'ussr' && a && a.type === 'BUY'){
      const m = this.raiseMoney(st, p);
      if (m) return m;
    }
    /* Уезжать за границу с пустым кошельком нельзя: налог капает и там,
       а погасить его оттуда нечем — рынка и складов за рубежом нет.
       Директор из-за этого сидел в долгу треть партии. */
    if (a && a.type === 'TRAVEL' && p.loc === 'ussr'){
      const tax = Rules.upkeepOf(st, p);
      if (tax > 0 && p.rub < tax * 5){   // рейс туда-обратно это 5–7 ходов
        if (p.goods > 0 && Rules.truckCap(p) + Rules.fleetCap(p) === 0)
          return {type:'SELL', by:p.id, items:{'goods:s':p.goods}};
        if (p.raw > 2) return {type:'SELL', by:p.id, items:{'raw:s':p.raw - 1}};
        const idle2 = this.idle(st, p);
        if (Object.keys(idle2).length) return {type:'SELL', by:p.id, items:idle2};
      }
    }
    /* Покупка валюты — тоже трата рублей, а налог платится рублями.
       Директор скупал доллары на всё свободное и садился в долг. */
    if (a && a.type === 'BUYUSD'){
      const rate = Rules.usdBuyRate(st);
      const keep = this.burn(st, p) * 2 + (p.owed || 0);
      const can = Math.floor(Math.max(0, p.rub - keep) / Math.max(1, rate));
      if (can <= 0) return null;
      if (can < (a.n|0)) return {type:'BUYUSD', by:p.id, n:can};
      return a;
    }
    if (!a || a.type !== 'BUY' || p.loc !== 'ussr' || !a.items) return a;
    const cost = this.costOf(st, a.items);
    const keep = this.burn(st, p) * 2 + (p.owed || 0);
    if (p.rub - cost >= keep) return a;

    const idle = this.idle(st, p);
    if (Object.keys(idle).length) return {type:'SELL', by:p.id, items:idle};

    /* урезаем: берём столько, сколько влезает в свободные деньги */
    const room = Math.max(0, p.rub - keep);
    const cut = {};
    let spent = 0, any = 0;
    for (const k in a.items){
      const [kind, orig] = k.split(':');
      const price = Rules.price(st, kind, orig, 'buy');
      const canN = Math.min(a.items[k]|0, Math.floor((room - spent) / Math.max(1, price)));
      if (canN > 0){ cut[k] = canN; spent += canN * price; any += canN; }
    }
    if (any > 0) return {type:'BUY', by:p.id, items:cut};

    /* совсем нет денег — не покупаем, пусть решает следующая ветка политики */
    if ((p.owed || 0) > 0 || p.rub < keep){
      if (p.debts === 0 && Rules.canLoan(st)) return {type:'LOAN', by:p.id};
      const sellable = this.anySellable(st, p);
      if (sellable) return {type:'SELL', by:p.id, items:sellable};
    }
    return a;
  },
  /* Что можно продать, не разрушив дело: сначала излишки запасов. */
  anySellable(st, p){
    if (p.raw   > 4) return {'raw:s': p.raw - 2};
    if (p.goods > 4) return {'goods:s': p.goods - 2};
    for (const k of ['fleet','truck','extractor','machine']){
      for (const o of ['i','s']){
        const have = p.own[k][o] - Rules.compOn(p, k, o);
        if (have > 1) return {[k+':'+o]: 1};
      }
    }
    return null;
  },

  /* ---------------- ЛЁГКИЙ ----------------
     Новичок: не берёт ссуду, не возит ничего за границу, сбывает запас
     при первой возможности и не строит дальше пары станков. */
  easy(st, p){
    const id = p.id;
    if (p.loc !== 'ussr'){                       // оказался за границей — домой
      const own = p.cargo.filter(c=>c.kind==='goods'&&c.state==='own').length;
      if (own > 0) return {type:'SELL', by:id, n:own};
      if (Rules.unloadable(p) > 0) return {type:'UNLOAD', by:id};
      return {type:'TRAVEL', by:id, dest:'ussr'};
    }
    if (Rules.unloadable(p) > 0) return {type:'UNLOAD', by:id};
    if (p.usd > 0 && Rules.canSellUsd(st, p)) return {type:'EXCHANGE', by:id, n:p.usd};
    Rules.autoAssign(p);

    const bp = k => Rules.price(st, k, 's', 'buy');
    const mc = p.own.machine.s + p.own.machine.i;
    const ex = p.own.extractor.s + p.own.extractor.i;
    const hold = Rules.truckCap(p) + Rules.fleetCap(p);

    /* Покупает, только когда денег заведомо вдвое больше нужного, и
       дальше пары станков не растёт — это и делает его новичком. */
    if (ex < 2 && p.rub >= bp('extractor') * 2 && st.market.extractor > 0)
      return {type:'BUY', by:id, items:{'extractor:s':1}};
    if (!p.own.plant && ex >= 2 && p.rub >= bp('plant') * 2 && st.market.plant > 0)
      return {type:'BUY', by:id, items:{'plant:s':1}};
    if (p.own.plant && mc < 2 && p.rub >= bp('machine') * 2 && st.market.machine > 0)
      return {type:'BUY', by:id, items:{'machine:s':1}};
    if (hold === 0 && ex >= 2 && p.rub >= bp('truck') * 3 && st.market.truck > 0)
      return {type:'BUY', by:id, items:{'truck:s':1}};

    /* Берётся и подвозить: заработок скромный, зато без поездок индикатор
       курса не двигается и стол из одних новичков не кончает партию. */
    if (hold > 0 && p.raw === 0 && p.goods === 0){
      const dests = Object.keys(CONTINENTS).filter(k=>Rules.capacityFor(p,k) > 0);
      if (dests.length){
        if (p.cargo.length){
          if (Rules.travelFee(st, p, dests[0], p.cargo.length) <= p.rub)
            return {type:'TRAVEL', by:id, dest:dests[0]};
        } else if (Rules.govLot(st) > 0){
          return {type:'LOAD', by:id, n:Math.min(hold, Rules.govLot(st))};
        }
      }
    }
    if (Rules.unloadable(p) > 0) return {type:'UNLOAD', by:id};

    /* сбывает сразу, не копя и не выбирая момент — потому всегда по низу */
    if (p.goods > 0) return {type:'SELL', by:id, items:{'goods:s':p.goods}};
    if (mc > 0 && p.raw > 0){
      const plan = Rules.planRun(p, 'machine', p.raw,
                                 Math.min(p.own.machine.s, Rules.machineSlots(p)), 0);
      if (plan.s + plan.i > 0 && (plan.s+plan.i) * Rules.produceCost(st) <= p.rub)
        return {type:'PRODUCE', by:id, s:plan.s, i:plan.i};
    }
    if (p.raw > 0 && mc === 0) return {type:'SELL', by:id, items:{'raw:s':p.raw}};
    if (ex > 0){
      const plan = Rules.planRun(p, 'extractor', Infinity, p.own.extractor.s, p.own.extractor.i);
      if (plan.s + plan.i > 0 && (plan.s+plan.i) * Rules.extractCost(st) <= p.rub)
        return {type:'EXTRACT', by:id, s:plan.s, i:plan.i};
    }
    if (p.raw > 0) return {type:'SELL', by:id, items:{'raw:s':p.raw}};
    return {type:'PASS', by:id};
  },

  /* ---------------- СЛОЖНЫЙ: «директор» ----------------
     Играет не роль, а самую доходную цепочку из замеров: произвести →
     вывезти → на выручку взять импорт → продать его дома вдвое дороже.
     Всё остальное — обслуживание этой цепочки. */
  hard(st, p){
    const id = p.id;
    const bp = k => Rules.price(st, k, 's', 'buy');
    /* В КЛАССИКЕ «директор» играет как финдиректор — та линия там и так
       сильнейшая, — но добавляет одно умение, которого нет ни у кого:
       перед последней переменой курса он обналичивается. Имущество
       дешевеет вдесятеро, наличные — нет; это и есть главная тактика из
       самих правил. Переписывать классику целиком пробовали — выходило
       хуже: там слишком мало капитала, чтобы строить длинные цепочки. */
    if (!Rules.hasDemand(st)){
      /* За границей: доллары идут ТОЛЬКО на импорт. Менять их в банке по
         1:1 — та самая ошибка, на которой теряют все: партия товара стоит
         дома в разы больше, чем доллар по банковскому курсу. */
