<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Конверсия (ремастер)</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1a1410">
<link rel="icon" href="img/icons/icon-32.png">
<link rel="apple-touch-icon" href="img/icons/icon-180.png">
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && window.top === window.self)
  addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
</script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=PT+Sans:ital,wght@0,400;0,700;1,400&family=PT+Mono&display=swap">
<style>
:root{
  /* цвета взяты с самих компонентов: карточек, жетонов, банковских чеков */
  --ground:#0C0A09; --tray:#141110; --panel:#1A1614; --panel2:#221D19; --line:#3A2F27; --line2:#514238;
  --ink:#F2EBE0; --ink2:#BCAE9D; --ink3:#8B7C6B;
  --red:#C4241A; --red-lit:#E23A24; --red-dim:#7C1610; --gold:#E0A32E; --green:#4FA355;
  --bar-field:#1B5E8A; --bar-market:#2E7D32; --bar-table:#C4241A; --bar-players:#6E6B22;
  --bar-trade:#7A4A96; --bar-log:#3A2F27;
  --sea:#3E8FB0; --route:#DC4128;
  --c1:#8A4FA8; --c2:#2E6FD4; --c3:#3E9B45; --c4:#E8A317; --c5:#C4241A;
  --disp:"Oswald","PT Sans Narrow","Arial Narrow",sans-serif;
  --body:"PT Sans","Segoe UI",system-ui,sans-serif;
  --mono:"PT Mono","Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground); color:var(--ink); font-family:var(--body); font-size:14px; line-height:1.45;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -8%, rgba(224,163,46,.06), transparent 70%),
    repeating-linear-gradient(96deg, rgba(255,255,255,.011) 0 2px, transparent 2px 6px);
}
button{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3,h4{margin:0;font-family:var(--disp);font-weight:600;text-wrap:balance}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
img{max-width:100%;display:block}

/* ---------------- анимации ---------------- */
@keyframes dealIn{from{opacity:0;transform:translateY(-18px) rotate(-7deg) scale(.9)}to{opacity:1;transform:none}}
@keyframes popIn{0%{opacity:0;transform:scale(.35)}62%{opacity:1;transform:scale(1.14)}100%{opacity:1;transform:scale(1)}}
@keyframes slotIn{0%{opacity:0;transform:translate(-50%,-210%) scale(.85)}70%{opacity:1;transform:translate(-50%,-92%) scale(1.03)}100%{opacity:1;transform:translate(-50%,-100%) scale(1)}}
@keyframes floatUp{0%{opacity:0;transform:translateY(6px) scale(.9)}18%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-38px) scale(1)}}
@keyframes noteFly{0%{opacity:0;transform:translateY(14px) rotate(-9deg) scale(.7)}30%{opacity:1}100%{opacity:0;transform:translateY(-46px) rotate(7deg) scale(1.05)}}
@keyframes coneDrop{0%{opacity:0;transform:translateY(-26px) scale(.5)}70%{opacity:1;transform:translateY(2px) scale(1.12)}100%{opacity:1;transform:none}}
@keyframes cellPop{0%{transform:scaleY(.2);opacity:.3}100%{transform:scaleY(1);opacity:1}}
@keyframes barSweep{from{background-position:200% 0}to{background-position:-100% 0}}
@keyframes tableIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.is-new{animation:dealIn .34s cubic-bezier(.2,.9,.3,1) backwards}
.chips img.is-new,.cgo.is-new{animation:popIn .3s cubic-bezier(.2,.9,.3,1) backwards}
.slot.is-new{animation:slotIn .42s cubic-bezier(.2,.9,.3,1) backwards}
.cone.is-new{animation:coneDrop .45s cubic-bezier(.2,.9,.3,1) backwards}
.cell.is-new{animation:cellPop .3s ease backwards;transform-origin:center bottom}
.table.turn-in{animation:tableIn .26s ease}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#app{max-width:1620px;margin:0 auto;padding:14px 16px 40px;display:flex;flex-direction:column;gap:12px}

/* ---------------- шапка ---------------- */
.top{display:flex;gap:18px;align-items:stretch;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;justify-content:center;padding-right:14px;border-right:1px solid var(--line);min-width:178px}
.brand h1{font-size:26px;letter-spacing:.01em;line-height:.9;text-transform:uppercase;font-weight:700}
.brand h1 span{color:var(--red-lit)}
.brand .ask{width:116px;height:auto;margin-top:5px;opacity:.9;filter:invert(1) contrast(1.3)}
.brand .ask:not([src]){display:none}
/* Підпис української версії замість скана логотипу АСК: та сама вага,
   нахил і довга виносна риска праворуч. */
.mal{width:116px;margin-top:5px;display:flex;align-items:center;gap:5px;line-height:1}
.mal>i{font-family:var(--disp);font-style:italic;font-weight:400;font-size:11px;color:var(--ink3);letter-spacing:.04em}
.mal>b{font-family:var(--disp);font-style:italic;font-weight:700;font-size:16px;color:var(--ink);letter-spacing:-.01em;transform:skewX(-6deg)}
.mal>.rule{flex:1;height:4px;background:var(--ink);margin-left:2px}
.brand .sub{font-family:var(--disp);font-size:9px;font-weight:300;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3);margin-top:4px}
.coursebox{flex:1;min-width:380px;display:flex;flex-direction:column;gap:5px;justify-content:center}
.courserow{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.courserow .lbl{font-family:var(--disp);font-size:11px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3)}
.courserow .big{font-family:var(--disp);font-size:20px;font-weight:700;line-height:1;color:var(--gold);
  padding:2px 9px 3px;border:1px solid #3A2F27;border-radius:2px;background:#0C0B0A}
.courserow .rate{font-family:var(--mono);font-size:13px;color:var(--gold)}
/* Кнопки шапки нужны только там, где нет третьей колонки */
.topbtns{display:none;gap:8px;align-items:center}
.sidebtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sidebtns .actNew{grid-column:1/-1}

/* трек ввоза-вывоза */
#track{display:flex;flex-direction:column;gap:2px;background:#080706;border:1px solid var(--line);border-radius:2px;padding:5px 6px;
  box-shadow:inset 0 2px 7px rgba(0,0,0,.75)}
.trow{display:flex;align-items:center;gap:6px}
.trow .tl{font-family:var(--disp);font-size:9px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);width:46px;flex:none}
.trow .cells{display:flex;gap:1px;flex:1;min-width:0}
.cell{flex:1;min-width:2px;height:9px;border-radius:1px;background:#221C18;transition:background .25s}
.trow.k1 .cell.on{background:var(--c1)} .trow.k2 .cell.on{background:var(--c2)}
.trow.k3 .cell.on{background:var(--c3)} .trow.k4 .cell.on{background:var(--c4)}
.cell.now{background:var(--red-lit)!important;box-shadow:0 0 0 1px #fff3,0 0 9px rgba(226,58,36,.9);position:relative;z-index:2}
.trow .tn{font-family:var(--mono);font-size:9px;color:var(--ink3);width:44px;text-align:right;flex:none}
.trow.done .tn{color:var(--ink2)}
.finish{width:16px;height:9px;flex:none;background:var(--c5);border-radius:1px;opacity:.3}
.finish.lit{opacity:1;box-shadow:0 0 10px rgba(226,58,36,.9)}

/* ---------------- панели: шапка как на карте собственности ---------------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:2px;overflow:hidden;
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 6px 16px rgba(0,0,0,.35)}
.phead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0;position:relative;
  background:var(--bar,#3A2F27);border-bottom:3px solid #0A0908}
.phead h2{flex:1;min-width:0;font-family:var(--disp);font-size:12px;font-weight:500;letter-spacing:.18em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;color:#fff;
  padding:6px 12px 5px;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.phead .mini{margin:0 8px 0 0}
.phead.c-field{--bar:var(--bar-field)} .phead.c-market{--bar:var(--bar-market)}
.phead.c-table{--bar:var(--bar-table)} .phead.c-players{--bar:var(--bar-players)}
.phead.c-trade{--bar:var(--bar-trade)} .phead.c-log{--bar:var(--bar-log)}

.grid{display:grid;grid-template-columns:302px minmax(0,1fr) 336px;gap:12px;align-items:start}
@media (max-width:1280px){.grid{grid-template-columns:284px minmax(0,1fr)}
  .col3{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:12px}}
@media (max-width:900px){.grid{grid-template-columns:1fr}.col3{grid-template-columns:1fr}}
.colstack{display:flex;flex-direction:column;gap:12px}

/* ---------------- поле ---------------- */
.world{padding:10px;background:linear-gradient(180deg,#0F1E26,#0B161C)}
/* Картина поля — та самая, что напечатана на доске. Лежит сверху, под ней
   плашки континентов; снизу уходит в тень, чтобы не спорить с текстом. */
.mapart{position:relative;margin:-10px -10px 9px;overflow:hidden;border-bottom:1px solid #06131A}
.mapart img{display:block;width:100%;height:auto}
.mapart:after{content:"";position:absolute;left:0;right:0;bottom:0;height:46%;
  background:linear-gradient(180deg,rgba(11,22,28,0),rgba(11,22,28,.92))}
.plates{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.plate{position:relative;border:1px solid #2A4A5A;border-radius:2px;background:linear-gradient(160deg,var(--sea),#2A6C86);
  background-size:cover;background-position:center;
  padding:6px 7px 7px;display:flex;flex-direction:column;gap:2px;min-height:80px;overflow:hidden}
/* Поверх рисованной карты — косая вуаль, иначе подписи тонут в синеве */
.plate:before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(118deg,rgba(5,18,24,.84) 0%,rgba(5,18,24,.56) 48%,rgba(5,18,24,.08) 100%)}
.plate>*{position:relative;z-index:1}
.plate.busy{border-color:var(--gold);box-shadow:0 0 0 1px rgba(224,163,46,.45)}
.plate .pn,.plate .pg{padding-right:44px}
.plate .pn{font-family:var(--disp);font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#F2EADA;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.plate .pg{font-family:var(--mono);font-size:10px;color:#BFD6E0;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.plate .thumb{position:absolute;right:-5px;bottom:-6px;width:44px;opacity:.95;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));pointer-events:none}
.plate .thumb.card{width:40px;border-radius:1px;bottom:-9px;right:-7px;transform:rotate(-7deg)}
/* Что здесь берут — знаком на бумажном кружке, а не мутным сканом карточки */
.plate .goods{position:absolute;right:6px;top:6px;width:30px;height:30px;border-radius:50%;z-index:2;
  background:#EDE5D6 var(--paper) center/cover;display:grid;place-items:center;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.35), 0 2px 5px rgba(0,0,0,.5)}
.plate .goods img{display:block;width:19px;height:19px;object-fit:contain}
.dest{position:relative}
.dest .goods{position:absolute;right:7px;top:7px;width:30px;height:30px;border-radius:50%;
  background:#EDE5D6 var(--paper) center/cover;display:grid;place-items:center;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.35), 0 2px 5px rgba(0,0,0,.5)}
.dest .goods img{display:block;width:19px;height:19px;object-fit:contain}
.plate .cones{display:flex;gap:3px;margin-top:auto;position:relative;z-index:2;min-height:12px}
/* Шестая клетка поля — не место, а справка о поездке: другой материал,
   чтобы её не приняли за континент. */
.plate.trip:before{display:none}
.plate.trip{background:linear-gradient(160deg,#2B2119,#1A130F);border-color:#4A3A2A;cursor:pointer;
  transition:border-color .18s, box-shadow .18s}
.plate.trip:hover{border-color:var(--gold);box-shadow:0 0 0 1px rgba(224,163,46,.4)}
.plate.trip .pn{color:var(--gold)}
.plate.trip .pg{color:#C6B49E;padding-right:6px;font-size:9.5px;line-height:1.3}
.plate.trip .pg b{color:#fff;font-weight:400}
.plate.trip .more{margin-top:auto;font-family:var(--disp);font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink3)}
.plate.trip .rk{display:flex;align-items:baseline;gap:5px;margin-top:3px;font-family:var(--mono);font-size:9.5px;color:#9C8A76}
.plate.trip .rk b{color:var(--green);font-weight:400}
.plate.trip .rkbar{height:4px;border-radius:1px;background:#0C0B0A;border:1px solid #3A2F27;overflow:hidden;margin:2px 0 1px}
.plate.trip .rkbar i{display:block;height:100%;background:var(--green)}
.plate.trip.mid  b,.plate.trip.mid  .rkbar i{color:var(--gold)} .plate.trip.mid  .rkbar i{background:var(--gold)}
.plate.trip.warm b{color:#E08A2E} .plate.trip.warm .rkbar i{background:#E08A2E}
.plate.trip.hot  b{color:var(--red-lit)} .plate.trip.hot .rkbar i{background:var(--red-lit)}
.plate.trip:hover .more{color:var(--gold)}
.ussr{margin-top:9px;border:1px solid var(--red-dim);border-radius:2px;
  background:linear-gradient(180deg,#3E1712,#251110);padding:8px 10px;display:flex;align-items:center;gap:9px;position:relative}
.ussr::before{content:"";position:absolute;left:0;right:0;top:-9px;height:9px;
  background:repeating-linear-gradient(90deg,var(--route) 0 3px,transparent 3px 24px);opacity:.6}
.ussr .un{font-family:var(--disp);font-size:15px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
.ussr .cones{margin-left:auto;display:flex;gap:4px;min-height:15px}
.cone{width:15px;height:16px;flex:none;border-radius:46% 46% 40% 40%/62% 62% 30% 30%;
  border:1px solid rgba(0,0,0,.5);box-shadow:inset 0 -4px 5px rgba(0,0,0,.32), inset 0 3px 4px rgba(255,255,255,.42)}
.cone.sm{width:11px;height:12px}

/* ---------------- рынок ---------------- */
.mrow{display:grid;grid-template-columns:46px 1fr auto auto;gap:8px;align-items:center;padding:5px 10px;border-bottom:1px solid #221C18}
.mrow:last-of-type{border-bottom:0}
.mrow .th{width:46px;height:36px;display:flex;align-items:center;justify-content:center}
.mrow .th img{max-width:46px;max-height:34px;width:auto;object-fit:contain}
.mrow .mn b{font-family:var(--disp);font-size:14px;font-weight:400;letter-spacing:.04em;color:var(--ink)}
.mrow .mp{display:flex;flex-direction:column;align-items:flex-end;line-height:1.05}
.mrow .mp b{font-family:var(--mono);font-size:15px;font-weight:400;color:var(--gold)}
.mrow .mp small{font-family:var(--disp);font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.mrow .ms{font-family:var(--mono);font-size:13px;text-align:right;border-left:1px solid #2A231F;padding-left:10px}
.mrow .ms i{font-style:normal;color:var(--gold)}
.mnote{padding:8px 10px;font-size:11px;color:var(--ink3);line-height:1.45}

/* ---------------- стол игрока ---------------- */
.pbar{display:flex;align-items:center;gap:10px;padding:9px 12px;background:linear-gradient(180deg,#241E19,#1C1714);
  border-bottom:1px solid var(--line);flex-wrap:wrap;position:relative}
.pbar .nme{font-family:var(--disp);font-size:22px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;line-height:1}
.tag{font-family:var(--disp);font-size:10px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;padding:2px 7px;
  border:1px solid var(--line2);border-radius:2px;color:var(--ink2)}
.tag.bot{border-color:#8A5FA8;color:#C79BDA}
.money{margin-left:auto;display:flex;gap:18px;align-items:center}
.mgroup{display:flex;align-items:center;gap:8px;position:relative}
.mstack{display:flex;align-items:center;height:30px}
.mstack img{width:64px;border-radius:1px;box-shadow:0 2px 4px rgba(0,0,0,.7);margin-right:-45px;transform-origin:left center}
.mstack img:nth-child(2){transform:rotate(-3deg)}
.mstack img:nth-child(3){transform:rotate(3deg)}
.mstack img:nth-child(4){transform:rotate(-2deg)}
.mstack img:last-child{margin-right:0}
.money b{font-family:var(--mono);font-size:21px;font-weight:400;line-height:1}
.money .rub{color:var(--gold)} .money .usd{color:var(--green)}
.money small{font-family:var(--disp);font-size:10px;font-weight:300;letter-spacing:.14em;color:var(--ink3);text-transform:uppercase}
.delta{position:absolute;right:8px;top:2px;z-index:6;font-family:var(--mono);font-size:13px;pointer-events:none;
  animation:floatUp 1.15s ease forwards;white-space:nowrap;text-shadow:0 1px 3px #000}
.delta.up{color:#7ED484} .delta.down{color:#E88070}
.flynote{position:absolute;right:2px;top:2px;width:52px;pointer-events:none;animation:noteFly 1.15s ease forwards;
  filter:drop-shadow(0 3px 5px rgba(0,0,0,.6))}
.credit{width:104px;border-radius:2px;box-shadow:0 2px 5px rgba(0,0,0,.55)}

/* Стол игрока — лоток коробки: чёрный лакированный картон, зоны утоплены
   в него ячейками. Фактура с листа 04, подставляется из p4.js (--tray). */
.table{padding:12px;display:flex;flex-direction:column;gap:12px;
  background:#0E0C0B var(--tray) center/420px repeat;
  box-shadow:inset 0 10px 22px rgba(0,0,0,.6), inset 0 -8px 18px rgba(0,0,0,.5)}
.zone{border:1px solid #070605;border-radius:3px;background:rgba(14,11,10,.62);padding:9px 11px 12px;
  box-shadow:inset 0 3px 10px rgba(0,0,0,.72), inset 0 -1px 0 rgba(255,255,255,.045),
             0 1px 0 rgba(255,255,255,.04)}
.zone>h4{font-family:var(--disp);font-size:11px;font-weight:400;letter-spacing:.22em;text-transform:uppercase;color:var(--ink3);
  margin-bottom:9px;display:flex;align-items:baseline;gap:8px;border-bottom:1px solid #231D19;padding-bottom:5px;
  text-shadow:0 1px 0 rgba(0,0,0,.8)}
.zone>h4 em{font-style:normal;font-family:var(--mono);font-size:11px;letter-spacing:0;color:var(--ink2);margin-left:auto;text-transform:none}
.zone.empty>h4{margin-bottom:0;border-bottom:0;padding-bottom:0}
.zrow{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}

/* Станки выступают над плитой на ~44px (поднимаются из пазов), и на узком
   экране подзаголовок зоны переносился на вторую строку прямо им под трубы.
   Отступ сверху резервирует место, в которое станки и поднимаются. */
.plant{position:relative;width:262px;flex:none;margin-top:44px}
.plant>img.base{width:100%}
.slot{position:absolute;width:20%;transform:translate(-50%,-100%);filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.slot.ghost{opacity:.17;filter:grayscale(1)}

.stack{position:relative;width:76px;flex:none}
.stack .sh{position:relative;height:112px}
.stack .sh img{position:absolute;left:0;top:0;width:76px;border-radius:2px;box-shadow:0 2px 6px rgba(0,0,0,.6)}
.stack .badge{position:absolute;right:-6px;top:-6px;background:var(--red);color:#fff;font-family:var(--disp);font-size:12px;font-weight:600;
  min-width:21px;height:21px;border-radius:11px;display:flex;align-items:center;justify-content:center;padding:0 5px;
  box-shadow:0 1px 4px rgba(0,0,0,.7);z-index:5}
.stack .cn{margin-top:6px;font-family:var(--disp);font-size:10px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink3);text-align:center;line-height:1.2}

.chips{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.chips img{width:31px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
/* Жетоны лежат в круглых гнёздах, как в настоящей коробке */
.store .chips img{border-radius:50%;background:#0A0908;box-shadow:0 0 0 3px #0A0908, inset 0 2px 4px rgba(0,0,0,.8),
  0 2px 3px rgba(0,0,0,.6)}
.chips .more{font-family:var(--mono);font-size:12px;color:var(--ink3);margin-left:3px}
.chipset{display:flex;flex-direction:column;gap:5px}
.chipset .cl{font-family:var(--disp);font-size:10px;font-weight:400;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3)}
.chipset .cv{font-family:var(--mono);font-size:15px}

/* --- единицы поштучно: оборудование, свободные компьютеры --- */
.zrow.unit{gap:10px;align-items:flex-start}
/* Карточка собственности, собранная вектором (UI.cardSVG) */
.pcard{display:block;width:100%;height:auto;font-family:var(--disp)}
.pcard text{text-transform:uppercase}
.ispec .pcard{width:230px;max-height:none;border-radius:2px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.7))}
.unit1{position:relative;width:72px;flex:none}
.unit1 .ucard{width:72px;border-radius:2px;box-shadow:0 2px 6px rgba(0,0,0,.6);display:block}
.unit1 svg.ucard{box-shadow:none;filter:drop-shadow(0 2px 5px rgba(0,0,0,.6))}
.unit1.pcfree .ucard{width:44px;margin:0 auto;filter:drop-shadow(0 3px 5px rgba(0,0,0,.6));box-shadow:none;
  border-radius:0;opacity:.75}
.unit1 .un{margin-top:5px;font-family:var(--disp);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink3);text-align:center;line-height:1.25}
.upc{position:absolute;right:-7px;top:-9px;z-index:6;width:30px;height:30px;border-radius:50%;
  background:#1B1512;border:1.5px solid var(--gold);box-shadow:0 2px 6px rgba(0,0,0,.8);
  display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.upc img{width:19px;margin-bottom:-1px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.umore{align-self:center;font-family:var(--mono);font-size:13px;color:var(--ink3)}
.pchint{flex:1;min-width:220px;align-self:center;font-size:12px;line-height:1.5;color:var(--ink2)}
.pchint b{color:var(--gold)}
.pchint .cbtn{margin-top:7px}
/* Компьютер стоит на переднем краю плиты, перед своим станком. Раньше он был
   вдвое крупнее и висел над пазом с z-index:3 — закрывал соседний станок.
   Теперь мельче, без подъёма в стопке, и падает на пустую площадку плиты. */
.slot.pc{width:10%;
  filter:drop-shadow(0 0 3px rgba(214,169,74,.85)) drop-shadow(0 2px 3px rgba(0,0,0,.8))}

/* --- транспорт: каждая машина картой, груз лежит на ней --- */
.fgrp+.fgrp{margin-top:13px;padding-top:11px;border-top:1px dashed #2A231E}
.fgt{display:flex;align-items:baseline;gap:9px;margin-bottom:8px;flex-wrap:wrap}
.fgt b{font-family:var(--disp);font-size:10px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.fgt em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--ink3)}
.fgrp.home .fgt b,.fgrp.gov .fgt b{color:var(--ink3)}
.vehrow{gap:11px;align-items:flex-start}
.veh1{position:relative;width:96px;flex:none}
.veh1 .vcard{width:96px;border-radius:2px;box-shadow:0 2px 7px rgba(0,0,0,.65);display:block}
.veh1 svg.vcard{box-shadow:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.65))}
.veh1 .vn{margin-top:5px;font-family:var(--disp);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink3);text-align:center;line-height:1.25}
.veh1 .vpic{position:relative;line-height:0}
.fgrp.home .veh1{opacity:.55;filter:saturate(.55)}
.fgrp.home .veh1 .vcard{box-shadow:0 1px 3px rgba(0,0,0,.5)}
.vload{position:absolute;left:4px;right:4px;bottom:4px;display:flex;gap:3px;height:40px;padding:3px;
  border-radius:2px;background:rgba(8,7,6,.72);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.vslot{position:relative;flex:1;min-width:0;border:1px dashed rgba(255,255,255,.16);border-radius:2px;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.vslot.on{border-color:transparent}
.vslot img{max-width:100%;max-height:100%;object-fit:contain;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
.vslot.gov img{filter:grayscale(.6) brightness(.7)}
.vslot .tok{display:flex;align-items:center;justify-content:center;width:100%;height:100%}
.vslot .tok svg.pcard{width:auto;height:100%;max-width:100%;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
.vslot.gov .tok svg.pcard{filter:grayscale(.6) brightness(.75)}
.vslot .gv{position:absolute;left:0;right:0;bottom:0;text-align:center;font-family:var(--disp);
  font-size:7px;font-style:normal;letter-spacing:.1em;text-transform:uppercase;color:#E8DFD2;
  background:rgba(8,7,6,.7);line-height:1.5}
@media (max-width:520px){
  .veh1,.veh1 .vcard{width:84px} .vload{height:34px}
  .unit1,.unit1 .ucard{width:64px}
}
/* карточки транспорта как переключатели: нажал — машина осталась дома */
.veh1.pick{cursor:pointer;border-radius:3px;padding:3px;margin:-3px;transition:background .12s,box-shadow .12s}
.veh1.pick .vpic{box-shadow:0 0 0 2px var(--gold);border-radius:2px}
.veh1.pick:hover{background:#2A231E}
.veh1.pick.off{opacity:.5;filter:saturate(.4)}
.veh1.pick.off .vpic{box-shadow:0 0 0 1px #3A2F27}

.veh1.pick .vslot{pointer-events:none}
.veh1 .vn .athome{display:block;color:var(--gold);font-weight:600;margin-top:2px}
.rounds{margin:-4px 0 10px;font-size:12.5px;color:var(--ink2)}
.rounds b{color:var(--gold)}
/* журнал: разделители кругов и счётчик в шапке */
.lround{display:flex;align-items:center;gap:8px;margin:9px 0 5px;
  font-family:var(--disp);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3)}
.lround::before,.lround::after{content:'';flex:1;height:1px;background:#2A231E}
.lround:first-child{margin-top:0}
.phead .hcount{font-family:var(--mono);font-size:11px;color:#E8DFD2;opacity:.75;
  letter-spacing:0;text-transform:none;padding-right:12px;white-space:nowrap;flex:none}
/* окно поездки: манифест рейса */
.cap2{font-family:var(--mono);font-size:11px;letter-spacing:0;text-transform:none;color:var(--ink2);margin-left:auto}
.qcap{display:flex;align-items:baseline}
.staybox{font-size:12px;line-height:1.5;color:var(--ink2);background:#241E19;border-left:2px solid var(--gold);
  padding:7px 10px;border-radius:2px;margin:2px 0 8px}
.staybox b{color:var(--gold);font-weight:600}
.govcgo{display:flex;flex-direction:column;gap:5px;align-self:flex-start;padding:6px 8px;border-radius:2px;
  border:1px dashed #3A2F27;background:#1B1512}
.govcgo .gl{font-family:var(--disp);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.govcgo .cargo{gap:5px}
.govcgo .cgo{width:38px}.govcgo .cgo img{width:38px}.govcgo .cgo.chip img{width:26px}
#prev{margin-bottom:9px;min-height:10px}
/* совмещённый ход: «заодно сдать госгруз» */
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line2);
  border-radius:2px;background:#211B17;cursor:pointer;margin-top:2px}
.chk:hover{border-color:var(--gold)}
.chk input{width:19px;height:19px;flex:none;margin:1px 0 0;accent-color:var(--red);cursor:pointer}
.chk span{font-size:13px;line-height:1.4;color:var(--ink)}
.chk i{display:block;font-style:normal;font-size:11.5px;line-height:1.45;color:var(--ink3);margin-top:3px}
.cargo{display:flex;gap:7px;flex-wrap:wrap;align-items:flex-end}
.cgo{position:relative;width:54px}
.cgo img{width:54px;border-radius:2px;box-shadow:0 2px 4px rgba(0,0,0,.55)}
.cgo.chip img{width:36px}
.cgo svg.pcard{width:54px;height:auto;border-radius:2px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.55))}
.govcgo .cgo svg.pcard{width:38px}
.cgo .gov{position:absolute;left:0;right:0;bottom:-13px;text-align:center;font-family:var(--disp);font-size:9px;
  font-weight:400;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.cgo.stateflag img{filter:grayscale(.55) brightness(.72)}

/* ---------------- действия ---------------- */
.acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:0 12px 12px}
@media (max-width:1100px){.acts{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.acts{grid-template-columns:1fr}}
.act{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;padding:0 0 9px;
  background:#211B17;border:1px solid var(--line2);border-radius:2px;cursor:pointer;overflow:hidden;
  transition:transform .12s,border-color .12s,background .12s}
.act b{display:flex;align-items:center;gap:8px;width:100%;font-family:var(--disp);font-size:13px;font-weight:500;text-transform:uppercase;letter-spacing:.14em;
  padding:5px 10px 4px;margin-bottom:6px;background:#3A2F27;color:#fff;border-bottom:2px solid #0A0908}
.act b>span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Бумажный кружок со знаком действия */
.aic{flex:none;width:25px;height:25px;border-radius:50%;background:#EDE5D6 var(--paper) center/cover;
  display:grid;place-items:center;margin:-2px -3px -2px 0;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.3), 0 1px 2px rgba(0,0,0,.45)}
.aic img{display:block;width:15px;height:15px;object-fit:contain}
.act:disabled .aic{filter:grayscale(.6)}
.fbtn .fic{width:14px;height:14px;object-fit:contain;vertical-align:-2px;margin-right:6px;
  filter:invert(1) brightness(1.6) saturate(.2);opacity:.75}
.act i{font-style:normal;font-size:11px;color:var(--ink3);line-height:1.25;padding:0 10px}
.act:hover:not(:disabled){background:#2C241E;border-color:var(--gold);transform:translateY(-2px)}
.act:active:not(:disabled){transform:translateY(0)}
.act:disabled{opacity:.3;cursor:not-allowed}
.act.prime b{background:var(--red);border-bottom-color:#5C0F09}
.act.prime:hover:not(:disabled){border-color:var(--red-lit)}
.free{display:flex;gap:7px;flex-wrap:wrap;padding:0 12px 10px;align-items:center}
.fbtn{padding:5px 11px;background:transparent;border:1px dashed var(--line2);border-radius:2px;cursor:pointer;font-size:12px;color:var(--ink2)}
.fbtn:hover:not(:disabled){border-color:var(--green);color:var(--ink);border-style:solid}
.fbtn:disabled{opacity:.3;cursor:not-allowed}
.freenote{padding:0 12px 12px;font-size:11px;color:var(--ink3);font-style:italic}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=text],input[type=number],input[type=email],input[type=password]{background:#080706;border:1px solid var(--line2);color:var(--ink);
  padding:7px 10px;border-radius:2px;font-family:var(--body);font-size:14px;box-shadow:inset 0 2px 5px rgba(0,0,0,.6)}
input[type=text]::placeholder{color:#6B5F53}
input[type=text]:focus,input[type=number]:focus,input[type=email]:focus,input[type=password]:focus{outline:0;border-color:var(--gold);box-shadow:inset 0 2px 5px rgba(0,0,0,.6),0 0 0 2px rgba(224,163,46,.22)}
select{background:#080706;border:1px solid var(--line2);color:var(--ink);padding:7px 30px 7px 10px;border-radius:2px;
  font-family:var(--disp);font-size:14px;font-weight:400;letter-spacing:.04em;cursor:pointer;
  appearance:none;-webkit-appearance:none;box-shadow:inset 0 2px 5px rgba(0,0,0,.6);
  background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);
  background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
select:focus{outline:0;border-color:var(--gold);box-shadow:inset 0 2px 5px rgba(0,0,0,.6),0 0 0 2px rgba(224,163,46,.22)}
select option{background:#171310;color:var(--ink)}

/* ---------------- игроки ---------------- */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(188px,1fr));gap:8px;padding:11px}
.rcard{position:relative;border:1px solid var(--line);border-radius:2px;padding:8px 10px;background:#151110;display:flex;flex-direction:column;gap:3px;cursor:pointer;transition:border-color .12s}
.rcard.hit{animation:hitFlash .9s ease}
@keyframes hitFlash{0%{box-shadow:0 0 0 0 rgba(224,163,46,.55)}45%{box-shadow:0 0 0 3px rgba(224,163,46,.28)}100%{box-shadow:0 0 0 0 rgba(224,163,46,0)}}
.rcard:hover{border-color:var(--line2)}
.rcard.act{border-color:var(--gold);background:#231B12}
.rcard.dead{opacity:.4}
.rcard .rn{display:flex;align-items:center;gap:6px;font-family:var(--disp);font-size:14px;font-weight:500;text-transform:uppercase;letter-spacing:.07em}
.rcard .rm{font-family:var(--mono);font-size:12px;color:var(--ink2)}
.rcard .rl{font-size:11px;color:var(--ink3)}

/* ---------------- сделки ---------------- */
.tradebody{padding:11px;display:flex;flex-direction:column;gap:10px;max-height:330px;overflow-y:auto}
.phead .mini.on{background:var(--gold);color:#1B1512;border-color:var(--gold)}
/* окно сделки: две узкие колонки — сжимаем строки, иначе подпись ломается */
.legitems .qhead,.legitems .qrow{grid-template-columns:30px minmax(0,1fr) 52px 100px 44px;gap:7px;padding:6px 8px}
.legitems .qrow .qi{width:30px;height:30px}
.legitems .qrow .qi img{max-width:30px;max-height:30px}
.legitems .qrow .ql b{font-size:13px}
.legitems .qrow .ql small{font-size:10.5px;white-space:nowrap}
.legitems .qrow .qp b{font-size:13px}
.legitems .qrow .qp small{display:none}
.legitems .qhead{font-size:9px;letter-spacing:.1em}
.legitems .qrow .qc{gap:4px}
.legitems .qrow .qc .stp{width:26px;height:26px;min-width:26px}
.legitems .qrow .qc input{width:40px}
.legitems .qrow .qs{font-size:13px}
/* подсказанная рынком сумма в окне сделки */
.mrow2 input.auto{color:var(--gold);border-color:rgba(214,169,74,.5)}
/* подтверждение сделки: что уходит и что приходит */
.tconf{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 4px}
.tc{border:1px solid var(--line2);border-radius:2px;padding:9px 11px;background:#211B17}
.tc .tl{display:block;font-family:var(--disp);font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink3);margin-bottom:4px}
.tc b{font-size:14px;line-height:1.35}
.tc.give{border-left:2px solid var(--red)} .tc.give b{color:#E8A99A}
.tc.take{border-left:2px solid var(--green,#4FA355)} .tc.take b{color:var(--gold)}
@media (max-width:520px){.tconf{grid-template-columns:1fr}}
.offer{border:1px solid var(--line2);border-radius:2px;padding:9px;background:#151110;display:flex;flex-direction:column;gap:6px;animation:dealIn .3s}
.offer.mine{border-left:3px solid var(--gold)}
.offer .oh{display:flex;align-items:center;gap:6px;font-size:12px}
.offer .oh .arrow{color:var(--ink3)}
.offer .leg{display:grid;grid-template-columns:54px 1fr;gap:4px 8px;font-size:12px;align-items:baseline}
.offer .leg .lb{font-family:var(--disp);font-size:10px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
.offer .leg .lv{font-family:var(--mono);font-size:12px}
.offer .note{font-size:11px;color:var(--ink2);font-style:italic;border-left:2px solid var(--line2);padding-left:7px}
.offer .oa{display:flex;gap:6px;flex-wrap:wrap}
.mini{padding:4px 9px;border:1px solid var(--line2);background:#251F19;border-radius:2px;cursor:pointer;font-size:12px;
  font-family:var(--disp);letter-spacing:.08em}
.mini:hover:not(:disabled){border-color:var(--gold)}
.mini.go{border-color:var(--green);color:#8FD394}
.mini.go:hover:not(:disabled){background:#1B2A1C}
.mini.no{border-color:var(--red-dim)}
.mini:disabled{opacity:.35;cursor:not-allowed}
.empty{color:var(--ink3);font-size:12px;font-style:italic;text-align:center;padding:14px 4px}

.log{padding:9px 11px;font-size:12px;display:flex;flex-direction:column-reverse;gap:4px;max-height:330px;overflow-y:auto}
.log .le{display:flex;gap:7px;align-items:baseline;border-bottom:1px dotted #251F1B;padding-bottom:3px}
.log .le .tn{font-family:var(--mono);font-size:10px;color:var(--ink3);flex:none;width:24px;text-align:right}
.log .le .tx{color:var(--ink2)}
.log .le.ev .tx{color:var(--gold)}
.log .le.bad .tx{color:#E88070}
.log .le.good .tx{color:#8FD394}
.log .le.dl .tx{color:#C79BDA}


/* ---------------- просмотр компонента ---------------- */
[data-insp]{cursor:zoom-in}
[data-insp]:hover{outline:1px solid rgba(224,163,46,.55);outline-offset:2px;border-radius:2px}
.mrow[data-insp]:hover{background:#211B17;outline:0}
.itag{font-family:var(--disp);font-size:10px;font-weight:400;letter-spacing:.22em;text-transform:uppercase;color:var(--ink3);margin-bottom:10px}
.igal{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;align-items:flex-end;
  padding:16px 14px;background:#100D0B;border:1px solid var(--line);border-radius:2px;margin-bottom:14px}
.ispec{margin:0;display:flex;flex-direction:column;align-items:center;gap:7px;max-width:300px}
.ispec img{border-radius:2px;box-shadow:0 6px 18px rgba(0,0,0,.7);max-height:340px;width:auto}
.ispec.wide img{max-height:none;max-width:100%}
.ispec figcaption{font-family:var(--disp);font-size:11px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
.ispec.pick figcaption{color:var(--gold)}
.ispec.pick img{outline:2px solid var(--gold);outline-offset:3px}
.inow{display:grid;gap:8px;margin:14px 0;padding:11px 12px;background:#171310;border:1px solid var(--line);border-radius:2px}
.inow>div{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px}
.inow .l{font-family:var(--disp);font-size:10px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);width:218px;flex:none;white-space:nowrap}
.inow .v{font-family:var(--mono);font-size:14px;color:var(--gold)}
.inow .v2{font-family:var(--mono);font-size:14px;color:var(--ink2)}
.inow .w{font-family:var(--body);font-size:13px;color:var(--ink2)}
.inow .w b{color:var(--green)}
.iprice{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
.iprice th{font-family:var(--disp);font-size:10px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);
  text-align:right;padding:4px 7px;white-space:nowrap}
.iprice thead th{text-align:center;border-bottom:1px solid var(--line)}
.iprice thead .rt th{font-family:var(--mono);font-size:10px;letter-spacing:0;text-transform:none;padding-top:0;border-bottom:1px solid var(--line)}
.iprice tbody th{text-align:left}
.iprice td{text-align:center;padding:4px 7px;font-family:var(--mono)}
.iprice tr.dim td{color:var(--ink3)}
.iprice .nowc{background:rgba(224,163,46,.12);box-shadow:inset 1px 0 0 rgba(224,163,46,.35),inset -1px 0 0 rgba(224,163,46,.35)}
.iprice thead .nowc{color:var(--gold)}


/* ---------------- сетевая игра ---------------- */
.roomcode{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#0A0807;border:1px solid var(--gold);
  border-radius:2px;margin-bottom:14px;flex-wrap:wrap}
.roomcode .rc{font-family:var(--mono);font-size:34px;letter-spacing:.22em;color:var(--gold);line-height:1}
.roomcode .rl{font-family:var(--disp);font-size:10px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3);
  width:100%;margin-bottom:-4px}
.seats{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.seat{display:grid;grid-template-columns:26px 1fr auto auto;gap:10px;align-items:center;padding:8px 11px;
  background:#151110;border:1px solid var(--line);border-radius:2px}
.seat.me{border-color:var(--gold)}
.seat .sn{font-family:var(--disp);font-size:15px;letter-spacing:.04em}
.seat .st{font-family:var(--disp);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.seat .waiting{color:var(--ink3);font-style:italic;font-size:12px}
.netstat{font-size:12px;color:var(--ink3);margin-top:10px;line-height:1.5}
.netstat b{color:var(--gold)}
.netbadge{font-family:var(--disp);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:3px 8px;border-radius:2px;
  background:#1E3A2A;border:1px solid #2E6B45;color:#8FD394}
.netbadge.off{background:#2C1713;border-color:var(--red-dim);color:#E88070}
.turnbar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#241811;border-bottom:1px solid var(--line);
  font-family:var(--disp);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.turnbar.mine{background:#1E2A18;color:#9BD49F}
.two.three{grid-template-columns:1fr 1fr 1fr}
.legmoney{display:grid;gap:8px;margin-bottom:10px}
.mrow2{display:grid;grid-template-columns:1fr 132px;gap:10px;align-items:center;padding:6px 9px;background:#141110;
  border:1px solid var(--line);border-radius:2px}
.mrow2 .l{display:flex;flex-direction:column;line-height:1.2}
.mrow2 .l b{font-family:var(--disp);font-weight:400;font-size:14px;letter-spacing:.03em}
.mrow2 .l small{font-size:10px;color:var(--ink3)}
.mrow2 .qc{display:flex;align-items:center;gap:6px;justify-content:center}
.mrow2 input[type=number]{width:64px;height:34px;padding:0;text-align:center;font-family:var(--mono);font-size:16px;color:var(--gold)}
.legitems{max-height:250px;overflow-y:auto;border:1px solid var(--line);border-radius:2px;background:#141110}
.legitems .qrow{padding:6px 9px}
.subh{font-family:var(--disp);font-size:10px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3);margin:0 0 6px}

/* ---------------- выбор языка ---------------- */
.langpick{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:11px 12px;margin-bottom:14px;
  background:#141110;border:1px solid var(--line);border-radius:2px}
.langpick .ll{font-family:var(--disp);font-size:10px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);width:100%}
.langbtn{padding:7px 14px;background:#211B17;border:1px solid var(--line2);border-radius:2px;cursor:pointer;
  font-family:var(--disp);font-size:14px;letter-spacing:.06em;transition:.12s}
.langbtn:hover{border-color:var(--gold)}
.langbtn.on{background:var(--red);border-color:var(--red-lit);color:#fff}
.langpick .lnote{width:100%;font-size:11px;color:var(--ink3);line-height:1.45}

/* ---------------- модальные окна ---------------- */
.scrim{position:fixed;inset:0;background:rgba(5,4,3,.86);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50;
  animation:tableIn .16s ease}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:3px;max-width:660px;width:100%;max-height:90vh;
  display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.75);overflow:hidden}
.modal.wide{max-width:880px}
/* облако: под этим входом играют на другом устройстве — здесь всё закрыто (src/p11-cloud.js) */
#cloudLock{display:none;z-index:2000}
#cloudLock.on{display:flex}
.mhead{padding:0;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--red);border-bottom:3px solid #0A0908}
.mhead h3{font-family:var(--disp);font-size:14px;font-weight:500;text-transform:uppercase;letter-spacing:.22em;color:#fff;padding:8px 16px 7px}
.mbody{padding:14px 16px;overflow-y:auto}
.mfoot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:9px;align-items:center;justify-content:flex-end;background:var(--panel2);flex-wrap:wrap}
.mfoot .total{margin-right:auto;font-family:var(--mono);font-size:14px}

/* ---------------- шкала риска катастрофы ----------------
   Прибор, а не украшение: слева подпись, справа счёт колоды, снизу
   полоса от 0 до 100% с засечками на четвертях. Цвет ведёт уровень. */
.risk{margin-right:auto;flex:1;min-width:240px;max-width:360px;display:flex;flex-direction:column;gap:5px}
.risk .rtop{display:flex;align-items:baseline;gap:9px}
.risk .rl{font-family:var(--disp);font-size:9.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
.risk .rv{font-family:var(--mono);font-size:15px;color:var(--green);transition:color .3s}
.risk .rc{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink3)}
.risk .rbar{position:relative;height:9px;border:1px solid var(--line);border-radius:2px;background:#0C0B0A;
  overflow:hidden;box-shadow:inset 0 1px 4px rgba(0,0,0,.7)}
.risk .rbar i{display:block;height:100%;background:var(--green);transition:width .4s ease, background .3s}
.risk .rbar:after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 1px),rgba(255,255,255,.14) calc(25% - 1px) 25%)}
.risk.mid  .rv{color:var(--gold)}     .risk.mid  .rbar i{background:var(--gold)}
.risk.warm .rv{color:#E08A2E}         .risk.warm .rbar i{background:#E08A2E}
.risk.hot  .rv{color:var(--red-lit)}  .risk.hot  .rbar i{background:var(--red-lit);box-shadow:0 0 9px rgba(226,58,36,.85)}
.btn{padding:7px 16px;background:#2C241D;border:1px solid var(--line2);border-radius:2px;cursor:pointer;
  font-family:var(--disp);font-size:13px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;transition:.12s}
.btn:hover:not(:disabled){border-color:var(--gold)}
.btn.go{background:var(--red);border-color:var(--red-lit);color:#fff}
.btn.go:hover:not(:disabled){background:var(--red-lit)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.x{background:none;border:0;cursor:pointer;color:rgba(255,255,255,.7);font-size:22px;line-height:1;padding:0 12px}
.x:hover{color:#fff}

.qtbl{border:1px solid var(--line);border-radius:2px;background:#141110;overflow:hidden}
.qhead,.qrow{display:grid;grid-template-columns:40px minmax(0,1fr) 90px 132px 78px;gap:10px;align-items:center;padding:7px 11px}
.qtbl.nopr .qhead,.qtbl.nopr .qrow{grid-template-columns:40px minmax(0,1fr) 132px}
.qcap{font:700 12px/1 Oswald,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin:0 0 6px}
.qhead{background:#241E19;border-bottom:1px solid var(--line);
  font-family:var(--disp);font-size:9px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3)}
.qhead .r{text-align:right} .qhead .c{text-align:center}
.qrow{border-bottom:1px solid #221C19}
.qrow:last-child{border-bottom:0}
.qrow:hover{background:#191412}
.qrow .qi{width:40px;height:40px;display:flex;align-items:center;justify-content:center}
.qrow .qi img{max-width:40px;max-height:40px;width:auto;object-fit:contain}
.qrow .qi svg.pcard{width:29px;height:auto;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
.legitems .qrow .qi svg.pcard{width:22px}
.mrow .th svg.pcard{width:26px;height:auto;filter:drop-shadow(0 1px 3px rgba(0,0,0,.55))}
.qrow .ql{display:flex;flex-direction:column;min-width:0;gap:1px}
.qrow .ql b{font-family:var(--disp);font-weight:400;font-size:15px;letter-spacing:.03em;line-height:1.15}
.qrow .ql small{font-size:11px;color:var(--ink3);line-height:1.2}
.qrow .qp{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.qrow .qp b{font-family:var(--mono);font-size:16px;font-weight:400;color:var(--gold)}
.qrow .qp small{font-family:var(--disp);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.qrow .qc{display:flex;align-items:center;gap:6px;justify-content:center}
.qrow .qs{font-family:var(--mono);font-size:15px;text-align:right;color:var(--ink3)}
.qrow .qs.on{color:var(--ink)}
.qrow input[type=number]{width:64px;height:34px;padding:0;text-align:center;font-family:var(--mono);font-size:16px;color:var(--gold)}
.stp{width:30px;height:34px;border:1px solid var(--line2);background:linear-gradient(180deg,#2E271F,#211B16);border-radius:2px;
  cursor:pointer;line-height:1;font-size:17px;color:var(--ink2);display:flex;align-items:center;justify-content:center;transition:.1s}
.stp:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
.stp:active:not(:disabled){transform:translateY(1px)}

label.fld{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink2)}
label.fld>span{font-family:var(--disp);font-size:10px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.two{grid-template-columns:1fr}}

/* =====================================================================
   ПЛАНШЕТ И ТЕЛЕФОН
   На планшете просто две колонки вместо трёх. На телефоне — вкладки:
   один блок на экране, панель переключения снизу, липкая полоса
   состояния сверху. Всё, до чего дотрагиваются пальцем, не меньше 44px.
   ===================================================================== */
.mstat{display:none}
.tabbar{display:none}

@media (min-width:721px) and (max-width:1100px){
  .grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .col3{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .acts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .btn,.mini{min-height:40px}
  /* пачки банкнот налезают на цифры, когда колонка стола сужается */
  .mstack{display:none}
  .money{gap:16px}
}

@media (max-width:720px){
  #app{padding:0 8px calc(74px + env(safe-area-inset-bottom,0px));gap:8px}
  .grid{grid-template-columns:1fr;gap:8px}
  .colstack{display:contents}
  .panel[data-tab]{display:none}
  body[data-tab="field"]   .panel[data-tab="field"],
  body[data-tab="market"]  .panel[data-tab="market"],
  body[data-tab="table"]   .panel[data-tab="table"],
  body[data-tab="players"] .panel[data-tab="players"],
  body[data-tab="log"]     .panel[data-tab="log"]{display:block}

  /* --- шапка: одна строка, таблица курсов раскрывается по нажатию --- */
  .top{position:sticky;top:0;z-index:40;flex-wrap:nowrap;align-items:center;gap:6px;
       padding:6px 8px;margin:0 -8px;background:var(--bg);border-bottom:1px solid var(--line)}
  .brand{display:none}                     /* заголовок есть в окне новой партии */
  .coursebox{flex:1;min-width:0;padding:3px 7px;cursor:pointer}
  .courserow{gap:6px;flex-wrap:nowrap;overflow:hidden;align-items:baseline}
  .courserow .lbl{display:none}            /* подписи не влезают, цифры говорят сами */
  .courserow .big{font-size:20px}
  .courserow .rate{font-size:12px}
  .courserow .rate.num{margin-left:auto}
  .coursebox #track,.coursebox #trackLabels{display:none}
  .coursebox.open #track{display:block;margin-top:6px}
  .topbtns{display:flex;gap:4px;flex:none}
  .sidebtns{display:none}
  .topbtns .btn{padding:0 8px;min-height:40px;font-size:9px;letter-spacing:.06em}

  /* Деньги уже висят в липкой полосе — в шапке стола они лишние, а пачки
     банкнот на узком экране налезали на цифры. */
  .pbar{gap:8px;padding:7px 10px}
  .pbar .nme{font-size:17px}
  .money{display:none}

  /* Главное на вкладке «Мой стол» — кнопки хода: они должны быть сразу
     под шапкой, а не через два экрана прокрутки. */
  body[data-tab="table"] #boardPanel{display:flex;flex-direction:column}
  #boardPanel .pbar{order:1}
  #boardPanel .turnbar{order:2}
  #boardPanel .acts{order:3;padding-top:10px}
  #boardPanel .free{order:4}
  #boardPanel .freenote{order:5}
  #boardPanel .table{order:6}

  /* --- липкая полоса: чей ход и сколько у меня денег --- */
  .mstat{display:flex;position:sticky;top:53px;z-index:35;gap:8px;align-items:center;
    padding:7px 10px;margin:0 -8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    background:var(--panel);font-family:var(--mono);font-size:12px;overflow-x:auto;white-space:nowrap}
  .mstat b{font-family:var(--disp);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
  .mstat .sep{opacity:.35}
  .mstat .me{color:var(--ink)}
  .mstat.turn{border-left:3px solid var(--red);padding-left:8px}

  /* --- панель вкладок --- */
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:60;
    background:linear-gradient(180deg,#15151A,#0C0C10);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabbar button{appearance:none;background:none;border:0;border-top:2px solid transparent;
    padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-height:56px}
  .tabbar button b{font-family:var(--disp);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}
  .tabbar button span{font-family:var(--mono);font-size:8px;color:var(--ink3)}
  .tabbar button.on{border-top-color:var(--red);background:rgba(198,40,40,.12)}
  .tabbar button.on b{color:#fff}
  .tabbar button.alert b::after{content:'';display:inline-block;width:6px;height:6px;margin-left:4px;
    border-radius:50%;background:var(--red);vertical-align:middle}

  /* --- пальцем, а не мышью --- */
  .acts{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .act{min-height:62px}
  .act .an{font-size:12px}
  .free{gap:6px}
  .fbtn{min-height:44px;font-size:11px;padding:0 12px}
  .mini{min-height:38px;padding:0 12px}
  .mrow,.rcard,.plate{min-height:52px}
  .mrow{padding:9px 10px}
  .plates{gap:6px}
  .plate{min-height:92px}

  /* --- окна: во весь экран, кнопки внизу, формы в одну колонку --- */
  /* окно во весь экран и НАД панелью вкладок, иначе кнопки под ней */
  .scrim{padding:0;align-items:stretch;z-index:70}
  .modal{width:100%;max-width:none;max-height:100%;height:100%;border-radius:0;
    display:flex;flex-direction:column}
  .mhead{position:sticky;top:0;z-index:2}
  .mhead h3{font-size:14px}
  .mhead .x{min-width:44px;min-height:44px}
  .mbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px}
  .mfoot{position:sticky;bottom:0;z-index:2;flex-wrap:wrap;gap:8px;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel2);
    border-top:1px solid var(--line)}
  .mfoot .btn{flex:1;min-height:48px;min-width:120px}
  .mfoot .total{width:100%;order:-1;font-size:12px}
  .risk{flex:0 0 100%;width:100%;max-width:none;order:-1;min-width:0}
  .risk .rl{font-size:9px;letter-spacing:.1em;white-space:nowrap}
  .risk .rv{font-size:13px;white-space:nowrap}
  .risk .rc{font-size:9px;white-space:nowrap}
  .two,.two.three,.three{grid-template-columns:1fr}
  /* строка товара: сверху картинка-название-цена, снизу счётчик и сумма */
  .qtbl .qhead{display:none}
  .qrow,.qtbl.nopr .qrow{grid-template-columns:40px minmax(0,1fr) auto;grid-auto-rows:min-content;
    gap:4px 8px;padding:9px 10px}
  .qrow .qi{grid-row:span 2;align-self:start}
  .qrow .qp{grid-column:3;grid-row:1;flex-direction:row;align-items:baseline;gap:4px}
  .qrow .qp small{font-size:9px}
  .qrow .qc{grid-column:2;grid-row:2;justify-content:flex-start;gap:8px}
  .qrow .qs{grid-column:3;grid-row:2;align-self:center;font-size:14px}
  .qrow .stp{min-width:44px;min-height:44px;font-size:20px}
  .qrow input{min-height:44px;font-size:17px;width:64px}
  .fld input,.fld select{min-height:44px;font-size:15px;width:100%;max-width:100%;min-width:0}
  label.fld{min-width:0}
  .setup-roles select,.setup-roles input{min-width:0}
  .seat{min-height:52px}
  .roomcode .rc{font-size:24px}
}
@media (max-width:380px){
  .tabbar button span{display:none}
  .acts{grid-template-columns:1fr}
}
.legbox{border:1px solid var(--line);border-radius:2px;padding:10px;background:#151110}
.legbox>h4{margin:0 0 7px;font-family:var(--disp);font-size:11px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3)}

.dests{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:8px}
.dest{position:relative;padding:10px;border:1px solid #2A4A5A;background:linear-gradient(160deg,var(--sea),#2A6C86);
  border-radius:2px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;overflow:hidden;min-height:90px;transition:.12s}
.dest:hover:not(:disabled){border-color:var(--gold);transform:translateY(-2px)}
.dest.sel{border-color:var(--red-lit);box-shadow:0 0 0 2px rgba(226,58,36,.55)}
.dest:disabled{opacity:.35;cursor:not-allowed;filter:grayscale(.6)}
.dest b{font-family:var(--disp);font-size:16px;padding-right:46px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:#062029}
.dest i{font-style:normal;font-size:11px;color:#0A2A38;padding-right:50px}
.dest .thumb{position:absolute;right:-8px;bottom:-10px;width:56px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.dest .thumb.card{width:44px;transform:rotate(-7deg)}

/* У карт 1993-го свой текст, поэтому от скана берём только рисунок:
   впечатанную снизу полосу с чужим текстом обрезаем. */
/* --------- подробные правила --------- */
.compbox{position:relative;width:118px;text-align:center}
.compbox>img{width:72px;margin:0 auto;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.compbox .cl{font-family:var(--disp);font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--gold);margin-top:4px}
#btnNet.alarm{background:var(--red);color:#fff;border-color:var(--red);animation:alarmPulse 1.4s ease-in-out infinite}
@keyframes alarmPulse{0%,100%{opacity:1}50%{opacity:.55}}
.resume.back{border-color:rgba(198,160,74,.55)}
.compbox .cs{font-family:var(--mono);font-size:9px;line-height:1.2;color:var(--ink3);margin-top:2px}
.compbox .cw{font-family:var(--mono);font-size:9px;line-height:1.2;color:var(--red-lit);margin-top:1px}
.compbox .cbtn{margin-top:4px;font-family:var(--disp);font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--gold);background:transparent;border:1px solid rgba(198,160,74,.5);border-radius:3px;padding:2px 7px;cursor:pointer}
.compbox .cbtn:hover{background:rgba(198,160,74,.16)}
.compbox .badge{position:absolute;right:2px;top:-6px;background:var(--red);color:#fff;font-family:var(--disp);font-size:12px;font-weight:600;
  min-width:20px;height:20px;line-height:20px;border-radius:10px;text-align:center;box-shadow:0 2px 5px rgba(0,0,0,.5)}
.rrow{border-bottom:0}
.parts{padding:0 0 8px;font-size:11px;font-family:var(--mono);color:var(--ink3)}
.parts .pt{display:inline-block;margin-right:10px;white-space:nowrap}
.parts .pt b{color:var(--ink2);font-weight:400}
.parts .minus b{color:var(--red-lit)}
.rules{font-size:13.5px;line-height:1.55;color:var(--ink2)}
.rules h4{font-family:var(--disp);letter-spacing:.09em;text-transform:uppercase;font-size:12px;color:var(--gold);margin:20px 0 6px;padding-top:10px;border-top:1px solid var(--line)}
.rules h4:first-of-type{margin-top:4px;border-top:0;padding-top:0}
.rules p{margin:0 0 8px}
.rules b{color:var(--ink)}
.rules ul{margin:0 0 8px;padding-left:0;list-style:none}
.rules li{margin:0 0 5px;padding-left:14px;position:relative}
.rules li:before{content:'—';position:absolute;left:0;color:var(--ink3)}
.rules .lead{color:var(--ink);font-size:14px}
.rules .risk{max-width:none;margin:2px 0 12px}
.rnav{position:sticky;top:0;z-index:3;background:var(--panel);border-bottom:1px solid var(--line);
  padding:8px 0 9px;margin:-2px 0 12px;display:flex;flex-wrap:wrap;gap:6px}
.rnav a{font-family:var(--disp);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink2);background:#241D18;border:1px solid var(--line);border-radius:3px;padding:3px 8px;text-decoration:none}
.rnav a:hover{color:var(--ink);border-color:var(--line2)}
.rtab{width:100%;border-collapse:collapse;font-size:12px}

/* =====================================================================

   Перенесено из «Клабора», где эта раскладка отстоялась: слева вход в
   игру, справа комната с разговором. Меню всегда по-русски и в советском
   оформлении — украинская «Конверсія · 1993» начинается уже за столом,
   поэтому меню живёт вне #app и переводчик DOM его не трогает.
   ===================================================================== */
#menuRoot{position:fixed;inset:0;z-index:40;display:none;overflow:auto;
  background:var(--ground);

    radial-gradient(ellipse 80% 50% at 50% -8%, rgba(224,163,46,.09), transparent 70%),
    repeating-linear-gradient(96deg, rgba(255,255,255,.012) 0 2px, transparent 2px 6px)}
#menuRoot.on{display:block}
.mscreen{max-width:1060px;margin:0 auto;padding:28px 18px 40px;min-height:100vh;
  display:flex;flex-direction:column;justify-content:center}
/* Заставка меню — крышка коробки; название ложится на её красную полосу */
.mlid{position:relative;max-width:620px;margin:0 auto 20px;border-radius:3px;overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,.6), 0 0 0 1px rgba(0,0,0,.6)}

  color:#F6EFE2;text-shadow:0 2px 6px rgba(60,16,8,.75)}

.mlidt .msub{font-family:var(--disp);font-size:10px;letter-spacing:.3em;text-transform:uppercase;
  color:#F0DCCB;margin-top:3px;text-shadow:0 1px 3px rgba(60,16,8,.8)}
@media (max-width:720px){.mlidt h1{font-size:26px}.mlidt .msub{font-size:8px;letter-spacing:.22em}}
.langpick .lidpic{width:100%;max-width:300px;margin:9px auto 2px;display:block;border-radius:3px;
  box-shadow:0 4px 14px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.5)}
.mtitle{text-align:center;margin-bottom:20px}
.mtitle h1{font-size:44px;line-height:.92;letter-spacing:.02em;text-transform:uppercase;font-weight:700}
.mtitle h1 span{color:var(--red-lit)}
.mtitle .msub{font-family:var(--disp);font-size:11px;letter-spacing:.3em;text-transform:uppercase;
  color:var(--ink3);margin-top:6px}
.mainwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,330px);gap:20px;align-items:start}
.mcol{min-width:0;max-width:440px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:9px}
.mcol>.btn{width:100%;justify-content:center;text-align:center;padding:11px 16px;
  font-family:var(--disp);font-size:14px;letter-spacing:.13em;text-transform:uppercase}
.mfootnote{margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  font-size:12px;color:var(--ink3)}
.mfootnote a{color:var(--gold);text-decoration:none;border-bottom:1px dotted rgba(224,163,46,.5)}

/* ---- колонка комнаты ---- */

.hico{display:inline-grid;place-items:center;width:25px;height:25px;flex:0 0 auto;
  border:1px solid var(--line2);background:#251F19;border-radius:2px;cursor:pointer;
  color:var(--ink2);font-size:13px;line-height:1}

.hico.hsnd{margin-left:auto}

  border:1px solid var(--line2);border-radius:2px;font-family:inherit;font-size:13px}
.hsay input:focus{outline:none;border-color:var(--gold)}
.btn.tiny{padding:3px 9px;font-size:12px}
/* Окна настройки живут в левой колонке меню, а не поверх него:
   Ник — «суть чтобы они были слева, а чат всегда справа». Разметка у них
   та же, что у модалок, поэтому правим только рамку. */
.mcol{max-width:620px}
.mcol .modal{max-width:none;width:100%;max-height:none;margin:0}
.mcol .mbody{overflow:visible}
.mcol .mhead .x{display:none}
/* в колонке уже́, чем в модалке: три поля в ряд не помещаются и обрезают
   подписи — раскладываем по два и запрещаем полям вылезать за грядку */
.mcol .two,.mcol .two.three{grid-template-columns:1fr 1fr;gap:10px}
.mcol .two>*{min-width:0}
.mcol select,.mcol input,.mcol .fld{max-width:100%}
@media (max-width:560px){ .mcol .two,.mcol .two.three{grid-template-columns:1fr} }
.mcol #jkey{letter-spacing:.06em;font-size:12px}
/* версия игры в лобби: её выбирает хозяин, остальные читают */
.roomver{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;
  padding-top:10px;border-top:1px solid var(--line)}
.roomver .rl{font-family:var(--disp);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink3)}
.roomver .mini.on{border-color:var(--red-lit);background:var(--red);color:#fff}

/* ---------------- портреты ----------------
   Квадратная миниатюра: под картинкой крашеная подложка с буквой имени,
   поэтому пока портрет грузится (или если папки img/faces нет) место
   не пустует. Размеры: sm — списки и стол, md — выбор, lg — своё лицо. */
.fav{position:relative;display:inline-grid;place-items:center;border-radius:2px;
  overflow:hidden;flex:0 0 auto;font-family:var(--disp);font-weight:600;color:#fff;
  width:24px;height:24px;font-size:12px;vertical-align:-6px}
.fav i{position:absolute;inset:0;display:grid;place-items:center;font-style:normal}
.fav b{position:absolute;inset:0;background-position:center;background-size:cover}
.fav.sm{width:22px;height:22px;font-size:11px}
.fav.md{width:100%;height:100%;font-size:16px;border-radius:0}
.fav.lg{width:84px;height:84px;font-size:32px;border-radius:3px}
.fav.gold{box-shadow:inset 0 0 0 2px var(--gold)}
.fav.q{background:#251F19;color:var(--ink3);border:1px dashed var(--line2)}
.rcard .rn .fav{margin-right:5px}

/* своё лицо и имя в профиле */
.pme{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.pmeb{flex:1;min-width:0}
.pbio{font-size:12px;color:var(--ink3);margin-top:6px;line-height:1.45;min-height:17px}

/* выбор портрета */
.htabs.pt{margin-bottom:12px}
.facerow{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;
  max-height:320px;overflow:auto;padding:2px}
.facerow .fc{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:2px;
  overflow:hidden;cursor:pointer;background:#151110}
.facerow .fc:hover{border-color:var(--gold)}
.facerow .fc.on{border-color:var(--red-lit);box-shadow:0 0 0 1px var(--red-lit)}
.facerow .fc.rare{border-color:var(--bar-field)}
.facerow .fc.gold{border-color:var(--gold)}

/* список достижений */

  border:1px solid var(--line2);border-radius:2px;background:#151110}

  color:var(--ink3);padding:2px 0}
.mback:hover{color:var(--gold)}
/* профиль: накопительный счёт */
.pstat{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline}
.pstat .k{font-size:13px;color:var(--ink2);padding:4px 0;border-bottom:1px dotted var(--line)}

  .hallcol{height:min(52vh,400px)}
}

/* --------- применение ---------
   Отдельные слова заменяются только целиком (иначе «из» испортит
   «изменился», а «ход» — «находится»); фразы — обычной подстановкой. */
const RX_ESC = /[.*+?^${}()|[\]\\]/g;
const BND = '[^А-Яа-яЁёІіЇїЄєҐґA-Za-z0-9]';
const UA_MAP = UA_PAIRS.filter(p => p[0] !== p[1])
  .sort((a,b)=>b[0].length - a[0].length)
  .map(p => {
    const from = p[0], to = p[1];
    const word = from.length <= 12 && !/[\s·—–,.:;()«»<>]/.test(from);
    if (!word) return {plain:from, to:to};
    return {re:new RegExp('(^|' + BND + ')' + from.replace(RX_ESC, '\\$&') + '(?=' + BND + '|$)', 'g'), to:to};
  });
const LOC_MEMO = new Map();
const CYR = /[А-Яа-яЁё]/;
/* Кусок, обёрнутый NL(), остаётся как написан: так подпись кнопки
   «Классика · СССР» не превращается в «Классика · Україна». */
const NL_A = '\u0001', NL_B = '\u0002';
function NL(s){ return NL_A + s + NL_B; }
const NL_RE = /\u0001([^\u0002]*)\u0002/g;
function tr(s){
  let r = s;
  for (let i = 0; i < UA_MAP.length; i++){
    const p = UA_MAP[i];
    if (p.plain){ if (r.indexOf(p.plain) >= 0) r = r.split(p.plain).join(p.to); }
    else r = r.replace(p.re, (m, b) => b + p.to);
  }
  return r;
}
function LOC(s){
  if (typeof s !== 'string') return s;
  if (s.indexOf(NL_A) >= 0){
    if (LANG !== 'ua') return s.replace(NL_RE, '$1');
    let out = '', last = 0, m;
    NL_RE.lastIndex = 0;
    while ((m = NL_RE.exec(s))){
      out += tr(s.slice(last, m.index)) + m[1];
      last = m.index + m[0].length;
    }
    return out + tr(s.slice(last));
  }
  if (LANG !== 'ua' || !CYR.test(s)) return s;
  const hit = LOC_MEMO.get(s); if (hit !== undefined) return hit;
  const r = tr(s);
  if (LOC_MEMO.size > 4000) LOC_MEMO.clear();
  LOC_MEMO.set(s, r);
  return r;
}

   по языку — при возврате к «классике» текст восстанавливается.
   ------------------------------------------------------------------- */
const LOC_ORIG = new WeakMap();
function locDOM(root){
  root = root || document.getElementById('app');
  if (!root) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(n){
      const t = n.parentNode && n.parentNode.nodeName;
      if (t === 'SCRIPT' || t === 'STYLE') return NodeFilter.FILTER_REJECT;
      return n.nodeValue && CYR.test(n.nodeValue) || LOC_ORIG.has(n)
        ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    }
  });
  const list = [];
  for (let n = w.nextNode(); n; n = w.nextNode()) list.push(n);
  list.forEach(n => {
    if (!LOC_ORIG.has(n)) LOC_ORIG.set(n, n.nodeValue);
    const src = LOC_ORIG.get(n);
    n.nodeValue = LANG === 'ua' ? LOC(src) : src;
  });
}

}

/* «1 партия», «2 партии», «5 партий» — иначе в журнале «1 партий груза». */
function LOTS(n){
  const a = Math.abs(n) % 100, b = a % 10;
  const w = (a > 10 && a < 20) ? 'партий' : (b === 1 ? 'партия' : (b >= 2 && b <= 4 ? 'партии' : 'партий'));
  return n + ' ' + w;
}

/* «21 карта», «42 карты», «50 карт» — и то же по-украински */
function CARDS(n){
  const ua = (typeof LANG !== 'undefined' && LANG === 'ua');
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return n + ' карт';
  if (b === 1) return n + (ua ? ' картка' : ' карта');
  if (b >= 2 && b <= 4) return n + (ua ? ' картки' : ' карты');
  return n + ' карт';
}

    if (p.face >= 0) return p.face;
    if (typeof Faces === 'undefined') return -1;
    const sx = Math.random() < 0.6 ? 'm' : 'f';
    let free = Faces.freeOf(sx, busyFaces);
    if (!free.length) free = Faces.freeOf(sx === 'm' ? 'f' : 'm', busyFaces);
    if (!free.length) return -1;
    const n = free[Math.floor(Math.random() * free.length)];
    busyFaces.push(n);
    return n;
  };
  cfg.players.forEach((p,i)=>{
    st.players.push({
      id:i, name:p.name, color:COLORS[i%COLORS.length], bot:!!p.bot, role:p.role||'trader',
      face: faceFor(p),
      /* Бот без роли: специализацию выберет сам, посмотрев, чем заняты
         соседи. auto остаётся пометкой «выбирал сам» и после выбора. */
      auto:p.role === 'auto',
      /* уровень отдельного места: без него Bots.level берёт общий st.botSkill.
         Поле молча терялось — смешанные столы играли на одном уровне. */
      skill:(p.skill === 'easy' || p.skill === 'hard' || p.skill === 'norm') ? p.skill : null,
      rub:0, usd:0, loc:'ussr',
      own:{plant:0, machine:{s:0,i:0}, extractor:{s:0,i:0}, truck:{s:0,i:0}, fleet:{s:0,i:0}, computer:0},
      /* Какой транспорт ушёл в рейс. Дома — null (весь парк на месте).
         В рейсе считается только он: и грузоподъёмность, и то, что
         отберёт катастрофа. Оставленное дома не рискует ничем. */
      away:null,
      comp:{machine:{s:0,i:0}, extractor:{s:0,i:0}},   // куда установлены компьютеры
      raw:0, goods:0, cargo:[], debts:0, debtDue:0, skip:0, out:false,
      owed:0,                               // накопленная недоимка по налогу
      rent:{extractor:0, machine:0},        // арендованные мощности на один ход
      acted:0
    });
  });
  /* Очерёдность. Первый ход — заметное преимущество, и раздавать его по
     порядку заполнения формы нечестно: прогоны восьми одинаковых ботов
     показали перекос по местам за столом. Когда за столом двое и больше
     живых игроков, разыгрываем, КТО НАЧИНАЕТ. Сам массив не тасуем —
     id игрока это индекс в нём, и в сетевой партии на него завязано
     Net.seat: перестановка увела бы управление не тому человеку.
     Стол из одних ботов не трогаем — на нём держатся эталоны прогонов. */
  st.first = 0;
  const humans = st.players.filter(p => !p.bot).length;
  if (humans >= 2 && st.players.length > 1){
    st.first = Math.floor(nextRand(st) * st.players.length);
    st.cur = st.first;
  }
  const start = E(st).start;
  st.players.forEach(p => { p.rub = start; });
  Rules.say(st,'Партия начата. Каждому — ' + start + ' тыс. руб. Ход = одно действие.','');
  if (humans >= 2 && st.players.length > 1){
    const order = st.players.map((_,i)=> st.players[(st.first + i) % st.players.length].name);
    Rules.say(st,'Очерёдность разыграна: ходят ' + order.join(' → ') + '.','ev');
  }
  if (E(st).inflating)
    Rules.say(st,'Деньги дешевеют: с каждым курсом цены растут, а долг перед банком тает. Валюту можно купить только за рубежом, и спрос на неё разгоняет курс.','');
  return st;
},

say(st, text, cls){ st.log.push({t:st.turn, text, cls:cls||''}); if (st.log.length>400) st.log.shift(); },

/* --- справки ------------------------------------------------------- */
price(st, kind, origin, mode){
  const base = E(st).prices[kind][mode][st.course-1];
  return origin==='i' ? base*2 : base;
},
freight(st){ return E(st).freight[st.course-1]; },

/* Шанс вытянуть катастрофу следующей картой. В колоде «Событий в пути»
   ровно одна такая карта, и, если её вытянули, колода тут же собирается
   заново — значит она всегда где-то в оставшихся, и шанс равен один к
   их числу. Информация открытая: за настоящим столом сброс лежит рядом
   и его можно пересчитать, так что показывать её честно. */
crashOdds(st){
  const total = buildDeck(st).length;
  const left = st.deck.length || total;
  return {total:total, left:left, used:total - left, p: 1 / left};
},
/* Наряд на госперевозку: сколько партий государство даёт за одну погрузку.
   0 — без ограничения (классика, как в оригинале). */
govLot(st){ const v = E(st).govLot | 0; return v > 0 ? v : Infinity; },
rateTxt(st){ return E(st).rateTxt[st.course-1]; },
/* цена за рубежом: в 1993-м компьютер дешевеет с эпохой, остальное стоит своё */
usdPrice(st, kind){
  if (kind === 'computer' && E(st).inflating) return COMPUTER_USD_93[st.course-1];
  return E(st).prices[kind].usd;
},
usdSellRate(st){ return E(st).usdSell[st.course-1]; },   // банк принимает валюту
/* спрос: сколько сейчас платят за партию товара на этом континенте */
hasDemand(st){ return !!E(st).demand; },
demandOf(st, cont){ const c = st.continents[cont]; return c ? (c.demand|0) : 0; },
goodsPrice(st, cont){
  if (!this.hasDemand(st)) return this.usdPrice(st,'goods');
  const d = Math.max(0, Math.min(DEMAND_MAX, this.demandOf(st, cont)));
  return DEMAND_PRICE[d];
},
/* Во что обойдётся продажа n партий ЗДЕСЬ, партия за партией: спрос
   проседает с каждой, поэтому четыре партии в один рынок дают меньше,
   чем четыре раза по текущей цене. Считает то же самое, что и сама
   продажа, но ничего не меняет — нужно для предпросмотра в окне. */
goodsPreview(st, cont, n){
  const out = [];
  if (!this.hasDemand(st)){
    const p = this.usdPrice(st,'goods');
    for (let i=0;i<n;i++) out.push(p);
    return out;
  }
  let d = Math.max(0, Math.min(DEMAND_MAX, this.demandOf(st, cont)));
  for (let i=0;i<n;i++){
    out.push(DEMAND_PRICE[d]);
    d = Math.max(0, d - DEMAND_DRAIN);
  }
  return out;
},
demandTick(st){
  if (!this.hasDemand(st)) return;
  if (st.turn % DEMAND_EVERY !== 0) return;
  for (const k in st.continents){
    const c = st.continents[k];
    if ((c.demand|0) < DEMAND_MAX) c.demand = (c.demand|0) + 1;
  }
},
usdBuyRate(st){ const b = E(st).usdBuy; return b ? b[st.course-1] : 0; },
canBuyUsd(st, p){ return !!E(st).usdBuy && p.loc !== 'ussr'; },
/* Банк стоит дома: в 1993 сдать валюту можно только на внутреннем рынке.
   В классике обмен разрешён на любом расстоянии, как в оригинале. */
canSellUsd(st, p){ return !this.hasDemand(st) || p.loc === 'ussr'; },
extractCost(st){ return E(st).extract[st.course-1]; },
produceCost(st){ return E(st).produce[st.course-1]; },
loanTake(st){ return E(st).loanTake[st.course-1]; },
loanRepay(st){ return E(st).loanRepay[st.course-1]; },
canLoan(st){ return st.course <= E(st).loanLast && this.loanTake(st) > 0; },
P(st,i){ return st.players[i]; },
alive(st){ return st.players.filter(p=>!p.out); },

/* Компьютер ставится на ОДНУ конкретную единицу и добавляет ей +1 партию.
   Правила прямо перечисляют три вида: «оборудование добывает на партию
   больше; станок производит на партию больше; ГРУЗОПОДЪЁМНОСТЬ ТРАНСПОРТА
   увеличивается на партию». То есть ставить можно и на машину, и на судно.
   Второй компьютер имеет смысл: он усилит следующую единицу. */
COMP_KINDS: ['machine','extractor','truck','fleet'],
compMap(p){
  if (!p.comp) p.comp = {};
  for (const k of this.COMP_KINDS) if (!p.comp[k]) p.comp[k] = {s:0,i:0};
  return p.comp;
},
compOn(p, kind, origin){ const c = this.compMap(p)[kind]; return c ? (c[origin]|0) : 0; },
compUsed(p){ const c=this.compMap(p);
  return this.COMP_KINDS.reduce((a,k)=> a + (c[k].s|0) + (c[k].i|0), 0); },
compFree(p){ return Math.max(0, p.own.computer - this.compUsed(p)); },
compSlots(p, kind, origin){ return p.own[kind][origin]; },
/* Снимаем лишние компьютеры, если единицу продали или компьютеров стало меньше. */
compFix(p){
  const c = this.compMap(p);
  for (const k of this.COMP_KINDS)
    for (const o of ['s','i']) c[k][o] = Math.min(c[k][o]|0, p.own[k][o]);
  let over = this.compUsed(p) - p.own.computer;
  for (const k of ['fleet','truck','extractor','machine'])
    for (const o of ['s','i']){
      if (over <= 0) return;
      const take = Math.min(over, c[k][o]); c[k][o] -= take; over -= take;
    }
},
perExtractor(p, origin){ return origin==='i'?2:1; },
perMachine(p, origin){ return origin==='i'?2:1; },
/* базовая грузоподъёмность одной единицы транспорта, без компьютера */
perVehicle(kind, origin){ return kind==='truck' ? (origin==='i'?2:1) : (origin==='i'?3:2); },
/* Разложить свободные компьютеры по пустым местам: станки важнее добычи
   (партия товара дороже партии сырья), импортные единицы важнее советских.
   Транспорт — в последнюю очередь: он усиливает только того, кто возит. */
autoAssign(p){
  const c = this.compMap(p);
  let free = this.compFree(p);
  if (!free) return;
  const order = (p.own.plant && (p.own.machine.s + p.own.machine.i))
    ? [['machine','i'],['machine','s'],['extractor','i'],['extractor','s'],['fleet','i'],['fleet','s'],['truck','i'],['truck','s']]
    : [['fleet','i'],['fleet','s'],['truck','i'],['truck','s'],['extractor','i'],['extractor','s'],['machine','i'],['machine','s']];
  for (const [k,o] of order){
    if (free <= 0) break;
    const put = Math.min(p.own[k][o] - c[k][o], free);
    if (put > 0){ c[k][o] += put; free -= put; }
  }
},
/* Сколько единиц запустить, чтобы выпуск уложился в budget партий. */
planRun(p, kind, budget, maxS, maxI){
  const base = o => kind==='machine' ? this.perMachine(p,o) : this.perExtractor(p,o);
  let useS = 0, useI = 0, out = 0;
  const step = (o, used) => base(o) + (used < this.compOn(p,kind,o) ? 1 : 0);
  while (useI < maxI && out + step('i', useI) <= budget){ out += step('i', useI); useI++; }
  while (useS < maxS && out + step('s', useS) <= budget){ out += step('s', useS); useS++; }
  return {s:useS, i:useI, out:out};
},
/* Сколько партий даст запуск useS советских и useI импортных единиц. */
outFor(p, kind, useS, useI){
  const per = kind==='machine' ? this.perMachine.bind(this) : this.perExtractor.bind(this);
  return useS*per(p,'s') + Math.min(useS, this.compOn(p,kind,'s'))
       + useI*per(p,'i') + Math.min(useI, this.compOn(p,kind,'i'));
},
machineSlots(p){ return p.own.plant * MACHINES_PER_PLANT; },
usableMachines(p){
  const total = p.own.machine.s + p.own.machine.i + p.rent.machine;
  return Math.min(total, this.machineSlots(p));
},
/* В рейсе работает только уехавший транспорт; дома — весь парк.
   Старые сохранения без поля away ведут себя как раньше. */
transportOf(p){ return p.away || p.own; },
/* Грузоподъёмность набора машин с учётом компьютеров. Компьютер стоит на
   конкретной машине, поэтому в рейс его берут вместе с ней: если из шести
   грузовиков уехали два, работают максимум два компьютера. */
capOf(p, set, kind){
  let c = 0;
  for (const o of ['s','i']){
    const n = Math.max(0, set[kind][o]|0);
    /* Каждая карточка транспорта своя: на одной компьютер стоит, на другой
       нет. Если набор говорит, сколько компьютеров в нём, — верим ему;
       иначе считаем, что поехали лучшие машины (так было до выбора). */
    const cn = (set.comp && set.comp[kind]) ? (set.comp[kind][o]|0) : this.compOn(p, kind, o);
    c += n * this.perVehicle(kind, o) + Math.min(n, cn, this.compOn(p, kind, o));
  }
  return c;
},
/* Машина, купленная (или проданная) за границей, стоит рядом с игроком —
   значит она в рейсе и входит в трюм. Иначе привезти домой купленный
   импортный транспорт было бы нечем. */
awaySync(p, kind, origin, n){
  if (!p.away || (kind !== 'truck' && kind !== 'fleet')) return;
  p.away[kind][origin] = Math.max(0, Math.min(p.own[kind][origin], (p.away[kind][origin]|0) + n));
  if (p.away.comp && p.away.comp[kind])
    p.away.comp[kind][origin] = Math.min(p.away.comp[kind][origin]|0, p.away[kind][origin], this.compOn(p, kind, origin));
},
truckCap(p){ return this.capOf(p, this.transportOf(p), 'truck'); },
fleetCap(p){ return this.capOf(p, this.transportOf(p), 'fleet'); },
/* Сколько увезёт выбранный набор машин до этого континента. */
capOfSet(p, set, cont){
  const C = CONTINENTS[cont]; if (!C) return 0;
  return (C.byTruck ? this.capOf(p, set, 'truck') : 0)
       + (C.byFleet ? this.capOf(p, set, 'fleet') : 0);
},
/* Полный парк, доступный к отправке на этот континент. */
fleetHome(p, cont){
  const C = CONTINENTS[cont];
  return {truck:{s:C && C.byTruck ? p.own.truck.s : 0, i:C && C.byTruck ? p.own.truck.i : 0},
          fleet:{s:C && C.byFleet ? p.own.fleet.s : 0, i:C && C.byFleet ? p.own.fleet.i : 0}};
},
capacityFor(p, cont){
  // Считаем только тот транспорт, который туда доходит.
  const C = CONTINENTS[cont];
  return (C.byTruck ? this.truckCap(p) : 0) + (C.byFleet ? this.fleetCap(p) : 0);
},
hasOwnTransport(p){ return this.truckCap(p)+this.fleetCap(p) > 0; },
/* --- госгруз: сама работа, без завершения хода ---------------------
   Правила разрешают СОВМЕЩАТЬ: «загрузка государственного груза входит
   в ход „Покупка“, а разгрузка государственного груза входит в ход
   „Продажа“ своего». Поэтому работа вынесена из case-ов LOAD/UNLOAD
   сюда: отдельным ходом её вызывают они, попутно — BUY и SELL. */
maxLoad(st, p){
  const contKey = p.loc==='ussr' ? null : p.loc;
  const cap = contKey ? this.capacityFor(p, contKey)
                      : Math.max(this.truckCap(p), this.truckCap(p)+this.fleetCap(p));
  const room = cap - p.cargo.length;
  const stock = contKey ? st.continents[p.loc].stock : Infinity;
  return Math.max(0, Math.min(room, stock, this.govLot(st)));
},
doLoad(st, p, n){
