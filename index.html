    where:'Европа'
  },
  computer: {
    tag:'Игровая фишка · только импорт',
    text:()=>'Американский компьютер устанавливается на одну единицу и даёт ей +1 партию за ход: оборудование добывает на партию сырья больше, станок производит на партию товара больше, транспорт увозит на партию груза больше. Каждый следующий компьютер усиливает следующую единицу, поэтому их имеет смысл покупать столько, сколько у вас станков, оборудования и машин. Компьютер на машине уезжает вместе с ней. Советских компьютеров не существует, поэтому цена всегда двойная.',
    where:'Америка'
  },
  raw: {
    tag:'Жетоны по 1, 5 и 10 партий',
    text:()=>'Добывается оборудованием и тратится на производство товара. Мировой рынок сырьё не покупает — за границу его везти незачем. Выгоднее продавать не на рынок, а напрямую производителю: сделка между игроками хода не тратит.',
    where:null
  },
  goods: {
    tag:'Жетоны по 1, 5 и 10 партий',
    text:()=>'Производится из сырья на станках. Единственное, что покупает мировой рынок, — по $'+E(S).prices.goods.usd+' тыс. за партию. Именно вывоз товара даёт доллары, а доллары нужны, чтобы купить импорт и продать его дома вдвое дороже советского аналога.',
    where:null
  }
};

const CONT_BY_KIND = {};
for (const k in CONTINENTS) CONT_BY_KIND[CONTINENTS[k].kind] = CONTINENTS[k].ru;

UI.inspect = function(key){
  const parts = String(key).split(':');
  const kind = parts[0], origin = parts[1] === 'i' ? 'i' : 's';

  /* --- деньги и кредитное обязательство --- */
  if (kind === 'money'){
    const rub = parts[1] === 'rub';
    const list = rub ? [1,5,10,20,50,100] : [1,5,10,20];
    const imgs = list.map(v => `<figure class="ispec"><img src="${ART[(rub?'rub-':'usd-')+v]}" alt=""><figcaption>${rub?v+' тыс. руб.':'$'+v+' тыс.'}</figcaption></figure>`).join('');
    const m = UI.shell(rub ? 'Банковские чеки в рублях' : 'Банковские чеки в долларах',
      `<div class="igal">${imgs}</div>
       <p>${rub
         ? 'Внутренние деньги. За рубли покупается и продаётся всё на внутреннем рынке СССР. Стартовый капитал каждого игрока — ' + E(S).start + ' тыс. руб.'
         : 'Валюта мирового рынка. Доллары зарабатываются только вывозом советского товара за границу и тратятся там на импорт. Банк меняет доллары на рубли всегда 1:1, независимо от курса, а рубли на доллары не меняет никогда.'}</p>
       <p class="hint">${rub
         ? 'Ссуда в банке: взять ' + Rules.loanTake(S) + ' — вернуть ' + Rules.loanRepay(S) + '. Вторую не дадут, пока не возвращена первая.'
         : 'Менять доллары на рубли при низком курсе крайне невыгодно: $1 тыс. превращается в 1 тыс. руб., тогда как партия товара стоит на внутреннем рынке ' + Rules.price(S,'goods','s','buy') + '. Доллары ценны как ключ к импорту, а не как деньги.'}</p>`,
      `<button class="btn" data-close>Закрыть</button>`, true);
    UI.wireClose(m); UI.open(m); return;
  }
  if (kind === 'credit'){
    const m = UI.shell('Кредитное обязательство',
      `<div class="igal"><figure class="ispec wide"><img src="${ART['credit']}" alt=""><figcaption>Долг банку ${Rules.loanRepay(S)} тыс. руб.</figcaption></figure></div>
       <p>Ссуда берётся в любой момент и ход не тратит: игрок получает ${Rules.loanTake(S)} тыс. руб. и обязуется вернуть ${Rules.loanRepay(S)} тыс. Вторую ссуду не дадут, пока не возвращена первая.</p>
       <p>Обязательство можно продать другому игроку по договорной цене — тогда возвращать в банк полные ${Rules.loanRepay(S)} тыс. будет уже он. Купить чужое обязательство дешевле ${Rules.loanRepay(S)} бывает выгодно, а продать своё — способ выкрутиться в трудную минуту.</p>
       <p class="hint">Игрок, которому нужно платить, а денег нет, продать нечего и ссуда уже взята, объявляется банкротом и выходит из игры.</p>`,
      `<button class="btn" data-close>Закрыть</button>`, true);
    UI.wireClose(m); UI.open(m); return;
  }

  const info = INFO[kind]; if (!info) return;
  const isChip = ART_OF[kind].type === 'chip';
  const bothOrigins = kind === 'machine' || kind === 'extractor' || kind === 'truck' || kind === 'fleet';

  /* --- крупные изображения --- */
  let gal = '';
  if (isChip){
    gal = [10,5,1].map(v => `<figure class="ispec"><img src="${ART['chip-'+kind+v]}" alt=""><figcaption>${v} ${v===1?'партия':'партий'}</figcaption></figure>`).join('');
  } else if (bothOrigins){
    gal = `<figure class="ispec${origin==='s'?' pick':''}">${UI.cardSVG(kind,'s') || '<img src="'+art(kind,'s')+'" alt="">'}<figcaption>Советский</figcaption></figure>
           <figure class="ispec${origin==='i'?' pick':''}">${UI.cardSVG(kind,'i') || '<img src="'+art(kind,'i')+'" alt="">'}<figcaption>Импортный${CONT_BY_KIND[kind]?' · '+CONT_BY_KIND[kind]:''}</figcaption></figure>`;
  } else {
    gal = `<figure class="ispec${kind==='plant'?' wide':''}">${UI.artBox(kind,origin)}<figcaption>${kind==='computer'?'Америка':'Внутренний рынок СССР'}</figcaption></figure>`;
  }

  /* --- цены --- */
  const nowBuyS  = Rules.price(S, kind, 's', 'buy');
  const nowSellS = Rules.price(S, kind, 's', 'sell');
  const hasImport = kind !== 'plant' && kind !== 'raw' && kind !== 'goods';
  /* Таблица должна быть от ДЕЙСТВУЮЩЕГО режима: в 1993 цены свои, а карточка
     показывала классические. RATE_TXT — тоже классический ряд курсов. */
  const PR = E(S).prices, RT = E(S).rateTxt;
  const worldUsd = (kind === 'computer' && E(S).prices.computer && typeof COMPUTER_USD_93 !== 'undefined'
                    && S.mode === 'y1993') ? COMPUTER_USD_93[S.course-1] : PR[kind].usd;

  const col = i => `<td class="${i===S.course-1?'nowc':''}">${'' }</td>`;
  const rowHTML = (label, vals, cls) =>
    `<tr class="${cls||''}"><th>${label}</th>` +
    vals.map((v,i)=>`<td class="num ${i===S.course-1?'nowc':''}">${v===null?'—':v}</td>`).join('') + `</tr>`;

  const buyS  = PR[kind].buy.slice();
  const sellS = PR[kind].sell.map((v,i)=> i===4 ? null : v);
  const table = `
    <table class="iprice">
      <thead><tr><th></th>${[1,2,3,4,5].map(c=>`<th class="${c===S.course?'nowc':''}">курс ${c}</th>`).join('')}</tr>
             <tr class="rt"><th></th>${RT.map((r,i)=>`<th class="${i===S.course-1?'nowc':''}">${r}</th>`).join('')}</tr></thead>
      <tbody>
        ${rowHTML(kind==='computer'?'Покупка':'Покупка сов.', kind==='computer'?buyS.map(v=>v*2):buyS)}
        ${rowHTML(kind==='computer'?'Продажа':'Продажа сов.', kind==='computer'?sellS.map(v=>v===null?null:v*2):sellS, 'dim')}
        ${hasImport && kind!=='computer' ? rowHTML('Покупка имп.', buyS.map(v=>v*2)) : ''}
        ${hasImport && kind!=='computer' ? rowHTML('Продажа имп.', sellS.map(v=>v===null?null:v*2), 'dim') : ''}
      </tbody>
    </table>
    <p class="hint" style="margin-top:6px">Цены в тысячах рублей. Верхняя строка пары — сколько платит игрок, нижняя — сколько получает. Столбец текущего курса подсвечен; на 5-м курсе игра заканчивается и всё имущество продаётся по его цене.</p>`;

  /* --- сводка «сейчас» --- */
  let worldLine;
  if (kind === 'goods') worldLine = `Мировой рынок покупает по <b>$${worldUsd} тыс.</b> за партию — цена постоянна и от курса не зависит`;
  else if (kind === 'raw') worldLine = 'Мировой рынок сырьё <b>не покупает</b>';
  else if (kind === 'plant') worldLine = 'За границей заводы <b>не продаются</b>';
  else worldLine = `На континенте «${CONT_BY_KIND[kind]}» продаётся по <b>$${worldUsd} тыс.</b> — цена постоянна и от курса не зависит`;

  const now = `
    <div class="inow">
      <div><span class="l">Внутренний рынок, курс ${S.course}</span>
        <span class="v">купить ${kind==='computer'?nowBuyS:nowBuyS}${hasImport&&kind!=='computer'?' / '+nowBuyS*2+' имп.':''}</span>
        <span class="v2">продать ${S.course===5?'—':nowSellS}${hasImport&&kind!=='computer'&&S.course!==5?' / '+nowSellS*2+' имп.':''}</span></div>
      <div><span class="l">Мировой рынок</span><span class="v w">${worldLine}</span></div>
    </div>`;

  const m = UI.shell(KIND[kind].ru,
    `<div class="itag">${info.tag}</div>
     <div class="igal">${gal}</div>
     <p>${typeof info.text === 'function' ? info.text() : info.text}</p>
     ${now}
     ${table}`,
    `<button class="btn" data-close>Закрыть</button>`, true);
  UI.wireClose(m); UI.open(m);
};

/* один делегированный клик на всю страницу */
document.addEventListener('click', e => {
  const t = e.target.closest && e.target.closest('[data-insp]');
  if (!t) return;
  if (e.target.closest('button, select, input, a')) return;   // не мешаем управлению
  e.preventDefault();
  UI.inspect(t.getAttribute('data-insp'));
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && UI.modal && !UI.modal.querySelector('.evflip')) UI.close();
});

/* ---------------------- вкладки для телефона ----------------------
   На узком экране показывается ровно одна панель: листать метровую
   ленту на каждом ходу невозможно. Выбор хранится в атрибуте на <body>,
   всё переключение — на CSS. */
UI.setTab = function(name, byUser){
  document.body.setAttribute('data-tab', name);
  document.querySelectorAll('#tabbar button').forEach(b=>{
    const on = b.dataset.t === name;
    b.classList.toggle('on', on);
    if (on) b.classList.remove('alert');
  });
  if (byUser) UI.tabPinned = name;         // игрок выбрал сам — не перебиваем
  window.scrollTo({top:0, behavior:'smooth'});
};
UI.mobile = () => window.matchMedia('(max-width:720px)').matches;
document.querySelectorAll('#tabbar button').forEach(b=>{
  b.addEventListener('click', ()=>UI.setTab(b.dataset.t, true));
});
/* курс на телефоне свёрнут в строку — по нажатию раскрывается таблица */
(function(){
  const cb = document.querySelector('.coursebox');
  if (cb) cb.addEventListener('click', ()=>{ if (UI.mobile()) cb.classList.toggle('open'); });
})();
UI.setTab('table');
</script>
<script>
/* =====================================================================
   СЕТЕВАЯ ИГРА
   Хозяин создаёт комнату и получает код; остальные входят по коду.
   Связь — WebRTC через публичный брокер PeerJS, своего сервера не нужно.
   Хозяин — авторитетная сторона: он применяет все действия к правилам
   и рассылает готовое состояние. Боты считаются только у него.
   ===================================================================== */
const CODE_ABC = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   // без похожих I O 0 1
const PEER_PREFIX = 'konversia-1990-';

const Net = {
  mode: null,          // 'host' | 'client' | null
  peer: null, conns: [], hostConn: null,
  room: null, seat: null, myName: 'Игрок', myKey: '', freeSeats: [],
  lobby: [],           // [{name, conn}] — порядок задаёт номера мест
  status: '',
  cfg: {track:'short', bots:0, timer:0, botSkill:'norm'},

  available(){ return typeof Peer === 'function'; },
  active(){ return this.mode !== null; },
  isHost(){ return this.mode === 'host'; },

  newCode(){ let c=''; for (let i=0;i<4;i++) c += CODE_ABC[Math.floor(Math.random()*CODE_ABC.length)]; return c; },
  newKey(){ let c=''; for (let i=0;i<6;i++) c += CODE_ABC[Math.floor(Math.random()*CODE_ABC.length)]; return c; },

  /* --- память браузера: имя игрока, свой ключ в комнате, партия хозяина --- */
  LS: {
    get(k){ try { return localStorage.getItem(k); } catch(_){ return null; } },
    set(k, v){ try { localStorage.setItem(k, v); } catch(_){ } },
    del(k){ try { localStorage.removeItem(k); } catch(_){ } }
  },
  savedName(){ return this.LS.get('konv-name') || ''; },
  rememberName(n){ if (n) this.LS.set('konv-name', n); },
  myKeyFor(room){ return this.LS.get('konv-key-' + room) || ''; },
  rememberKey(room, key){ if (room && key) this.LS.set('konv-key-' + room, key); },
  lastRoom(){ return this.LS.get('konv-room') || ''; },
  rememberRoom(room){ if (room) this.LS.set('konv-room', room); },

  /* Где я сидел в последний раз. Пишется, как только известны комната,
     ключ и место: обновил вкладку — и кнопка «Вернуться за стол» в меню
     знает, куда возвращаться, без вспоминания кода. */
  rememberBack(){
    if (!this.room || this.seat == null) return;
    const key = this.myKey || this.myKeyFor(this.room);
    if (!key) return;
    try { this.LS.set('konv-back', JSON.stringify(
      {room:this.room, key:key, seat:this.seat, host:this.isHost(), when:Date.now()})); } catch(_){ }
  },
  savedBack(){
    try {
      const o = JSON.parse(this.LS.get('konv-back') || 'null');
      if (!o || !o.room || !o.key) return null;
      if (this.active() && this.room === o.room) return null;   // мы и так за этим столом
      return o;
    } catch(_){ return null; }
  },
  dropBack(){ this.LS.del('konv-back'); },

  /* Сервера нет: партию держит браузер хозяина. Пишем после каждого хода,
     чтобы закрытую вкладку можно было поднять с тем же кодом комнаты. */
  saveGame(){
    if (!this.isHost() || !S) return;
    try {
      this.LS.set('konv-save', JSON.stringify({
        room: this.room, cfg: this.cfg, when: Date.now(),
        seats: this.lobby.map(x => ({name:x.name, key:x.key})),
        state: JSON.stringify(S)
      }));
    } catch(_){ }
  },
  loadSave(){
    try { const j = this.LS.get('konv-save'); return j ? JSON.parse(j) : null; } catch(_){ return null; }
  },
  /* Слепок партии у гостя. Хозяин пишет свой конверт в saveGame, а гость —
     тут: состояние приезжает к нему целиком на каждом ходу, значит поднять
     стол он сможет не хуже. Пригодится, если разошлись все. */
  mirror(){
    if (this.isHost() || !S || !this.room) return;
    try {
      this.LS.set('konv-save', JSON.stringify({
        room: this.room, cfg: this.cfg, when: Date.now(), mirror: true,
        seats: (this.knownRoster || []).map(x => ({name:x.name, key:x.key})),
        state: JSON.stringify(S)
      }));
    } catch(_){ }
  },
  dropSave(){ this.LS.del('konv-save'); },

  /* ---------------- хозяин ---------------- */
  createRoom(name, onReady, onFail, tries, fixedCode){
    tries = tries || 0;
    if (tries > 4) return onFail('Не удалось занять код комнаты. Попробуйте ещё раз.');
    const code = fixedCode || this.newCode();
    const peer = new Peer(PEER_PREFIX + code, {debug:0});
    let settled = false;
    peer.on('open', ()=>{
      settled = true;
      this.mode = 'host'; this.peer = peer; this.room = code; this.seat = 0;
      this.myName = name || 'Хозяин';
      this.lobby = [{name:this.myName, conn:null, key:this.newKey(),
                     face:(typeof Prof !== 'undefined' ? Prof.face() : -1)}];
      this.rememberName(this.myName);
      this.rememberRoom(code);
      this.myKey = this.lobby[0].key;
      this.rememberKey(code, this.myKey);
      this.rememberBack();
      this.status = 'Комната создана. Ждём игроков.';
      peer.on('connection', c => this.acceptConn(c));
      peer.on('error', e => { this.status = 'Ошибка связи: ' + e.type; UI.renderLobby && UI.renderLobby(); });
      onReady(code);
    });
    peer.on('error', e => {
      if (settled) return;
      settled = true;
      try { peer.destroy(); } catch(_){}
      if (e.type === 'unavailable-id'){
        if (fixedCode) return onFail('Код ' + fixedCode + ' сейчас занят. Подождите минуту и попробуйте снова.');
        return this.createRoom(name, onReady, onFail, tries+1);
      }
      onFail(this.explain(e));
    });
  },

  acceptConn(c){
    c.on('open', ()=>{
      this.conns.push(c);
      c.on('data', d => this.onHostData(c, d));
      c.on('close', ()=> this.dropConn(c));
      c.on('error', ()=> this.dropConn(c));
    });
  },
  dropConn(c){
    this.conns = this.conns.filter(x => x !== c);
    setTimeout(()=>{ if (this.isHost()) this.pushRoster(); }, 0);
    const i = this.lobby.findIndex(s => s.conn === c);
    if (i < 0) return;
    this.lobby[i].conn = null;
    if (this.started){
      const p = Rules.P(S, i);
      if (p && !p.bot){ p.bot = true; p.role = 'trader';
        Rules.say(S, p.name + ' отключился — его место занял бот. Он может вернуться по своему ключу.', 'bad');
        this.saveGame(); this.pushState(); UI.render(); Bots.schedule(); }
    } else {
      this.lobby.splice(i, 1);
      this.pushLobby();
    }
    UI.renderLobby && UI.renderLobby();
  },
  onHostData(c, msg){
    if (!msg || typeof msg !== 'object') return;

    if (msg.t === 'hello'){
      const nm = String(msg.name || 'Игрок').slice(0, 18) || 'Игрок';
      const key = String(msg.key || '');
      const fc = (typeof msg.face === 'number' && msg.face >= 0) ? msg.face : -1;

      // 1. возвращение по ключу — своё место со всем имуществом
      if (key){
        const i = this.lobby.findIndex(x => x.key === key);
        if (i >= 0){
          this.lobby[i].conn = c; this.lobby[i].name = nm; this.lobby[i].face = fc;
          if (this.started){
            const p = Rules.P(S, i);
            if (p){ p.bot = false; p.name = nm;
              Rules.say(S, nm + ' вернулся в игру и снова ведёт своё дело.', 'dl'); }
            this.seatIn(c, i);
            this.saveGame(); this.pushState(); UI.render(); Bots.schedule();
          } else this.pushLobby();
          UI.renderLobby && UI.renderLobby();
          return;
        }
      }

      // 2. партия уже идёт — предлагаем занять место бота
      if (this.started){
        return this.send(c, {t:'seats', room:this.room, seats:
          S.players.map((p, i) => ({i:i, name:p.name, bot:!!p.bot, out:!!p.out}))});
      }

      // 3. обычный вход в лобби
      if (this.lobby.length >= 8) return this.send(c, {t:'err', text:'В комнате уже 8 игроков.'});
      this.lobby.push({name:nm, conn:c, key:this.newKey(), face:fc});
      this.pushLobby();
      UI.renderLobby && UI.renderLobby();
      return;
    }

    // занять место бота в идущей партии
    if (msg.t === 'claim'){
      if (!this.started) return;
      const i = msg.seat|0, p = Rules.P(S, i);
      if (!p || !p.bot || p.out) return this.send(c, {t:'err', text:'Это место уже занято живым игроком.'});
      const nm = String(msg.name || 'Игрок').slice(0, 18) || 'Игрок';
      while (this.lobby.length <= i) this.lobby.push({name:'—', conn:null, key:this.newKey()});
      this.lobby[i] = {name:nm, conn:c, key:this.newKey(),
                       face:(typeof msg.face === 'number' ? msg.face : -1)};
      p.bot = false; p.name = nm;
      if (msg.face >= 0) p.face = msg.face;
      Rules.say(S, nm + ' занял место бота и продолжает его дело.', 'dl');
      this.seatIn(c, i);
      this.saveGame(); this.pushState(); UI.render(); Bots.schedule();
      UI.renderLobby && UI.renderLobby();
      return;
    }

    if (msg.t === 'act'){
      const seat = this.lobby.findIndex(s => s.conn === c);
      const a = msg.action;
      if (seat < 0 || !a || a.by !== seat) return;          // действовать можно только за своё место
      S = Rules.apply(S, a);
      this.saveGame();
      UI.render(); this.pushState(); Bots.schedule();
    }
  },
  /* посадить соединение на место: отдаём состояние, номер места и ключ */
  seatIn(c, i){
    this.send(c, {t:'start', state:JSON.stringify(S), seat:i,
                  key:this.lobby[i].key, room:this.room, mode:S.mode,
                  roster:this.roster(), cfg:this.cfg});
  },
  pushLobby(){
    const names = this.lobby.map(s => s.name);
    const roster = this.roster();
    this.lobby.forEach((s, i) => { if (s.conn) this.send(s.conn,
      {t:'lobby', players:names, seat:i, room:this.room, key:s.key, mode:modeOfLang(),
       roster:roster}); });
  },
  /* Состав стола вместе с ключами. Рассылается всем, и это намеренно:
     если хозяин закроет вкладку, комнату поднимет кто-то из оставшихся —
     а пустить людей на их прежние места он сможет только зная ключи.
     Секрета тут нет: ключ это пропуск за свой же стул, не пароль. */
  roster(){ return this.lobby.map(s => ({name:s.name, key:s.key})); },
  pushRoster(){
    const r = this.roster();
    this.conns.forEach(c => { try { c.send({t:'roster', roster:r, room:this.room}); } catch(_){ } });
  },
  pushState(){ const j = JSON.stringify(S); this.conns.forEach(c => { try{ c.send({t:'state', state:j}); }catch(_){ } }); },
  /* Хозяин применяет действие сам — тоже через сохранение */
  hostApplied(){ this.saveGame(); },
  send(c, o){ try{ c.send(o); }catch(_){ } },

  startGame(cfg){
    const players = this.lobby.map(s => ({name:s.name, bot:false, face:(s.face >= 0 ? s.face : -1)}));
    const roles = ['miner','producer','trader'];
    for (let i = 0; i < (cfg.bots|0) && players.length < 8; i++)
      players.push({name:BOT_NAMES_L()[i % BOT_NAMES_L().length], bot:true, role:roles[i % 3]});
    S = Rules.create({seed:(Date.now() ^ (Math.random()*0xffffffff))>>>0, track:cfg.track,
                      mode:modeOfLang(), botSkill:cfg.botSkill, players});
    this.started = true;
    Prof.startGame(true);
    UI.timerSec = cfg.timer|0; UI.timerOn = UI.timerSec > 0;
    UI.overShown = false; UI.shownEventSeq = 0;
    this.lobby.forEach((s, i) => { if (s.conn) this.seatIn(s.conn, i); });
    this.saveGame();
    UI.close(true);
    /* Зал должен понимать, что случилось: иначе он видит только «такой-то
       вышел» и не знает, партия началась или человек закрыл вкладку. */
    UI.menuPlaying(this.lobby.map(x => x.name).join(', ') +
      ' — сели играть' + (this.room ? ' (комната ' + this.room + ')' : '') + '.');
    UI.render(); Bots.schedule();
  },

  /* ---------------- гость ---------------- */
  joinRoom(code, name, onReady, onFail, key){
    const peer = new Peer({debug:0});
    this.myName = name || 'Игрок';
    this.lost = false;
    let settled = false;
    peer.on('open', ()=>{
      const c = peer.connect(PEER_PREFIX + code, {reliable:true});
      const timer = setTimeout(()=>{ if (!settled){ settled = true; try{peer.destroy();}catch(_){}; onFail('Комната ' + code + ' не отвечает. Проверьте код.'); } }, 12000);
      c.on('open', ()=>{
        settled = true; clearTimeout(timer);
        this.mode = 'client'; this.peer = peer; this.hostConn = c; this.room = code;
        this.status = 'Подключено. Ждём, когда хозяин начнёт партию.';
        this.rememberName(this.myName);
        this.rememberRoom(code);
        const useKey = key || this.myKeyFor(code);
        if (useKey){ this.myKey = useKey; this.rememberKey(code, useKey); }
        c.send({t:'hello', name:this.myName, key:useKey, mode:modeOfLang(),
                face:(typeof Prof !== 'undefined' ? Prof.face() : -1)});
        c.on('data', d => this.onClientData(d));
        c.on('close', ()=>this.onLost());
        c.on('error', ()=>this.onLost());
        onReady();
      });
      c.on('error', e => { if (!settled){ settled = true; clearTimeout(timer); onFail(this.explain(e)); } });
    });
    peer.on('error', e => { if (!settled){ settled = true; onFail(this.explain(e)); } });
  },
  onClientData(msg){
    if (!msg || typeof msg !== 'object') return;
    if (msg.t === 'lobby'){
      this.seat = msg.seat; this.lobby = msg.players.map(n => ({name:n}));
      this.myKey = msg.key || this.myKey;
      this.rememberKey(msg.room || this.room, this.myKey);
      if (msg.roster) this.knownRoster = msg.roster;
      this.rememberBack();
      if (msg.mode && followRoomMode(msg.mode))
        this.status = msg.mode === 'y1993'
          ? 'У цій кімнаті грають у «Конверсію · 1993» — мову перемкнено.'
          : 'В этой комнате играют в классическую «Конверсию-1» — язык переключён.';
      this.status = 'В комнате ' + msg.players.length + ' игрок(ов). Ждём хозяина.';
      UI.renderLobby && UI.renderLobby();
    } else if (msg.t === 'seats'){
      // партия уже идёт — предлагаем занять место бота
      this.freeSeats = (msg.seats || []).filter(x => x.bot && !x.out);
      UI.claimModal && UI.claimModal(msg.seats || []);
    } else if (msg.t === 'start'){
      S = JSON.parse(msg.state); this.seat = msg.seat; this.started = true;
      followRoomMode(S.mode);                        // правила задаёт комната
      if (msg.key){ this.myKey = msg.key; this.rememberKey(msg.room || this.room, msg.key); }
      if (msg.roster) this.knownRoster = msg.roster;
      if (msg.cfg) this.cfg = msg.cfg;
      this.rememberBack();
      this.mirror();
      this.status = '';
      UI.overShown = false; UI.shownEventSeq = 0;
      Prof.startGame(true);
      UI.close(true);
      UI.menuPlaying();                              // гость тоже выходит из зала
      UI.render();
    } else if (msg.t === 'roster'){
      this.knownRoster = msg.roster || [];
      this.mirror();
    } else if (msg.t === 'state'){
      S = JSON.parse(msg.state); followRoomMode(S.mode); UI.render();
      this.mirror();
    } else if (msg.t === 'err'){
      this.status = msg.text; UI.renderLobby && UI.renderLobby();
    }
  },
  claimSeat(i){ if (this.hostConn) this.send(this.hostConn, {t:'claim', seat:i, name:this.myName,
    face:(typeof Prof !== 'undefined' ? Prof.face() : -1)}); },

  /* Связь с хозяином оборвалась. Место игрока у хозяина ведёт бот, ключ
     сохранён — значит вернуться можно в тот же стул. Пробуем сами, а если
     не вышло, показываем кнопку «Переподключиться». */
  onLost(){
    if (this.mode !== 'client' || this.lost) return;
    this.lost = true;
    this.status = 'Связь с хозяином потеряна.';
    UI.renderLobby && UI.renderLobby(); UI.render();
    if (this.autoTry) return;
    /* Ждём вразнобой и пробуем занять адрес комнаты сами: кто успел, тот и
       хозяин. Разброс нужен, чтобы двое не полезли одновременно — проигравший
       получит «адрес занят» и просто вернётся гостем к новому хозяину. */
    this.autoTry = setTimeout(()=>{ this.autoTry = null; this.takeOver(); },
      700 + Math.floor(Math.random() * 1500));
  },

  /* ---------- перехват комнаты ----------
     Хозяин закрыл вкладку — партия не должна умирать. Состояние у гостя
     полное (оно приезжает целиком на каждом ходу), состав с ключами тоже,
     поэтому любой из оставшихся может поднять стол и продолжить. */
  takeOver(){
    if (this.mode !== 'client' || !this.lost || !this.room || !S) return this.reconnect();
    const code = this.room, mySeat = this.seat;
    const roster = (this.knownRoster || []).slice();
    if (!roster.length) return this.reconnect();
    this.status = 'Хозяин пропал — поднимаем комнату…';
    UI.renderLobby && UI.renderLobby(); UI.render();
    try { if (this.peer) this.peer.destroy(); } catch(_){ }
    this.peer = null; this.hostConn = null;
    const peer = new Peer(PEER_PREFIX + code, {debug:0});
    let settled = false;
    peer.on('open', ()=>{
      if (settled) return;
      settled = true;
      this.mode = 'host'; this.peer = peer; this.room = code; this.seat = mySeat;
      this.lost = false; this.started = true;
      this.conns = [];
      // места остаются те же; у всех, кроме нас, связи пока нет — их ведут боты
      this.lobby = roster.map((x, i) => ({name:x.name, key:x.key, conn:null,
        face:(S.players[i] ? S.players[i].face : -1)}));
      S.players.forEach((p, i) => { if (i !== mySeat && !p.out) p.bot = true; });
      this.myKey = (this.lobby[mySeat] && this.lobby[mySeat].key) || this.myKey;
      this.rememberKey(code, this.myKey);
      this.rememberBack();
      peer.on('connection', c => this.acceptConn(c));
      peer.on('error', e => { this.status = 'Ошибка связи: ' + e.type; UI.renderLobby && UI.renderLobby(); });
      Rules.say(S, (S.players[mySeat] ? S.players[mySeat].name : 'Игрок') +
        ' поднял комнату — партия продолжается. Остальные возвращаются по своим ключам.', 'dl');
      this.status = 'Комната ' + code + ' поднята. Теперь хозяин — Вы.';
      this.saveGame();
      UI.render(); UI.renderLobby && UI.renderLobby(); Bots.schedule();
      UI.toast('Хозяин пропал — комнату подняли Вы. Остальные вернутся по своим ключам.');
    });
    peer.on('error', (e)=>{
      if (settled) return;
      settled = true;
      try { peer.destroy(); } catch(_){ }
      // адрес занят — значит комнату уже подняли без нас; идём туда гостем
      this.mode = 'client'; this.room = code; this.lost = true;
      this.reconnect();
    });
    setTimeout(()=>{ if (!settled){ settled = true; try { peer.destroy(); } catch(_){ }
      this.mode = 'client'; this.room = code; this.lost = true; this.reconnect(); } }, 4000);
  },
  /* Возврат в комнату: тем же именем и тем же ключом. Годится и после
     обрыва, и после перезагрузки страницы, и с другого браузера — там ключ
     вводится руками. */
  reconnect(onReady, onFail, code, key, name){
    const room = code || this.room || this.lastRoom();
    if (!room) return onFail && onFail('Не помню, в какой Вы были комнате. Введите код.');
    const k = key || this.myKeyFor(room);
    const nm = name || this.myName || this.savedName() || 'Игрок';
    try { if (this.peer) this.peer.destroy(); } catch(_){}
    this.peer = null; this.hostConn = null; this.mode = null; this.started = false;
    this.status = 'Возвращаемся в комнату ' + room + '…';
    UI.render();
    this.joinRoom(room, nm, ()=>{
      this.lost = false;
      this.status = 'Связь восстановлена.';
      UI.render(); onReady && onReady();
    }, t=>{
      this.mode = 'client'; this.room = room; this.lost = true;   // остаёмся «в комнате», чтобы кнопка возврата не пропала
      this.status = t;
      UI.render(); onFail && onFail(t);
    }, k);
  },

  /* ---------------- возобновление партии ----------------
     Сервера нет, поэтому партию поднимает тот же браузер хозяина: берём
     сохранённое состояние, занимаем тот же код комнаты и ждём, пока
     игроки вернутся со своими ключами. Место каждого пока ведёт бот. */
  /* Поднять партию из сохранения. mySeat — за какое место садится тот, кто
     поднимает: хозяин возвращается на нулевое, а гость, у которого остался
     слепок партии, — на своё. Остальные вернутся по ключам. */
  resumeGame(sv, onReady, onFail, mySeat){
    if (!sv || !sv.state) return onFail('Сохранение испорчено.');
    const seat0 = (mySeat != null && mySeat >= 0) ? mySeat : 0;
    const nm = (sv.seats && sv.seats[seat0]) ? sv.seats[seat0].name
             : (this.savedName() || 'Хозяин');
    this.createRoom(nm, ()=>{
      S = JSON.parse(sv.state);
      this.cfg = sv.cfg || this.cfg;
      this.lobby = (sv.seats || []).map((x,i) => ({name:x.name, conn:null, key:x.key || this.newKey()}));
      if (!this.lobby.length) this.lobby = [{name:this.myName, conn:null, key:this.newKey()}];
      this.seat = seat0; this.started = true;
      S.players.forEach((p,i) => { if (i !== seat0 && !p.out) p.bot = true; });
      if (S.players[seat0]) S.players[seat0].bot = false;
      this.myKey = (this.lobby[seat0] && this.lobby[seat0].key) || this.myKey;
      this.rememberKey(sv.room || this.room, this.myKey);
      this.rememberBack();
      Rules.say(S, 'Партия возобновлена. Игроки возвращаются по своим ключам; их места пока ведут боты.', 'dl');
      UI.overShown = false; UI.shownEventSeq = S.eventSeq || 0;
      this.saveGame();
      UI.close(true); UI.render(); Bots.schedule();
      onReady && onReady();
    }, onFail, 0, sv.room);
  },
  exportSave(sv){
    try {
      const blob = new Blob([JSON.stringify(sv)], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'konversia-' + (sv.room || 'save') + '.json';
      document.body.appendChild(a); a.click();
      setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    } catch(_){ }
  },
  importSave(file, done){
    const r = new FileReader();
    r.onload = () => { try { done(JSON.parse(r.result)); } catch(_){ done(null); } };
    r.readAsText(file);
  },
  sendAction(a){ if (this.hostConn) { try{ this.hostConn.send({t:'act', action:a}); }catch(_){ } } },

  leave(){
    try { if (typeof Hall !== 'undefined') Hall.table(null); } catch(_){ }
    try { this.conns.forEach(c => c.close()); } catch(_){ }
    try { if (this.hostConn) this.hostConn.close(); } catch(_){ }
    try { if (this.peer) this.peer.destroy(); } catch(_){ }
    this.mode = null; this.peer = null; this.conns = []; this.hostConn = null;

  },
  explain(e){
    const t = e && e.type;
    if (t === 'peer-unavailable') return 'Такой комнаты нет. Проверьте код — хозяин должен держать вкладку открытой.';
    if (t === 'network' || t === 'server-error' || t === 'socket-error')
      return 'Не удаётся связаться с брокером PeerJS. Так бывает без интернета и внутри предпросмотра артефакта на claude.ai, где внешние подключения запрещены. Сетевой режим работает в сборке из папки игры и на itch.io.';
    if (t === 'browser-incompatible') return 'Браузер не поддерживает WebRTC.';
    return 'Ошибка связи' + (t ? ' (' + t + ')' : '') + '.';
  }
};

/* =====================================================================

const Snd = {
  on: true, box: {}, last: 0, lastK: '',
  init(){ try { this.on = Net.LS.get('konv-snd') !== '0'; } catch(_){ } },
  set(v){ this.on = !!v; try { Net.LS.set('konv-snd', v ? '1' : '0'); } catch(_){ } },
  play(k){
    const src = ART['snd-' + k];
    if (!this.on || !src) return;
    const t = Date.now();
    // не тарахтим: один и тот же сигнал не чаще раза в секунду, любой — раза в 300 мс
    if (t - this.last < 300) return;
    if (k === this.lastK && t - this.last < 1000) return;
    this.last = t; this.lastK = k;
    try {
      let a = this.box[k];
      if (!a){ a = this.box[k] = new Audio(src); a.preload = 'auto'; a.volume = 0.55; }
      a.currentTime = 0;
      const pr = a.play();
      if (pr && pr.catch) pr.catch(()=>{});      // браузер ещё не разрешил звук — молча
    } catch(_){ }
  }
};
Snd.init();

      done = true;
      H.peer = p; H.host = true; H.ready = true;
      H.me.id = 'host';
      H.hostName = H.me.name;
      H.members = [{id:'host', name:H.me.name, face:H.me.face, table:null, host:true}];
      seenIds = ['host'];     // подняли комнату: мы одни, дальше всякий новый — со звуком
      p.on('connection', onGuest);
      line('sys', 'Комната поднята. Пока главный тут — вы.');
      fire();
    });
    p.on('error', ()=>{
      if (done || my !== gen || !H.on) return;
      done = true;
      try { p.destroy(); } catch(_){ }
      guest(my);
    });
    setTimeout(()=>{
      if (done || my !== gen || !H.on) return;
      done = true;
      try { p.destroy(); } catch(_){ }
      guest(my);
    }, CLAIM_WAIT);
  }

  function guest(my){
    if (!H.on || my !== gen) return;
    let p, done = false;
    try { p = new Peer({debug:0}); } catch(_){ H.err = 'нет связи'; fire(); return; }
    H.peer = p; H.host = false;
    p.on('open', ()=>{
      if (my !== gen){ try{ p.destroy(); }catch(_){ } return; }
      const c = p.connect(hallId(), {reliable:true});
      H.hostConn = c;
      c.on('open', ()=>{
        if (my !== gen) return;
        done = true; H.ready = true;
        Net.send(c, {t:'hi', name:H.me.name, face:H.me.face});
        fire();
      });
      c.on('data', m => { if (my === gen) onHostMsg(m); });
      c.on('close', ()=>{ if (my === gen) lostHost(); });
      c.on('error', ()=>{ if (!done && my === gen) retry(); });
    });
    p.on('error', ()=>{ if (!done && my === gen) retry(); });
    setTimeout(()=>{ if (!done && H.on && my === gen) retry(); }, CLAIM_WAIT);
  }

  // главный ушёл — ждём вразнобой и пробуем занять его место
  function retry(){
    if (!H.on) return;
    gen++;                                   // всё, что было до этого, больше не наше
    H.ready = false; H.host = false; H.hostConn = null; H.members = [];
    try { if (H.peer) H.peer.destroy(); } catch(_){ }
    H.peer = null;
    fire();
    setTimeout(claim, 200 + Math.floor(Math.random()*900));
  }

  function lostHost(){
    if (!H.on || H.host) return;
    line('sys', 'Главный вышел из комнаты, ищем нового…');
    retry();
  }

  function leave(){
    H.on = false; H.ready = false; H.host = false; gen++;
    if (H.hostConn){ try { Net.send(H.hostConn, {t:'bye'}); } catch(_){ } }
    try { if (H.peer) H.peer.destroy(); } catch(_){ }
    H.peer = null; H.hostConn = null; H.conns = []; H.members = []; H.msgs = [];
    fire();
  }

  /* ---------- главный ---------- */
  function onGuest(conn){
    H.conns.push(conn);
    conn.on('data', m => fromGuest(conn, m));
    conn.on('close', ()=>dropGuest(conn));
    conn.on('error', ()=>dropGuest(conn));
  }
  function dropGuest(conn){
    const i = H.conns.indexOf(conn);
    if (i >= 0) H.conns.splice(i,1);
    const m = memberOf(conn);
    if (m){
      H.members = H.members.filter(x => x.id !== m.id);
      line('sys', m.name + ' вышел из комнаты.');
      pushList();
    }
  }
  function memberOf(conn){
    for (let i = 0; i < H.members.length; i++) if (H.members[i].conn === conn) return H.members[i];
    return null;
  }

  function fromGuest(conn, m){
    if (!m || !m.t) return;
    if (m.t === 'hi'){
      const was = memberOf(conn);
      if (was){                                // это не новый игрок, а тот же сменил имя
        was.name = String(m.name || was.name).slice(0,18);
        if (typeof m.face === 'number') was.face = m.face;
        pushList();
        return;
      }
      const id = 'p' + (++seq);
      const mem = {id:id, name:String(m.name || 'Игрок').slice(0,18),
                   face:(typeof m.face === 'number' ? m.face : -1), table:null, conn:conn};
      H.members.push(mem);
      Net.send(conn, {t:'you', id:id});
      line('sys', mem.name + ' вошёл в комнату.');
      pushList();
      return;
    }
    const who = memberOf(conn);
    if (!who) return;
    if (m.t === 'msg') return broadcastMsg(who.name, String(m.text || '').slice(0,200), who.id);
    if (m.t === 'table'){
      who.table = m.code ? {code:String(m.code).slice(0,6), N:m.N || 0} : null;
      if (who.table) tableLine(who.name, who.table.code, who.table.N, who.id);
      else line('sys', who.name + ' закрыл комнату.');
      pushList();
      return;
    }
    if (m.t === 'note'){                       // «сели играть» — разносим от имени зала
      const tx = String(m.text || '').slice(0,140);
      if (tx){ line('sys', tx); toAll({t:'sys', text:tx}); }
      return;
    }
    if (m.t === 'gone'){                       // сел играть — из зала его убираем
      H.members = H.members.filter(x => x.id !== who.id);
      line('sys', who.name + ' сел за стол.');
      pushList();
      return;
    }
    if (m.t === 'bye') return dropGuest(conn);
  }

  function pubList(){
    return H.members.map(m => ({id:m.id, name:m.name, face:(m.face == null ? -1 : m.face),
      table:m.table, host:!!m.host}));
  }
  function pushList(){
    // соединение могло тихо отвалиться — такие места в списке не держим
    H.members = H.members.filter(m => m.host || (m.conn && m.conn.open !== false));
    H.conns = H.conns.filter(c => c && c.open !== false);
    const l = pubList();
    H.conns.forEach(c => Net.send(c, {t:'list', members:l, hostName:H.me.name}));
    noteMembers();
    fire();
  }
  function toAll(msg){ H.conns.forEach(c => Net.send(c, msg)); }

  // id отправителя едет вместе с репликой: по имени «свой-чужой» не отличить,
  // двое могут назваться одинаково
  function broadcastMsg(from, text, sid){
    if (!text) return;
    line('msg', text, from);
    if (sid !== H.me.id) snd('msg');
    toAll({t:'msg', from:from, text:text, sid:sid});
  }
  function tableLine(name, code, N, sid){
    line('table', name + ' создал комнату' + (N ? ' на ' + N : ''), name, code, N);
    if (sid !== H.me.id) snd('table');
    toAll({t:'table', from:name, code:code, N:N, sid:sid});
  }

  /* ---------- гость ---------- */
  function onHostMsg(m){
    if (!m || !m.t) return;
    if (m.t === 'you'){ H.me.id = m.id; return; }
    if (m.t === 'list'){
      H.members = m.members || [];
      noteMembers();
      if (m.hostName && m.hostName !== H.hostName){
        const first = !H.hostName;
        H.hostName = m.hostName;
        if (!first) line('sys', 'Теперь главный в комнате — ' + m.hostName + '.');
      }
      fire(); return;
    }
    if (m.t === 'msg'){
      if (m.sid !== H.me.id) snd('msg');
      return line('msg', m.text, m.from);
    }
    if (m.t === 'sys') return line('sys', m.text);
    if (m.t === 'table'){
      if (m.sid !== H.me.id) snd('table');
      return line('table', m.from + ' создал комнату' + (m.N ? ' на ' + m.N : ''), m.from, m.code, m.N);
    }
  }

  /* ---------- что делает игрок ---------- */
  function say(text){
    text = String(text || '').trim().slice(0,200);
    if (!text || !H.ready) return;
    if (H.host) broadcastMsg(H.me.name, text, H.me.id);
    else Net.send(H.hostConn, {t:'msg', text:text});
  }

  // объявить, что я поднял стол (или закрыл его)
  function table(code, N){
    if (!H.ready) return;
    H.me.table = code ? {code:code, N:N} : null;
    if (H.host){
      const m = H.members.filter(x => x.id === 'host')[0];
      if (m) m.table = H.me.table;
      if (code) tableLine(H.me.name, code, N, H.me.id);
      else line('sys', 'Вы закрыли комнату.');
      pushList();
    } else Net.send(H.hostConn, {t:'table', code:code || null, N:N || 0});
  }

  // сел играть — выходим из зала совсем
  function playing(){
    if (!H.on) return;
    if (!H.host && H.hostConn) Net.send(H.hostConn, {t:'gone'});
    leave();
  }

  function updateMe(name, face){
    if (name) H.me.name = String(name).slice(0,18);
    if (typeof face === 'number' && face >= 0) H.me.face = face;
    if (!H.ready) return;
    if (H.host){
      H.hostName = H.me.name;
      const m = H.members.filter(x => x.id === 'host')[0];
      if (m){ m.name = H.me.name; m.face = H.me.face; }
      pushList();
    } else Net.send(H.hostConn, {t:'hi', name:H.me.name, face:H.me.face});
  }

  /* Объявить на весь зал, что стол сел играть. Говорит хозяин перед тем,
     как выйти: иначе зал видит только «такой-то вышел» и не понимает,
     партия началась или человек закрыл вкладку. */
  function announce(text){
    text = String(text || '').trim().slice(0,140);
    if (!text || !H.ready) return;
    if (H.host){ line('sys', text); toAll({t:'sys', text:text}); }
    else Net.send(H.hostConn, {t:'note', text:text});
  }

  setInterval(()=>{
    if (!H.on || !H.ready) return;
    if (H.host) pushList();
    else Net.send(H.hostConn, {t:'ping'});
  }, PING);

  return {
    S:H, enter:enter, leave:leave, say:say, table:table,
    sound(f){ H.onSound = f; },
    playing:playing, updateMe:updateMe, announce:announce,
    list(){ return H.members.slice(); },
    log(){ return H.msgs.slice(); }
  };
})();
</script>

    return run(function () {
      var pr = new firebase.auth.GoogleAuthProvider();
      try { pr.setCustomParameters({ prompt: 'select_account' }); } catch (e) { }
      return auth.signInWithPopup(pr);
    });
  };
  C.signIn = function (e, p) { return run(function () { return auth.signInWithEmailAndPassword(e, p); }); };
  C.signUp = function (e, p) { return run(function () { return auth.createUserWithEmailAndPassword(e, p); }); };
  C.reset = function (e) { return run(function () { return auth.sendPasswordResetEmail(e); }); };
  C.signOut = signOut;
  C.push = push;
  C.msg = msg;
  C.SID = SID;
  return C;
})();
</script>
<script>
/* ============================ ОКНА СЕТЕВОЙ ИГРЫ ====================== */
UI.netModal = function(){
  if (!Net.available()){
    const m = UI.shell('Сетевая игра недоступна',
      `<p style="margin-top:0">Не загрузилась библиотека связи PeerJS. Так бывает в двух случаях:</p>
       <p>— страница открыта там, где внешние подключения запрещены (например, внутри предпросмотра артефакта на claude.ai);<br>
          — нет интернета.</p>
       <p class="hint">Сетевой режим работает в сборке из папки игры и на itch.io. Игра за одним экраном и с ботами работает всегда.</p>`,
      `<button class="btn" data-close>Понятно</button>`);
    UI.wireClose(m); UI.place(m); return;
  }
  if (Net.active() && Net.lost) return UI.reconnectModal();
  if (Net.active()) return UI.lobbyModal();

  const m = UI.shell('Сетевая игра',
    `<label class="fld" style="margin-bottom:14px"><span>Ваше имя в игре</span>
       <input type="text" id="nname" maxlength="18" value="${esc(Net.savedName() || 'Игрок')}" autocomplete="off"></label>
     <div class="two">
       <div class="legbox"><h4>Создать комнату</h4>
         <p style="margin:0 0 10px;font-size:13px">Вы станете хозяином: получите код из четырёх знаков, раздадите его друзьям и начнёте партию, когда все соберутся.</p>
         <button class="btn go" id="mkroom" style="width:100%">Создать</button></div>
       <div class="legbox"><h4>Присоединиться</h4>
         <p style="margin:0 0 10px;font-size:13px">Введите код комнаты, который прислал хозяин.</p>
         <input type="text" id="jcode" maxlength="4" placeholder="КОД" autocomplete="off"
                style="width:100%;text-align:center;font-family:var(--mono);font-size:26px;letter-spacing:.28em;text-transform:uppercase;margin-bottom:10px">
         <input type="text" id="jkey" maxlength="8" placeholder="КЛЮЧ ИГРОКА — если возвращаетесь" autocomplete="off"
                style="width:100%;text-align:center;font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:10px">
         <button class="btn" id="joinb" style="width:100%">Войти</button></div>
     </div>
     <div class="err" id="nerr" style="display:none"></div>
     <div class="hint">Связь идёт напрямую между браузерами через WebRTC, отдельный сервер не нужен. Хозяин должен держать вкладку открытой всю партию: у него считаются правила и боты.</div>`,
    `<button class="btn" data-close>Закрыть</button>`, true);

  const err = t => { const e = m.querySelector('#nerr'); e.style.display='block'; e.textContent = t; };
  const sv = Net.loadSave();
  if (sv){
    const box = m.querySelector('.mbody');
    const when = new Date(sv.when||Date.now());
    const rb = h(`<div class="resume">
        <b>Есть незаконченная партия</b>
        <span>комната ${esc(sv.room||'?')} · сохранена ${when.toLocaleString()}</span>
        <span class="hint" style="margin:0">Игроки вернутся по своим ключам. Пока Ваша вкладка закрыта, партия стоит.</span>
        <div class="rbtns">
          <button class="btn go" id="resume">Возобновить игру</button>
          <button class="mini" id="savefile">Сохранить в файл</button>
          <button class="mini no" id="dropsave">Удалить</button>
        </div></div>`);
    box.insertBefore(rb, box.firstChild);
    rb.querySelector('#resume').addEventListener('click', ()=>{
      const b = rb.querySelector('#resume'); b.disabled = true; b.textContent = T('Поднимаем…');
      Net.resumeGame(sv, ()=>UI.render(), t=>{ err(t); b.disabled=false; b.textContent=T('Возобновить игру'); });
    });
    rb.querySelector('#savefile').addEventListener('click', ()=>Net.exportSave(sv));
    rb.querySelector('#dropsave').addEventListener('click', ()=>{ Net.dropSave(); rb.remove(); });
  }
  /* Вылетел и перезагрузил страницу: комнату и ключ браузер помнит,
     поэтому вернуться должно быть одной кнопкой, а не по памяти кода. */
  const back = Net.lastRoom(), backKey = back && Net.myKeyFor(back);
  if (back && backKey){
    const box = m.querySelector('.mbody');
    const rb = h(`<div class="resume back">
        <b>Вернуться в игру</b>
        <span>комната ${esc(back)} · Ваш ключ ${esc(backKey)}</span>
        <span class="hint" style="margin:0">Пока Вас нет, Ваше место ведёт бот — со всем имуществом. Вернётесь на него же.</span>
        <div class="rbtns">
          <button class="btn go" id="rejoin">Вернуться в комнату ${esc(back)}</button>
          <button class="mini no" id="forget">Забыть</button>
        </div></div>`);
    box.insertBefore(rb, box.firstChild);
    rb.querySelector('#rejoin').addEventListener('click', ()=>{
      const b2 = rb.querySelector('#rejoin'); b2.disabled = true; b2.textContent = T('Возвращаемся…');
      Net.reconnect(()=>UI.lobbyModal(),
                    t=>{ err(t); b2.disabled=false; b2.textContent=T('Вернуться в комнату') + ' ' + back; },
                    back, backKey, m.querySelector('#nname').value.trim() || undefined);
    });
    rb.querySelector('#forget').addEventListener('click', ()=>{ Net.LS.del('konv-room'); rb.remove(); });
  }
  const nameOf = () => m.querySelector('#nname').value.trim() || 'Игрок';
  m.querySelector('#mkroom').addEventListener('click', ()=>{
    m.querySelector('#mkroom').disabled = true; m.querySelector('#mkroom').textContent = T('Создаём…');
    Net.createRoom(nameOf(), code=>{
      /* Зал сразу видит поднятую комнату и может постучаться одной кнопкой —
         код никому пересылать не нужно. */
      try { Hall.updateMe(nameOf(), Prof.face()); Hall.table(code, 0); } catch(_){ }
      UI.lobbyModal();
    }, t=>{ err(t); m.querySelector('#mkroom').disabled=false; m.querySelector('#mkroom').textContent=T('Создать'); });
  });
  m.querySelector('#joinb').addEventListener('click', ()=>{
    const code = m.querySelector('#jcode').value.trim().toUpperCase();
    if (code.length !== 4) return err(T('Код состоит из четырёх знаков.'));
    m.querySelector('#joinb').disabled = true; m.querySelector('#joinb').textContent = T('Подключаемся…');
    const key = (m.querySelector('#jkey').value || '').trim().toUpperCase();
    Net.joinRoom(code, nameOf(), ()=>UI.lobbyModal(), t=>{ err(t); m.querySelector('#joinb').disabled=false; m.querySelector('#joinb').textContent=T('Войти'); }, key);
  });
  UI.wireClose(m); UI.place(m);
};


/* =====================================================================
   ГЛАВНОЕ МЕНЮ
   Полный экран поверх поля: слева вход в игру, справа комната.
   Всё по-русски и в советском оформлении — украинская версия
   начинается за столом, когда партия уже создана.
   ===================================================================== */
UI.menuOn = false;

UI.hallName = function(){
  return (Net.savedName() || 'Игрок').slice(0,18);
};

UI.hallPeople = function(){
  const S2 = Hall.S;
  if (S2.err) return '<div class="hempty">Комната не отвечает. Играть это не мешает: ' +
    'боты и вход по коду работают как обычно.</div>';
  if (!S2.on) return '<div class="hempty">Не подключены.</div>';
  if (!S2.ready) return '<div class="hempty">Подключаемся к комнате…</div>';
  if (!S2.members.length) return '<div class="hempty">Пока никого. Вы тут первый.</div>';
  return S2.members.map(m => {
    const mine = (m.id === S2.me.id), busy = !!m.table;
    const letter = (m.name || '?').charAt(0).toUpperCase();
    /* Вторая строка под именем — как в аське, где под ником стоит статус.
       Туда уезжает всё, что иначе теснилось справа и обрезало имя. */
    const sub = [];
    if (m.host) sub.push('<i class="hhost">главный</i>');
    if (mine) sub.push('это вы');
    sub.push(busy ? (mine ? 'своя комната ' + esc(m.table.code) : 'за столом') : 'в меню');
    return '<div class="hrow' + (mine ? ' me' : '') + '">' +
      '<span class="hav">' + Faces.ava(m.face >= 0 ? m.face : -1, letter, 'sm') +
      '<i class="hdotst ' + (busy ? 'busy' : 'free') + '" title="' +
      (busy ? 'за столом' : 'в меню') + '"></i></span>' +
      '<span class="hname"><b>' + esc(m.name) + '</b>' +
      '<span class="hsub">' + sub.join(' · ') + '</span></span>' +
      (busy && !mine
        ? '<button class="btn tiny" data-hjoin="' + esc(m.table.code) + '">Подключиться</button>' : '') +
      '</div>';
  }).join('');
};

UI.hallLog = function(){
  const l = Hall.log();
  if (!l.length) return '<div class="hempty">Тут будет разговор. Историю не храним — ' +
    'только то, что говорят сейчас.</div>';
  return l.map(x => {
    if (x.k === 'sys') return '<div class="hmsg sys">' + esc(x.t) + '</div>';
    if (x.k === 'table'){
      const mine = Hall.S.me.table && Hall.S.me.table.code === x.code;   // свою комнату не зовём
      return '<div class="hmsg tbl">' + esc(x.t) +
        (mine ? '<span class="hst">это ваша комната</span>'
              : '<button class="btn tiny" data-hjoin="' + esc(x.code) + '">Подключиться</button>') + '</div>';
    }
    return '<div class="hmsg"><b>' + esc(x.from) + '</b> ' + esc(x.t) + '</div>';
  }).join('');
};

/* Комната открывается на «Чате»: иначе человек пишет, а собеседники
   с открытым списком людей его не видят. */
UI.hallTab = 'log';
UI.hallSeen = 0;

UI.hallTabs = function(){
  const S2 = Hall.S;
  const n = (S2.on && S2.ready && !S2.err) ? S2.members.length : 0;
  const unread = Hall.log().length - UI.hallSeen;
  return '<button class="htab' + (UI.hallTab === 'log' ? ' on' : '') + '" data-ht="log">Чат' +
    (UI.hallTab !== 'log' && unread > 0 ? '<i class="hnew"></i>' : '') + '</button>' +
    '<button class="htab' + (UI.hallTab === 'people' ? ' on' : '') + '" data-ht="people">Люди' +
    (n ? '<i class="hnum">' + n + '</i>' : '') + '</button>';
};

UI.hallHead = function(){
  const S2 = Hall.S;
  let st = '';
  if (!S2.on) st = '<span class="hstat">не подключены</span>';
  else if (S2.err) st = '<span class="hstat bad">недоступна</span>' +
    '<button class="mini" data-hm="retry">Ещё раз</button>';
  else if (!S2.ready) st = '<span class="hstat">подключаемся…</span>';
  /* Имя тут же, в шапке: без него все в списке зовутся «Игрок», а
     переписываться с четырьмя одинаковыми «Игроками» невозможно. */
  return '<h4>Комната</h4>' + st +
    '<button class="mini" data-hm="name" title="Сменить имя в комнате">' +
    esc(UI.hallName()) + '</button>' +
    '<button class="hico hsnd' + (Snd.on ? '' : ' off') + '" data-hm="snd" title="' +
    (Snd.on ? 'Звуки комнаты включены. Нажмите — замолчит'
            : 'Звуки комнаты выключены. Нажмите — заговорит') + '">♪</button>';
};

// перерисовываем только список и разговор, чтобы не сбивать набор текста
UI.hallRefresh = function(){
  if (!UI.menuOn) return;
  const box = document.getElementById('hPeople');
  if (!box) return;
  const keep = box.scrollTop;                  // список обновляется сам по себе —
  box.innerHTML = UI.hallPeople();             // не выдёргиваем его из-под пальца
  box.scrollTop = keep;
  const lg = document.getElementById('hLog');
  if (lg){ lg.innerHTML = UI.hallLog(); lg.scrollTop = 1e6; }
  if (UI.hallTab === 'log') UI.hallSeen = Hall.log().length;
  const tb = document.getElementById('hTabs');
  if (tb) tb.innerHTML = UI.hallTabs();
  const hh = document.querySelector('#menuRoot .hhead');
  if (hh) hh.innerHTML = UI.hallHead();
};

// звуки комнаты живут только в меню: сели за стол — молчим
Hall.sound(k => { if (UI.menuOn) Snd.play(k); });

UI.menuHide = function(){
  UI.menuOn = false;
  const r = document.getElementById('menuRoot');
  if (r){ r.classList.remove('on'); r.innerHTML = ''; }
};

/* Партия началась — выходим из зала совсем и убираем меню. */
UI.menuPlaying = function(note){
  UI.menuHide();
  if (note) try { Hall.announce(note); } catch(_){ }
  /* Уходим из зала не сразу: объявление уже отправлено, но соединение
     закрывать рано — иначе оно оборвётся раньше, чем сообщение уйдёт,
     и зал увидит только «такой-то вышел». */
  setTimeout(()=>{ try { Hall.playing(); } catch(_){ } }, note ? 400 : 0);
};

/* Левая колонка меню: сюда садятся и кнопки, и окна настройки партии.
   Комната справа при этом не пересобирается — иначе набранная реплика
   пропадала бы при каждом переходе. */
UI.mcol = function(){ return document.querySelector('#menuRoot .mcol'); };

UI.menuMain = function(){
  const col = UI.mcol();
  if (!col) return;
  const live = S && !S.over;
  const save = Net.loadSave();
  /* Вылетел, обновил вкладку — место за столом никуда не делось: комнату,
     ключ и номер места браузер помнит, и вернуться должно быть одной
     кнопкой, а не по памяти кода. */
  const back = Net.savedBack();
  col.innerHTML =
    (live ? '<button class="btn go" data-mm="resume">Продолжить партию — ход ' +
      (S.turn || 1) + '</button>' : '') +
    (back && !live ? '<button class="btn go" data-mm="back">Вернуться за стол ' + esc(back.room) +
      (back.seat != null ? ' — место ' + (back.seat + 1) : '') + '</button>' : '') +
    '<button class="btn' + (live || back ? '' : ' go') + '" data-mm="start">Начать игру</button>' +
    '<button class="btn" data-mm="join">Подключиться к игре</button>' +
    '<button class="btn" data-mm="profile">Профиль</button>' +
    '<button class="btn" data-mm="rules">Правила</button>' +
    (save && !save.mirror ? '<button class="btn" data-mm="rehost">Поднять прежнюю комнату ' +
      esc(save.room || '') + '</button>' : '') +
    (back && live ? '<button class="btn" data-mm="back">Вернуться за стол ' + esc(back.room) + '</button>' : '') +
    '<div class="mfootnote"><span>хозяин держит вкладку открытой — сервера нет</span>' +
    '<a href="https://malefictum.itch.io/" target="_blank" rel="noopener noreferrer">Malefictum</a></div>';
};

/* Окно садится в левую колонку, если открыто меню, и остаётся модалкой,
   если игра уже идёт и окно позвали из шапки. */
UI.place = function(m, opts){
  const col = UI.menuOn && UI.mcol();
  if (!col) return UI.open(m, opts);
  UI.close(true);
  col.innerHTML = '';
  const back = h('<button class="mback">‹ назад в меню</button>');
  back.addEventListener('click', ()=>UI.menuMain());
  col.appendChild(back);
  col.appendChild(m);
  m.querySelectorAll('[data-close]').forEach(b2 =>
    b2.addEventListener('click', e => { e.stopPropagation(); UI.menuMain(); }));
  const f = m.querySelector('input,select,button');
  if (f) f.focus();
};

UI.menu = function(){
  const r = document.getElementById('menuRoot');
  if (!r) return;
  /* Крышка коробки вместо пустого фона: игра начинается с того, что
     лежало на столе в 1990-м. Название набрано поверх красной полосы —
     она на картинке оставлена пустой намеренно. */
  const lidArt = (typeof LANG !== 'undefined' && LANG === 'ua' && ART['cover-ua']) ? ART['cover-ua'] : ART['cover-box'];
  const lid = lidArt ? '<div class="mlid' + (lidArt === ART['cover-ua'] ? ' ua' : '') + '"><img src="' + lidArt + '" alt="">' +
      '<div class="mlidt"><h1>КОНВЕР<span>СИЯ</span></h1>' +
      '<div class="msub">ремастер · инвестиционная игра</div></div></div>' : '';
  const body =
    (lid || '<div class="mtitle"><h1>КОНВЕР<span>СИЯ</span></h1>' +
    '<div class="msub">ремастер · инвестиционная игра</div></div>') +
    '<div class="mainwrap">' +
      '<div class="mcol"></div>' +
      '<div class="hallcol t-' + UI.hallTab + '">' +
        '<div class="hhead">' + UI.hallHead() + '</div>' +
        '<div class="htabs" id="hTabs">' + UI.hallTabs() + '</div>' +
        '<div class="hpeople" id="hPeople">' + UI.hallPeople() + '</div>' +
        '<div class="hlog" id="hLog">' + UI.hallLog() + '</div>' +
        '<div class="hsay"><input id="hSay" maxlength="200" placeholder="Сказать всем…" autocomplete="off">' +
        '<button class="btn" data-hm="send">Сказать</button></div>' +
      '</div>' +
    '</div>';
  r.innerHTML = '<div class="mscreen">' + body + '</div>';
  r.classList.add('on');
  UI.menuOn = true;
  UI.menuMain();

  r.onclick = function(ev){
    const hj = ev.target.closest('[data-hjoin]');
    if (hj) return UI.hallJoin(hj.dataset.hjoin);
    const ht = ev.target.closest('[data-ht]');
    if (ht){
      UI.hallTab = ht.dataset.ht;
      if (UI.hallTab === 'log') UI.hallSeen = Hall.log().length;
      const col = r.querySelector('.hallcol');
      if (col){
        col.classList.toggle('t-people', UI.hallTab === 'people');
        col.classList.toggle('t-log', UI.hallTab === 'log');
      }
      UI.hallRefresh();
      return;
    }
    const hm = ev.target.closest('[data-hm]');
    if (hm){
      const v = hm.dataset.hm;
      if (v === 'send') return UI.hallSend();
      if (v === 'snd'){ Snd.set(!Snd.on); if (Snd.on) Snd.play('msg'); return UI.hallRefresh(); }
      if (v === 'name') return UI.hallNameModal();
      if (v === 'retry'){ Hall.leave(); Hall.enter(UI.hallName(), Prof.face(), UI.hallRefresh); return UI.hallRefresh(); }
      return;
    }
    const b = ev.target.closest('[data-mm]');
    if (!b) return;
    const v = b.dataset.mm;
    if (v === 'resume'){ UI.menuHide(); UI.render(); Bots.schedule(); return; }
    if (v === 'start') return UI.setupModal();
    if (v === 'join') return UI.joinPanel();
    if (v === 'back') return UI.backPanel();
    if (v === 'profile') return UI.profilePanel();
    if (v === 'rules') return UI.rulesModal();
    if (v === 'rehost'){
      const sv = Net.loadSave();
      if (sv) Net.resumeGame(sv, ()=>{ UI.menuPlaying('Хозяин поднял прежнюю комнату ' +
        (sv.room || '') + '.'); UI.render(); }, t=>alert(t));
      return;
    }
  };

  const f = r.querySelector('#hSay');
  if (f) f.onkeydown = e => { if (e.key === 'Enter'){ UI.hallSend(); e.preventDefault(); } };

  Hall.enter(UI.hallName(), Prof.face(), UI.hallRefresh);
  UI.hallRefresh();
};

/* Имя одно на всё: в комнате, за сетевым столом и в сохранённой партии.
   Поэтому пишем его туда же, откуда его берёт сетевая игра. */
UI.hallNameModal = function(){
  const m = UI.shell('Как вас звать',
    '<label class="fld"><span>Имя в комнате и за столом</span>' +
    '<input type="text" id="hnm" maxlength="18" autocomplete="off" value="' +
    esc(UI.hallName()) + '"></label>' +
    '<div class="hint">Имя видят все, кто сейчас в комнате. ' +
    'Его же подставит сетевая игра, когда будете создавать комнату или входить по коду.</div>',
    '<button class="btn" data-close>Отмена</button>' +
    '<button class="btn go" id="hnmok">Сохранить</button>');
  const save = () => {
    const v = (m.querySelector('#hnm').value || '').trim().slice(0,18) || 'Игрок';
    Net.rememberName(v);
    try { Hall.updateMe(v, Prof.face()); } catch(_){ }
    UI.close(true);
    UI.hallRefresh();
  };
  m.querySelector('#hnmok').addEventListener('click', save);
  m.querySelector('#hnm').addEventListener('keydown', e => { if (e.key === 'Enter') save(); });
  UI.wireClose(m); UI.open(m);
};


/* =====================================================================
   ДОСТИЖЕНИЯ
   За каждое достижение даётся свой портрет — он не выпадает в лотерею
   никогда, только за дело. Шестнадцать самых трудных отмечены золотом:
   это одесские легенды, и берутся они поштучно.

   Строка: [ид, название, за что, портрет].
   ===================================================================== */
const ACH = [
  // --- партии и победы ---
  ['first',    'Первый цикл',        'доиграть партию до конверсии рубля',            172],
