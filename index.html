      if (p.loc !== 'ussr'){
        const cont = st.continents[p.loc], kind = CONTINENTS[p.loc].kind;
        const own = p.cargo.filter(c=>c.kind==='goods'&&c.origin==='s'&&c.state==='own').length;
        if (own > 0) return {type:'SELL', by:id, n:own};
        if (p.cargo.some(c=>c.state==='gov' && c.from !== p.loc)) return {type:'UNLOAD', by:id};
        const free = Rules.capacityFor(p, p.loc) - p.cargo.length;
        const buy = Math.min(free, cont.stock, Math.floor(p.usd / Math.max(1, Rules.usdPrice(st, kind))));
        if (buy > 0) return {type:'BUY', by:id, n:buy};
        return {type:'TRAVEL', by:id, dest:'ussr'};
      }
      if (p.cargo.length) return null;
      const seg = st.track[3] || 0;
      const endgame = st.course === 5 || (st.course === 4 && seg && st.pos >= seg - 2);
      if (!endgame) return null;
      /* Обналичиваемся ОДИН раз за курс. Без этого получались качели:
         распродался — средний уровень отстроился заново — распродался
         снова, и стол из одних «директоров» переставал двигать индикатор. */
      if (p.cashedAt === st.course) return null;
      const items = {};
      if (p.own.plant) items['plant:s'] = p.own.plant;
      ['machine','extractor','truck','fleet'].forEach(k=>{
        if (p.own[k].s) items[k+':s'] = p.own[k].s;
        if (p.own[k].i) items[k+':i'] = p.own[k].i;
      });
      if (p.raw) items['raw:s'] = p.raw;
      if (p.goods) items['goods:s'] = p.goods;
      if (p.own.computer) items['computer:i'] = p.own.computer;
      if (Object.keys(items).length){ p.cashedAt = st.course; return {type:'SELL', by:id, items}; }
      if (p.usd > 0 && Rules.canSellUsd(st, p)) return {type:'EXCHANGE', by:id, n:p.usd};
      if (p.debts > 0 && p.rub >= (p.debtDue||0)) return {type:'REPAY', by:id};
      return null;
    }
    const cap = () => Rules.truckCap(p) + Rules.fleetCap(p);
    const work = Rules.produceCost(st) * 3 + Rules.extractCost(st) * 3;
    const nine = Rules.hasDemand(st);

    /* ---------- за границей ---------- */
    if (p.loc !== 'ussr'){
      const cont = st.continents[p.loc], kind = CONTINENTS[p.loc].kind;
      const own = p.cargo.filter(c=>c.kind==='goods'&&c.origin==='s'&&c.state==='own').length;
      if (own > 0) return {type:'SELL', by:id, n:own};              // ради этого и ехали
      if (p.cargo.some(c=>c.state==='gov' && c.from !== p.loc)) return {type:'UNLOAD', by:id};

      const free = Rules.capacityFor(p, p.loc) - p.cargo.length;
      const price = Rules.usdPrice(st, kind);
      /* импорт дома идёт вдвое дороже отечественного — это главный рычаг */
      const canBuy = Math.min(free, cont.stock, Math.floor(p.usd / Math.max(1, price)));
      if (canBuy > 0) return {type:'BUY', by:id, n:canBuy};

      /* гривня тает, доллар нет: лишнее сверх дороги домой — в валюту,
         но только пока курс не разогнался и покупка ещё дёшева */
      if (nine && Rules.canBuyUsd(st, p) && st.course <= 3){
        const rate = Rules.usdBuyRate(st);
        const keep = Rules.travelFee(st, p, p.loc, p.cargo.length, true) + work;
        const n = Math.floor((p.rub - keep) / Math.max(1, rate));
        if (n >= 2) return {type:'BUYUSD', by:id, n};
      }
      /* обратный рейс не должен идти порожняком */
      const lot = Math.min(free, cont.stock, Rules.govLot(st));
      if (lot > 0 && Rules.hasOwnTransport(p)) return {type:'LOAD', by:id, n:lot};

      const fee = Rules.travelFee(st, p, p.loc, p.cargo.length, true);
      if (p.rub < fee && p.usd > 0 && p.loc === 'ussr') return {type:'EXCHANGE', by:id, n:p.usd};
      return {type:'TRAVEL', by:id, dest:'ussr'};
    }

    /* ---------- дома ---------- */
    /* Госгруз, взятый ЗДЕСЬ, здесь же сдать нельзя — его надо везти.
       Разгружаем только привезённое и свой импорт. */
    if (Rules.unloadable(p) > 0) return {type:'UNLOAD', by:id};
    const govHome = p.cargo.filter(c=>c.state==='gov' && c.from === 'ussr').length;
    if (govHome > 0){
      const dests = Object.keys(CONTINENTS).filter(k=>Rules.capacityFor(p,k) > 0);
      for (const k of dests)
        if (Rules.travelFee(st, p, k, p.cargo.length) <= p.rub) return {type:'TRAVEL', by:id, dest:k};
      return {type:'PASS', by:id};
    }
    Rules.autoAssign(p);

    /* привезённый импорт — в деньги, пока курс не съел его цену */
    const impOwn = {};
    for (const k of ['machine','extractor','truck','fleet']){
      const need = k==='machine' ? Rules.machineSlots(p) - (p.own.machine.s+p.own.machine.i)
                 : k==='extractor' ? Math.max(0, 4 - (p.own.extractor.s+p.own.extractor.i))
                 : (cap() < 6 ? 1 : 0);
      const keep = Math.max(0, Math.min(p.own[k].i, need));
      const sell = p.own[k].i - keep;
      if (sell > 0) impOwn[k + ':i'] = sell;
    }
    if (Object.keys(impOwn).length) return {type:'SELL', by:id, items:impOwn};
    if (Rules.compFree(p) > 0 && p.own.computer > 0 &&
        p.own.machine.s + p.own.machine.i + p.own.extractor.s + p.own.extractor.i === 0)
      return {type:'SELL', by:id, items:{'computer:i':Rules.compFree(p)}};

    /* Ссуда: рано она разгоняет стройку, поздно — грабёж. Возвращаем
       не раньше 3-го курса, иначе получаются качели «взял — вернул —
       взял», и каждый круг таких качелей стоит половину ссуды. */
    /* Ссуда стоит половину сверху, но со ста тысячами на старте в классике
       не развернуться вообще: ни завода (нужно 149 с запасом), ни полного
       рейса. Берём один раз на первом курсе и возвращаем с третьего —
       качели «взял-вернул-взял» съедали по 50 за круг. */
    if (p.debts === 0 && Rules.canLoan(st) && st.course === 1 &&
        p.rub < bp('plant') + work) return {type:'LOAN', by:id};
    if (p.debts > 0 && st.course >= 3 && p.rub >= (p.debtDue||0) + work * 2)
      return {type:'REPAY', by:id};

    /* Классика: перед ПОСЛЕДНЕЙ переменой курса имущество дешевеет
       вдесятеро, а наличные — нет. Распродаёмся в ноль и БОЛЬШЕ НИЧЕГО
       НЕ СТРОИМ: заново отстроенный завод к концу партии не окупится. */
    if (!nine && st.course >= 4){
      const seg = st.track[3] || 0;
      const endgame = st.course === 5 || (seg && st.pos >= seg - 2);
      if (endgame && !p.cargo.length){
        const items = {};
        if (p.own.plant) items['plant:s'] = p.own.plant;
        ['machine','extractor','truck','fleet'].forEach(k=>{
          if (p.own[k].s) items[k+':s'] = p.own[k].s;
          if (p.own[k].i) items[k+':i'] = p.own[k].i;
        });
        if (p.raw) items['raw:s'] = p.raw;
        if (p.goods) items['goods:s'] = p.goods;
        if (p.own.computer) items['computer:i'] = p.own.computer;
        if (Object.keys(items).length) return {type:'SELL', by:id, items};
        if (p.usd > 0 && Rules.canSellUsd(st, p)) return {type:'EXCHANGE', by:id, n:p.usd};
        if (p.debts > 0 && p.rub >= (p.debtDue||0)) return {type:'REPAY', by:id};
        return {type:'PASS', by:id};
      }
    }
    if (nine && st.course >= 4 && p.usd > 0 && p.goods === 0 && Rules.canSellUsd(st, p)) return {type:'EXCHANGE', by:id, n:p.usd};

    /* ---- стройка: завод → станки → оборудование, всегда с запасом на работу ---- */
    const mc = p.own.machine.s + p.own.machine.i;
    const ex = p.own.extractor.s + p.own.extractor.i;
    const slots = Rules.machineSlots(p);
    const hold = cap();
    /* В классике всё имущество к концу партии дешевеет вдесятеро, а
       наличные — нет: техника, купленная на третьем курсе, до конца не
       окупится. В 1993 наоборот — там имущество дорожает. */
    /* В классике вкладываться имеет смысл на первых курсах: техника,
       купленная на третьем, до конца партии не окупится. Но если у бота
       вообще нет производства, достраивать нужно всегда — иначе он
       замирает и стол перестаёт двигать индикатор. */
    const bare = (mc === 0 || ex === 0);
    const investOK = nine || st.course <= 2 || bare;
    const plantGate = nine ? bp('plant') + work
                           : bp('plant') + bp('machine')*2 + bp('extractor') + work;
    if (investOK && !p.own.plant && p.rub >= plantGate && st.market.plant > 0)
      return {type:'BUY', by:id, items:{'plant:s':1}};
    if (investOK && p.own.plant && mc === 0 && p.rub >= bp('machine') + work && st.market.machine > 0)
      return {type:'BUY', by:id, items:{'machine:s':1}};
    if (investOK && mc > 0 && ex === 0 && p.rub >= bp('extractor') + work && st.market.extractor > 0)
      return {type:'BUY', by:id, items:{'extractor:s':1}};

    /* Расширяться надо НА ИЗЛИШЕК и раньше работы: иначе бот вечно
       крутит «добыл — произвёл» на одном станке и никогда не растёт. */
    if (investOK && mc > 0 && mc < slots && p.rub >= bp('machine')*2 + work && st.market.machine > 0)
      return {type:'BUY', by:id, items:{'machine:s':1}};
    if (investOK && ex > 0 && ex < Math.min(6, mc + 1) && p.rub >= bp('extractor')*2 + work && st.market.extractor > 0)
      return {type:'BUY', by:id, items:{'extractor:s':1}};

    /* Трюм. В классике импортный рычаг сильнее всего НА ПЕРВЫХ курсах,
       пока цены высоки: партия товара за $4 превращается в импорт,
       который дома идёт вдвое дороже отечественного. Ждать полного
       завода нельзя — окно закроется. Поэтому там возим сразу, а товар
       для рейса при отсутствии завода просто покупаем на рынке. */
    const readyToShip = hold > 0;
    /* В классике трюм строим по чуть-чуть: скупив сразу четыре машины,
       остаёшься без денег на сам товар, и везти нечего. */
    const capTarget = nine ? 6 : (p.own.plant ? 4 : 2);
    if (investOK && hold < capTarget && (nine ? mc > 0 : true)){
      const fl = bp('fleet'), tk = bp('truck');
      if (p.rub >= fl + work && fl / 3 <= tk && st.market.fleet > 0)
        return {type:'BUY', by:id, items:{'fleet:s':1}};
      if (p.rub >= tk + work && st.market.truck > 0)
        return {type:'BUY', by:id, items:{'truck:s':1}};
    }

    /* ---- вывоз: ради него всё и строилось ---- */
    if (hold > 0 && readyToShip && p.goods >= Math.max(2, Math.min(hold, 4))){
      const order = Object.keys(CONTINENTS).filter(k=>Rules.capacityFor(p,k) > 0);
      if (nine) order.sort((a,b)=>Rules.goodsPrice(st,b) - Rules.goodsPrice(st,a));
      else order.sort((a,b)=>Rules.usdPrice(st,CONTINENTS[b].kind) - Rules.usdPrice(st,CONTINENTS[a].kind));
      for (const k of order){
        const kc = Rules.capacityFor(p, k);
        /* при спросе весь трюм в один рынок сдавать невыгодно: цена
           садится с каждой партией */
        const lot = nine ? Math.max(2, Math.min(kc, (st.continents[k].demand|0) + 2)) : kc;
        const take = Math.min(p.goods, lot, kc - p.cargo.length);
        if (take <= 0) continue;
        if (Rules.travelFee(st, p, k, p.cargo.length + take) > p.rub) continue;
        return {type:'TRAVEL', by:id, dest:k, take:take};
      }
    }
    /* Нет завода, но есть трюм — берём товар на рынке и везём. Покупать
       можно ТОЛЬКО сразу на полный рейс: товар на внутреннем рынке
       покупается дороже, чем продаётся, и партия, купленная «про запас»
       и сданная обратно, — чистый убыток. */
    const lot = Math.max(2, Math.min(hold, 4));
    if (!nine && !p.own.plant && hold > 0 && p.goods < lot){
      const gp = bp('goods'), want = lot - p.goods;
      if (p.rub - work >= want * gp) return {type:'BUY', by:id, items:{'goods:s':want}};
    }
    /* товар сдаём дома, только если вывезти его нечем */
    if (p.goods > 0 && hold === 0 && p.goods >= 3)
      return {type:'SELL', by:id, items:{'goods:s':p.goods}};

    /* ---- работа ---- */
    const runMake = () => {
      if (!p.own.plant) return null;
      const pl = Rules.planRun(p, 'machine', p.raw, Math.min(p.own.machine.s, slots),
                               Math.min(p.own.machine.i, Math.max(0, slots - p.own.machine.s)));
      return (pl.s + pl.i > 0 && (pl.s+pl.i) * Rules.produceCost(st) <= p.rub)
        ? {type:'PRODUCE', by:id, s:pl.s, i:pl.i} : null;
    };
    const need = Rules.outFor(p, 'machine', Math.min(p.own.machine.s, slots),
                              Math.min(p.own.machine.i, Math.max(0, slots - p.own.machine.s)));
    const make = runMake();
    if (make && p.raw >= need) return make;
    if (p.raw < Math.max(need, 2) || mc === 0){
      const dig = Rules.planRun(p, 'extractor', Infinity,
                                p.own.extractor.s + (p.rent.extractor||0), p.own.extractor.i);
      if (dig.s + dig.i > 0 && (dig.s+dig.i) * Rules.extractCost(st) <= p.rub)
        return {type:'EXTRACT', by:id, s:dig.s, i:dig.i};
    }
    if (make) return make;

    /* ---- нечего делать: везём чужое, это всегда в плюс ---- */
    if (hold > 0 && p.goods === 0 && p.cargo.length === 0 &&
        Object.keys(CONTINENTS).some(k=>Rules.capacityFor(p,k) > 0))
      return {type:'LOAD', by:id, n:Math.min(hold, Rules.govLot(st))};
    if (p.goods > 0 && hold === 0) return {type:'SELL', by:id, items:{'goods:s':p.goods}};
    if (p.raw > 0 && mc === 0) return {type:'SELL', by:id, items:{'raw:s':p.raw}};
    return null;                       // остальное доиграет средний уровень
  },


  normal(st, p){
    const id = p.id, rub = p.rub;
    const bp = k => Rules.price(st, k, 's', 'buy');

    /* ---- за границей ---- */
    if (p.loc !== 'ussr'){
      const cont = st.continents[p.loc], kind = CONTINENTS[p.loc].kind;
      const govSov = p.cargo.filter(c=>c.state==='gov' && c.origin==='s').length;
      const govImp = p.cargo.filter(c=>c.state==='gov' && c.origin==='i').length;
      const ownGoods = p.cargo.filter(c=>c.kind==='goods'&&c.state==='own').length;
      if (ownGoods > 0) return {type:'SELL', by:id, n:ownGoods};
      if (govSov > 0) return {type:'UNLOAD', by:id};        // сдать привезённый госгруз
      const free = Rules.capacityFor(p, p.loc) - p.cargo.length;
      const canBuy = Math.min(free, cont.stock, Math.floor(p.usd / Rules.usdPrice(st, kind)));
      if (canBuy > 0) return {type:'BUY', by:id, n:canBuy};
      if (govImp === 0 && free > 0 && cont.stock > 0 && Rules.hasOwnTransport(p))
        return {type:'LOAD', by:id, n:Math.min(free, cont.stock)};
      // домой; если не хватает на наём госстранспорта — сначала находим деньги
      const units = p.cargo.length;
      const fee = Rules.travelFee(st, p, p.loc, units);
      if (p.rub < fee){
        if (p.usd > 0 && Rules.canSellUsd(st, p)) return {type:'EXCHANGE', by:id, n:p.usd};   // обмен разрешён на любом расстоянии
        if (p.debts === 0) return {type:'LOAN', by:id};
        if (Rules.unloadable(p) > 0) return {type:'UNLOAD', by:id};   // уехать налегке
      }
      return {type:'TRAVEL', by:id, dest:'ussr'};
    }

    /* ---- дома: сначала разобраться с грузом ---- */
    const govImpHome = p.cargo.filter(c=>c.state==='gov' && c.origin==='i').length;
    const impCargo = p.cargo.filter(c=>c.state==='own'&&c.origin==='i').length;
    if (govImpHome > 0) return {type:'UNLOAD', by:id};      // сдать импортный госгруз на рынок
    if (p.rub < 5 && p.debts > 0 && p.usd > 0 && Rules.canSellUsd(st, p)) return {type:'EXCHANGE', by:id, n:p.usd};
    // компьютер ставится на конкретный станок или оборудование добычи
    Rules.autoAssign(p);
    // компьютер, которому не нашлось места, лежит мёртвым капиталом — продаём
    if (Rules.compFree(p) > 0 && p.cargo.length === 0)
      return {type:'SELL', by:id, items:{'computer:i':Rules.compFree(p)}};
    /* Импортный ТОВАР остаётся в грузе — он и продаётся из груза вдвое дороже. */
    if (impCargo > 0) return {type:'SELL', by:id, cargo:impCargo, items:{}};
    /* ГЛАВНЫЙ РЫЧАГ: привезённый импорт продаётся дома ВДВОЕ дороже
       отечественного. Один доллар, пропущенный через импорт, стоит на 1-м
       курсе классики 18.9 ₽, а сданный в банк — ровно 1 ₽. Поэтому импорт
       — это ТОВАР, а не имущество: оставляем себе ровно столько, сколько
       реально работает, остальное продаём.
       (Раньше здесь стояло «перевозчик оставляет весь транспорт» — и бот
       копил импортные суда вместо продажи, теряя почти весь капитал.) */
    {
      const holdWant = 6;                                  // больше трюма классике не окупить
      const need = {
        extractor: Math.max(2, Math.min(4, p.own.plant ? 4 : 2)),
        machine:   Rules.machineSlots(p),                  // сколько влезет в заводы
        truck:     Rules.truckCap(p) + Rules.fleetCap(p) < holdWant ? 99 : 0,
        fleet:     Rules.truckCap(p) + Rules.fleetCap(p) < holdWant ? 99 : 0
      };
      const sell = {}; let any = 0;
      for (const k of ['extractor','machine','truck','fleet']){
        const have = p.own[k].s + p.own[k].i;
        const extra = Math.min(p.own[k].i - Rules.compOn(p, k, 'i'),   // на чём стоит ПК — не трогаем
                               have - need[k]);
        if (extra > 0){ sell[k+':i'] = extra; any += extra; }
      }
      if (any > 0) return {type:'SELL', by:id, items:sell};
    }
    if (rub < 8 && p.debts === 0) return {type:'LOAN', by:id};

    /* ---- ДОБЫТЧИК ---- */
    if (p.role === 'miner'){
      const ex = p.own.extractor.s + p.own.extractor.i;
      if (ex === 0){
        const n = Math.min(2, Math.floor(rub / bp('extractor')), st.market.extractor);
        if (n > 0) return {type:'BUY', by:id, items:{'extractor:s':n}};
        return p.debts===0 ? {type:'LOAN', by:id} : {type:'PASS', by:id};
      }
      if (p.raw >= 6 || (p.raw > 0 && rub < ex)) return {type:'SELL', by:id, items:{'raw:s':p.raw}};
      if (ex < 10 && rub >= bp('extractor') * 3){
        if (st.market.imp.extractor > 0 && rub >= bp('extractor') * 6)
          return {type:'BUY', by:id, items:{'extractor:i':Math.min(2, st.market.imp.extractor)}};
        const n = Math.min(2, Math.floor(rub / bp('extractor')) - 1, st.market.extractor);
        if (n > 0) return {type:'BUY', by:id, items:{'extractor:s':n}};
      }
      if (rub >= ex){
        const plan = Rules.planRun(p, 'extractor', Infinity,
                                   p.own.extractor.s, p.own.extractor.i);
        if (plan.s + plan.i > 0) return {type:'EXTRACT', by:id, s:plan.s, i:plan.i};
      }
      return {type:'PASS', by:id};
    }

    /* ---- ПРОИЗВОДИТЕЛЬ ---- */
    if (p.role === 'producer'){
      if (p.own.plant === 0){
        if (rub >= bp('plant') && st.market.plant > 0) return {type:'BUY', by:id, items:{'plant:s':1}};
        return p.debts===0 ? {type:'LOAN', by:id} : {type:'PASS', by:id};
      }
      const mach = Rules.usableMachines(p);
      const slotsFree = Rules.machineSlots(p) - (p.own.machine.s + p.own.machine.i);
      if (mach === 0){
        const n = Math.min(2, Math.floor(rub / bp('machine')), st.market.machine);
        if (n > 0) return {type:'BUY', by:id, items:{'machine:s':n}};
        if (st.market.imp.machine > 0 && rub >= bp('machine')*2)
          return {type:'BUY', by:id, items:{'machine:i':1}};
        return p.debts===0 ? {type:'LOAN', by:id} : {type:'PASS', by:id};
      }
      if (slotsFree > 0 && rub >= bp('machine')*2 + bp('raw')*4 && st.market.imp.machine > 0)
        return {type:'BUY', by:id, items:{'machine:i':Math.min(slotsFree, st.market.imp.machine, 1)}};
      const need = Rules.outFor(p, 'machine', p.own.machine.s, p.own.machine.i);
      if (p.goods >= 5) return {type:'SELL', by:id, items:{'goods:s':p.goods}};
      // запускаем ровно столько станков, сколько прокормим сырьём, деньгами и жетонами товара
      {
        const budget = p.raw;
        const room = Rules.machineSlots(p);
        const plan = Rules.planRun(p, 'machine', budget,
                                   Math.min(p.own.machine.s, room),
                                   Math.min(p.own.machine.i, room));
        let useI = plan.i, useS = plan.s;
        if (useS + useI > room){ useI = Math.min(useI, room); useS = Math.max(0, room - useI); }
        const n = useS + useI;
        if (n > 0 && rub >= n * Rules.produceCost(st)) return {type:'PRODUCE', by:id, s:useS, i:useI};
      }
      const wantRaw = Math.max(0, need - p.raw);
      const buyRaw = Math.min(wantRaw, Math.floor((rub - mach*Rules.produceCost(st)) / bp('raw')));
      if (buyRaw > 0) return {type:'BUY', by:id, items:{'raw:s':buyRaw}};
      if (p.goods > 0) return {type:'SELL', by:id, items:{'goods:s':p.goods}};
      return {type:'PASS', by:id};
    }

    /* ---- ПЕРЕВОЗЧИК ---- */
    const cap = Rules.truckCap(p) + Rules.fleetCap(p);
    if (cap === 0){
      if (rub >= bp('truck') && st.market.truck > 0) return {type:'BUY', by:id, items:{'truck:s':1}};
      if (st.market.imp.truck > 0 && rub >= bp('truck')*2) return {type:'BUY', by:id, items:{'truck:i':1}};
      if (rub >= bp('fleet') && st.market.fleet > 0) return {type:'BUY', by:id, items:{'fleet:s':1}};
      if (st.market.imp.fleet > 0 && rub >= bp('fleet')*2) return {type:'BUY', by:id, items:{'fleet:i':1}};
      if (p.usd > 0 && Rules.canSellUsd(st, p)) return {type:'EXCHANGE', by:id, n:p.usd};
      if (p.own.computer) return {type:'SELL', by:id, items:{'computer:i':p.own.computer}};
      return p.debts===0 ? {type:'LOAN', by:id} : {type:'PASS', by:id};
    }
    if (p.cargo.length === 0 && p.goods === 0 && p.usd >= Rules.usdPrice(st,'computer')*1.5 && !p.own.computer &&
        st.market.imp.computer === 0 && rub < bp('goods')) return {type:'EXCHANGE', by:id, n:Math.floor(p.usd/2)};
    const freeCont = Object.keys(CONTINENTS).filter(k=>!st.players.some(q=>!q.out && q.loc===k));
    // за компьютерами в Америку — только морем; заводим флот, когда есть на что
    if (Rules.fleetCap(p) === 0 && st.market.fleet > 0 &&
        (p.usd >= Rules.usdPrice(st,'computer') || rub >= bp('fleet') * 3) && rub >= bp('fleet'))
      return {type:'BUY', by:id, items:{'fleet:s':1}};

    if (p.goods > 0 || p.cargo.length > 0){
      const rich = p.usd >= Rules.usdPrice(st,'computer');
      let order = rich ? ['america','europe','asia','africa','australia'] : ['europe','asia','africa','australia','america'];
      /* когда рынки живут своим спросом, везти надо туда, где за товар
         больше платят, а не в ближайший: перекормленный рынок даёт $2 */
      if (Rules.hasDemand(st) && p.goods > 0)
        order = order.slice().sort((a,b)=>Rules.goodsPrice(st,b) - Rules.goodsPrice(st,a));
      let reachable = false;
      for (const k of order){
        const kc = Rules.capacityFor(p, k);
        if (kc === 0) continue;                                  // своим транспортом туда не добраться
        const take = Math.max(0, Math.min(p.goods, kc - p.cargo.length));
        const units = p.cargo.length + take;
        if (Rules.travelFee(st, p, k, units) > rub) continue;     // не на что нанять госстранспорт
        reachable = true;
        return {type:'TRAVEL', by:id, dest:k, take:take};
      }
      // все доступные направления заняты — расширяем парк, чтобы открыть морские
      if (!reachable && Rules.fleetCap(p) === 0 && st.market.fleet > 0 && rub >= bp('fleet'))
        return {type:'BUY', by:id, items:{'fleet:s':1}};
    }
    const buyGoods = Math.min(cap, Math.floor(rub / bp('goods')));
    if (buyGoods > 0) return {type:'BUY', by:id, items:{'goods:s':buyGoods}};
    if (freeCont.length && Rules.hasOwnTransport(p))
      return {type:'LOAD', by:id, n:Math.min(cap, Rules.govLot(st))};
    return {type:'PASS', by:id};
  }
};
</script>
<script>
/* =====================================================================
   ИНТЕРФЕЙС. Вся графика — настоящие компоненты игры, вырезанные
   из сканов комплекта (объект ART в начале файла).
   ===================================================================== */
const $ = s => document.querySelector(s);
const h = (html) => { const t = document.createElement('template'); t.innerHTML = LOC(html).trim(); return t.content.firstElementChild; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* какой компонент чем нарисован */
const ART_OF = {
  extractor:{type:'card',  s:'card-extractor-s', i:'card-extractor-i'},
  truck:    {type:'card',  s:'card-truck-s',     i:'card-truck-i'},
  fleet:    {type:'card',  s:'card-fleet-s',     i:'card-fleet-i'},
  machine:  {type:'piece', s:'piece-machine-s',  i:'piece-machine-i'},
  computer: {type:'piece', s:'piece-computer',   i:'piece-computer'},
  plant:    {type:'piece', s:'piece-plant',      i:'piece-plant'},
  raw:      {type:'chip',  s:'chip-raw1',        i:'chip-raw1',   denom:[[10,'chip-raw10'],[5,'chip-raw5'],[1,'chip-raw1']]},
  goods:    {type:'chip',  s:'chip-goods1',      i:'chip-goods1', denom:[[10,'chip-goods10'],[5,'chip-goods5'],[1,'chip-goods1']]}
};
const art = (kind, origin) => ART[ART_OF[kind][origin === 'i' ? 'i' : 's']];
/* атрибут «рассмотреть компонент крупно» — обрабатывается одним делегированным кликом */
const insp = (kind, origin) => ' data-insp="' + kind + ':' + (origin === 'i' ? 'i' : 's') + '" title="Нажмите, чтобы рассмотреть и увидеть цены"';
const artType = kind => ART_OF[kind].type;

function chipStack(kind, n, maxChips){
  const out = []; let left = n;
  for (const [v, id] of ART_OF[kind].denom){
    while (left >= v && out.length < (maxChips||9)){ out.push(ART[id]); left -= v; }
  }
  return {imgs: out, rest: left};
}
function chipsHTML(kind, n, maxChips){
  if (!n) return '';
  const st = chipStack(kind, n, maxChips);
  return `<span class="chips">${st.imgs.map(s=>`<img src="${s}" alt="">`).join('')}${st.rest?`<span class="more">+${st.rest}</span>`:''}</span>`;
}

function slots(p){
  const out = [];
  if (p.own.plant)    out.push(['plant:s', p.own.plant]);
  for (const k of ['machine','extractor','truck','fleet']){
    if (p.own[k].s) out.push([k+':s', p.own[k].s]);
    if (p.own[k].i) out.push([k+':i', p.own[k].i]);
  }
  if (p.own.computer) out.push(['computer:i', p.own.computer]);
  if (p.raw)   out.push(['raw:s', p.raw]);
  if (p.goods) out.push(['goods:s', p.goods]);
  return out;
}
/* Подпись строки в модалках добычи/производства: базовая производительность
   и сколько единиц этого типа усилено компьютером. */
function subOut(p, kind, origin){
  const per = kind==='machine' ? Rules.perMachine(p,origin) : Rules.perExtractor(p,origin);
  const c = Rules.compOn(p, kind, origin);
  return per + ' партии за ход' + (c ? ' · с ПК ' + c + ' шт. по ' + (per+1) : '');
}
/* как зовётся бот выбранного уровня */
const BOT_TITLE = {easy:'бухгалтер', norm:'финдиректор', hard:'директор'};
const labelOf = key => { const [k,o] = key.split(':'); return KIND[k].ru + (o==='i' ? ' (имп.)' : ''); };
const artOfKey = key => { const [k,o] = key.split(':'); return art(k,o); };

/* положение пяти пазов на фотографии заводской подложки */
const PLANT_SLOTS = [[21,57],[37,50],[53,43],[69,36],[85,29]];

/* банковские чеки: номиналы из комплекта */
const RUB_DENOM = [[100,'rub-100'],[50,'rub-50'],[20,'rub-20'],[10,'rub-10'],[5,'rub-5'],[1,'rub-1']];
const USD_DENOM = [[20,'usd-20'],[10,'usd-10'],[5,'usd-5'],[1,'usd-1']];
function noteStack(denoms, n, max){
  const out = []; let left = n;
  for (const [v, id] of denoms){
    while (left >= v && out.length < (max||5)){ out.push(ART[id]); left -= v; }
    if (out.length >= (max||5)) break;
  }
  return out;
}
function notesHTML(denoms, n, max){
  return '<span class="mstack">' + noteStack(denoms, n, max).map(s=>`<img src="${s}" alt="">`).join('') + '</span>';
}
function biggestNote(denoms, n){
  for (const [v, id] of denoms) if (n >= v) return ART[id];
  return ART[denoms[denoms.length-1][1]];
}
function tweenNum(el, from, to, ms){
  if (from === to || !el){ if (el) el.textContent = to; return; }
  const t0 = performance.now();
  const step = now => {
    const k = Math.min(1, (now - t0) / (ms||420));
    el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1-k, 3)));
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

const UI = {
  modal: null, shownEventSeq: 0, overShown: false,
  timeLeft: 0, timerOn: false, timerSec: 0,
  snap: {}, snapLoc: {}, snapR: null, snapTrack: null, animAt: -1, anim: false,

  /* Меню закрывает поле так же, как модалка: пока человек в меню, боты
     за его спиной не ходят и таймер не тикает. */
  blocking(){ return !!this.modal || !!this.menuOn; },

  /* Копирование в буфер. navigator.clipboard есть не везде (нужен
     защищённый контекст) и молча отклоняет промис — поэтому сначала
     старый надёжный способ через скрытое поле, и только потом новый. */
  copyText(txt){
    let ok = false;
    try {
      const ta = document.createElement('textarea');
      ta.value = txt;
      ta.setAttribute('readonly','');
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none';
      document.body.appendChild(ta);
      ta.select(); ta.setSelectionRange(0, txt.length);
      ok = document.execCommand('copy');
      document.body.removeChild(ta);
    } catch(_){ ok = false; }
    if (!ok && navigator.clipboard && navigator.clipboard.writeText){
      try { navigator.clipboard.writeText(txt); ok = true; } catch(_){}
    }
    return ok;
  },

  open(node, opts){
    this.close(true);
    const scrim = h('<div class="scrim"></div>');
    scrim.appendChild(node);
    if (!(opts && opts.sticky)) scrim.addEventListener('mousedown', e => { if (e.target === scrim) UI.close(); });
    $('#modalRoot').appendChild(scrim);
    this.modal = scrim;
    const f = node.querySelector('input,select,button');
    if (f) f.focus();
  },
  close(silent){
    if (this.modal){ this.modal.remove(); this.modal = null; }
    if (!silent){ this.render(); Bots.schedule(); }
  },
  shell(title, bodyHTML, footHTML, wide){
    return h(`<div class="modal${wide?' wide':''}">
      <div class="mhead"><h3>${title}</h3><button class="x" data-close>×</button></div>
      <div class="mbody">${bodyHTML}</div>
      <div class="mfoot">${footHTML||''}</div></div>`);
  },
  wireClose(m){ m.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', ()=>this.close())); },

  /* ---------------- главный рендер ---------------- */
  render(){
    if (!S) return;
    const logo = $('#askLogo'), mal = $('#malLogo');
    const ua = typeof LANG !== 'undefined' && LANG === 'ua';
    /* Ремастер: логотип издателя 1990 года не используем — всегда своя подпись. */
    if (logo) logo.style.display = 'none';
    if (mal) mal.style.display = 'flex';
    /* Кнопка «Сеть» есть и в липкой шапке (телефон), и под журналом
       (десктоп) — подписываем обе. */
    const lost = (typeof Net !== 'undefined') && Net.active() && Net.lost;
    const netTxt = lost ? T('Связь потеряна — вернуться')
                 : (typeof Net !== 'undefined' && Net.active()) ? (T('Комната') + ' ' + Net.room)
                 : T('Сеть');
    document.querySelectorAll('.actNet').forEach(nb=>{
      nb.textContent = netTxt;
      nb.classList.toggle('alarm', !!lost);
    });
    this.anim = (S.log.length !== this.animAt);
    this.animAt = S.log.length;
    this.top(); this.map(); this.market(); this.board(); this.roster(); this.trade(); this.logView();
    const ms = (typeof Net !== 'undefined' && Net.active()) ? Net.seat : null;
    if (S.lastEvent && S.lastEvent.seq !== this.shownEventSeq){
      this.shownEventSeq = S.lastEvent.seq;
      const who = Rules.P(S, S.lastEvent.by);
      if (!who.bot && (ms == null || S.lastEvent.by === ms)) this.eventModal(S.lastEvent);
    } else if (S.over && !this.overShown){
      this.overShown = true;
      try { Prof.finish(); } catch(_){ }     // счёт растёт ровно раз за партию
      this.overModal();
    }
    try { Prof.watch(); } catch(_){ }        // максимумы для достижений
    this.tick(true);
  },

  /* ---------------- липкая полоса на телефоне ----------------
     На узком экране видна одна вкладка, поэтому самое нужное — чей ход
     и сколько у меня денег — всегда висит под шапкой. */
  mstat(){
    const el = $('#mstat'); if (!el) return;
    const mySeat = (typeof Net !== 'undefined' && Net.active()) ? Net.seat : null;
    const me = Rules.P(S, mySeat != null ? mySeat : S.cur);
    const cur = Rules.P(S, S.cur);
    const mine = (mySeat == null) || (S.cur === mySeat);
    const cash = Rules.hasDemand(S) ? '₴' : '₽';
    el.className = 'mstat' + (mine && !S.over ? ' turn' : '');
    el.innerHTML = LOC(S.over
      ? '<b>Игра окончена</b>'
      : '<b>' + (mine ? 'Ваш ход' : 'Ходит ' + esc(cur.name)) + '</b>'
        + '<span class="sep">·</span><span class="me">' + me.rub + ' ' + cash + '</span>'
        + '<span class="sep">·</span><span class="me">$' + me.usd + '</span>'
        + '<span class="sep">·</span>сырьё ' + me.raw
        + '<span class="sep">·</span>товар ' + me.goods
        + (me.cargo.length ? '<span class="sep">·</span>груз ' + me.cargo.length : '')
        + (me.loc !== 'ussr' ? '<span class="sep">·</span>' + CONTINENTS[me.loc].ru : ''));
    /* точка на вкладке «Мой стол», когда ход дошёл до игрока */
    const tb = document.querySelector('#tabbar button[data-t="table"]');
    if (tb) tb.classList.toggle('alert', mine && !S.over && document.body.dataset.tab !== 'table');
  },

  /* ---------------- трек ввоза-вывоза ---------------- */
  top(){
    this.mstat();
    $('#courseNum').textContent = S.course;
    $('#courseRate').textContent = Rules.rateTxt(S);
    $('#trackNum').textContent = S.course >= 5 ? T('финиш') : (S.pos + ' / ' + S.track[S.course-1]);
    const tr = $('#track'); tr.innerHTML = '';
    for (let k = 0; k < 4; k++){
      const len = S.track[k], done = S.course > k+1, here = S.course === k+1;
      const row = h(`<div class="trow k${k+1} ${done?'done':''}">
        <span class="tl">курс ${k+1}</span><span class="cells"></span>
        <span class="tn">${done ? len+'/'+len : here ? S.pos+'/'+len : '—/'+len}</span></div>`);
      const cells = row.querySelector('.cells');
      const step = Math.max(1, Math.ceil(len / 60));
      const was = this.snapTrack;
      const grew = this.anim && was && (was.course < S.course || (was.course === S.course && was.pos < S.pos));
      for (let i = 0; i < len; i += step){
        const filled = done || (here && i < S.pos);
        const now = here && S.pos > 0 && i < S.pos && i + step >= S.pos;
        const fresh = grew && filled && (was.course < k+1 || (was.course === k+1 && i >= was.pos));
        cells.appendChild(h(`<span class="cell ${filled?'on':''} ${now?'now':''} ${fresh?'is-new':''}"></span>`));
      }
      tr.appendChild(row);
    }
    tr.appendChild(h(`<div class="trow"><span class="tl">финиш</span>
      <span class="cells" style="flex:none"><span class="finish ${S.course>=5?'lit':''}"></span></span>
      <span style="font-size:11px;color:var(--ink3);margin-left:6px">${E(S).inflating ? 'гривна дешевле доллара вдесятеро — конец игры' : 'рубль равен доллару — конец игры'}</span></div>`));
    if (this.anim) this.snapTrack = {course:S.course, pos:S.pos};
  },

  /* ---------------- поле ---------------- */
  map(){
    const box = $('#mapList'); box.innerHTML = '';
    const world = h(`<div class="world" style="--paper:url(${ART['tex-card']||''})"></div>`);
    /* Картина настоящего поля: побережье, шоссе, море. Над ней — маршруты
       и плашки континентов. Сама картина ничего не значит механически,
       но без неё поле читалось как таблица, а не как игра. */
    if (ART['board-map'])
      world.appendChild(h(`<div class="mapart"><img src="${ART['board-map']}" alt=""><span class="routes"></span></div>`));
    const plates = h('<div class="plates"></div>');
    for (const k in CONTINENTS){
      const c = CONTINENTS[k], st = S.continents[k];
      const here = S.players.filter(p=>!p.out && p.loc===k);
      const t = artType(c.kind);
      /* Фон плашки — рисованная карта континента с листа 02; миниатюра
         товара осталась, но стала мелкой меткой в углу: что здесь берут. */
      const bg = ART['cont-' + k] ? ' style="background-image:url(' + ART['cont-' + k] + ')"' : '';
      const pl = h(`<div class="plate ${here.length?'busy':''}"${insp(c.kind,'i')}${bg}>
        <span class="pn">${c.ru}</span>
        <span class="pg">${KIND[c.kind].short} · $${Rules.usdPrice(S, c.kind)}</span>
        <span class="pg">запас ${st.stock} · ${CONTINENTS[k].byTruck ? (CONTINENTS[k].byFleet ? 'авто, флот' : 'авто') : 'флот'}</span>
        ${Rules.hasDemand(S) ? '<span class="dem"><i class="db"><i style="width:' + (10*Rules.demandOf(S,k)) + '%"></i></i>спрос ' + Rules.demandOf(S,k) + ' · <b>$' + Rules.goodsPrice(S,k) + '</b></span>' : ''}
        ${ART['g-'+c.kind] ? '<span class="goods" title="' + KIND[c.kind].ru + '"><img src="' + ART['g-'+c.kind] + '" alt=""></span>'
                           : '<img class="thumb ' + (t==='card'?'card':'') + '" src="' + art(c.kind,'i') + '" alt="">'}
        <span class="cones"></span></div>`);
      here.forEach(p => pl.querySelector('.cones').appendChild(
        h(`<span class="cone sm ${this.anim && this.snapLoc[p.id] !== p.loc ? 'is-new':''}" style="background:${p.color}" title="${esc(p.name)}"></span>`)));
      plates.appendChild(pl);
    }
    /* Шестая клетка сетки пустовала. Ставим туда цену поездки: сколько
       стоит нанять государственный транспорт сейчас, при этом курсе. */
    const fr = Rules.freight(S);
    const od = Rules.crashOdds(S), opc = od.p * 100;
    const oTxt = (opc < 10 ? opc.toFixed(1).replace('.', ',') : String(Math.round(opc))) + ' %';
    const oLvl = opc >= 50 ? ' hot' : opc >= 20 ? ' warm' : opc >= 8 ? ' mid' : '';
    const trip = h(`<div class="plate trip${oLvl}" title="Как устроена поездка">
      <span class="pn">Поездка</span>
      <span class="pg">свой везёт даром</span>
      <span class="pg">гос. наём · <b>${fr}</b> тыс. ₽ / партия</span>
      <span class="rk">катастрофа <b>${oTxt}</b></span>
      <span class="rkbar"><i style="width:${Math.min(100, Math.max(2, opc)).toFixed(1)}%"></i></span>
      <span class="more">как это устроено →</span></div>`);
    trip.addEventListener('click', ()=>this.travelInfoModal());
    plates.appendChild(trip);
    world.appendChild(plates);
    const inUssr = S.players.filter(p=>!p.out && p.loc==='ussr');
    const u = h(`<div class="ussr"><span class="un">СССР</span>
      <span style="color:#C9A28E;font-family:var(--mono);font-size:10px">внутренний рынок</span>
      <span class="cones"></span></div>`);
    inUssr.forEach(p => u.querySelector('.cones').appendChild(
      h(`<span class="cone ${this.anim && this.snapLoc[p.id] !== p.loc ? 'is-new':''}" style="background:${p.color}" title="${esc(p.name)}"></span>`)));
    world.appendChild(u);
    if (this.anim) S.players.forEach(p => this.snapLoc[p.id] = p.loc);
    box.appendChild(world);
    box.appendChild(h(`<div class="mnote">Автотранспорт идёт по суше — в Европу, Азию и Африку. Флот плавает в Африку, Австралию и Америку. Континенты открыты всем — там можно встретиться.${Rules.hasDemand(S) ? ' Спрос подрастает сам и падает от продаж: каждая партия уходит по своей цене, поэтому выгоднее развозить товар по разным континентам.' : ''}</div>`));
  },

  /* ---------------- внутренний рынок ---------------- */
  market(){
    const m = $('#mktList'); m.innerHTML = '';
    m.appendChild(h(`<div class="mhead"><span></span><span>Позиция</span>
      <span class="r">Цена, тыс.&nbsp;₽</span><span class="r">Остаток, шт</span></div>`));
    const rows = [['plant','Завод'],['machine','Станки'],['extractor','Оборудование'],
                  ['truck','Автотранспорт'],['fleet','Флот'],['computer','Компьютер'],
                  ['raw','Сырьё'],['goods','Товар']];
    for (const [k,l] of rows){
      const isComp = k === 'computer';
      /* Жетоны сырья и товара не ограничены — в правилах считаны только
         «Карты собственности», а жетоны идут номиналами 1, 5 и 10 штук. */
      const sov = (isComp || S.market[k] == null) ? null : S.market[k];
      const imp = (k==='raw'||k==='goods'||k==='plant') ? null : (S.market.imp[k]||0);
      const price = isComp ? Rules.price(S,k,'i','buy') : Rules.price(S,k,'s','buy');
      m.appendChild(h(`<div class="mrow"${insp(k, isComp?'i':'s')}>
        <span class="th">${UI.artBox(k, isComp?'i':'s')}</span>
        <span class="mn"><b>${l}</b></span>
        <span class="mp"><b>${price}</b>${isComp?'<small>только импорт</small>':''}</span>
        <span class="ms">${sov!==null?sov:'—'}${imp!==null?' / <i>'+imp+'</i>':''}</span></div>`));
    }
    m.appendChild(h(`<div class="mnote">Цена — сколько платит игрок по курсу ${S.course}; импортное вдвое дороже. Остаток: советское / <i style="color:var(--gold);font-style:normal">импортное</i>. Сырьё и товар банк выдаёт без ограничений — считаны только карты собственности. Перевозка госгруза: ${Rules.freight(S)} тыс. руб. за партию. Нажмите на строку — увидите цены по всем курсам.</div>`));
  },

  /* ---------------- стол игрока ---------------- */
  board(){
    const box = $('#boardPanel'); box.innerHTML = '';
    if (S.over){
      box.appendChild(h('<div class="pbar"><span class="nme">Игра окончена</span></div>'));
      const res = h('<div style="padding:14px"><button class="btn go" id="showRes">Итоги партии</button></div>');
      res.querySelector('#showRes').addEventListener('click', ()=>this.overModal());
      box.appendChild(res);
      return;
    }
    /* в сетевой игре всегда показываем СВОЙ стол, а не стол того, чей сейчас ход */
    const mySeat = (typeof Net !== 'undefined' && Net.active()) ? Net.seat : null;
    const p = Rules.P(S, mySeat != null ? mySeat : S.cur);
    const acting = (mySeat == null) ? true : (S.cur === mySeat);
    const cur = Rules.P(S, S.cur);
    const abroad = p.loc !== 'ussr';
    const locTxt = abroad ? CONTINENTS[p.loc].ru : 'СССР';

    if (mySeat != null){
      box.appendChild(h(`<div class="turnbar${acting?' mine':''}">
        ${acting ? 'Ваш ход' : 'Ходит: ' + esc(cur.name)}
        <span style="margin-left:auto;font-family:var(--mono);font-size:11px;letter-spacing:0;text-transform:none;color:var(--ink3)">круг ${S.turn}</span></div>`));
    }

    const prev = this.snap[p.id];
    const anim = this.anim && !!prev;

    box.appendChild(h('<div class="phead c-table"><h2>Стол игрока</h2></div>'));
    const bar = h(`<div class="pbar">
      <span class="cone" style="background:${p.color}"></span>
      <span class="nme">${esc(p.name)}</span>
      ${p.bot ? '<span class="tag bot">бот</span>' : ''}
      <span class="tag">${locTxt}</span>
      ${S.extraAction ? '<span class="tag" style="border-color:var(--gold);color:var(--gold)">доп. действие</span>' : ''}
      ${(UI.timerOn && !p.bot) ? '<span class="tag" id="timerTag" style="border-color:var(--gold);color:var(--gold)">' + UI.timerSec + ' с</span>' : ''}
      ${p.debts ? '<img class="credit" src="' + ART['credit'] + '" alt="Кредитное обязательство" data-insp="credit:s" title="Долг банку ' + (p.debtDue||0) + ' тыс. руб. Нажмите, чтобы рассмотреть">' : ''}
      <span class="money">
        <span class="mgroup" id="gRub" data-insp="money:rub" title="Нажмите, чтобы рассмотреть банковские чеки">${notesHTML(RUB_DENOM, p.rub)}
          <span><b class="rub num" id="nRub">${p.rub}</b> <small>тыс. руб.</small></span></span>
        <span class="mgroup" id="gUsd" data-insp="money:usd" title="Нажмите, чтобы рассмотреть банковские чеки">${p.usd?notesHTML(USD_DENOM, p.usd):''}
          <span><b class="usd num" id="nUsd">${p.usd}</b> <small>тыс. $</small></span></span>
      </span></div>`);
    box.appendChild(bar);
    if (anim){
      const fx = (gid, nid, from, to, denoms) => {
        if (from === to) return;
        tweenNum(bar.querySelector(nid), from, to);
        const g = bar.querySelector(gid), d = to - from;
        g.appendChild(h(`<span class="delta ${d>0?'up':'down'}">${d>0?'+':'−'}${Math.abs(d)}</span>`));
        if (d > 0) g.appendChild(h(`<img class="flynote" src="${biggestNote(denoms, Math.abs(d))}" alt="">`));
        setTimeout(()=>g.querySelectorAll('.delta,.flynote').forEach(x=>x.remove()), 1300);
      };
      fx('#gRub', '#nRub', prev.rub, p.rub, RUB_DENOM);
      fx('#gUsd', '#nUsd', prev.usd, p.usd, USD_DENOM);
    }

    const table = h('<div class="table' + (anim && prev.cur !== S.cur ? ' turn-in' : '') + '"' +
      (ART['tex-tray'] ? ' style="--tray:url(' + ART['tex-tray'] + ')"' : '') + '></div>');

    /* ---------------- производство: завод со станками, ПК прямо на станках ------------- */
    const mSov = p.own.machine.s, mImp = p.own.machine.i, mRent = p.rent.machine;
    if (p.own.plant || mSov + mImp){
      const capacity = Rules.machineSlots(p);
      /* сколько станков каждого происхождения оснащено компьютером. Который
         именно — правила не различают, поэтому метим первые в раскладке. */
      const pcM = {i:Rules.compOn(p,'machine','i'), s:Rules.compOn(p,'machine','s')};
      const pcN = pcM.i + pcM.s;
      const z = h(`<div class="zone"><h4>Производство
        <em>${p.own.plant} завод${p.own.plant===1?'':'а'} · станков ${mSov+mImp}${mRent?' + '+mRent+' в аренде':''} из ${capacity}${pcN?' · ПК на '+pcN:''} · выпуск ${Rules.outFor(p,'machine',mSov,mImp)} за ход</em></h4>
        <div class="zrow" id="plants"></div></div>`);
      const host = z.querySelector('#plants');
      const list = [];
      for (let i=0;i<mImp;i++) list.push('i');
      for (let i=0;i<mSov;i++) list.push('s');
      const nPlants = Math.max(p.own.plant, 1);
      const pcUsed = {i:0, s:0};
      for (let pi = 0; pi < nPlants; pi++){
        const pl = h(`<div class="plant"${insp('plant','s')}><img class="base" src="${ART['piece-plant']}" alt="Завод"></div>`);
        if (!p.own.plant) pl.style.opacity = '.3';
        for (let s = 0; s < MACHINES_PER_PLANT; s++){
          const idx = pi * MACHINES_PER_PLANT + s;
          const kindOrigin = list[idx];
          const xy = PLANT_SLOTS[s];
          const fresh = anim && kindOrigin && idx >= (prev.mach || 0);
          pl.appendChild(h(`<img${kindOrigin?insp('machine',kindOrigin):''} class="slot ${kindOrigin?'':'ghost'} ${fresh?'is-new':''}" style="left:${xy[0]}%;top:${xy[1]}%;animation-delay:${fresh?(idx-(prev.mach||0))*70:0}ms" src="${art('machine', kindOrigin === 'i' ? 'i' : 's')}" alt="">`));
          /* компьютер стоит на переднем краю плиты перед своим станком: там пусто,
             и видно, какой именно станок оснащён, ничего не перекрывая */
          if (kindOrigin && pcUsed[kindOrigin] < pcM[kindOrigin]){
            pcUsed[kindOrigin]++;
            pl.appendChild(h(`<img class="slot pc"${insp('computer','i')} style="left:${xy[0]-6}%;top:${xy[1]+10}%" src="${ART['piece-computer']}" alt="Компьютер">`));
          }
        }
        host.appendChild(pl);
      }
      table.appendChild(z);
    }

    /* ---------------- добыча: оборудование поштучно, ПК сверху ------------------------- */
    const exS = p.own.extractor.s, exI = p.own.extractor.i;
    if (exS + exI){
      const pcE = {i:Rules.compOn(p,'extractor','i'), s:Rules.compOn(p,'extractor','s')};
      const pcN = pcE.i + pcE.s;
      const z = h(`<div class="zone"><h4>Добыча
        <em>оборудования ${exS+exI}${pcN?' · ПК на '+pcN:''} · добыча ${Rules.outFor(p,'extractor',exS,exI)} партий за ход</em></h4>
        <div class="zrow unit" id="ex"></div></div>`);
      const host = z.querySelector('#ex');
      const wasEx = prev && prev.cards ? ((prev.cards['extractor:s']||0) + (prev.cards['extractor:i']||0)) : 0;
      let seen = 0;
      const one = (o, n, pc) => {
        for (let i=0;i<n;i++){
          seen++;
          const el = h(`<div class="unit1 ${anim && seen > wasEx ? 'is-new' : ''}"${insp('extractor',o)}>
            ${UI.cardSVG('extractor', o, {cls:'ucard'})}
            <div class="un">${KIND.extractor.short}${o==='i'?' имп.':''} · ${o==='i'?2:1}${i<pc?' + 1':''}</div></div>`);
          if (i < pc) el.appendChild(h(`<span class="upc" title="Компьютер: +1 партия"><img src="${ART['piece-computer']}" alt="Компьютер"></span>`));
          host.appendChild(el);
        }
      };
      one('i', exI, pcE.i); one('s', exS, pcE.s);
      table.appendChild(z);
    }

    /* ---------------- компьютеры: только те, что ещё не стоят на месте --------------- */
    if (p.own.computer){
      const nc = p.own.computer, cUsed = Rules.compUsed(p), free = nc - cUsed;
      const z = h(`<div class="zone"><h4>Компьютеры
        <em>установлено ${cUsed} из ${nc}</em></h4><div class="zrow unit" id="pcs"></div></div>`);
      const host = z.querySelector('#pcs');
      for (let i=0;i<Math.min(free,6);i++)
        host.appendChild(h(`<div class="unit1 pcfree"${insp('computer','i')}>
          <img class="ucard" src="${ART['piece-computer']}" alt="Компьютер">
          <div class="un">без места</div></div>`));
      if (free > 6) host.appendChild(h(`<div class="umore">+${free-6}</div>`));
      host.appendChild(h(`<div class="pchint">${free
        ? 'Каждый компьютер добавляет <b>+1 партию</b> одному станку, одной единице оборудования или одной машине. Свободных: <b>' + free + '</b>.'
        : 'Все компьютеры стоят на местах. Переставить — отдельный ход.'}
        <button class="cbtn" id="compBtn">Установка</button></div>`));
      host.querySelector('#compBtn').addEventListener('click', e=>{ e.stopPropagation(); this.assignModal(p); });
      table.appendChild(z);
    }

    /* ---------------- транспорт: каждая машина отдельной картой, груз лежит на ней ----
       Раньше транспорт лежал общей стопкой, а груз — отдельной строкой, и понять,
       что уехало, а что осталось дома, было нельзя. Теперь парк разложен как на
       столе: слева уехавшие, справа оставшиеся, жетоны груза — прямо на карточках. */
    /* Компьютер стоит на конкретной машине и уезжает вместе с ней, поэтому
       сначала им оснащаются уехавшие, а что осталось — те, что дома. */
    const pcAll = this.pcPool(p);
    const vehOf = (set, pool) => this.vehList(p, set, pool);
    const awaySet = (abroad && p.away) ? p.away : null;
    const homeSet = {
      truck:{s:p.own.truck.s - (awaySet?awaySet.truck.s:0), i:p.own.truck.i - (awaySet?awaySet.truck.i:0)},
      fleet:{s:p.own.fleet.s - (awaySet?awaySet.fleet.s:0), i:p.own.fleet.i - (awaySet?awaySet.fleet.i:0)}};
    /* Компьютеры уехавших известны точно; дома остаются оставшиеся. */
    const goPool = (awaySet && awaySet.comp)
      ? {truck:{s:awaySet.comp.truck.s|0, i:awaySet.comp.truck.i|0},
         fleet:{s:awaySet.comp.fleet.s|0, i:awaySet.comp.fleet.i|0}}
      : {truck:{s:pcAll.truck.s, i:pcAll.truck.i}, fleet:{s:pcAll.fleet.s, i:pcAll.fleet.i}};
    const homePool = {truck:{s:pcAll.truck.s - goPool.truck.s, i:pcAll.truck.i - goPool.truck.i},
                      fleet:{s:pcAll.fleet.s - goPool.fleet.s, i:pcAll.fleet.i - goPool.fleet.i}};
    const goVeh   = vehOf(awaySet || p.own, goPool);
    const stayVeh = awaySet ? vehOf(homeSet, homePool) : [];
    if (goVeh.length || stayVeh.length || p.cargo.length){
      const cap = abroad ? Rules.capacityFor(p, p.loc) : Rules.truckCap(p)+Rules.fleetCap(p);
      const hired = Math.max(0, p.cargo.length - cap);
      const capTxt = !p.cargo.length ? 'мест ' + cap + ', трюм пуст'
        : hired ? 'в своих машинах ' + cap + ', государственным ещё ' + hired
                : 'в трюме ' + p.cargo.length + ' из ' + cap + ' мест';
      const z = h(`<div class="zone"><h4>Транспорт <em>${capTxt}</em></h4>
        <div id="veh"></div></div>`);
      const host = z.querySelector('#veh');
      /* груз раскладывается по тем машинам, что везут: в рейсе — по уехавшим,
         дома — по всему парку. Что не влезло, едет государственным. */
      let rest = p.cargo.slice();
      const group = (title, note, list, carry, idle, cls) => {
        if (!list.length) return;
        const g = h(`<div class="fgrp ${cls||''}"><div class="fgt"><b>${title}</b>${note?'<em>'+note+'</em>':''}</div>
          <div class="zrow vehrow"></div></div>`);
        const row = g.querySelector('.vehrow');
        if (carry){
          const sp = this.spread(list, rest); rest = sp.rest;
          sp.rows.forEach(r=> row.appendChild(this.vehCard(r.v, r.tokens, idle)));
        } else list.forEach(v=> row.appendChild(this.vehCard(v, null, idle)));
        host.appendChild(g);
      };
      if (awaySet){
        group('В рейсе · ' + CONTINENTS[p.loc].ru, 'везёт груз и рискует в катастрофе', goVeh, true, false, 'away');
        group('Дома · внутренний рынок', 'стоит и ничем не рискует', stayVeh, false, true, 'home');
      } else {
        group(abroad ? ('С Вами · ' + CONTINENTS[p.loc].ru) : 'На внутреннем рынке',
              abroad ? '' : 'загруженное поедет с Вами', goVeh, true, false, 'away');
      }
      /* остаток — на государственном транспорте */
      if (rest.length){
        const g = h(`<div class="fgrp gov"><div class="fgt"><b>На государственном транспорте</b><em>наём оплачен при поездке</em></div>
          <div class="cargo"></div></div>`);
        const row = g.querySelector('.cargo');
        rest.forEach(c=>{
          const t = artType(c.kind);
          row.appendChild(h(`<div class="cgo ${t==='chip'?'chip':''} ${c.state==='gov'?'stateflag':''}"${insp(c.kind,c.origin)}>
            ${UI.artBox(c.kind, c.origin)}
            ${c.state==='gov'?'<span class="gov">гос</span>':''}</div>`));
        });
        host.appendChild(g);
      }
      table.appendChild(z);
    }

    /* ---------------- склад ------------------------------------------------------ */
    if (p.raw || p.goods){
      const z = h(`<div class="zone store"><h4>Склад</h4><div class="zrow" style="gap:28px" id="ss"></div></div>`);
      const host = z.querySelector('#ss');
      const set = (kind, n, was, title) => {
        const el = h(`<div class="chipset"${insp(kind,'s')}><span class="cl">${title}</span>${chipsHTML(kind,n)}<span class="cv">${n} партий</span></div>`);
        if (anim && n > was) el.querySelectorAll('.chips img').forEach((im,i)=>{
          im.classList.add('is-new'); im.style.animationDelay = (i*55) + 'ms';
        });
        host.appendChild(el);
      };
      if (p.raw)   set('raw',   p.raw,   prev ? prev.raw   : 0, 'Сырьё');
      if (p.goods) set('goods', p.goods, prev ? prev.goods : 0, 'Товар');
      table.appendChild(z);
    }

    if (!table.children.length)
      table.appendChild(h(`<div class="zone empty"><h4>Стол пуст — первым ходом купите на рынке то, чем будете заниматься</h4></div>`));
    /* Имущество выкладываем ПОСЛЕ кнопок: к кнопкам возвращаешься каждый
       ход, а стол растёт вниз — иначе к концу партии до хода надо было
       прокрутить полтора экрана карточек. */

    /* действия */
    /* Знак действия — чёрный плакатный силуэт, поэтому он садится на
       светлый бумажный кружок: на тёмной планке иначе не виден. */
    const acts = h(`<div class="acts" style="--paper:url(${ART['tex-card']||''})"></div>`);
    const ACT_ICON = {'Покупка':'i-buy', 'Добыча':'i-extract', 'Производство':'i-produce',
                      'Продажа':'i-sell', 'Погрузка':'i-load', 'Разгрузка':'i-unload',
                      'Поездка':'i-travel', 'Пропуск':'i-pass'};
    const A = (label, hint, on, fn, prime) => {
      const ic = ART[ACT_ICON[label]];
      const chip = ic ? `<span class="aic"><img src="${ic}" alt=""></span>` : '';
      const b = h(`<button class="act${prime?' prime':''}" ${on?'':'disabled'}><b><span>${label}</span>${chip}</b><i>${hint}</i></button>`);
      if (on) b.addEventListener('click', fn);
      acts.appendChild(b);
    };
    const cont = abroad ? CONTINENTS[p.loc] : null;
    const freeCap = (abroad ? Rules.capacityFor(p, p.loc) : Rules.truckCap(p)+Rules.fleetCap(p)) - p.cargo.length;
    const govCargo = p.cargo.filter(c=>c.state==='gov').length;
    const impCargo = p.cargo.filter(c=>c.state==='own'&&c.origin==='i').length;
    const goodsCargo = p.cargo.filter(c=>c.kind==='goods'&&c.state==='own').length;
    const human = !p.bot && acting;
    const exN = p.own.extractor.s + p.own.extractor.i + p.rent.extractor;

    A('Покупка', abroad ? (KIND[cont.kind].ru + ' · $' + PRICES[cont.kind].usd) : 'с внутреннего рынка', human, ()=>this.buyModal(p), true);
    A('Добыча', 'оборудования ' + exN + ' · ' + Rules.extractCost(S) + ' тыс./шт', human && !abroad && exN > 0, ()=>this.extractModal(p));
    A('Производство', 'станков ' + Rules.usableMachines(p) + ' · ' + Rules.produceCost(S) + ' тыс./шт',
      human && !abroad && p.own.plant>0 && Rules.usableMachines(p)>0 && p.raw>0, ()=>this.produceModal(p));
    A('Продажа', abroad ? ('товар за $' + PRICES.goods.usd) : 'на внутренний рынок',
      human && (abroad ? goodsCargo>0 : (slots(p).length>0 || impCargo>0)), ()=>this.sellModal(p));
    A('Погрузка', 'госгруз · ' + Rules.freight(S) + ' тыс. сразу' +
      (Rules.govLot(S) !== Infinity ? ' · наряд до ' + Rules.govLot(S) : ''),
      human && freeCap>0 && Rules.hasOwnTransport(p) && (!abroad || S.continents[p.loc].stock>0), ()=>this.loadModal(p));
    /* Своё по приезде выкладывается само, поэтому «Разгрузка» — это про
       государственный груз. Остаток своего в трюме может быть только
       из старых партий, и тогда действие тоже сработает. */
    const dropGov = Rules.govHere(p);
    const ownStuck = abroad ? 0 : p.cargo.filter(c=>c.state==='own' && !(c.origin==='i'&&c.kind==='goods')).length;
    A('Разгрузка', dropGov ? ('госгруз ×'+dropGov) : (ownStuck ? ('своё ×'+ownStuck) : 'нечего'),
      human && (dropGov>0 || ownStuck>0), ()=>{
        const had = p.own.computer;
        Transport.send({type:'UNLOAD', by:p.id});
        this.maybeAssign(p.id, had);
      });
    A('Поездка', abroad ? 'вернуться в СССР' : 'на континент', human, ()=>this.travelModal(p), true);
    A('Пропуск', 'ничего не делать', human, ()=>Transport.send({type:'PASS', by:p.id}));
    box.appendChild(acts);

    /* внеходовые операции — работают и в чужой ход */
    const humans = (mySeat != null) ? [p] : S.players.filter(q=>!q.out && !q.bot);
    const free = h('<div class="free"></div>');
    let actorId = (!p.bot && !p.out) ? p.id : (humans[0] ? humans[0].id : null);
    if (humans.length){
      if (humans.length > 1){
        const sel = h('<select></select>');
        humans.forEach(q => sel.appendChild(h(`<option value="${q.id}" ${q.id===actorId?'selected':''}>${esc(q.name)}</option>`)));
        sel.addEventListener('change', ()=>{ actorId = +sel.value; this.board(); });
        free.appendChild(h('<span style="font-family:var(--disp);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)">Действует</span>'));
        free.appendChild(sel);
      }
      const a = Rules.P(S, actorId);
      const FREE_ICON = [['Ссуда','i-loan'], ['Вернуть','i-loan'], ['Обменять','i-exchange'],
                         ['Купить','i-exchange'], ['Предложить','i-deal']];
      const F = (label, on, fn) => {
        const hit = FREE_ICON.find(x => label.indexOf(x[0]) === 0);
        const ic = hit && ART[hit[1]];
        const b = h(`<button class="fbtn" ${on?'':'disabled'}>${ic ? '<img class="fic" src="'+ic+'" alt="">' : ''}${label}</button>`);
        if (on) b.addEventListener('click', fn); free.appendChild(b);
      };
      F('Ссуда ' + Rules.loanTake(S) + ' → вернуть ' + Rules.loanRepay(S), a.debts===0 && Rules.canLoan(S), ()=>Transport.send({type:'LOAN', by:actorId}));
      F('Вернуть ' + (a.debtDue || Rules.loanRepay(S)) + ' в банк', a.debts>0 && a.rub>=(a.debtDue||0), ()=>Transport.send({type:'REPAY', by:actorId}));
      F('Обменять $ на ₽ (1:' + Rules.usdSellRate(S) + ')', a.usd>0 && (!Rules.hasDemand(S) || a.loc==='ussr'),
        ()=>this.exchangeModal(Rules.P(S, actorId)));
      if (Rules.canBuyUsd(S, a))
        F('Купить $ (1:' + Rules.usdBuyRate(S) + ')', a.rub >= Rules.usdBuyRate(S), ()=>this.buyUsdModal(Rules.P(S, actorId)));
      F('Предложить сделку', true, ()=>this.offerModal(actorId));
    }
    this.snap[p.id] = {rub:p.rub, usd:p.usd, raw:p.raw, goods:p.goods, cargo:p.cargo.length, cur:S.cur,
      mach:p.own.machine.s + p.own.machine.i,
      cards:{'extractor:s':p.own.extractor.s,'extractor:i':p.own.extractor.i,
             'truck:s':p.own.truck.s,'truck:i':p.own.truck.i,
             'fleet:s':p.own.fleet.s,'fleet:i':p.own.fleet.i}};

    box.appendChild(free);
    box.appendChild(h(`<div class="freenote">Ссуда, обмен валюты и сделки с игроками ход не тратят — их можно делать между ходами и во время чужого хода${(mySeat==null && p.bot)?'. Сейчас ходит бот, но панель сделок работает':''}.</div>`));
    box.appendChild(table);
  },

  roster(){
    const r = $('#roster'); r.innerHTML = '';
    S.players.forEach(p=>{
      const was = this.snapR && this.snapR[p.id];
      const dR = was ? p.rub - was.rub : 0, dU = was ? p.usd - was.usd : 0;
      const hit = this.anim && (dR || dU);
      const isMe = (typeof Net !== 'undefined' && Net.active() && Net.seat === p.id);
      const el = h(`<div class="rcard ${p.id===S.cur?'act':''} ${p.out?'dead':''} ${hit?'hit':''}" title="Предложить сделку: ${esc(p.name)}">
        <span class="rn">${(typeof Faces !== 'undefined' && p.face >= 0) ? Faces.ava(p.face, (p.name||'?').charAt(0).toUpperCase(), 'sm') : ''}<span class="cone sm" style="background:${p.color}"></span>${esc(p.name)}${isMe?' <span class="tag" style="font-size:9px;border-color:var(--gold);color:var(--gold)">вы</span>':''}${p.bot?' <span class="tag bot" style="font-size:9px">бот</span>':''}</span>
        <span class="rm">${p.rub} ₽ · $${p.usd}${p.debts?' · долг':''}</span>
        <span class="rl">${p.out?'банкрот':(p.loc==='ussr'?'СССР':CONTINENTS[p.loc].ru)} · груз ${p.cargo.length} · сырьё ${p.raw} · товар ${p.goods}</span></div>`);
      el.addEventListener('click', ()=>this.offerModal((typeof Net!=='undefined'&&Net.active())?Net.seat:S.cur, p.id));
      if (hit){
        const parts = [];
        if (dR) parts.push((dR>0?'+':'−') + Math.abs(dR) + ' ₽');
        if (dU) parts.push((dU>0?'+':'−') + '$' + Math.abs(dU));
        el.appendChild(h(`<span class="delta ${(dR||dU)>0?'up':'down'}">${parts.join('  ')}</span>`));
        setTimeout(()=>el.querySelectorAll('.delta').forEach(x=>x.remove()), 1300);
      }
      r.appendChild(el);
    });
    if (this.anim){
      this.snapR = {};
      S.players.forEach(p => this.snapR[p.id] = {rub:p.rub, usd:p.usd});
    }
  },

  tradeMine: false,          // фильтр «показывать только мои предложения»
  trade(){
    const t = $('#tradeList'); t.innerHTML = '';
    const meSeat0 = (typeof Net !== 'undefined' && Net.active()) ? Net.seat : null;
    const meId = meSeat0 != null ? meSeat0 : (Rules.P(S, S.cur) && !Rules.P(S, S.cur).bot ? S.cur : null);
    /* Кнопка «мои» — чтобы найти и снять своё, когда предложений много. */
    const cnt = $('#tradeCount'), fl = $('#tradeMine');
    if (cnt) cnt.textContent = S.offers.length ? S.offers.length : '';
    if (fl){
      const my = meId != null ? S.offers.filter(o=>o.from===meId).length : 0;
      fl.style.display = my > 0 ? '' : 'none';
      fl.classList.toggle('on', this.tradeMine);
      fl.textContent = this.tradeMine ? T('показать все') : T('мои · ') + my;
    }
    let list = S.offers.slice().reverse();
    if (this.tradeMine && meId != null) list = list.filter(o=>o.from===meId);
    if (!list.length){
      t.appendChild(h(this.tradeMine
        ? '<div class="empty">Ваших предложений нет.</div>'
        : '<div class="empty">Открытых предложений нет.<br>Сделки не тратят ход — предлагайте в любой момент.</div>'));
      return;
    }
    list.forEach(o=>{
      const A = Rules.P(S, o.from);
      const toTxt = o.to === -1 ? 'любому' : esc(Rules.P(S, o.to).name);
      const el = h(`<div class="offer ${o.from===S.cur?'mine':''}">
        <div class="oh"><span class="cone sm" style="background:${A.color}"></span><b>${esc(A.name)}</b>
          <span class="arrow">→</span><span>${toTxt}</span></div>
        <div class="leg"><span class="lb">Отдаёт</span><span class="lv">${esc(Rules.legTxt(o.give))}</span>
                         <span class="lb">Хочет</span><span class="lv">${esc(Rules.legTxt(o.want))}</span></div>
        ${o.rent ? '<div class="note">Аренда: ' + KIND[o.rent.kind].ru + ' ×' + o.rent.n + ' на один ход покупателя.</div>' : ''}
        ${o.note ? '<div class="note">' + esc(o.note) + '</div>' : ''}
        <div class="oa"></div></div>`);
      const oa = el.querySelector('.oa');
      const meSeat = (typeof Net !== 'undefined' && Net.active()) ? Net.seat : null;
      S.players.forEach(q=>{
        if (q.out || q.bot || q.id===o.from) return;
        if (meSeat != null && q.id !== meSeat) return;
        if (o.to !== -1 && o.to !== q.id) return;
        const err = Rules.tradeCheck(S, A, q, o);
        const b = h(`<button class="mini go" ${err?'disabled':''} title="${err?esc(err):'Принять'}">Принять: ${esc(q.name)}</button>`);
        /* Раньше сделка заключалась с одного клика — «наклацать» чужое
           предложение было слишком легко. Теперь показываем, что уходит
           и что приходит, и спрашиваем прямо. */
        if (!err) b.addEventListener('click', ()=>this.confirmTrade(A, q, o));
        oa.appendChild(b);
      });
      if (!A.bot && (meSeat == null || A.id === meSeat)){
        const c = h('<button class="mini no">Снять</button>');
        c.addEventListener('click', ()=>Transport.send({type:'CANCEL', by:o.from, id:o.id}));
        oa.appendChild(c);
      }
      t.appendChild(el);
    });
  },

  /* ---------------- подтверждение сделки ---------------- */
  confirmTrade(A, q, o){
    const m = this.shell('Подтвердите сделку',
      `<p style="margin-top:0">Сделка с игроком <b>${esc(A.name)}</b>. Ход она не тратит.</p>
       <div class="tconf">
         <div class="tc give"><span class="tl">Вы отдаёте</span><b>${esc(Rules.legTxt(o.want))}</b></div>
         <div class="tc take"><span class="tl">Вам отдают</span><b>${esc(Rules.legTxt(o.give))}</b></div>
       </div>
       ${o.rent ? '<div class="hint">Аренда: ' + KIND[o.rent.kind].ru + ' ×' + o.rent.n + ' на один Ваш ход.</div>' : ''}
       ${o.note ? '<div class="hint">Комментарий: ' + esc(o.note) + '</div>' : ''}`,
      `<button class="btn" data-close>Нет</button><button class="btn go" id="yes">Да, меняемся</button>`);
    m.querySelector('#yes').addEventListener('click', ()=>{
      this.close(true); Transport.send({type:'ACCEPT', by:q.id, id:o.id});
    });
    this.wireClose(m); this.open(m);
  },

  /* ---------------- журнал в файл ---------------- */
  saveLog(){
    const head = 'Конверсия · журнал партии\n' +
      (S.mode === 'y1993' ? 'Версия 1993 (Украина, гривня)' : 'Классика (СССР, рубли)') +
      ' · кругов: ' + S.turn + ' · курс: ' + S.course + '\n' +
      'Игроки: ' + S.players.map(p=>p.name + (p.bot?' (бот)':'')).join(', ') + '\n' +
      new Date().toLocaleString() + '\n' + '='.repeat(60) + '\n\n';
    let last = null, body = '';
    S.log.forEach(e=>{
      if (e.t !== last){ last = e.t; body += '\n--- ' + T('круг ') + e.t + ' ---\n'; }
      body += T(e.text) + '\n';
    });
    const blob = new Blob([head + body], {type:'text/plain;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'konversia-log-' + (S.mode==='y1993'?'1993':'classic') + '-' + S.turn + '.txt';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  },

  logView(){
    /* Номер круга у каждой строки был, но читался плохо. Теперь круги
       разделены полосой, а в шапке журнала видно, сколько их всего. */
    const l = $('#log'); l.innerHTML = '';
    const rows = S.log.slice(-60);
    let last = null;
    rows.forEach(e => {
      if (e.t !== last){
        last = e.t;
        l.appendChild(h(`<div class="lround"><span>круг ${e.t}</span></div>`));
      }
      l.appendChild(h(`<div class="le ${e.cls}"><span class="tn">${e.t}</span><span class="tx">${esc(e.text)}</span></div>`));
    });
    const cap = $('#logRounds');
    if (cap) cap.textContent = T('круг ') + S.turn;
  },

  /* ---------------- строки с количеством ---------------- */
  /* Миниатюра позиции: для трёх видов, у которых есть карта собственности,
     рисуем вектор, остальное (фишки, жетоны, деньги) остаётся картинкой. */
  artBox(kind, origin, cls){
    const v = this.cardSVG ? this.cardSVG(kind, origin, {cls: cls || ''}) : '';
    return v || '<img src="' + art(kind, origin) + '" alt="">';
  },

  qtyBody(rows, opts){
    opts = opts || {};
    const priced = rows.some(r => r.price != null);
    const unit = opts.unit || 'тыс. ₽';
    const head = `<div class="qhead"><span></span><span>${opts.what || 'Позиция'}</span>` +
      (priced ? `<span class="r">${opts.priceLabel || 'Цена за штуку'}</span>` : '') +
      `<span class="c">Сколько</span>` + (priced ? `<span class="r">Сумма</span>` : '') + `</div>`;
    const body = rows.map(r => `<div class="qrow" data-key="${r.key}">
      <span class="qi">${r.html ? r.html : (r.art?'<img src="'+r.art+'" alt="">':'')}</span>
      <span class="ql"><b>${r.label}</b><small>${r.sub||''}</small></span>
      ${priced ? `<span class="qp">${r.price==null?'':'<b>'+r.price+'</b><small>'+unit+'</small>'}</span>` : ''}
      <span class="qc">
        <button class="stp" data-d="-1">–</button>
        <input type="number" min="0" max="${r.max}" value="${r.val||0}" data-price="${r.price||0}" data-max="${r.max}">
        <button class="stp" data-d="1">+</button>
      </span>
      ${priced ? '<span class="qs">—</span>' : ''}</div>`).join('');
    return `<div class="qtbl${priced?'':' nopr'}">${head}${body}</div>`;
  },
  wireQty(node, onChange){
    const rowSums = () => node.querySelectorAll('.qrow').forEach(r=>{
      const cell = r.querySelector('.qs'); if (!cell) return;
      const i = r.querySelector('input'), v = +i.value||0, pr = +i.dataset.price||0;
      cell.textContent = v > 0 && pr > 0 ? (v*pr) : '—';
      cell.classList.toggle('on', v > 0 && pr > 0);
    });
    const fire = () => { rowSums(); onChange(); };
    node.querySelectorAll('.qrow').forEach(row=>{
      const inp = row.querySelector('input');
      row.querySelectorAll('.stp').forEach(b => b.addEventListener('click', ()=>{
        const d = +b.dataset.d, mx = +inp.dataset.max;
        inp.value = Math.max(0, Math.min(mx, (+inp.value||0) + d)); fire();
      }));
      inp.addEventListener('input', ()=>{
        const mx = +inp.dataset.max;
        inp.value = Math.max(0, Math.min(mx, Math.floor(+inp.value||0))); fire();
      });
    });
    fire();
  },
  readQty(node){
    const out = {};
    node.querySelectorAll('.qrow').forEach(r=>{ const v = +r.querySelector('input').value||0; if (v>0) out[r.dataset.key] = v; });
    return out;
  },
  sumQty(node){
    let s = 0;
    node.querySelectorAll('.qrow').forEach(r=>{ const i = r.querySelector('input'); s += (+i.value||0) * (+i.dataset.price||0); });
    return s;
  },
  bindTotal(m, limit){
    const body = m.querySelector('.mbody'), ok = m.querySelector('#ok');
    const upd = ()=>{
      const s = this.sumQty(body);
      const t = m.querySelector('#tot'); if (t) t.textContent = s;
      ok.disabled = s <= 0 || s > limit;
    };
    this.wireQty(body, upd);
    return body;
  },

  /* ---------------- покупка ---------------- */
  /* ---------------- парк как набор карточек ----------------
     Один и тот же вид нужен и на столе игрока, и в окне поездки, поэтому
     разложение набора машин и рисование карточки вынесены сюда. */
  vehList(p, set, pcLeft){
    /* Если набор сам говорит, сколько в нём машин с компьютером (уехавший
       парк), берём это; иначе — переданный пул. */
    const pool = pcLeft || (set.comp ? {truck:{s:set.comp.truck.s|0, i:set.comp.truck.i|0},
                                        fleet:{s:set.comp.fleet.s|0, i:set.comp.fleet.i|0}}
                                     : this.pcPool(p));
    const out = [];
    for (const k of ['truck','fleet']) for (const o of ['i','s']){
      const n = Math.max(0, set[k][o]|0);
      for (let i=0;i<n;i++){
        const pc = pool[k][o] > 0; if (pc) pool[k][o]--;
        out.push({k:k, o:o, pc:!!pc, base:Rules.perVehicle(k,o), cap:Rules.perVehicle(k,o) + (pc?1:0)});
      }
    }
    return out;
  },
  pcPool(p){
    return {truck:{s:Rules.compOn(p,'truck','s'), i:Rules.compOn(p,'truck','i')},
            fleet:{s:Rules.compOn(p,'fleet','s'), i:Rules.compOn(p,'fleet','i')}};
  },
  /* v — машина из vehList, tokens — что на ней лежит (массив длиной v.cap, null = пусто) */
  vehCard(v, tokens, idle){
    const el = h(`<div class="veh1${idle?' idle':''}"${insp(v.k,v.o)}>
      <div class="vpic">${UI.cardSVG(v.k, v.o, {cls:'vcard'}) || '<img class="vcard" src="' + art(v.k,v.o) + '" alt="">'}<div class="vload"></div></div>
      <div class="vn">${KIND[v.k].short}${v.o==='i'?' имп.':''} · ${v.base}${v.pc?' + 1':''}</div></div>`);
    if (v.pc) el.appendChild(h(`<span class="upc" title="Компьютер: +1 партия груза"><img src="${ART['piece-computer']}" alt="Компьютер"></span>`));
    const load = el.querySelector('.vload');
    for (let i=0;i<v.cap;i++){
      const t = tokens ? tokens[i] : null;
      const sl = h(`<span class="vslot${t?' on':''}${t&&t.state==='gov'?' gov':''}"></span>`);
      if (t){
        sl.appendChild(h(`<span class="tok"${insp(t.kind,t.origin)}>${UI.artBox(t.kind, t.origin)}</span>`));
        if (t.state==='gov') sl.appendChild(h('<i class="gv">гос</i>'));
      }
      load.appendChild(sl);
    }
    return el;
  },
  /* разложить список партий по списку машин: [{v, tokens}] и сколько не влезло */
  spread(list, cargo){
    let ci = 0;
    const out = list.map(v=>{
      const tokens = [];
      for (let i=0;i<v.cap;i++) tokens.push(ci < cargo.length ? cargo[ci++] : null);
      return {v:v, tokens:tokens};
    });
    return {rows:out, rest:cargo.slice(ci)};
  },

  /* ---------------- совмещённый ход ----------------
     Правила: «загрузка государственного груза входит в ход „Покупка“,
     а разгрузка государственного груза входит в ход „Продажа“ своего».
     Поэтому в обеих модалках есть необязательная приставка. Ключ __gov
     отделён от товарных позиций: в items он попасть не должен. */
  govLoadBlock(p, max){
    if (max <= 0) return '';
    const abroad = p.loc !== 'ussr';
    const kind = abroad ? CONTINENTS[p.loc].kind : 'goods';
    return `<hr class="sep"><div class="qcap">Заодно погрузка (тем же ходом)</div>` +
      this.qtyBody([{key:'__gov', label:'Государственный груз' + (abroad?' (импортный)':' (советский)'),
        html:UI.artBox(kind, abroad?'i':'s'),
        sub:'банк платит ' + Rules.freight(S) + ' тыс. за партию сразу · наряд до ' + max,
        price:null, max:max, val:0}]) +
      `<div class="hint" style="margin:6px 0 0">Правила разрешают совмещать: погрузка госгруза входит в ход «Покупка». Груз не Ваш и продать его нельзя, но перевозку банк оплачивает при погрузке.</div>`;
  },
  govDropBlock(p){
    const n = Rules.govHere(p);
    if (!n) return '';
    return `<hr class="sep"><label class="chk" id="dropGov"><input type="checkbox" checked>
      <span>Заодно сдать государственный груз ×${n}<i>Разгрузка госгруза входит в ход «Продажа» своего. Деньги за перевозку уже получены.</i></span></label>`;
  },
  readGovDrop(m){ const el = m.querySelector('#dropGov input'); return !!(el && el.checked); },

  buyModal(p){
    if (p.loc !== 'ussr'){
      const cont = CONTINENTS[p.loc], kind = cont.kind, pr = PRICES[kind].usd;
      const freeCap = Rules.capacityFor(p, p.loc) - p.cargo.length;
      const max = Math.min(S.continents[p.loc].stock, freeCap, Math.floor(p.usd / pr));
      const govMax = Rules.maxLoad(S, p);
      const m = this.shell('Покупка в ' + cont.ru,
        this.qtyBody([{key:kind+':i', label:KIND[kind].ru + ' (импорт)', html:UI.artBox(kind,'i'),
          sub:'запас континента ' + S.continents[p.loc].stock + ', свободных мест ' + freeCap, price:pr, max:max, val:max}]) +
        `<div class="hint">Купленное за границей — это груз. Использовать его можно только после доставки в СССР (действие «Разгрузка») либо продать на внутренний рынок вдвое дороже советского аналога.</div>` +
        this.govLoadBlock(p, govMax),
        `<span class="total">Итого: $<span id="tot">0</span> тыс. · у Вас $${p.usd}</span>
         <button class="btn" data-close>Отмена</button><button class="btn go" id="ok">Купить</button>`);
      const body = this.bindTotal(m, p.usd);
      /* Купленное занимает тот же трюм, что и госгруз: сколько взял себе,
         столько наряда уже не влезет. Пересчитываем на лету. */
      const govRow = m.querySelector('.qrow[data-key="__gov"]');
      if (govRow){
        const gi = govRow.querySelector('input');
        const bi = m.querySelector('.qrow[data-key="' + kind + ':i"] input');
        const sync = ()=>{
          const left = Math.max(0, Math.min(govMax, freeCap - (+bi.value||0),
                                            S.continents[p.loc].stock - (+bi.value||0)));
          gi.dataset.max = left; gi.max = left;
          if ((+gi.value||0) > left) gi.value = left;
          govRow.querySelector('small').textContent =
            T('банк платит ') + Rules.freight(S) + T(' тыс. за партию сразу · наряд до ') + left;
        };
        bi.addEventListener('input', sync);
        govRow.parentNode.parentNode.querySelectorAll('.stp').forEach(b=>b.addEventListener('click', sync));
        m.querySelectorAll('.qrow[data-key="' + kind + ':i"] .stp').forEach(b=>b.addEventListener('click', sync));
        sync();
      }
      m.querySelector('#ok').addEventListener('click', ()=>{
        const q = this.readQty(body); const load = q['__gov']|0; this.close(true);
        Transport.send({type:'BUY', by:p.id, n:q[kind+':i']||0, load:load});
      });
      this.wireClose(m); this.open(m); return;
    }
    const rows = [];
    const add = (kind, origin) => {
      const stock = origin==='i' ? (S.market.imp[kind]||0) : S.market[kind];
      if (!stock) return;
      const price = Rules.price(S, kind, origin, 'buy');
      rows.push({key:kind+':'+origin, label:KIND[kind].ru + (origin==='i'?' (импорт)':''), html:UI.artBox(kind,origin),
                 sub:'на рынке ' + stock, price:price, max:Math.min(stock, Math.floor(p.rub/price))});
    };
    add('plant','s'); add('machine','s'); add('machine','i'); add('extractor','s'); add('extractor','i');
    add('truck','s'); add('truck','i'); add('fleet','s'); add('fleet','i'); add('computer','i');
    add('raw','s'); add('goods','s');
    const m = this.shell('Покупка на внутреннем рынке',
      this.qtyBody(rows) + `<div class="hint">За один ход «Покупка» можно взять сразу всё, что нужно. Импортное оборудование появляется на рынке только после того, как его привезут перевозчики.</div>` +
      this.govLoadBlock(p, Rules.maxLoad(S, p)),
      `<span class="total">Итого: <span id="tot">0</span> тыс. руб. · у Вас ${p.rub}</span>
       <button class="btn" data-close>Отмена</button><button class="btn go" id="ok">Купить</button>`, true);
    const body = this.bindTotal(m, p.rub);
    m.querySelector('#ok').addEventListener('click', ()=>{
      const items = this.readQty(body); const had = p.own.computer;
      const load = items['__gov']|0; delete items['__gov'];
      this.close(true); Transport.send({type:'BUY', by:p.id, items:items, load:load});
      this.maybeAssign(p.id, had);
    });
    this.wireClose(m); this.open(m);
  },

  /* ---------------- продажа ---------------- */
  sellModal(p){
    if (p.loc !== 'ussr'){
      const n = p.cargo.filter(c=>c.kind==='goods'&&c.origin==='s'&&c.state==='own').length;
      /* При спросе цена ПАДАЕТ с каждой проданной партией, поэтому одной
         цифрой её показать нельзя: считаем лестницу и сумму на лету. */
      const dem = Rules.hasDemand(S);
      const now = Rules.goodsPrice(S, p.loc);
      const head = dem
        ? `<p style="margin-top:0">Мировой рынок покупает только советский «Товар». Здесь спрос <b>${Rules.demandOf(S, p.loc)}</b> из 10, и первая партия идёт по <b>$${now} тыс.</b> Каждая проданная партия сбивает спрос, поэтому следующая будет дешевле — весь трюм в один рынок сдавать невыгодно.</p>`
