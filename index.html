  ['phoenix',  'Феникс',             'выиграть партию, в которой брали ссуду',        261],
  ['blitz',    'Блиц',               'выиграть за двенадцать кругов или быстрее',     262],
  ['soviet',   'Своими силами',      'выиграть, не купив ни одной импортной единицы', 263],
  ['broker',   'Маклер',             'двадцать принятых сделок за всё время',         264],
  ['win15',    'Генеральный',        'выиграть пятнадцать партий',                    265],
  ['games60',  'Ветеран конверсии',  'доиграть шестьдесят партий',                    266],
  ['world',    'Кругосветка',        'побывать на всех континентах за одну партию',   267],
  ['mln100',   'Сто миллионов',      'сто миллионов на накопительном счету',          268],
  ['netWin5',  'Хозяйка положения',  'выиграть пять сетевых партий',                  269],
  ['host',     'Хозяин комнаты',     'поднять комнату и довести сетевую партию',      270],
  ['collAll',  'Вся Одесса',         'открыть все портреты до одного',                271]
];
const ACH_BY = {}; ACH.forEach(a => ACH_BY[a[0]] = a);
const RARE = ACH.map(a => a[3]);

/* =====================================================================
   ПРОФИЛЬ
   Имя одно на всё — в комнате, за сетевым столом и в сохранённой партии.
   Счёт накопительный: цифры только растут, партия к партии.
   Заработанное берём из итогов — это та самая строка, по которой
   считают победителя: всё имущество продано, валюта сдана, долги вычтены.
   Рубли и гривни считаются раздельно: это разные игры на одном поле.
   ===================================================================== */
const Prof = {
  KEY: 'konv-stats', KF: 'konv-faces', KA: 'konv-ach', KV: 'konv-face',

  blank(){
    return {games:0, wins:0, netGames:0, netWins:0, earnedRub:0, earnedUah:0,
            winsRub:0, winsUah:0, deals:0, hallMsgs:0, since:Date.now()};
  },
  load(){
    try {
      const j = Net.LS.get(this.KEY);
      return Object.assign(this.blank(), (j ? JSON.parse(j) : null) || {});
    } catch(_){ return this.blank(); }
  },
  save(o){ try { Net.LS.set(this.KEY, JSON.stringify(o)); } catch(_){ } },
  bump(d){
    const o = this.load();
    for (const k in d) o[k] = (o[k] || 0) + d[k];
    this.save(o);
    return o;
  },

  /* ---------- портреты ----------
     Вначале открыто шестнадцать: восемь мужских, восемь женских. Портреты
     за достижения в эту раздачу не попадают — иначе первое же лицо могло
     бы оказаться Беней Криком, и выбивать было бы нечего. */
  FREE_M: 8, FREE_W: 8,
  // докуда портрет падает просто за доигранную партию; дальше — только за победы
  FREEPLAY: 64,

  defaultFaces(){
    const m = [], w = [];
    for (let i = 0; i < Faces.N; i++){
      if (RARE.indexOf(i) >= 0) continue;
      if (Faces.sex(i) === 'f'){ if (w.length < this.FREE_W) w.push(i); }
      else if (m.length < this.FREE_M) m.push(i);
      if (m.length >= this.FREE_M && w.length >= this.FREE_W) break;
    }
    return m.concat(w).sort((a,b)=>a-b);
  },
  faces(){
    let l = null;
    try { l = JSON.parse(Net.LS.get(this.KF) || 'null'); } catch(_){ }
    if (!l || !l.length){ l = this.defaultFaces(); this.saveFaces(l); }
    return l.filter(n => n >= 0 && n < Faces.N);
  },
  saveFaces(l){ try { Net.LS.set(this.KF, JSON.stringify(l)); } catch(_){ } },
  hasFace(n){ return this.faces().indexOf(n) >= 0; },

  /* Своё лицо. Если выбранного портрета почему-то нет на руках —
     возвращаем первый открытый, чтобы за столом не сидел пустой квадрат. */
  face(){
    let n = -1;
    try { n = parseInt(Net.LS.get(this.KV), 10); } catch(_){ }
    const mine = this.faces();
    if (!(n >= 0) || mine.indexOf(n) < 0) n = mine.length ? mine[0] : 0;
    return n;
  },
  setFace(n){ try { Net.LS.set(this.KV, String(n)); } catch(_){ } },

  /* Открыть один случайный ещё закрытый портрет. Портреты за достижения
     в лотерею не попадают. Вернёт номер или -1. */
  give(won){
    const mine = this.faces(), left = [];
    if (mine.length >= this.FREEPLAY && !won) return -1;   // дальше только за победу
    for (let i = 0; i < Faces.N; i++)
      if (mine.indexOf(i) < 0 && RARE.indexOf(i) < 0) left.push(i);
    if (!left.length) return -1;
    const n = left[Math.floor(Math.random() * left.length)];
    mine.push(n); mine.sort((a,b)=>a-b);
    this.saveFaces(mine);
    return n;
  },

  /* ---------- достижения ---------- */
  achList(){
    try { const l = JSON.parse(Net.LS.get(this.KA) || '[]'); return Array.isArray(l) ? l : []; }
    catch(_){ return []; }
  },
  achSave(l){ try { Net.LS.set(this.KA, JSON.stringify(l)); } catch(_){ } },
  achHas(id){ return this.achList().indexOf(id) >= 0; },

  // выдать достижение вместе с его портретом; вернёт true, если оно новое
  ach(id){
    const d = ACH_BY[id];
    if (!d || this.achHas(id)) return false;
    const l = this.achList(); l.push(id); this.achSave(l);
    const f = this.faces();
    if (f.indexOf(d[3]) < 0){ f.push(d[3]); f.sort((a,b)=>a-b); this.saveFaces(f); }
    this.toastAch(d);
    return true;
  },
  toastAch(d){
    const gold = d[3] >= Faces.GOLD0;
    try { UI.toast((gold ? '★ ' : '') + '«' + d[1] + '» — ' + d[2] + '. Открыт портрет.'); } catch(_){ }
  },

  reset(){
    this.save(this.blank());
    this.saveFaces(this.defaultFaces());
    this.achSave([]);
    this.setFace(this.defaultFaces()[0]);
  },

  /* ---------- наблюдение за партией ----------
     Всё, что нужно достижениям, снимается с состояния: на каждом
     перерисовывании смотрим на своё место и запоминаем максимумы. Считать
     по журналу было бы хрупко — текст меняется, состояние нет. */
  startGame(net){
    this.cur = {net:!!net, counted:false, host:!!(Net.active() && Net.isHost()),
      maxRub:0, maxUsd:0, maxCargo:0, maxGear:0, maxPlant:0, maxComp:0, maxFleet:0,
      loans:0, repaid:0, debts:0, everImport:false, locs:{}, travels:0,
      deals:0, buyusd:0, seats:(S && S.players) ? S.players.length : 0};
  },
  watch(){
    const c = this.cur;
    if (!c || !S || !S.players) return;
    const seat = this.mySeat(); if (seat < 0) return;
    const p = S.players[seat]; if (!p) return;
    const o = p.own;
    const gear = o.machine.s + o.machine.i + o.extractor.s + o.extractor.i +
                 o.truck.s + o.truck.i + o.fleet.s + o.fleet.i;
    const imp = o.machine.i + o.extractor.i + o.truck.i + o.fleet.i + o.computer;
    c.maxRub = Math.max(c.maxRub, p.rub|0);
    c.maxUsd = Math.max(c.maxUsd, p.usd|0);
    c.maxCargo = Math.max(c.maxCargo, (p.cargo||[]).length);
    c.maxGear = Math.max(c.maxGear, gear);
    c.maxPlant = Math.max(c.maxPlant, o.plant|0);
    c.maxComp = Math.max(c.maxComp, o.computer|0);
    c.maxFleet = Math.max(c.maxFleet, o.fleet.s + o.fleet.i);
    if (imp > 0) c.everImport = true;
    if (p.loc) c.locs[p.loc] = 1;
    // ссуду видно по переключению долга, а не по журналу
    if ((p.debts|0) > c.debts) c.loans++;
    if ((p.debts|0) < c.debts) c.repaid++;
    c.debts = p.debts|0;
    this.checkLive(c, p);
  },
  // то, что можно засчитать не дожидаясь итогов
  checkLive(c, p){
    if (c.maxRub >= 1000) this.ach('mln');
    if (c.maxRub >= 3000) this.ach('mln3');
    if (c.maxUsd >= 50) this.ach('usd50');
    if (c.maxPlant >= 1) this.ach('plant');
    if (c.maxPlant >= 2) this.ach('plant2');
    if (c.maxGear >= 8) this.ach('gear8');
    if (c.maxComp >= 1) this.ach('comp1');
    if (c.maxFleet >= 1) this.ach('fleet');
    if (c.maxCargo >= 3) this.ach('cargo3');
    if (c.loans >= 1) this.ach('loan');
    if (c.repaid >= 1) this.ach('repay');
    if (c.travels >= 10) this.ach('road10');
    if (c.buyusd >= 1) this.ach('exchange');
    if (Object.keys(c.locs).length >= 6) this.ach('world');
    const o = p.own, gear = o.machine.s + o.machine.i + o.extractor.s + o.extractor.i +
      o.truck.s + o.truck.i + o.fleet.s + o.fleet.i;
    const sov = o.machine.s + o.extractor.s + o.truck.s + o.fleet.s;
    if (gear >= 4 && sov === 0) this.ach('import');
  },

  // своё же действие: по нему считаются рейсы, сделки и покупка валюты
  act(a){
    const c = this.cur;
    if (!c || !a || !S) return;
    const seat = this.mySeat(); if (seat < 0) return;
    const me = S.players[seat];
    if (!me || a.by !== me.id) return;
    if (a.type === 'TRAVEL') c.travels++;
    if (a.type === 'BUYUSD') c.buyusd++;
    if (a.type === 'ACCEPT'){ c.deals++; this.bump({deals:1}); this.ach('deal');
      if (this.load().deals >= 20) this.ach('broker'); }
  },

  mySeat(){
    if (!S || !S.players) return -1;
    if (Net.active() && Net.seat != null) return Net.seat;
    for (let i = 0; i < S.players.length; i++) if (!S.players[i].bot) return i;
    return -1;
  },

  /* Итоги подведены — записываем. Ровно один раз на партию: окно итогов
     можно открыть заново, и второй раз счёт расти не должен. */
  finish(){
    if (!S || !S.over || !this.cur || this.cur.counted) return;
    const res = S.result || [];
    if (!res.length) return;
    const seat = this.mySeat(); if (seat < 0) return;
    const me = S.players[seat]; if (!me) return;
    const mine = res.filter(r => r.id === me.id)[0];
    if (!mine) return;
    const c = this.cur;
    c.counted = true;
    const net = c.net;
    const won = res[0] && res[0].id === me.id && !mine.out;
    const worth = Math.max(0, mine.worth || 0);       // банкроту писать нечего
    const classic = (S.mode || 'classic') === 'classic';

    const d = {games:1, wins:0, netGames:0, netWins:0, earnedRub:0, earnedUah:0,
               winsRub:0, winsUah:0};
    if (net){ d.netGames = 1; if (won) d.netWins = 1; }
    else if (won) d.wins = 1;
    if (classic) d.earnedRub = worth; else d.earnedUah = worth;
    if (won){ if (classic) d.winsRub = 1; else d.winsUah = 1; }
    const st = this.bump(d);

    // --- партии и победы
    this.ach('first');
    if (st.games >= 5) this.ach('games5');
    if (st.games >= 25) this.ach('games25');
    if (st.games >= 60) this.ach('games60');
    if (won){
      const allWins = st.wins + st.netWins;
      this.ach('win1');
      if (allWins >= 5) this.ach('win5');
      if (allWins >= 15) this.ach('win15');
      if (!classic) this.ach('infl');
      if (st.winsRub > 0 && st.winsUah > 0) this.ach('both');
      if (c.loans > 0) this.ach('phoenix');
      if (!c.everImport) this.ach('soviet');
      if (S.turn <= 12) this.ach('blitz');
      const foes = res.filter(r => r.id !== me.id);
      if (foes.length && foes.every(r => r.out)) this.ach('rout');
      /* «вдвое против второго» считаем по лучшему из соперников, даже если
         он банкрот: иначе разгром в одни ворота не засчитывался вовсе. */
      const second = foes.slice().sort((a,b)=>(b.worth||0)-(a.worth||0))[0];
      if (second && worth >= 2 * Math.max(1, second.worth || 0)) this.ach('double');
      if (net){
        this.ach('netWin');
        if (st.netWins >= 5) this.ach('netWin5');
        if (c.host) this.ach('host');
      }
    }
    if (mine.out) this.ach('bankrupt');
    if (S.turn >= 35) this.ach('long');
    if (net) this.ach('net1');
    if ((st.earnedRub + st.earnedUah) >= 100000) this.ach('mln100');

    // --- портрет за партию: за победу всегда, за участие пока не набрано FREEPLAY
    const got = this.give(won);
    this.collAch();
    this.cur.gift = got;
    return got;
  },

  collAch(){
    const n = this.faces().length;
    if (n >= 64) this.ach('coll64');
    if (n >= 150) this.ach('coll150');
    if (n >= Faces.N) this.ach('collAll');
  },


  /* ---------- перенос профиля ----------
     Один файл со всем нажитым: имя, лицо, открытые портреты, достижения,
     накопительный счёт. Содержимое перемешано и снабжено контрольной
     суммой — не от взлома (открытый браузер не защитишь), а чтобы не
     подсунуть случайный файл и не испортить нажитое.
     При загрузке профили СКЛАДЫВАЮТСЯ: портреты и достижения добавляются
     к своим, счёт берётся больший. Так перенос с другого компьютера
     ничего не отнимает. */
  HEAD: 'KONVERSIA1',

  pack(){
    return {v:1, ts:Date.now(), name:(Net.savedName() || 'Игрок'),
            face:this.face(), faces:this.faces(), ach:this.achList(), stats:this.load()};
  },
  exportText(){
    const raw = this.utf8(JSON.stringify(this.pack()));
    return this.HEAD + '.' + this.sum(raw).toString(36) + '.' + this.b64(this.mix(raw));
  },
  exportFile(){
    const nm = (Net.savedName() || 'profile').replace(/[^0-9A-Za-zА-Яа-яЁё]+/g, '-').slice(0,20) || 'profile';
    const name = 'konversia-' + nm + '.konv';
    try {
      const blob = new Blob([this.exportText()], {type:'application/octet-stream'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click();
      setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      UI.toast('Профиль сохранён в файл ' + name);
    } catch(_){ UI.toast('Сохранить файл не вышло — так бывает в предпросмотре артефакта.'); }
  },
  parse(text){
    const parts = String(text || '').trim().split('.');
    if (parts.length !== 3 || parts[0] !== this.HEAD) throw new Error('это не файл профиля «Конверсии»');
    const raw = this.mix(this.unb64(parts[2]));       // перемешивание своё же и разбирает
    if (this.sum(raw).toString(36) !== parts[1]) throw new Error('файл повреждён');
    const o = JSON.parse(this.unutf8(raw));
    if (!o || o.v !== 1) throw new Error('версия файла не подходит');
    return o;
  },
  importText(text){
    const o = this.parse(text);
    if (o.name) Net.rememberName(String(o.name).slice(0,18));
    const f = this.faces().slice();
    (o.faces || []).forEach(n => { if (n >= 0 && n < Faces.N && f.indexOf(n) < 0) f.push(n); });
    f.sort((a,b)=>a-b); this.saveFaces(f);
    const a = this.achList().slice();
    (o.ach || []).forEach(id => { if (ACH_BY[id] && a.indexOf(id) < 0) a.push(id); });
    this.achSave(a);
    if (typeof o.face === 'number' && f.indexOf(o.face) >= 0) this.setFace(o.face);
    // счёт не складываем, а берём больший: иначе перенос туда-обратно удваивал бы нажитое
    const mine = this.load(), his = o.stats || {}, out = this.blank();
    for (const k in out) out[k] = Math.max(mine[k] || 0, his[k] || 0);
    out.since = Math.min(mine.since || Date.now(), his.since || Date.now());
    this.save(out);
    this.collAch();
    return {name:Net.savedName(), faces:f.length, ach:a.length};
  },

  mix(bytes){
    const out = new Uint8Array(bytes.length);
    let st = (0x9e3779b9 ^ bytes.length) >>> 0;
    for (let i = 0; i < bytes.length; i++){
      st = (Math.imul(st, 1103515245) + 12345) >>> 0;
      out[i] = bytes[i] ^ ((st >>> 16) & 255);
    }
    return out;
  },
  sum(bytes){
    let s = 0;
    for (let i = 0; i < bytes.length; i++) s = (Math.imul(s, 31) + bytes[i]) >>> 0;
    return s;
  },
  b64(bytes){
    let str = '';
    for (let i = 0; i < bytes.length; i += 8000)
      str += String.fromCharCode.apply(null, bytes.subarray(i, i + 8000));
    return btoa(str);
  },
  unb64(t){
    const raw = atob(t), a = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) a[i] = raw.charCodeAt(i);
    return a;
  },
  utf8(s2){ return new TextEncoder().encode(s2); },
  unutf8(b2){ return new TextDecoder().decode(b2); },

  /* ---------- строки для экрана ---------- */
  achOfFace(n){ for (let i = 0; i < ACH.length; i++) if (ACH[i][3] === n) return ACH[i]; return null; },
  plural(n, one, few, many){
    const a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return many;
    if (b > 1 && b < 5) return few;
    if (b === 1) return one;
    return many;
  },
  facesLine(){
    const mine = this.faces().length, all = Faces.N;
    const got = this.achList().length;
    const goldGot = this.faces().filter(n => n >= Faces.GOLD0).length;
    const tail = 'За достижения: <b>' + got + '</b> из ' + ACH.length +
      ' — такие портреты в лотерею не попадают никогда.<br>' +
      'Золотых легенд: <b>' + goldGot + '</b> из ' + (all - Faces.GOLD0) + '.';
    if (mine >= all) return 'Открыты все ' + all + ' портретов — собрано. ' + tail;
    const how = (mine >= this.FREEPLAY)
      ? '. Дальше новый портрет открывается за <b>каждую выигранную</b> партию. '
      : '. За каждую доигранную партию открывается ещё один — так до ' + this.FREEPLAY +
        ', дальше только за победы. ';
    return 'Открыто портретов: <b>' + mine + '</b> из ' + all + how + tail;
  },

  // итог партии считается в тысячах — на экране показываем миллионы
  mln(v){
    const m = (v || 0) / 1000;
    return (m >= 100 ? Math.round(m) : Math.round(m * 10) / 10).toString().replace('.', ',');
  }
};

/* ---------- подключиться к идущей или собирающейся партии ----------
   Отдельный вход: игрок вводит код и попадает либо в лобби, где видит
   остальных, либо в уже идущую партию — там ему предложат свободное
   место. Ключ нужен только тому, кто возвращается на своё. */
UI.joinPanel = function(){
  if (!Net.available()) return UI.netModal();      // там объяснено, почему связи нет
  if (Net.active() && Net.lost) return UI.reconnectModal();
  if (Net.active()) return UI.lobbyModal();

  const back = Net.savedBack();
  const m = UI.shell('Подключиться к игре',
    `<label class="fld"><span>Ваше имя в игре</span>
       <input type="text" id="jname" maxlength="18" value="${esc(Net.savedName() || 'Игрок')}" autocomplete="off"></label>
     <label class="fld"><span>Код комнаты — четыре знака от хозяина</span>
       <input type="text" id="jcode" maxlength="4" placeholder="КОД" autocomplete="off"
              style="text-align:center;font-family:var(--mono);font-size:26px;letter-spacing:.28em;text-transform:uppercase"></label>
     <label class="fld"><span>Ключ игрока — только если возвращаетесь на своё место</span>
       <input type="text" id="jkey" maxlength="8" placeholder="НЕ ОБЯЗАТЕЛЬНО" autocomplete="off"
              style="text-align:center;font-family:var(--mono);font-size:14px;letter-spacing:.14em;text-transform:uppercase"></label>
     <div class="err" id="jerr" style="display:none"></div>
     <div class="hint">Партия ещё собирается — попадёте в лобби и увидите остальных.
     Партия уже идёт — предложат занять свободное место со всем его имуществом.
     Хозяин должен держать вкладку открытой: сервера нет, комнату держит его браузер.</div>`,
    `<button class="btn" data-close>Назад</button>
     <button class="btn go" id="jgo">Войти</button>`);

  const err = t => { const e = m.querySelector('#jerr'); e.style.display='block'; e.textContent = t; };
  if (back){
    m.querySelector('#jcode').value = back.room;
    m.querySelector('#jkey').value = back.key || '';
  }
  const go = () => {
    const code = (m.querySelector('#jcode').value || '').trim().toUpperCase();
    if (code.length !== 4) return err('Код состоит из четырёх знаков.');
    const nm = (m.querySelector('#jname').value || '').trim() || 'Игрок';
    const key = (m.querySelector('#jkey').value || '').trim().toUpperCase();
    const b = m.querySelector('#jgo'); b.disabled = true; b.textContent = 'Подключаемся…';
    Net.joinRoom(code, nm, ()=>UI.lobbyModal(),
      t=>{ err(t); b.disabled = false; b.textContent = 'Войти'; }, key);
  };
  m.querySelector('#jgo').addEventListener('click', go);
  m.querySelector('#jcode').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  UI.wireClose(m); UI.place(m);
};

/* ---------- вернуться на своё место ----------
   Всё, что нужно, браузер уже помнит: комната, ключ, номер места.
   Поэтому тут одна кнопка, а поля — на случай, если человек возвращается
   с другого компьютера и ключ переписал с бумажки. */
UI.backPanel = function(){
  const back = Net.savedBack();
  if (!back) return UI.joinPanel();
  const m = UI.shell('Вернуться за стол',
    `<div class="roomcode"><span class="rl">Комната</span>
       <span class="rc">${esc(back.room)}</span></div>
     <div class="roomcode key"><span class="rl">Ваш ключ${back.seat != null ? ' · место ' + (back.seat + 1) : ''}</span>
       <span class="rc sm">${esc(back.key || '—')}</span>
       <button class="mini" id="bcopy">Скопировать</button></div>
     <div class="err" id="berr" style="display:none"></div>
     <div class="hint">Пока Вас нет, место ведёт бот — со всем накопленным имуществом.
     Вернётесь на него же. Партия стоит, если хозяин закрыл вкладку: тогда он поднимает
     её кнопкой «Поднять прежнюю комнату», и ключ снова сработает.</div>`,
    `<button class="mini no" id="bforget" style="margin-right:auto">Забыть</button>
     <button class="btn" data-close>Назад</button>
     <button class="btn go" id="bgo">Вернуться в комнату ${esc(back.room)}</button>`);

  const err = t => { const e = m.querySelector('#berr'); e.style.display='block'; e.textContent = t; };
  m.querySelector('#bcopy').addEventListener('click', ()=>{
    const b = m.querySelector('#bcopy');
    b.textContent = UI.copyText(back.key || '') ? 'Скопировано' : (back.key || '—');
    setTimeout(()=>b.textContent = 'Скопировать', 1600);
  });
  m.querySelector('#bforget').addEventListener('click', ()=>{ Net.dropBack(); UI.menuMain(); });
  m.querySelector('#bgo').addEventListener('click', ()=>{
    const b = m.querySelector('#bgo'); b.disabled = true; b.textContent = 'Возвращаемся…';
    Net.reconnect(()=>{ UI.menuHide(); UI.lobbyModal(); },
      t=>{
        err(t); b.disabled = false; b.textContent = 'Вернуться в комнату ' + back.room;
        /* Комнату никто не держит — значит разошлись все. У нас остался слепок
           партии, и поднять её можно самим: остальные вернутся по своим ключам. */
        const sv = Net.loadSave();
        if (sv && sv.room === back.room && !m.querySelector('#braise')){
          const up = h('<button class="btn go" id="braise">Поднять комнату ' +
            esc(back.room) + ' самому</button>');
          up.addEventListener('click', ()=>{
            up.disabled = true; up.textContent = 'Поднимаем…';
            Net.resumeGame(sv, ()=>{ UI.menuHide(); UI.render(); },
              t2=>{ err(t2); up.disabled = false;
                    up.textContent = 'Поднять комнату ' + back.room + ' самому'; },
              back.seat);
          });
          m.querySelector('.mfoot').appendChild(up);
          err(t + ' Партию можно поднять самому — она сохранена у Вас.');
        }
      },
      back.room, back.key, Net.savedName() || undefined);
  });
  UI.wireClose(m); UI.place(m);
};

      'на всех устройствах, где вы вошли этим же входом. Играть под одним входом можно только в одном месте: ' +
      'откроете игру на другом устройстве — здесь она остановится.' +
      (C.at ? ' Последнее сохранение в облако — ' + new Date(C.at).toTimeString().slice(0,5) + '.' : '') + '</div>' +
      row + '<button class="btn" data-m="cl-out">Выйти из профиля</button></div>';
  } else {
    h += '<div class="hint" style="margin-top:0">Войдите — и профиль (портреты, достижения, счёт) станет одним на всех ' +
      'ваших устройствах и не пропадёт при чистке браузера. Вход тот же, что в «Колдовстве» и «Клаборе».</div>' +
      row + '<button class="btn go" data-m="cl-google">Войти через Google</button></div>' +
      row + '<label class="fld" style="flex:1;min-width:160px"><span>Почта</span><input type="email" id="clMail" autocomplete="email"></label>' +
      '<label class="fld" style="flex:1;min-width:160px"><span>Пароль</span><input type="password" id="clPass" autocomplete="current-password"></label></div>' +
      row + '<button class="btn" data-m="cl-in">Войти</button><button class="btn" data-m="cl-up">Создать вход</button>' +
      '<button class="mini" data-m="cl-reset">Забыли пароль?</button></div>';
  }
  return h + '<div class="hint" id="cloudMsg">' +
    (C.state === 'wait' ? 'Связываемся с облаком…' : (C.err ? 'Облако: ' + esc(C.err) : '')) + '</div></div>';
};
UI.cloudWire = function(m){
  m.querySelectorAll('[data-m^="cl-"]').forEach(b => b.addEventListener('click', ()=>{
    const v = b.dataset.m;
    const say = t => { const e = m.querySelector('#cloudMsg'); if (e) e.textContent = t; };
    const fail = e => say('Облако: ' + (e.message || e));
    const mail = ((m.querySelector('#clMail') || {}).value || '').trim();
    const pass = (m.querySelector('#clPass') || {}).value || '';
    if (v === 'cl-google'){ say('Связываемся с облаком…'); Cloud.google().catch(fail); return; }
    if (v === 'cl-out'){ Cloud.signOut().then(()=>UI.toast('Вы вышли. Профиль остался и в этом браузере.')).catch(fail); return; }
    if (v === 'cl-reset'){
      if (!mail) return say('Впишите почту — пришлём письмо для нового пароля.');
      Cloud.reset(mail).then(()=>say('Письмо для нового пароля отправлено на ' + mail + '.')).catch(fail); return;
    }
    if (!mail || !pass) return say('Впишите почту и пароль.');
    say('Связываемся с облаком…');
    (v === 'cl-up' ? Cloud.signUp(mail, pass) : Cloud.signIn(mail, pass)).catch(fail);
  }));
};

UI.saveProfName = function(m){
  const f = m && m.querySelector('#pnm');

  const v = (f.value || '').trim().slice(0,18) || 'Игрок';
  if (v === UI.hallName()) return;

  try { Hall.updateMe(v, Prof.face()); } catch(_){ }

};

/* Перенос профиля на другой компьютер. Файл читаем через <input type=file>:
   перетаскивание работает не везде, а кнопка — везде. */
UI.profImport = function(){
  const inp = h('<input type="file" accept=".konv,text/plain" style="display:none">');
  document.body.appendChild(inp);
  inp.addEventListener('change', ()=>{
    const f = inp.files && inp.files[0];
    if (!f){ inp.remove(); return; }
    const rd = new FileReader();
    rd.onload = ()=>{
      try {
        const r = Prof.importText(String(rd.result || ''));
        UI.toast('Профиль загружен: ' + r.name + ', портретов ' + r.faces +
          ', достижений ' + r.ach + '.');
        try { Hall.updateMe(UI.hallName(), Prof.face()); } catch(_){ }
        UI.hallRefresh();
        UI.profilePanel();
      } catch(e){ UI.toast('Не вышло: ' + (e && e.message ? e.message : e)); }
      inp.remove();
    };
    rd.onerror = ()=>{ UI.toast('Файл не читается.'); inp.remove(); };
    rd.readAsText(f);
  });
  inp.click();
};

  if (box) seats.forEach(x=>{
    const can = x.bot && !x.out;
    const b = h(`<div class="seat ${can?'':'busy'}">
        <span class="sn">${x.i+1}. ${esc(x.name)}</span>
        <span class="st">${x.out ? 'выбыл' : (x.bot ? 'ведёт бот' : 'живой игрок')}</span>
        ${can ? '<button class="mini go">Занять</button>' : ''}</div>`);
    if (can) b.querySelector('button').addEventListener('click', ()=>{ UI.close(true); Net.claimSeat(x.i); });
    box.appendChild(b);
  });
  UI.wireClose(m); UI.open(m, {sticky:true});
};

UI.lobbyModal = function(){
  const host = Net.isHost();
  const m = UI.shell(host ? 'Комната ' + Net.room : 'Комната ' + Net.room,
    `<div class="roomcode"><span class="rl">Код комнаты — продиктуйте его игрокам</span>
       <span class="rc" id="rc">${Net.room}</span>
       <button class="mini" id="copy">Скопировать</button></div>
     <div class="roomcode key"><span class="rl">Ваш ключ — по нему вернётесь на своё место, если оборвётся связь</span>
       <span class="rc sm" id="mykey">—</span>
       <button class="mini" id="copykey">Скопировать</button></div>
     <div class="subh">Игроки <span id="seatn" class="hcount"></span></div>
     <div class="seats" id="seats"></div>
     <div class="roomver" id="roomver"></div>
     ${host ? `<hr class="sep">
       <div class="two three">
         <label class="fld"><span>Длина партии</span><select id="track">
           <option value="short" selected>Короткая — 100 пересечений</option>
           <option value="medium">Средняя — 125</option>
           <option value="long">Длинная — 190</option></select></label>
         <label class="fld"><span>Уровень ботов</span><select id="skill">
           <option value="easy">Бухгалтер</option>
           <option value="norm" selected>Финдиректор</option>
           <option value="hard">Директор</option>
         </select></label>
         <label class="fld"><span>Добавить ботов</span><select id="bots">
           <option value="0" selected>без ботов</option><option value="1">1 бот</option>
           <option value="2">2 бота</option><option value="3">3 бота</option></select></label>
         <label class="fld"><span>Таймер хода</span><select id="timer">
           <option value="0" selected>выключен</option><option value="30">30 секунд</option>
           <option value="60">60 секунд</option><option value="90">90 секунд</option></select></label>
       </div>` : ''}
     <div class="netstat" id="nstat"></div>`,
    (host ? `<button class="btn" id="leave">Закрыть комнату</button><button class="btn go" id="go">Начать партию</button>`
          : `<button class="btn" id="leave">Выйти</button><button class="btn" data-close>Свернуть</button>`), true);

  UI.renderLobby = () => {
    /* Окно лобби бывает и модалкой, и колонкой меню. Проверяем просто:
       живо ли оно ещё на странице. Раньше тут стояло «наше ли это модальное
       окно» — в колонке меню условие не выполнялось никогда, и лобби
       переставало обновляться: ни ключа, ни игроков, ни версии. */
    if (!m.isConnected) { UI.renderLobby = null; return; }
    const seats = m.querySelector('#seats'); seats.innerHTML = '';
    Net.lobby.forEach((s, i) => seats.appendChild(h(`<div class="seat ${i===Net.seat?'me':''}">
      <span class="cone" style="background:${COLORS[i % COLORS.length]}"></span>
      <span class="sn">${esc(s.name)}</span>
      <span class="st">${i===0?'хозяин':'игрок'}</span>
      <span class="st">${i===Net.seat?'это вы':''}</span></div>`)));
    if (!Net.lobby.length) seats.appendChild(h('<div class="empty">Пока никого нет.</div>'));
    const sn = m.querySelector('#seatn');
    if (sn) sn.textContent = Net.lobby.length + ' из 8';
    /* Во что играет комната — видно всем. Правила и язык это одно и то же,
       поэтому версию задаёт хозяин, а гостям она приезжает с составом. */
    const rv = m.querySelector('#roomver');
    if (rv){
      const ua = LANG === 'ua';
      rv.innerHTML = '<span class="rl">Версия игры</span>' + (host
        ? '<button class="mini' + (!ua ? ' on' : '') + '" data-ver="ru">Классика · СССР</button>' +
          '<button class="mini' + (ua ? ' on' : '') + '" data-ver="ua">Конверсія · 1993</button>'
        : '<b>' + (ua ? 'Конверсія · 1993' : 'Классика · СССР') + '</b>');
      if (host) rv.querySelectorAll('[data-ver]').forEach(b2 => b2.addEventListener('click', ()=>{
        if (b2.dataset.ver === LANG) return;
        setLang(b2.dataset.ver);
        applyLangArt().then(()=>{ Net.pushLobby(); UI.renderLobby && UI.renderLobby(); });
      }));
    }
    const kb = m.querySelector('#mykey');
    if (kb){
      const k = Net.isHost() ? (Net.lobby[0] && Net.lobby[0].key) : Net.myKey;
      kb.textContent = k || '—';
    }
    m.querySelector('#nstat').innerHTML = esc(T(Net.status || '')) +
      (host ? '<br>' + T('Держите эту вкладку открытой: у Вас считаются правила и ходят боты.') : '');
    const go = m.querySelector('#go'); if (go) go.disabled = Net.lobby.length < 1;
  };

  const copyBtn = (btnSel, getText) => {
    const b = m.querySelector(btnSel);
    b.addEventListener('click', ()=>{
      const txt = String(getText() || '');
      if (!txt || txt === '—'){ b.textContent = T('Нечего копировать'); }
      else if (UI.copyText(txt)) b.textContent = T('Скопировано');
      else b.textContent = txt;                      // хотя бы покажем — можно выделить
      setTimeout(()=>b.textContent = T('Скопировать'), 1800);
    });
  };
  copyBtn('#copy',    ()=>Net.room);
  copyBtn('#copykey', ()=>m.querySelector('#mykey').textContent);
  m.querySelector('#leave').addEventListener('click', ()=>{ Net.leave(); UI.renderLobby = null; UI.close(true); UI.setupModal(); });
  const go = m.querySelector('#go');
  if (go) go.addEventListener('click', ()=>{
    UI.renderLobby = null;
    Net.startGame({track:m.querySelector('#track').value, bots:+m.querySelector('#bots').value,
                   timer:+m.querySelector('#timer').value, botSkill:m.querySelector('#skill').value});
  });
  UI.wireClose(m); UI.place(m, {sticky:!host && !Net.started});
  UI.renderLobby();
};

document.querySelectorAll('.actNet').forEach(b=>b.addEventListener('click', ()=>UI.netModal()));
applyLangArt();
/* Первым экраном — меню. Поднимаем его здесь, а не в блоке «Старт»:
   UI.menu живёт в этом файле ниже, и раньше его ещё не существует. */
UI.menu();
</script>
