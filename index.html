        : `<p style="margin-top:0">Мировой рынок покупает только советский «Товар» — по <b>$${PRICES.goods.usd} тыс.</b> за партию. Цены за границей постоянны и от курса рубля не зависят.</p>`;
      const m = this.shell('Продажа на мировом рынке',
        head +
        this.qtyBody([{key:'goods:s', label:'Товар (свой груз)', html:UI.artBox('goods','s'),
                       sub:'в грузе ' + n, price:now, max:n, val:n}],
                     {priceLabel: dem ? 'Первая партия' : 'Цена за штуку', unit:'тыс. $'}) +
        (dem ? '<div class="hint" id="ladder"></div>' : '') + this.govDropBlock(p),
        `<span class="total">Выручка: $<span id="tot">0</span> тыс.</span>
         <button class="btn" data-close>Отмена</button><button class="btn go" id="ok">Продать</button>`);
      const body = m.querySelector('.mbody');
      const upd = ()=>{
        const q = this.readQty(body), take = q['goods:s'] || 0;
        const list = Rules.goodsPreview(S, p.loc, take);
        const sum = list.reduce((a,b)=>a+b, 0);
        m.querySelector('#tot').textContent = sum;
        /* колонка «сумма» в строке считает количество × цену, а при спросе
           это неправда — переписываем её настоящей суммой по лестнице */
        const cell = body.querySelector('.qrow .qs');
        if (cell){ cell.textContent = take ? sum : '—'; cell.classList.toggle('on', take>0); }
        const lad = m.querySelector('#ladder');
        if (lad) lad.innerHTML = take
          ? LOC('По партиям: $' + list.join(', $') + (list.length>1 && list[0]!==list[list.length-1]
              ? ' — цена падает по мере насыщения рынка.' : '.'))
          : '';
        m.querySelector('#ok').disabled = take <= 0;
      };
      this.wireQty(body, upd);
      m.querySelector('#ok').addEventListener('click', ()=>{
        const q = this.readQty(body); const drop = this.readGovDrop(m);
        this.close(true); Transport.send({type:'SELL', by:p.id, n:q['goods:s']||0, unload:drop});
      });
      this.wireClose(m); this.open(m); return;
    }
    const rows = slots(p).map(function(pair){
      const key = pair[0], n = pair[1], parts = key.split(':');
      return {key:key, label:labelOf(key), art:artOfKey(key), sub:'у Вас ' + n,
              price:Rules.price(S, parts[0], parts[1], 'sell'), max:n};
    });
    const impCargo = p.cargo.filter(c=>c.state==='own'&&c.origin==='i');
    const byKind = {}; impCargo.forEach(c => byKind[c.kind] = (byKind[c.kind]||0)+1);
    let cargoRows = '';
    if (impCargo.length){
      cargoRows = '<hr class="sep"><h4 style="font-family:var(--disp);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin:0 0 6px">Привезённый импорт (из груза)</h4>' +
        this.qtyBody([{key:'__cargo', label:Object.keys(byKind).map(k=>KIND[k].ru+' ×'+byKind[k]).join(', '),
                       html:UI.artBox(impCargo[0].kind,'i'), sub:'продаётся вдвое дороже советского', price:null, max:impCargo.length}]);
    }
    const m = this.shell('Продажа на внутренний рынок',
      (rows.length ? this.qtyBody(rows) : '<div class="empty">Собственности нет.</div>') + cargoRows +
      `<div class="hint">Рынок покупает дешевле, чем продаёт. Перед сменой курса выгодно распродать запасы — новый курс их обесценит.</div>` +
      this.govDropBlock(p),
      `<span class="total">Выручка: <span id="tot">0</span> тыс. руб.</span>
       <button class="btn" data-close>Отмена</button><button class="btn go" id="ok">Продать</button>`, true);
    const body = m.querySelector('.mbody');
    const upd = ()=>{
      let s = 0, any = 0;
      body.querySelectorAll('.qrow').forEach(r=>{
        const i = r.querySelector('input'), v = +i.value||0; any += v;
        if (r.dataset.key === '__cargo'){
          let left = v;
          for (let k=impCargo.length-1;k>=0&&left>0;k--,left--) s += Rules.price(S, impCargo[k].kind, 'i', 'sell');
        } else s += v * (+i.dataset.price||0);
      });
      m.querySelector('#tot').textContent = s; m.querySelector('#ok').disabled = any<=0;
    };
    this.wireQty(body, upd);
    m.querySelector('#ok').addEventListener('click', ()=>{
      const q = this.readQty(body); const cargo = q.__cargo||0; delete q.__cargo;
      const drop = this.readGovDrop(m);
      this.close(true); Transport.send({type:'SELL', by:p.id, items:q, cargo:cargo, unload:drop});
    });
    this.wireClose(m); this.open(m);
  },

  /* Привезли или купили компьютер — сразу спрашиваем, куда его поставить:
     иначе игрок не понимает, почему «разгрузка» ничего не изменила. */
  maybeAssign(pid, had){
    setTimeout(()=>{
      const q = Rules.P(S, pid);
      if (!q || q.own.computer <= (had|0) || this.modal) return;
      if (Rules.compFree(q) <= 0) return;
      const room = Rules.COMP_KINDS.reduce((a,k)=> a + q.own[k].s + q.own[k].i, 0)
                 - Rules.compUsed(q);
      if (room > 0) this.assignModal(q);
    }, 380);
  },

  /* ---------------- установка компьютеров ---------------- */
  /* Компьютер ставится на одну единицу — станок, оборудование добычи или
     транспорт — и даёт ей +1 партию за ход. Разложить свободные компьютеры
     по пустым местам можно между ходами бесплатно; снять уже установленный и
     переставить — отдельное действие. */
  assignModal(p){
    const nc = p.own.computer;
    const cur = Rules.compMap(p);
    const rows = [];
    const WHAT = {machine:'товара за ход', extractor:'сырья за ход', truck:'груза', fleet:'груза'};
    const add = (kind, origin, label) => {
      const max = p.own[kind][origin]; if (!max) return;
      const per = (kind==='machine') ? Rules.perMachine(p,origin)
                : (kind==='extractor') ? Rules.perExtractor(p,origin)
                : Rules.perVehicle(kind, origin);
      rows.push({key:kind+':'+origin, label:label, html:UI.artBox(kind,origin),
                 sub:'станет ' + (per+1) + ' вместо ' + per + ' ' + WHAT[kind] + ' · всего единиц ' + max,
                 max:max, val:cur[kind][origin]});
    };
    add('machine','s','Советские станки');
    add('machine','i','Импортные станки');
    add('extractor','s','Советское оборудование добычи');
    add('extractor','i','Импортное оборудование добычи');
    add('truck','s','Советский автотранспорт');
    add('truck','i','Импортный автотранспорт');
    add('fleet','s','Советский флот');
    add('fleet','i','Импортный флот');
    if (!rows.length){
      this.open(this.shell('Установка компьютеров',
        '<div class="hint">Компьютер ставится на станок, на оборудование по добыче сырья или на транспорт. У Вас пока нет ничего из этого — купите оборудование, и компьютер можно будет установить.</div>',
        '<button class="btn" data-close>Понятно</button>'));
      return;
    }
    const m = this.shell('Установка компьютеров',
      this.qtyBody(rows, {what:'Куда ставим'}) +
      `<div class="hint">Каждый компьютер усиливает <b>одну</b> единицу на +1 партию: оборудование добудет партию сырья больше,
       станок выпустит партию товара больше, <b>транспорт увезёт партию груза больше</b>. Компьютеров у Вас ${nc}.
       Разложить свободные — бесплатно и в любой момент. <b>Снять уже установленный и переставить — стоит ход.</b>
       Компьютер на машине уезжает вместе с ней: оставили её дома — трюма он не прибавит.</div>`,
      `<span class="total">Занято: <span id="tot">0</span> из ${nc} · <span id="fee">—</span></span>
       <button class="btn" data-close>Отмена</button><button class="btn go" id="ok">Установить</button>`);
    const body = m.querySelector('.mbody');
    const upd = ()=>{
      const q = this.readQty(body);
      let total = 0, removed = 0, added = 0;
      rows.forEach(r=>{
        const v = q[r.key]|0; total += v;
        const d = v - r.val; if (d>0) added += d; else removed += -d;
      });
      const acting = (S.cur === p.id) && !S.pendingChoice && !S.pendingSalvage;
      m.querySelector('#tot').textContent = total;
      m.querySelector('#fee').textContent = T(removed ? 'переустановка — стоит ход' : 'бесплатно');
      m.querySelector('#ok').disabled = total > nc || (!added && !removed) || (removed>0 && !acting);
    };
    this.wireQty(body, upd);
    m.querySelector('#ok').addEventListener('click', ()=>{
      const q = this.readQty(body);
      const map = {machine:{s:0,i:0}, extractor:{s:0,i:0}, truck:{s:0,i:0}, fleet:{s:0,i:0}};
      for (const key in q){ const [k,o] = key.split(':'); map[k][o] = q[key]|0; }
      this.close(true); Transport.send({type:'ASSIGN', by:p.id, map:map});
    });
    this.wireClose(m); this.open(m);
  },

  /* ---------------- добыча / производство ---------------- */
  /* Подпись строки: базовая производительность плюс сколько единиц усилено
     компьютером — иначе игрок не понимает, откуда взялись лишние партии. */
  extractModal(p){
    const sMax = p.own.extractor.s + p.rent.extractor, iMax = p.own.extractor.i;
    const rows = [];
    if (sMax) rows.push({key:'s', label:'Советское оборудование' + (p.rent.extractor?' (с арендой)':''), html:UI.artBox('extractor','s'),
                         sub:subOut(p,'extractor','s'), price:Rules.extractCost(S), max:sMax, val:sMax});
    if (iMax) rows.push({key:'i', label:'Импортное оборудование', html:UI.artBox('extractor','i'),
                         sub:subOut(p,'extractor','i'), price:Rules.extractCost(S), max:iMax, val:iMax});
    const m = this.shell('Добыча сырья',
      this.qtyBody(rows) + `<div class="hint">Расход — ${Rules.extractCost(S)} тыс. руб. за работу каждого оборудования, независимо от его производительности.${Rules.compUsed(p)?' Компьютер добавляет +1 партию той единице, на которой установлен.':''}</div>`,
      `<span class="total">Расход: <span id="tot">0</span> · добудете <span id="out">0</span> партий</span>
       <button class="btn" data-close>Отмена</button><button class="btn go" id="ok">Добывать</button>`);
    const body = m.querySelector('.mbody');
    const upd = ()=>{
      const q = this.readQty(body), cost = this.sumQty(body);
      const out = Rules.outFor(p, 'extractor', q.s||0, q.i||0);
      m.querySelector('#tot').textContent = cost; m.querySelector('#out').textContent = out;
      m.querySelector('#ok').disabled = out<=0 || cost>p.rub;
    };
    this.wireQty(body, upd);
    m.querySelector('#ok').addEventListener('click', ()=>{
      const q = this.readQty(body); this.close(true); Transport.send({type:'EXTRACT', by:p.id, s:q.s||0, i:q.i||0});
    });
    this.wireClose(m); this.open(m);
  },
  produceModal(p){
    const cap = Rules.machineSlots(p);
    const sMax = Math.min(p.own.machine.s + p.rent.machine, cap);
    const iMax = Math.min(p.own.machine.i, Math.max(0, cap - sMax));
    const rows = [];
    if (sMax) rows.push({key:'s', label:'Советские станки' + (p.rent.machine?' (с арендой)':''), html:UI.artBox('machine','s'),
                         sub:subOut(p,'machine','s'), price:Rules.produceCost(S), max:sMax, val:sMax});
    if (iMax) rows.push({key:'i', label:'Импортные станки', html:UI.artBox('machine','i'),
                         sub:subOut(p,'machine','i'), price:Rules.produceCost(S), max:iMax, val:iMax});
    const m = this.shell('Производство товара',
      this.qtyBody(rows) + `<div class="hint">На один завод ставится ${MACHINES_PER_PLANT} станков; у Вас слотов — ${cap}. Расход ${Rules.produceCost(S)} тыс. руб. за станок. Сырья в наличии: ${p.raw}.</div>`,
      `<span class="total">Расход: <span id="tot">0</span> · из <span id="need">0</span> сырья → <span id="out">0</span> товара</span>
       <button class="btn" data-close>Отмена</button><button class="btn go" id="ok">Производить</button>`);
    const body = m.querySelector('.mbody');
    const upd = ()=>{
      const q = this.readQty(body), cost = this.sumQty(body);
      const out = Rules.outFor(p, 'machine', q.s||0, q.i||0);
      m.querySelector('#tot').textContent = cost; m.querySelector('#out').textContent = out; m.querySelector('#need').textContent = out;
      m.querySelector('#ok').disabled = out<=0 || cost>p.rub || out>p.raw;
    };
    this.wireQty(body, upd);
    m.querySelector('#ok').addEventListener('click', ()=>{
      const q = this.readQty(body); this.close(true); Transport.send({type:'PRODUCE', by:p.id, s:q.s||0, i:q.i||0});
    });
    this.wireClose(m); this.open(m);
  },

  /* ---------------- погрузка ---------------- */
  loadModal(p){
    const abroad = p.loc !== 'ussr';
    const kind = abroad ? CONTINENTS[p.loc].kind : 'goods';
    const stock = abroad ? S.continents[p.loc].stock : Infinity;   // жетоны товара не считаются
    const cap = (abroad ? Rules.capacityFor(p, p.loc) : Rules.truckCap(p)+Rules.fleetCap(p)) - p.cargo.length;
    const lot = Rules.govLot(S);                 // наряд: сколько партий дают за раз
    const max = Math.min(stock, cap, lot);
    const m = this.shell('Погрузка государственного груза',
      this.qtyBody([{key:'n', label:KIND[kind].ru + (abroad?' (импортный)':' (советский)'), html:UI.artBox(kind, abroad?'i':'s'),
                     sub:(stock===Infinity ? 'на складе без ограничений' : 'доступно ' + stock) + ', свободных мест ' + cap +
                         (lot !== Infinity ? ', наряд не больше ' + lot : ''),
                     price:Rules.freight(S), max:max, val:max}]) +
      `<div class="hint">Госгруз не принадлежит Вам и продать его нельзя, но банк платит за перевозку сразу при погрузке — ${Rules.freight(S)} тыс. руб. за партию. Заработок идёт и туда, и обратно.${lot !== Infinity ? ' Больше ' + lot + ' партий за одну погрузку государство не даёт — остальной трюм под свой товар.' : ''}</div>`,
      `<span class="total">Получите: <span id="tot">0</span> тыс. руб.</span>
       <button class="btn" data-close>Отмена</button><button class="btn go" id="ok">Погрузить</button>`);
    const body = this.bindTotal(m, Infinity);
    m.querySelector('#ok').addEventListener('click', ()=>{
      const q = this.readQty(body); this.close(true); Transport.send({type:'LOAD', by:p.id, n:q.n||0});
    });
    this.wireClose(m); this.open(m);
  },

  /* ---------------- поездка ---------------- */

  /* ---------------- шкала риска катастрофы ----------------
     Открытая информация: одна катастрофа на всю колоду, после неё колода
     собирается заново. Шанс — один к числу оставшихся карт. Текст пишем
     сразу на нужном языке и заворачиваем в NL(): словарь тут не нужен. */
  riskHTML(bare){
    const o = Rules.crashOdds(S);
    const pc = o.p * 100;
    const num = (pc < 10 ? pc.toFixed(1).replace('.', ',') : String(Math.round(pc))) + ' %';
    const lvl = pc >= 50 ? 'hot' : pc >= 20 ? 'warm' : pc >= 8 ? 'mid' : '';
    const ua = (typeof LANG !== 'undefined' && LANG === 'ua');
    const lab = ua ? 'Ризик катастрофи' : 'Риск катастрофы';
    const cnt = ua ? ('карт у колоді: ' + o.left + ' · скинуто: ' + o.used)
                   : ('карт в колоде: ' + o.left + ' · сброшено: ' + o.used);
    const tip = ua ? ('У колоді «Подій у дорозі» рівно одна катастрофа на ' + CARDS(o.total) +
                      '. Шанс витягти її наступною — 1 до ' + o.left +
                      '. Після катастрофи колода збирається наново.')
                   : ('В колоде «Событий в пути» ровно одна катастрофа на ' + CARDS(o.total) +
                      '. Шанс вытянуть её следующей — 1 к ' + o.left +
                      '. После катастрофы колода собирается заново.');
    /* bare — когда шкалу вставляют внутрь текста, уже обёрнутого в NL():
       вложенные метки ломают разбор, поэтому там их не ставим. */
    const html = `<div class="risk ${lvl}" title="${tip}">
      <div class="rtop"><span class="rl">${lab}</span><b class="rv">${num}</b><span class="rc">${cnt}</span></div>
      <div class="rbar"><i style="width:${Math.min(100, Math.max(1, pc)).toFixed(1)}%"></i></div></div>`;
    return bare ? html : NL(html);
  },

  travelModal(p){
    if (p.loc !== 'ussr'){
      const units = p.cargo.length, cap = Rules.capacityFor(p, p.loc);
      const fee = Rules.travelFee(S, p, p.loc, units, true);
      const short = Math.max(0, fee - p.rub);
      const byUsd = short > 0 && p.usd >= short;
      const m = this.shell('Поездка домой',
        `<p style="margin-top:0">Возвращение в СССР с ${units} партиями груза.</p>
         ${fee ? '<div class="warn">Своей грузоподъёмности не хватает — наём государственного транспорта обойдётся в ' + fee + ' тыс. руб.'
                 + (byUsd ? ' Рублей не хватает, уйдут $' + short + ' тыс. по курсу 1:1.' : '') + '</div>'
               : (units ? '' : '<div class="hint" style="margin:0 0 8px">Налегке дорога домой бесплатна — уехать можно всегда.</div>')}
         <div class="hint">По прибытии индикатор курса сдвинется на ${units} клеток. В пути тянется карта «События в пути».</div>`,
        `${this.riskHTML()}<button class="btn" data-close>Отмена</button><button class="btn go" id="ok" ${(fee>p.rub && !byUsd)?'disabled':''}>Ехать</button>`);
      m.querySelector('#ok').addEventListener('click', ()=>{
        const had = p.own.computer;
        this.close(true); Transport.send({type:'TRAVEL', by:p.id, dest:'ussr'});
        this.maybeAssign(p.id, had);   // привезли компьютер — своё выложилось само, спросим куда ставить
      });
      this.wireClose(m); this.open(m); return;
    }
    /* ================= ПОЕЗДКА ЗА ГРАНИЦУ =================
       Одно окно — один манифест рейса. Что в нём собрано, то и уедет;
       всё прочее остаётся на внутреннем рынке. Раньше окно спрашивало
       только «куда» и «сколько товара», а лишний груз молча уезжал на
       государственном транспорте и двигал курс — отсюда и путаница
       «взял две машины, а сдвинуло на шесть». */
    let dest = null;
    const m = this.shell('Поездка за границу',
      `<div style="--paper:url(${ART['tex-card']||''})"><div class="qcap">1 · Куда едем</div>
       <div class="dests" id="dests"></div>
       <div id="stage2" style="display:none">
         <hr class="sep">
         <div class="qcap">2 · Что грузим <span class="cap2" id="holdTxt"></span></div>
         <div id="freight"></div>
         <div class="qcap">3 · Какие машины едут <span class="cap2" id="capTxt"></span></div>
         <div class="hint" style="margin:0 0 8px">Нажмите на карточку — машина останется дома. Оставленные в катастрофе не гибнут, но и груз не везут. Каждая карточка своя: с компьютером она берёт на партию больше.</div>
         <div class="zrow vehrow" id="prev"></div>
         <div id="stay" class="staybox"></div>
         <label class="chk" id="hire" style="display:none"><input type="checkbox">
           <span>Довезти остаток государственным транспортом<i>Не влезает <b class="hn">0</b> партий. Наём обойдётся в <b class="hf">0</b> тыс. руб. Без этого они останутся на внутреннем рынке.</i></span></label>
         <div id="calc" class="hint"></div>
       </div></div>`,
      `${this.riskHTML()}<button class="btn" data-close>Отмена</button><button class="btn go" id="ok" disabled>Ехать</button>`, true);

    const ds     = m.querySelector('#dests');
    const stage2 = m.querySelector('#stage2');
    const frBox    = m.querySelector('#freight');
    const prev     = m.querySelector('#prev');
    const stayBox  = m.querySelector('#stay');
    const hireBox  = m.querySelector('#hire');
    const calc     = m.querySelector('#calc');

    /* уже погруженное: госгруз и то своё, что осталось в трюме */
    const loaded = p.cargo.slice();
    const read = (box, key) => { const r = box.querySelector('.qrow[data-key="'+key+'"]');
                                 return r ? (+r.querySelector('input').value||0) : 0; };

    /* Парк для этого направления — поимённо. Каждая карточка своя: одна
       с компьютером, другая без, и игрок сам решает, какая едет. */
    let park = [], picked = new Set();
    const buildPark = ()=>{
      const all = Rules.fleetHome(p, dest);
      const pool = this.pcPool(p);
      park = [];
      for (const k of ['truck','fleet']) for (const o of ['i','s']){
        const n = Math.max(0, all[k][o]|0);
        for (let i=0;i<n;i++){
          const pc = pool[k][o] > 0; if (pc) pool[k][o]--;
          park.push({k:k, o:o, pc:!!pc, base:Rules.perVehicle(k,o), cap:Rules.perVehicle(k,o) + (pc?1:0)});
        }
      }
      picked = new Set(park.map((_,i)=>i));
    };
    const pickSet = ()=>{
      const set = {truck:{s:0,i:0}, fleet:{s:0,i:0}, comp:{truck:{s:0,i:0}, fleet:{s:0,i:0}}};
      park.forEach((v,i)=>{ if (!picked.has(i)) return;
        set[v.k][v.o]++; if (v.pc) set.comp[v.k][v.o]++; });
      return set;
    };

    /* ---- 3. груз ---- */
    const drawFreight = ()=>{
      const was = {};
      frBox.querySelectorAll('.qrow').forEach(r=> was[r.dataset.key] = +r.querySelector('input').value||0);
      const had = Object.keys(was).length > 0;
      const rows = [];
      const govN = loaded.filter(c=>c.state==='gov').length;
      const ownN = loaded.length - govN;
      const v = (key, n) => had ? Math.min(n, was[key] == null ? n : was[key]) : n;
      if (govN) rows.push({key:'__gov', label:'Государственный груз (уже в трюме)', html:UI.artBox('goods','s'),
                           sub:'перевозка оплачена при погрузке · оставите — деньги вернутся банку',
                           price:null, max:govN, val:v('__gov', govN)});
      if (ownN) rows.push({key:'__own', label:'Своё, уже погруженное', html:UI.artBox(loaded.find(c=>c.state!=='gov').kind, 'i'),
                           sub:'осталось с прошлой поездки', price:null, max:ownN, val:v('__own', ownN)});
      if (p.goods){
        /* По умолчанию берём столько, сколько влезет в выбранные машины:
           ехать за границу с пустым трюмом почти никогда не нужно. */
        const hold = dest ? Rules.capOfSet(p, pickSet(), dest) : 0;
        const fit = Math.max(0, Math.min(p.goods, hold - govN - ownN));
        rows.push({key:'take', label:'Свой товар со склада', html:UI.artBox('goods','s'),
                   sub:'у Вас ' + p.goods + ' партий · мировой рынок берёт только советский',
                   price:null, max:p.goods, val:v('take', fit)});
      }
      /* сырьё берут в рейс только там, где мировой рынок его покупает */
      if (p.raw && E(S).prices.raw.usd)
        rows.push({key:'takeRaw', label:'Своё сырьё со склада', html:UI.artBox('raw','s'),
                   sub:'у Вас ' + p.raw + ' партий', price:null, max:p.raw, val:v('takeRaw', 0)});
      if (!rows.length){
        frBox.innerHTML = LOC('<div class="hint" style="margin:0 0 9px">Везти нечего — можно ехать порожняком за импортом.</div>');
        return;
      }
      frBox.innerHTML = LOC(this.qtyBody(rows, {what:'Груз'}));
      this.wireQty(frBox, upd);
    };

    /* ---- сборка манифеста ---- */
    const manifest = ()=>{
      const govWant = read(frBox, '__gov'), ownWant = read(frBox, '__own');
      const take = read(frBox, 'take'), takeRaw = read(frBox, 'takeRaw');
      const list = [];
      let g = govWant, o = ownWant;
      for (const c of loaded){
        if (c.state === 'gov'){ if (g > 0){ list.push(c); g--; } }
        else if (o > 0){ list.push(c); o--; }
      }
      for (let i=0;i<take;i++)    list.push({kind:'goods', origin:'s', state:'own'});
      for (let i=0;i<takeRaw;i++) list.push({kind:'raw',   origin:'s', state:'own'});
      return {cargo:list, take:take, takeRaw:takeRaw,
              leftGov:loaded.filter(c=>c.state==='gov').length - govWant,
              leftOwn:(loaded.length - loaded.filter(c=>c.state==='gov').length) - ownWant};
    };

    const upd = ()=>{
      if (!dest){ m.querySelector('#ok').disabled = true; return; }
      const set = pickSet();
      const hold = Rules.capOfSet(p, set, dest);
      const man = manifest();
      const units = man.cargo.length;
      const over = Math.max(0, units - hold);
      const hireOn = over > 0 && hireBox.querySelector('input').checked;
      const goUnits = hireOn ? units : Math.min(units, hold);
      const goCargo = man.cargo.slice(0, goUnits);

      m.querySelector('#capTxt').textContent = hold > 0
        ? T('мест ') + hold
        : T('своего транспорта нет · госперевозчик ') + Rules.freight(S) + T(' за партию');
      m.querySelector('#holdTxt').textContent = T('занято ') + Math.min(units, hold) + T(' из ') + hold +
        (over ? T(' · сверх трюма ') + over : '');

      /* Карточки парка: выбранные везут груз, снятые стоят серыми. */
      prev.innerHTML = '';
      const goList = [], goIdx = [];
      park.forEach((v,i)=>{ if (picked.has(i)){ goList.push(v); goIdx.push(i); } });
      const sp = this.spread(goList, goCargo);
      const cards = new Array(park.length);
      sp.rows.forEach((r,j)=>{ cards[goIdx[j]] = this.vehCard(r.v, r.tokens, false); });
      park.forEach((v,i)=>{
        if (picked.has(i)) return;
        const el = this.vehCard(v, null, true);
        el.querySelector('.vn').appendChild(h('<b class="athome">дома</b>'));
        cards[i] = el;
      });
      cards.forEach((el,i)=>{
        el.classList.add('pick');
        if (!picked.has(i)) el.classList.add('off');
        el.addEventListener('click', ev=>{
          if (ev.target.closest('[data-insp]') && ev.target !== el && ev.target.closest('.vslot')) return;
          ev.preventDefault(); ev.stopPropagation();
          if (picked.has(i)) picked.delete(i); else picked.add(i);
          upd();
        });
        prev.appendChild(el);
      });
      if (!park.length)
        prev.appendChild(h('<div class="hint" style="margin:0">Своего транспорта на это направление нет — повезёт государственный, по ' + Rules.freight(S) + ' тыс. за партию плюс столько же за Вас.</div>'));
      if (sp.rest.length){
        const g = h('<div class="govcgo"><span class="gl">госперевозчик</span><span class="cargo"></span></div>');
        const row = g.querySelector('.cargo');
        sp.rest.forEach(c=> row.appendChild(h(`<div class="cgo ${artType(c.kind)==='chip'?'chip':''} ${c.state==='gov'?'stateflag':''}">
          ${UI.artBox(c.kind, c.origin)}</div>`)));
        prev.appendChild(g);
      }

      /* что остаётся дома */
      const staying = [];
      if (!hireOn && over > 0) staying.push(T('не влезло ') + over);
      if (man.leftGov > 0) staying.push(T('госгруз ') + man.leftGov);
      if (man.leftOwn > 0) staying.push(T('своё ') + man.leftOwn);
      stayBox.innerHTML = staying.length
        ? LOC('<b>Останется на внутреннем рынке:</b> ') + staying.join(', ') +
          '. ' + T('Госгруз вернётся банку вместе с платой за перевозку.')
        : '';
      stayBox.style.display = staying.length ? '' : 'none';

      hireBox.style.display = over > 0 ? '' : 'none';
      hireBox.querySelector('.hn').textContent = over;
      hireBox.querySelector('.hf').textContent = over * Rules.freight(S);

      const rate = Rules.freight(S);
      const noOwn = hold === 0;
      const paid = hireOn ? over : (noOwn ? goUnits : 0);          // партий по найму
      const self = noOwn ? 1 : 0;                                   // за себя, если своего транспорта нет
      const fee = (paid + self) * rate;
      const short = Math.max(0, fee - p.rub);
      /* Раньше строка говорила «наём 10 тыс.» и не объясняла, откуда они
         взялись при нуле уехавших партий: это плата за себя. Теперь ставка
         и состав счёта видны. */
      const why = [];
      if (paid) why.push(paid + ' ' + (paid === 1 ? 'партия' : 'партий') + ' по ' + rate);
      if (self) why.push('за себя ' + rate);
      calc.innerHTML = LOC('Уедет партий: <b>' + goUnits + '</b>. ' +
        (fee ? 'Государственный транспорт: <b style="color:var(--gold)">' + fee + ' тыс. руб.</b> (' + why.join(' + ') + '). '
             : 'Свой транспорт везёт всё — платить не надо. ') +
        'Индикатор курса сдвинется на <b>' + goUnits + '</b>.');
      m.querySelector('#ok').disabled = short > 0;
    };

    /* ---- 1. континенты ---- */
    for (const k in CONTINENTS){
      const c = CONTINENTS[k], here = S.players.filter(q=>!q.out && q.loc===k && q.id!==p.id);
      const t = artType(c.kind);
      const b = h(`<button class="dest">
        <b>${c.ru}</b><i>${KIND[c.kind].ru} · $${Rules.usdPrice(S, c.kind)}</i>
        <i>запас ${S.continents[k].stock} · ${routeTxt(k)}</i>
        ${Rules.hasDemand(S) ? '<i style="color:var(--green);font-weight:700">товар $' + Rules.goodsPrice(S,k) + ' · спрос ' + Rules.demandOf(S,k) + '</i>' : ''}
        ${here.length?'<i style="color:var(--gold)">там уже: ' + here.map(q=>esc(q.name)).join(', ') + '</i>':''}
        ${ART['g-'+c.kind] ? '<span class="goods"><img src="' + ART['g-'+c.kind] + '" alt=""></span>'
                           : '<img class="thumb ' + (t==='card'?'card':'') + '" src="' + art(c.kind,'i') + '" alt="">'}</button>`);
      b.addEventListener('click', ()=>{
        dest = k; ds.querySelectorAll('.dest').forEach(x=>x.classList.remove('sel')); b.classList.add('sel');
        stage2.style.display = '';
        buildPark(); drawFreight(); upd();
      });
      ds.appendChild(b);
    }
    hireBox.querySelector('input').addEventListener('change', upd);

    m.querySelector('#ok').addEventListener('click', ()=>{
      const set = pickSet(), man = manifest();
      const hireOn = hireBox.querySelector('input').checked && hireBox.style.display !== 'none';
      /* то, что игрок решил не брать, снимается с транспорта до отъезда */
      const drop = {gov:man.leftGov, own:man.leftOwn};
      this.close(true);
      Transport.send({type:'TRAVEL', by:p.id, dest:dest, ship:set, hire:hireOn,
                      take:man.take, takeRaw:man.takeRaw, drop:drop});
    });
    this.wireClose(m); this.open(m);
  },

  /* ---------------- карта события: настоящая карточка с переворотом ---------------- */
  eventModal(ev){
    const who = Rules.P(S, ev.by);
    const src = ART['ev-' + (ev.img || ev.id)] || ART['ev-bonus'];
    const sv = ev.salvage;                       // страховка после катастрофы
    const ch = ev.choice;                        // карта с решением
    /* У карт 1993-го текст не впечатан в скан, а набирается здесь: так их
       можно править и переводить, не перепечатывая картинки. */
    const ownText = ev.txt;                     // ремастер: на рисунках текста нет ни в одной колоде
    const CH = {
      customs: {yes:'Заплатить', no:'Отдать партию груза'},
      buyout:  {yes:'Продать весь груз', no:'Везти дальше'},
      bribe:   {yes:'Заплатить и проехать', no:'Стоять в очереди'}
    };
    const rows = sv ? sv.items.map(it=>{
      const [kind, o] = it.key.split(':');
      const one = Math.ceil(Rules.price(S, kind, 's', 'buy') / 2);
      return {key:it.key, label:KIND[kind].ru, html:UI.artBox(kind, 's'),
              sub:'по ' + one + ' тыс. за штуку', price:one, max:it.n, val:it.n};
    }) : [];
    const canPay = sv && sv.rub >= sv.cost;
    const m = this.shell('События в пути · ' + esc(who.name),
      `<div class="evwrap"><div class="evflip turn" id="flip">
         <div class="evface">${ownText ? '<i class="evpic" style="background-image:url(' + src + ')"></i>' : '<img src="' + src + '" alt="' + esc(ev.txt) + '">'}</div>
         <div class="evback"><span>События в пути</span></div>
       </div></div>
       ${ownText ? '<div class="evtxt">' + esc(ownText) + '</div>' : ''}
       <div class="evres">${ev.notes.map(esc).join('<br>')}</div>
       ${ch ? `<div class="salv"><div class="svsum">${
         ch.kind==='customs' ? 'Пошлина — <b>' + ch.cost + '</b> тыс. У Вас <b>' + ch.rub + '</b> тыс. Не заплатите — таможня заберёт одну партию груза.' :
         ch.kind==='buyout'  ? 'Дают <b>$' + ch.worth + '</b> тыс. за весь груз (' + ch.cargo + ' партий) прямо здесь и сейчас.' :
                               'Просят <b>' + ch.cost + '</b> тыс. У Вас <b>' + ch.rub + '</b> тыс. Заплатите — получите ещё одну операцию в этот ход.'
       }</div></div>` : ''}
       ${sv ? `<div class="salv">
         <div class="svh">Страховка: выкупить своё за половину цены</div>
         ${this.qtyBody(rows, {head:'Что спасаем', sum:true})}
         <div class="svsum">К оплате <b id="svsum">${sv.cost}</b> тыс. · у Вас <b>${sv.rub}</b> тыс.</div>
         <div class="hint" style="margin:6px 0 0">Импорт погиб безвозвратно — заново его не завезёшь. Отечественное рынок готов поставить взамен. Выкупать можно по частям: спасти флот и бросить товар — тоже решение.</div>
       </div>` : ''}`,
      sv ? `<button class="btn" id="svno">Потерять всё</button>
            <button class="btn go" id="svyes">Выкупить</button>`
      : ch ? `<button class="btn" id="chno">${esc(CH[ch.kind].no)}</button>
              <button class="btn go" id="chyes" ${(ch.kind!=='buyout' && ch.rub < ch.cost) ? 'disabled' : ''}>${esc(CH[ch.kind].yes)}</button>`
         : `<button class="btn go" data-close>Дальше</button>`);
    if (ch){
      const send = y => { this.close(true); Transport.send({type:'CHOOSE', by:ev.by, yes:y}); };
      m.querySelector('#chno').addEventListener('click', ()=>send(false));
      const cy = m.querySelector('#chyes');
      if (cy && !cy.disabled) cy.addEventListener('click', ()=>send(true));
    }
    if (sv){
      const body = m.querySelector('.mbody');
      const sum = () => { const q = this.readQty(body); let c = 0;
        rows.forEach(r=>{ c += (q[r.key]|0) * r.price; }); return c; };
      const upd = () => {
        const c = sum();
        m.querySelector('#svsum').textContent = c;
        m.querySelector('#svyes').disabled = c > sv.rub;
      };
      this.wireQty(body, upd); upd();
      m.querySelector('#svno').addEventListener('click', ()=>{
        this.close(true); Transport.send({type:'SALVAGE', by:ev.by, pick:{}}); });
      m.querySelector('#svyes').addEventListener('click', ()=>{
        const pick = this.readQty(body);
        this.close(true); Transport.send({type:'SALVAGE', by:ev.by, pick:pick}); });
    } else this.wireClose(m);
    this.open(m, {sticky:true});
    const flip = m.querySelector('#flip');
    requestAnimationFrame(()=>requestAnimationFrame(()=>flip.classList.remove('turn')));
  },

  /* ---------------- обмен валюты ---------------- */
  exchangeModal(p){
    const r = Rules.usdSellRate(S);
    const m = this.shell('Обмен валюты',
      this.qtyBody([{key:'n', label:'Продать банку доллары', sub:'у Вас $' + p.usd + ' тыс.', price:r, max:p.usd, val:p.usd}]) +
      `<div class="hint">${Rules.hasDemand(S)
        ? 'Банк принимает валюту по нынешнему курсу 1:' + r + ' и стоит он дома — за границей сдать доллары некому. Обратно гривню на доллары банк не меняет никогда: валюту берут только за рубежом, у обменника. Обмен ход не тратит.'
        : 'Банк меняет доллары на рубли всегда 1:1, независимо от курса. Обратно рубли на доллары не меняются никогда — доллары зарабатываются только вывозом товара. Обмен ход не тратит.'}</div>`,
      `<span class="total">Получите: <span id="tot">0</span> тыс. руб.</span>
       <button class="btn" data-close>Отмена</button><button class="btn go" id="ok">Обменять</button>`);
    const body = this.bindTotal(m, Infinity);
    m.querySelector('#ok').addEventListener('click', ()=>{
      const q = this.readQty(body); this.close(true); Transport.send({type:'EXCHANGE', by:p.id, n:q.n||0});
    });
    this.wireClose(m); this.open(m);
  },

  /* Покупка валюты — только за границей и тратит ход, как любая закупка */
  buyUsdModal(p){
    const r = Rules.usdBuyRate(S), max = Math.floor(p.rub / r);
    const m = this.shell('Обменник за границей',
      this.qtyBody([{key:'n', label:'Купить доллары', html:UI.artBox('goods','s'),
        sub:'обменник берёт 1:' + r + ' · у Вас ' + p.rub + ' тыс. грн', price:r, max:max, val:Math.min(max, 5)}]) +
      `<div class="hint">Дома валюту не купить — только здесь. Обменник берёт дороже банковского курса, поэтому в пределах одного курса на этом не заработать: прибыль будет у того, кто удержит доллары через смену курса. Каждые $${4} тыс. спроса сдвигают индикатор на клетку — бегство от гривни само её и обесценивает. Покупка тратит ход.</div>`,
      `<span class="total">Заплатите: <span id="tot">0</span> тыс. грн</span>
       <button class="btn" data-close>Отмена</button><button class="btn go" id="ok">Купить</button>`);
    const body = this.bindTotal(m, p.rub);
    m.querySelector('#ok').addEventListener('click', ()=>{
      const q = this.readQty(body); this.close(true); Transport.send({type:'BUYUSD', by:p.id, n:q.n||0});
    });
    this.wireClose(m); this.open(m);
  }
};

  const imp = origin === 'i';
  const key = kind + ':' + (imp ? 'i' : 's');
  const f = CARD_FACE[key];
  if (!f) return '';
  const o = opts || {};
  const ua = (typeof LANG !== 'undefined' && LANG === 'ua');
  const L = ua ? 'ua' : 'ru';
  const esc2 = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

  const icon = ART[f.icon] || '';

  const lic = ua ? 'ЛІЦЕНЗІЯ' : 'ЛИЦЕНЗИЯ';

  /* «Импорт» — косая лента в углу: отличие видно и на миниатюре */

  const rows = st.length === 3

       <text x="142" y="340" font-family="${HF}" font-size="46" font-weight="700" fill="#141414">${f.n}</text>
       <text x="142" y="362" font-size="15" fill="#3A332A">${esc2(st[1])}</text>
       <text x="142" y="390" font-size="12.5" fill="#6A5E4C">${esc2(st[2])}</text>`
    : `<text x="142" y="300" font-size="15" fill="#3A332A">${esc2(st[0])}</text>
       <text x="142" y="352" font-family="${HF}" font-size="50" font-weight="700" fill="#141414">${f.n}</text>
       <text x="142" y="378" font-size="15" fill="#3A332A">${esc2(st[1])}</text>`;
  return NL(`<svg class="pcard${o.cls ? ' ' + o.cls : ''}" viewBox="0 0 284 420" role="img">
    <defs><clipPath id="pc-${key.replace(':','-')}"><rect x="0" y="0" width="284" height="420" rx="10"/></clipPath></defs>
    <g clip-path="url(#pc-${key.replace(':','-')})">
    <rect x="0" y="0" width="284" height="420" fill="#F3EEE1"/>
    <rect x="0" y="0" width="284" height="168" fill="${f.band}"/>
    <path d="M0,168 H284" stroke="#141414" stroke-width="4"/>
    <circle cx="142" cy="86" r="60" fill="#F3EEE1" stroke="#141414" stroke-width="4"/>
    <circle cx="142" cy="86" r="51" fill="none" stroke="#141414" stroke-width="1.2" stroke-dasharray="2 3"/>
    ${icon ? `<image href="${icon}" x="102" y="46" width="80" height="80" preserveAspectRatio="xMidYMid meet"/>` : ''}
    ${ribbon}
    <text x="142" y="160" text-anchor="middle" font-family="${HF}" font-size="11" font-weight="700" letter-spacing="3.5" fill="#F3EEE1">${lic}</text>
    </g>
    <rect x="1.5" y="1.5" width="281" height="417" rx="9" fill="none" stroke="#141414" stroke-width="3"/>
    <rect x="9" y="176" width="266" height="236" rx="4" fill="none" stroke="#141414" stroke-width="1" stroke-dasharray="1.5 2.5"/>
    <g text-anchor="middle" font-family="${BF}">
      <text x="142" y="208" font-family="${HF}" font-size="23" font-weight="700" fill="#141414">${esc2(name[0])}</text>
      <text x="142" y="234" font-family="${HF}" font-size="${name[1].length > 13 ? 18 : 21}" font-weight="600" fill="#141414">${esc2(name[1])}</text>
      <text x="142" y="256" font-size="12" font-style="italic" fill="${f.band}">${origin1}</text>
      <path d="M92,268 H192" stroke="#141414" stroke-width="1"/>
      ${rows}

  </svg>`);
};

<script>
/* ============================ СДЕЛКИ (панель торговли между ходами) ==== */
UI.offerModal = function(fromId, toId){
  const netSeat = (typeof Net !== 'undefined' && Net.active()) ? Net.seat : null;
  const humans = netSeat != null ? [Rules.P(S, netSeat)] : S.players.filter(p=>!p.out && !p.bot);
  if (!humans.length) return;
  let from = S.players.find(p=>p.id===fromId && !p.bot && !p.out) ? fromId : humans[0].id;
  if (netSeat != null) from = netSeat;
  let to = (toId != null && toId !== from) ? toId : -1;

  const moneyBlock = side => `<div class="legmoney">
      <div class="mrow2" data-key="rub"><span class="l"><b>Рубли</b><small>тыс. руб.</small></span>
        <span class="qc"><button class="stp" data-d="-5">–</button><input type="number" min="0" value="0"><button class="stp" data-d="5">+</button></span></div>
      <div class="mrow2" data-key="usd"><span class="l"><b>Доллары</b><small>тыс. $</small></span>
        <span class="qc"><button class="stp" data-d="-1">–</button><input type="number" min="0" value="0"><button class="stp" data-d="1">+</button></span></div>
      <div class="mrow2" data-key="note"><span class="l"><b>Кредитное обязательство</b><small>получатель вернёт в банк ${Rules.loanRepay(S)}</small></span>
        <span class="qc"><button class="stp" data-d="-1">–</button><input type="number" min="0" max="9" value="0"><button class="stp" data-d="1">+</button></span></div>
    </div>`;

  const m = UI.shell('Предложить сделку',
    `<div class="two" style="margin-bottom:14px">
       <label class="fld"><span>Кто предлагает</span><select id="from"></select></label>
       <label class="fld"><span>Кому</span><select id="to"></select></label>
     </div>
     <div class="two">
       <div class="legbox"><h4>Отдаю</h4>${moneyBlock('give')}
         <div class="subh">Имущество и запасы</div><div class="legitems" id="give"></div></div>
       <div class="legbox"><h4>Хочу взамен</h4>${moneyBlock('want')}
         <div class="subh">Имущество и запасы</div><div class="legitems" id="want"></div></div>
     </div>
     <hr class="sep">
     <div class="two">
       <label class="fld"><span>Аренда на один ход получателя</span>
         <select id="rentKind"><option value="">— нет —</option><option value="extractor">Оборудование для добычи</option><option value="machine">Станки</option></select></label>
       <label class="fld"><span>Сколько единиц в аренду</span><input type="number" id="rentN" min="0" max="20" value="0"></label>
     </div>
     <label class="fld" style="margin-top:12px"><span>Комментарий</span><input type="text" id="onote" maxlength="90" placeholder="например: сырьё дешевле рынка, не теряя хода"></label>
     <div class="hint">Сделка не тратит ход ни одной из сторон. Товарные сделки возможны только между игроками в одной точке карты; деньгами можно обмениваться на любом расстоянии.</div>
     <div class="err" id="oerr" style="display:none"></div>`,
    `<button class="btn" data-close>Отмена</button><button class="btn go" id="ok">Выставить</button>`, true);

  const selFrom = m.querySelector('#from'), selTo = m.querySelector('#to');
  humans.forEach(p => selFrom.appendChild(h(`<option value="${p.id}" ${p.id===from?'selected':''}>${esc(p.name)}</option>`)));
  selFrom.disabled = humans.length < 2;
  const fillTo = () => {
    selTo.innerHTML = LOC('<option value="-1">Любому игроку</option>');
    S.players.forEach(p => { if (!p.out && p.id !== from) selTo.appendChild(h(`<option value="${p.id}">${esc(p.name)}</option>`)); });
    selTo.value = String(to);
  };
  fillTo();

  const ALL = ['plant:s','machine:s','machine:i','extractor:s','extractor:i','truck:s','truck:i','fleet:s','fleet:i','computer:i','raw:s','goods:s'];
  /* Рыночная подсказка. Раньше цены в окне сделки не было вовсе — чтобы
     назначить сумму, приходилось закрывать окно и лезть в таблицу рынка.
     Показываем «покупка / продажа» и берём середину как честную оценку:
     продавцу это больше, чем даст рынок, покупателю — меньше, чем возьмёт. */
  const mkt = key => {
    const [k, o] = key.split(':');
    const buy = Rules.price(S, k, o, 'buy'), sell = Rules.price(S, k, o, 'sell');
    return {buy:buy, sell:sell, mid:Math.max(1, Math.round((buy + sell) / 2))};
  };
  const rowOf = (k, n) => {
    const q = mkt(k);
    const ko = String(k).split(':');
    return {key:k, label:labelOf(k), html:UI.artBox(ko[0], ko[1]),
            sub:(n != null ? 'есть ' + n + ' · ' : '') + 'рынок ' + q.sell + '/' + q.buy,
            price:q.mid, max:(n != null ? n : 99)};
  };
  const legRows = (host, owner) => {
    const rows = owner ? slots(owner) : [];
    const opts = {what:'Позиция', priceLabel:'Оценка'};
    if (!owner) host.innerHTML = LOC(UI.qtyBody(ALL.map(k=>rowOf(k, null)), opts));
    else if (!rows.length) host.innerHTML = LOC('<div class="empty">Собственности и запасов нет — можно предложить только деньги.</div>');
    else host.innerHTML = LOC(UI.qtyBody(rows.map(([k,n])=>rowOf(k, n)), opts));
    UI.wireQty(host, suggest);
  };
  /* Сумма выставленного имущества по оценке. */
  const legValue = host => {
    let v = 0;
    if (host) host.querySelectorAll('.qrow').forEach(r=>{
      const i = r.querySelector('input');
      v += (+i.value||0) * (+i.dataset.price||0);
    });
    return v;
  };
  /* Подставляем оценочную сумму в рублёвое поле ПРОТИВОПОЛОЖНОЙ стороны:
     выставил своё имущество — видишь, сколько за него просить; попросил
     чужое — видишь, сколько за него дать. Как только игрок правит сумму
     руками, подсказка отступает и больше её не трогает. */
  const rubOf = box => box.querySelector('.legmoney .mrow2[data-key="rub"] input');
  const suggest = () => {
    const boxes = m.querySelectorAll('.legbox');
    const giveV = legValue(m.querySelector('#give'));
    const wantV = legValue(m.querySelector('#want'));
    const put = (box, v) => {
      const inp = rubOf(box);
      if (!inp || inp.dataset.touched === '1') return;
      inp.value = v > 0 ? v : 0;
      inp.classList.toggle('auto', v > 0);
    };
    put(boxes[1], giveV);          // отдаю вещи → хочу столько рублей
    put(boxes[0], wantV);          // хочу вещи  → отдаю столько рублей
  };
  const refresh = () => {
    legRows(m.querySelector('#give'), Rules.P(S, from));
    legRows(m.querySelector('#want'), to === -1 ? null : Rules.P(S, to));
    suggest();
  };
  selFrom.addEventListener('change', ()=>{ from = +selFrom.value; if (to===from) to = -1; fillTo(); refresh(); });
  selTo.addEventListener('change', ()=>{ to = +selTo.value; refresh(); });
  refresh();

  m.querySelectorAll('.mrow2').forEach(row=>{
    const inp = row.querySelector('input');
    const touch = ()=>{ inp.dataset.touched = '1'; inp.classList.remove('auto'); };
    row.querySelectorAll('.stp').forEach(b=>b.addEventListener('click', ()=>{
      inp.value = Math.max(0, (+inp.value||0) + (+b.dataset.d)); touch();
    }));
    inp.addEventListener('input', touch);
  });

  const readLeg = box => {
    const leg = {rub:0, usd:0, note:0, items:{}};
    box.querySelectorAll('.legmoney .mrow2').forEach(r=>{ leg[r.dataset.key] = Math.max(0, +r.querySelector('input').value||0); });
    const items = box.querySelector('.legitems');
    if (items) items.querySelectorAll('.qrow').forEach(r=>{ const v = +r.querySelector('input').value||0; if (v>0) leg.items[r.dataset.key] = v; });
    return leg;
  };

  m.querySelector('#ok').addEventListener('click', ()=>{
    const boxes = m.querySelectorAll('.legbox');
    const give = readLeg(boxes[0]), want = readLeg(boxes[1]);
    const rentKind = m.querySelector('#rentKind').value, rentN = +m.querySelector('#rentN').value||0;
    const offer = {to, give, want, note:m.querySelector('#onote').value.trim()};
    if (rentKind && rentN > 0) offer.rent = {kind:rentKind, n:rentN};
    const empty = l => !l.rub && !l.usd && !l.note && !Object.keys(l.items).length;
    if (empty(give) && !offer.rent && empty(want)){
      const e = m.querySelector('#oerr'); e.style.display='block'; e.textContent=T('Пустое предложение — укажите, что отдаёте или что хотите получить.'); return;
    }
    UI.close(true);
    Transport.send({type:'OFFER', by:from, offer});
  });
  m.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', ()=>UI.close()));
  UI.open(m);
};

/* ============================ ПОДРОБНЫЕ ПРАВИЛА ======================
   Свод для той игры, в которую сейчас играют: классика и 1993-й
   расходятся заметно, поэтому половина разделов пишется по режиму.

UI.rulesModal = function(){

  const P = nine ? PRICES_93 : PRICES;
  const cur = k => P[k].buy.map(v=>v).join(' / ');
  const sel = k => P[k].sell.map(v=>v).join(' / ');
  const fr  = (nine ? ECON.y1993.freight : FREIGHT);
  const rates = (nine ? ECON.y1993.rateTxt : RATE_TXT);
  const loanT = (nine ? ECON.y1993.loanTake : ECON.classic.loanTake);
  const loanR = (nine ? ECON.y1993.loanRepay : ECON.classic.loanRepay);

  const row = (name, k, imp) => {

            <tr><td style="color:var(--ink3);font-size:11px">${nine?'↳ отримуєте':'↳ получаете'}</td>${s}<td></td></tr>`;

  const S_ = (id, title, body) => `<h4 id="${id}">${title}</h4>${body}`;
  const nav = nine
    ? [['r1','Мета'],['r2','Хід'],['r3','Угоди'],['r4','Гроші'],['r5','Виробництво'],
       ['r6','Транспорт'],['r7','Держвантаж'],['r8','За кордоном'],['r9','Курс'],
       ['r10','Валюта'],['r11','Попит'],['r12','Події'],['r13','Страховка'],
       ['r14','Банкрутство'],['r15','Заборонено'],['r16','Тактика'],['r17','Таблиця цін']]
    : [['r1','Цель'],['r2','Ход'],['r3','Сделки'],['r4','Деньги'],['r5','Производство'],
       ['r6','Транспорт'],['r7','Госгруз'],['r8','За границей'],['r9','Курс'],
       ['r12','События'],['r14','Банкротство'],['r15','Запрещено'],['r16','Тактика'],['r17','Таблица цен']];
  /* Заголовки разделов: у каждой игры свой язык, поэтому пишем оба набора,
     а не гоняем длинный текст через словарь — он его калечит. */
  const H = nine ? {
    r1:'Мета гри і як вона закінчується', r2:'Хід — це одна дія', r3:'Угоди між гравцями — не хід',
    r4:'Гроші, банк і позика', r5:'Виробничий ланцюг', r6:'Транспорт і маршрути',
    r7:'Перевезення державного вантажу', r8:'За кордоном', r9:'Курс і його зміна',
    r10:'Валюта', r11:'Попит на континентах', r12:'Події в дорозі',
    r13:'Страховка при катастрофі', r14:'Банкрутство', r15:'Правилами заборонено',

<p class="lead">Іде 1993 рік. Гривня знецінюється, гроші горять у руках, і виграє не той, хто більше накопичив, а той, хто вчасно перетворив папір на справу, товар і валюту.</p>
<p>Партія йде до переходу індикатора з 4-го курсу на 5-й. У цю мить гра зупиняється, <b>усе майно автоматично продається за цінами 5-го курсу</b>, із суми віднімаються непогашені борги, і перемагає той, у кого більше грошей.</p>

${S_('r2',H.r2, nine ? `
<p class="lead">У «Конверсії» хід — це не кидок кубика і не пересування фішки, а <b>одна і тільки одна дія</b>. Об'єднувати дві дії в один хід заборонено.</p>

<p>Гравці в <b>різних точках карти</b> можуть робити лише грошові операції — обмін валюти, оплату послуг, купівлю доларів один в одного. Товарні угоди можливі, тільки коли обидва в одному місці.</p>

${S_('r5',H.r5, nine ? `
<p class="lead">Обладнання видобуває сировину → завод із верстатами робить із сировини товар → товар продається вдома або вивозиться за долари.</p>
<p><b>Завод</b> тримає до п'яти верстатів; без заводу верстати не працюють. <b>Продуктивність за один хід:</b></p>
<ul>
<li>Обладнання видобутку: вітчизняне — 1 партія сировини, імпортне — 2.</li>
<li>Верстат: вітчизняний — 1 партія товару, імпортний — 2.</li>
<li>Автотранспорт: вітчизняний везе 1 партію, імпортний — 2.</li>
<li>Флот: вітчизняний — 2 партії, імпортний — 3.</li>
</ul>
<p><b>Комп'ютер</b> встановлюється на <b>одну</b> одиницю — на верстат <b>або</b> на обладнання з видобутку сировини — і дає їй +1 партію за хід. Витрати на роботу при цьому не зростають: зайва партія дістається безкоштовно. На транспорт комп'ютер не ставиться.</p>
<p>Комп'ютерів можна тримати стільки, скільки у вас верстатів і обладнання: кожен наступний підсилює наступну одиницю. Комп'ютери бувають лише імпортні й лише з Америки, тому ціна завжди подвійна.</p>

<div class="rbox new"><b>1993:</b> плата за роботу <b>не змінюється з курсом</b> — 1 тис. за обладнання і 2 тис. за верстат, як і в класиці. У цьому все дзеркало: у класиці ціни падають ДО цієї плати і прибуток під кінець вмирає, а тут вони тікають ВІД неї. При міцній гривні партія товару дає близько 2, при повній інфляції — за 60. Розгін у тридцять разів: спочатку ледве зводиш кінці з кінцями, під кінець рахуєш мільйони.</div>` : `
<p class="lead">Оборудование добывает сырьё → завод со станками делает из сырья товар → товар продаётся дома или вывозится за доллары.</p>
<p><b>Завод</b> держит до пяти станков; без завода станки не работают. <b>Производительность за один ход:</b></p>
<ul>
<li>Оборудование добычи: отечественное — 1 партия сырья, импортное — 2.</li>

<p>Компьютер на машине уезжает вместе с ней. Оставили её на внутреннем рынке — трюма в этом рейсе он не прибавит.</p>

<p>Здати вантаж можна <b>тільки там, куди ви його привезли</b>. Узяти й тут-таки кинути на місці — не хід із правил: платять за перевезення, а перевезення не було.</p>
<p>Держвантаж на державному транспорті вигоди не дає, але індикатор рухає.</p>` : `

${S_('r8',H.r8, nine ? `

<p><b>Купівля.</b> Платите доларами, куплене одразу вважається вантажем. Поки ви не привезли його додому й не розвантажилися, воно не працює: куплений в Африці автотранспорт не можна використати на місці.</p>

<p><b>Дома импорт стоит вдвое дороже отечественного</b> — и когда покупаете, и когда продаёте. В этом весь смысл рейса: везёте товар за $, привозите импорт, продаёте его дома по двойной цене.</p>

${nine ? S_('r10',H.r10, `

           <option value="long">Длинный — 15/25/50/100, 190 пересечений</option>
         </select></label>
       <label class="fld"><span>Уровень ботов</span>
         <select id="skill">
           <option value="easy">Бухгалтер — считает, но дальше склада не смотрит</option>
           <option value="norm" selected>Финдиректор — держится своего дела и знает счёт</option>
           <option value="hard">Директор — сам выбирает линию и играет на весь цикл</option>
         </select></label>
       <label class="fld"><span>Таймер хода (для темпа)</span>
         <select id="timer">
           <option value="0" selected>Выключен</option>
           <option value="30">30 секунд</option>
           <option value="60">60 секунд</option>
           <option value="90">90 секунд</option>
         </select></label>
     </div>
     <div class="hint">Хотите играть с разных компьютеров — «Играть по сети» в меню: хозяин создаёт комнату и раздаёт код, а кто в комнате — увидит её сам.<br>
     Хот-сит: все люди ходят за одним экраном по очереди. Ботов можно ставить на любые места. Панель сделок работает всё время и ход не тратит — предлагать и принимать можно даже во время чужого хода.</div>`,
    `<button class="btn" id="netgame" style="margin-right:auto">Играть по сети</button>
     <button class="btn go" id="start">Начать партию за одним экраном</button>`, true);

  /* Выбор languages применяем не сразу, а когда партия начнётся: меню и
     окно настройки остаются русскими и советскими, «Конверсія · 1993»
     включается за столом. Ник: «украинская версия лишь уже в игре». */
  let pick = LANG;
  const lp = m.querySelector('#langpick');
  /* Крышка коробки меняется вместе с выбором: видно, во что садишься играть. */
  const lidPic = m.querySelector('#lidpic');
  const paintLang = ()=>{
    lp.querySelectorAll('.langbtn').forEach(b=>b.classList.toggle('on', b.dataset.l === pick));
    if (lidPic) lidPic.src = (pick === 'ua' && ART['cover-ua']) ? ART['cover-ua'] : ART['cover-box'];
  };
  lp.querySelectorAll('.langbtn').forEach(b=>b.addEventListener('click', ()=>{
    pick = b.dataset.l; paintLang();
  }));
  paintLang();
  const host = m.querySelector('#rows');
  // своё лицо получает первый человек в списке — это и есть вы
  const firstHuman = () => { for (let i = 0; i < rows.length; i++) if (!rows[i].bot) return i; return -1; };
  const draw = () => {
    host.innerHTML = '';
    rows.forEach((r,i)=>{
      const mine = !r.bot && i === firstHuman();
      const el = h(`<div class="prow">
        ${mine ? Faces.ava(Prof.face(), (r.name||'?').charAt(0).toUpperCase(), 'sm') : ''}
        <span class="chip" style="background:${COLORS[i%COLORS.length]}"></span>
        <input type="text" value="${esc(r.name)}" maxlength="18">
        <select>
          <option value="human">Человек</option>
          <option value="auto">Бот</option>
          <option value="miner">Бот · добытчик</option>
          <option value="producer">Бот · производитель</option>
          <option value="trader">Бот · перевозчик</option>
        </select>
        <button class="mini no" ${rows.length<=2?'disabled':''}>×</button></div>`);
      el.querySelector('select').value = r.bot ? r.role : 'human';
      el.querySelector('input').addEventListener('input', e=>{ r.name = e.target.value; });
      el.querySelector('select').addEventListener('change', e=>{
        if (e.target.value === 'human'){ r.bot = false; }
        else { r.bot = true; r.role = e.target.value; }
      });
      el.querySelector('button').addEventListener('click', ()=>{ if (rows.length>2){ rows.splice(i,1); draw(); } });
      host.appendChild(el);
    });
    m.querySelector('#addp').disabled = rows.length >= 8;
  };
  draw();
  m.querySelector('#addp').addEventListener('click', ()=>{
    if (rows.length >= 8) return;
    /* Следующая свободная фамилия из набора — чтобы «+ игрок»
       не выдавал безликих «Игрок 5». */
    const used = rows.map(r=>r.name);
    const nm = NAMES.find(n => used.indexOf(n) < 0) || ('Игрок ' + (rows.length+1));
    rows.push({name:nm, bot:true, role:'auto'}); draw();
  });
  m.querySelector('#netgame').addEventListener('click', ()=>UI.netModal());
  m.querySelector('#start').addEventListener('click', ()=>{
    if (pick !== LANG) setLang(pick);       // правила и язык — одно и то же
    const cfg = {
      seed: (Date.now() ^ (Math.random()*0xffffffff)) >>> 0,
      track: m.querySelector('#track').value,
      /* Язык и правила — одно и то же: украинский это «Конверсія · 1993»,
         классика это оригинал. Без этой строки игра всегда запускалась
         классикой, а украинская версия существовала только в коде. */
      mode: modeOfLang(),
      botSkill: m.querySelector('#skill').value,
      players: rows.map((r,i)=>({name:r.name.trim()||'Игрок', bot:r.bot, role:r.role,
        face: (!r.bot && i === firstHuman()) ? Prof.face() : -1}))
    };
    UI.timerSec = +m.querySelector('#timer').value || 0;
    UI.timerOn = UI.timerSec > 0;
    UI.overShown = false; UI.shownEventSeq = 0;
    S = Rules.create(cfg);
    Prof.startGame(false);
    UI.close(true);
    applyLangArt();
    UI.menuPlaying();                 // за столом зал молчит, и место в списке освобождается
    UI.render();
    Bots.schedule();
  });
  UI.place(m, {sticky:true});
};

/* ============================ ТАЙМЕР ХОДА ============================= */
UI.tick = function(reset){ if (reset) this.timeLeft = this.timerSec; };
setInterval(()=>{
  if (!UI.timerOn || !S || S.over || UI.blocking()) return;
  const p = Rules.P(S, S.cur); if (!p || p.bot || p.out) return;
  UI.timeLeft--;
  const t = document.querySelector('#timerTag');
  if (t) t.textContent = '⏱ ' + Math.max(0, UI.timeLeft) + ' с';
  if (UI.timeLeft <= 0) Transport.send({type:'PASS', by:p.id});
}, 1000);

/* ============================ СТАРТ =================================== */
document.querySelectorAll('.actRules').forEach(b=>b.addEventListener('click', ()=>UI.rulesModal()));
document.querySelector('#btnOffer').addEventListener('click', ()=>{ if (S && !S.over) UI.offerModal(S.cur); });
document.querySelector('#tradeMine').addEventListener('click', ()=>{ UI.tradeMine = !UI.tradeMine; UI.trade(); });
document.querySelector('#btnSaveLog').addEventListener('click', ()=>{ if (S) UI.saveLog(); });
document.querySelectorAll('.actNew').forEach(b=>b.addEventListener('click', ()=>{ UI.close(true); UI.menu(); }));
</script>
<script>
/* =====================================================================
   ПРОСМОТР КОМПОНЕНТА
   Клик по любому компоненту — карточке, жетону, фишке, чеку — открывает
   его крупно, с описанием и текущими ценами на внутреннем и мировом рынке.

const INFO = {

    tag:'Лицензия',
    text:()=>'Позволяет добывать сырьё. Расход за работу — '+Rules.extractCost(S)+' тыс. руб. за каждое оборудование, независимо от того, сколько оно добывает. Советское даёт 1 партию сырья за ход, импортное — 2 партии при тех же расходах. Установленный на эту единицу компьютер добавляет ей ещё одну партию.',

  },
  truck: {

  fleet: {

  },

    text:()=>'Подложка на пять станков. Без завода станки не работают: сколько бы их ни было куплено, производить можно только теми, что стоят в пазах. Импортных заводов не бывает.',

  },
  machine: {
